        adoptLoadedDays(loadedDays);

        // Independent secondary loads: each in its own try so one failure
        // cannot abort the others (and cannot arm loadFailedRef).
        // Both tables are authenticated-read only: readAuthOnlyTable returns
        // null (not []) when there is no fresh token, so a stale session can
        // never adopt an RLS-empty answer over the current lists (datalayer-001).
        try {
          const trades = await readAuthOnlyTable("shift_trade_requests", { order: "submitted_at.desc", limit: 100 });
          if (trades) setTradeRequests(trades);
        } catch(e) { console.warn("Trade requests load failed:", e); }
        try {
          const notifs = await readAuthOnlyTable("notifications", { order: "created_at.desc", limit: 50 });
          if (notifs) setNotifications(notifs);
        } catch(e) { console.warn("Notifications load failed:", e); }
        try {
          const mainRows = await db.query("client_versions", { eq: { id: "main" }, select: "id,min_version,message" });
          const main = Array.isArray(mainRows) ? mainRows[0] : null;
          if (main && main.min_version && versionCmp(APP_VERSION, main.min_version) < 0) setForceUpdate({ min_version: main.min_version, message: main.message || "" });
          else setForceUpdate(null);
        } catch(e) { console.warn("client_versions min-version check failed:", e); }
      } catch (e) {
        console.error("Supabase load error (schedule_days):", e);
        loadFailedRef.current = true; // read threw - suppress autosave until a read succeeds
        showToast("Couldn't load the latest data - check your connection and reload.", "error");
      }
      await loadTimeOff();
      await loadAvailability();
      await loadEastTables();
      setLoaded(true);
      loadedAtRef.current = Date.now();
    })();

    // --- Realtime subscriptions (preferred) with safety-net poll ---
    const refreshBlobRow = async () => {
      try {
        const { data: row } = await supabase.from("call_schedule_data").select("data,updated_at").eq("id", "main").single();
        blobLoadedRef.current = true; // the read succeeded (a missing row is still a successful read)
        if (!row?.data) return;
        if (row.updated_at === blobTsRef.current) return; // nothing new (or our own echo)
        blobTsRef.current = row.updated_at;
        const d = typeof row.data === "string" ? JSON.parse(row.data) : row.data;
        adoptBlob(d);
      } catch(e) { console.warn("Background config refresh failed:", e); }
    };
    const refreshDays = async () => {
      try {
        const fresh = await loadScheduleDays();
        loadFailedRef.current = false; // the days read succeeded - the days leg is safe again (the blob leg is gated by blobLoadedRef separately)
        // Adopt only days that differ from what we last persisted AND that we
        // have not edited locally since (an unsaved local edit is the truth).
        const base = lastSyncRef.current || {};
        const local = scheduleRef.current || {};
        let changedAny = false;
        const merged = { ...local };
        const allDays = Object.keys(Object.assign({}, base, fresh.sched));
        for (const day of allDays) {
          const serverChanged = !sameAssignment(day, fresh.sched[day], base[day]);
          const localChanged = !sameAssignment(day, local[day], base[day]);
          if (serverChanged && !localChanged) {
            if (fresh.sched[day]) merged[day] = fresh.sched[day]; else delete merged[day];
            base[day] = fresh.sched[day] ? JSON.parse(JSON.stringify(fresh.sched[day])) : undefined;
            if (!fresh.sched[day]) delete base[day];
            changedAny = true;
          }
        }
        dayVersionsRef.current = { ...dayVersionsRef.current, ...fresh.vers };
        if (changedAny) { lastSyncRef.current = base; scheduleRef.current = merged; setSchedule(merged); }
      } catch(e) { console.warn("Background schedule refresh failed:", e); }
    };
    // Authenticated-read tables: skipped (list kept) without a fresh token - see readAuthOnlyTable.
    const refreshTradeReqs = async () => {
      try {
        const trades = await readAuthOnlyTable("shift_trade_requests", { order: "submitted_at.desc", limit: 100 });
        if (trades) setTradeRequests(trades);
      } catch(e) { console.warn("Background trade-requests refresh failed:", e); }
    };
    const refreshNotifs = async () => {
      try {
        const notifs = await readAuthOnlyTable("notifications", { order: "created_at.desc", limit: 50 });
        if (notifs) setNotifications(notifs);
      } catch(e) { console.warn("Background notifications refresh failed:", e); }
    };
    const refreshMinVersion = async () => {
      try {
        const mainRows = await db.query("client_versions", { eq: { id: "main" }, select: "id,min_version,message" });
        const main = Array.isArray(mainRows) ? mainRows[0] : null;
        if (main && main.min_version && versionCmp(APP_VERSION, main.min_version) < 0) setForceUpdate({ min_version: main.min_version, message: main.message || "" });
        else setForceUpdate(null);
      } catch(e) { console.warn("Background min-version refresh failed:", e); }
    };
    const refreshAll = async () => {
      await Promise.allSettled([
        refreshBlobRow(), refreshDays(), refreshTradeReqs(), refreshNotifs(), refreshMinVersion(),
        loadTimeOff(true), loadAvailability(true), loadEastTables(true),
      ]);
    };
    refreshDaysRef.current = refreshDays;       // trade apply -> refetch the rows the function wrote
    refreshTradesRef.current = refreshTradeReqs;

    // Per-row live updates for schedule_days: apply the changed row and keep
    // the version map fresh (this also harmlessly self-confirms our writes).
    const onDayChange = (payload) => {
      try {
        const nw = payload.new, od = payload.old;
        const day = (nw && nw.day) || (od && od.day);
        if (!day) return;
        if (payload.eventType === "DELETE") {
          setSchedule(p => { const n = { ...p }; delete n[day]; scheduleRef.current = n; return n; });
          delete dayVersionsRef.current[day];
          if (lastSyncRef.current) delete lastSyncRef.current[day];
        } else if (nw) {
          const a = dayRowToAssignment(nw);
          // An unsaved local edit on this day (inside the 800ms debounce or
          // with its write in flight) is the truth, exactly as in refreshDays
          // and the CAS conflict path: adopt the row only when local still
          // equals what we last persisted. The version map and lastSyncRef
          // always advance, so the pending edit re-syncs as a PATCH against
          // the fresh version (helpers.js mergeRealtimeDay, pinned in
          // test/data-layer.test.js).
          const base = lastSyncRef.current || {};
          const m = mergeRealtimeDay(day, (scheduleRef.current || {})[day], base[day], a);
          dayVersionsRef.current[day] = nw.version;
          if (lastSyncRef.current) lastSyncRef.current[day] = JSON.parse(JSON.stringify(m.lastSync));
          if (m.localChanged) {
            console.warn(`Realtime: ${day} changed in the table (v${nw.version}) while a local edit is unsaved - keeping the local edit; it re-syncs on the next pass.`);
          } else {
            setSchedule(p => { const n = { ...p, [day]: m.next }; scheduleRef.current = n; return n; });
          }
          if (a.primary || a.backup || a.externalCover) everHadRealDataRef.current = true;
        }
      } catch (e) { console.warn("Realtime day apply failed:", e); }
    };

    let rtChannel = null;
    let rtClient = null;
    const setupRealtime = () => {
      try {
        rtClient = (typeof getSupabaseRT === "function") ? getSupabaseRT() : null;
        if (!rtClient) return false;
        rtChannel = rtClient.channel("silvis-schedule-sync")
          .on("postgres_changes", { event: "*", schema: "public", table: "call_schedule_data" }, refreshBlobRow)
          .on("postgres_changes", { event: "*", schema: "public", table: "schedule_days" }, onDayChange)
          .on("postgres_changes", { event: "*", schema: "public", table: "time_off" }, () => { loadTimeOff(true); })
          .on("postgres_changes", { event: "*", schema: "public", table: "availability" }, () => { loadAvailability(true); })
          .on("postgres_changes", { event: "*", schema: "public", table: "shift_trade_requests" }, refreshTradeReqs)
          .on("postgres_changes", { event: "*", schema: "public", table: "notifications" }, refreshNotifs)
          .on("postgres_changes", { event: "*", schema: "public", table: "client_versions" }, refreshMinVersion)
          .subscribe((status) => {
            if (status === "SUBSCRIBED") refreshAll();
          });
        return true;
      } catch(e) { console.warn("Realtime subscribe failed, falling back to poll:", e); return false; }
    };
    if (!setupRealtime()) {
      const onReady = () => { window.removeEventListener("supabase-sdk-ready", onReady); setupRealtime(); };
      window.addEventListener("supabase-sdk-ready", onReady);
      setTimeout(() => { window.removeEventListener("supabase-sdk-ready", onReady); if (!rtChannel) setupRealtime(); }, 5000);
    }
    // Safety-net poll: every 60 seconds. If Realtime works nothing changes.
    const pollInterval = setInterval(refreshAll, 60000);
    return () => {
      clearInterval(pollInterval);
      if (rtChannel && rtClient) { try { rtClient.removeChannel(rtChannel); } catch(e) { console.warn("Realtime channel cleanup failed:", e); } }
    };
  }, [reloadTrigger]);

  // --- Current-state bundle (NOT "the thing we persist") ---
  // A snapshot of live component state in one object. schedule / vacations /
  // availability are IN the bundle but NOT in the blob - every blob write
  // strips them. They are ARGUMENTS to four consumers: payloadLooksWiped (the
  // empty-save guard), syncScheduleDays (leg 1), the keepalive flush, and the
  // JSON export. Do not remove them.
  const buildStateBundle = (overrides = {}) => ({
    roster: surgeons, surgeonRules, groupRules, holidays, settings, lastPublished,
    lastGenerate, // kept in the blob across autosaves once part 4 writes it (the upsert replaces data wholesale)
    schedule, vacations, availability: availabilityRows,
    ...overrides,
  });
  const blobFromBundle = (bundle) => {
    const blobData = { ...bundle };
    delete blobData.schedule; delete blobData.vacations; delete blobData.availability;
    return blobData;
  };
  // Mirrors the RLS predicate on call_schedule_data (silvis_is_sched()).
  const canWriteBlob = isScheduler;

  // --- Supabase: Auto-save on changes ---
  useEffect(() => {
    if (!loaded) return;
    if (isPublicMode) return;  // Public viewers never write to the DB
    if (loadedAtRef.current && Date.now() - loadedAtRef.current < 3000) return; // hydration window
    if (loadFailedRef.current) {
      setSaveError(true);
      setSaveStatus("Not saving - data failed to load");
      return;
    }
    const payload = buildStateBundle();
    pendingSaveRef.current = payload;
    // Arm the guard as soon as we hold real data locally.
    if (!payloadLooksWiped(payload)) everHadRealDataRef.current = true;
    const timer = setTimeout(async () => {
      // -- Empty-save guard --
      if (payloadLooksWiped(payload) && everHadRealDataRef.current && !allowWipeSaveRef.current) {
        console.warn("Autosave blocked: refusing to write empty payload over real data.");
        setSaveError(true);
        setSaveStatus("Save blocked - empty data not written");
        return;
      }
      allowWipeSaveRef.current = false; // consume one-shot bypass
      // -- The two legs are INDEPENDENT (conventions 3a) --
      // Leg 1 - schedule_days (CAS). Every session, every role, FIRST and
      // unconditionally. Its own error handling is loud.
      syncScheduleDays(payload.schedule);
      // Leg 2 - the config blob. Scheduler/admin only (RLS): a member has
      // nothing to write here and would only produce a 403 every 60s.
      if (!canWriteBlob) return;
      // Never write the blob from a session that has not READ it: with
      // surgeonRules / groupRules / holidays undefined locally, this upsert
      // would replace the real jsonb with defaults (finding safety-2).
      if (!blobLoadedRef.current) {
        console.warn("Autosave: the shared setup (call_schedule_data) has not loaded this session - blob write skipped so defaults cannot overwrite it.");
        setSaveError(true);
        setSaveStatus("Setup not saved - shared setup failed to load");
        return;
      }
      try {
        const ts = new Date().toISOString();
        const { error: saveErr } = await supabase
          .from("call_schedule_data")
          .upsert({ id: "main", data: blobFromBundle(payload), updated_by: userProfile?.person_id || null, updated_at: ts });
        if (saveErr) throw new Error(`blob save failed: ${String(saveErr).slice(0, 200)}`);
        blobTsRef.current = ts;
        pendingSaveRef.current = null; // Save committed - clear pending
        setSaveError(false);
        setSaveStatus("Saved");
        setTimeout(() => setSaveStatus(""), 2000);
      } catch (e) {
        console.error("Save failed:", e);
        setSaveError(true);
        const failMsg = String(e?.message || e);
        const denied = /42501|row-level security|\b403\b/i.test(failMsg);
        setSaveStatus(denied ? "Not saved - no permission" : "Save failed - retrying");
        showToast(denied
          ? "Couldn't save the shared setup - your account doesn't have permission. Ask the scheduler."
          : /401|JWT|expired/i.test(failMsg)
            ? "Changes aren't saving - your session expired. Reload or sign in again."
            : "Changes aren't saving - check your connection.", "error");
      }
    }, 800);
    return () => clearTimeout(timer);
  }, [loaded, surgeons, surgeonRules, groupRules, holidays, settings, lastPublished, lastGenerate, schedule, vacations, availabilityRows]);

  // --- Flush pending save when app is backgrounded or closing ---
  // The auto-save above has an 800ms debounce; an edit made right before
  // locking the phone would be lost. Fire any pending save immediately with
  // fetch keepalive. The days leg KEEPS THE CAS CONTRACT (finding wire-1): a
  // day whose version we know goes out as PATCH ?day=eq.X&version=eq.N with
  // version N+1 (a moved version matches zero rows instead of overwriting a
  // newer device's row and regressing its version); a day we have never seen
  // in the table goes out as a plain POST at version 1 (an existing row 409s,
  // it is never merged over). Responses are not awaited - whatever did not
  // land re-syncs through syncScheduleDays on the next foreground (the
  // pending payload stays armed on a rejected fetch). Never an upsert here.
  // Uses a ref bridge so the []-deps effect sees the current render's
  // closure (conventions item 1).
  const flushRef = useRef(() => {});
  flushRef.current = (source) => {
    if (isPublicMode) return;
    const payload = pendingSaveRef.current;
    if (!payload) return;
    if (loadFailedRef.current) return;
    if (payloadLooksWiped(payload) && everHadRealDataRef.current && !allowWipeSaveRef.current) {
      console.warn(`Keepalive flush blocked (${source}): empty payload over real data.`);
      return;
    }
    pendingSaveRef.current = null; // Clear optimistically; failures re-arm below
    try {
      const session = auth.getSession();
      const token = session?.access_token || SUPABASE_ANON_KEY;
      const ts = new Date().toISOString();
      const by = userProfile?.person_id || null;
      const hdrs = { "Content-Type": "application/json", "apikey": SUPABASE_ANON_KEY, "Authorization": `Bearer ${token}`, "Prefer": "resolution=merge-duplicates,return=minimal" };
      // schedule_days leg: per-day CAS writes, no upsert (see the comment above).
      const dayHdrs = { "Content-Type": "application/json", "apikey": SUPABASE_ANON_KEY, "Authorization": `Bearer ${token}`, "Prefer": "return=minimal" };
      try {
        const cur = payload.schedule || {};
        const base = lastSyncRef.current || {};
        const chk = scheduleWipeCheck(base, cur);
        if (chk.wipe && !intentionalScheduleWipeRef.current) {
          console.warn(`Keepalive flush (${source}): wipe-shaped diff skipped.`);
        } else {
          let sent = 0;
          for (const day of Object.keys(Object.assign({}, base, cur))) {
            if (sameAssignment(day, base[day], cur[day])) continue;
            const ver = dayVersionsRef.current[day];
            const row = assignmentToDayRow(day, cur[day] || emptyDayAssignment());
            const rearm = (e) => { console.warn(`Keepalive flush (${source}): schedule_days ${day} not sent -`, e); pendingSaveRef.current = payload; };
            // The response IS read: a 401/403/409 (or a CAS miss) re-arms the
            // pending payload so the next foreground re-syncs it - never a
            // silent "sent" (Prompt 11 hardening).
            const checkDay = (res) => { if (!res.ok) { console.warn(`Keepalive flush (${source}): schedule_days ${day} rejected with HTTP ${res.status} - re-armed for the next sync`); pendingSaveRef.current = payload; } };
            if (typeof ver === "number") {
              fetch(`${SUPABASE_URL}/rest/v1/schedule_days?day=eq.${day}&version=eq.${ver}`, { method: "PATCH", keepalive: true, headers: dayHdrs, body: JSON.stringify({ ...row, version: ver + 1, updated_by: by, updated_at: ts }) }).then(checkDay).catch(rearm);
            } else {
              fetch(`${SUPABASE_URL}/rest/v1/schedule_days`, { method: "POST", keepalive: true, headers: dayHdrs, body: JSON.stringify({ ...row, version: 1, updated_by: by, updated_at: ts }) }).then(checkDay).catch(rearm);
            }
            sent++;
          }
          if (sent) console.warn(`Keepalive flush (${source}): ${sent} schedule_days CAS write(s) sent; they re-sync on the next foreground if any did not land.`);
        }
      } catch (e) { console.warn("Unload flush (schedule_days) failed:", e); pendingSaveRef.current = payload; }
      if (!canWriteBlob) return;
      if (!blobLoadedRef.current) { console.warn(`Keepalive flush (${source}): shared setup never loaded - blob leg skipped.`); return; }
      fetch(`${SUPABASE_URL}/rest/v1/call_schedule_data?on_conflict=id`, {
        method: "POST", keepalive: true, headers: hdrs,
        body: JSON.stringify({ id: "main", data: blobFromBundle(payload), updated_by: by, updated_at: ts }),
      }).then((res) => {
        // Stamp the blob timestamp ONLY on a 2xx: a 401/403/5xx used to be
        // counted as saved and never retried (Prompt 11 hardening).
        if (res.ok) { blobTsRef.current = ts; return; }
        console.warn(`Keepalive blob save (${source}) rejected with HTTP ${res.status} - re-armed for the next autosave`);
        pendingSaveRef.current = payload;
      }).catch(e => {
        console.warn(`Keepalive save failed (${source}):`, e);
        pendingSaveRef.current = payload;
      });
    } catch (e) {
      console.warn(`Flush pending save (${source}) error:`, e);
      pendingSaveRef.current = payload;
    }
  };
  useEffect(() => {
    const onVisibilityChange = () => { if (document.hidden) flushRef.current("visibilitychange"); };
    const onPageHide = () => flushRef.current("pagehide");
    const onBeforeUnload = () => flushRef.current("beforeunload");
    document.addEventListener("visibilitychange", onVisibilityChange);
    window.addEventListener("pagehide", onPageHide);
    window.addEventListener("beforeunload", onBeforeUnload);
    return () => {
      document.removeEventListener("visibilitychange", onVisibilityChange);
      window.removeEventListener("pagehide", onPageHide);
      window.removeEventListener("beforeunload", onBeforeUnload);
    };
  }, []);

  // --- Periodic snapshot safety net ---
  // Once per session (and at most once every 6h across sessions), capture a
  // snapshot after load so there is always a recent restore point.
  const sessionSnapRef = useRef(false);
  useEffect(() => {
    if (!loaded || sessionSnapRef.current) return;
    if (!isScheduler) return;
    sessionSnapRef.current = true;
    // The result IS inspected: a failed safety-net snapshot is worth a toast
    // (it is the restore point every destructive action counts on).
    snapshots.captureIfStale("periodic_session", 6).then(r => {
      if (r && r.ok && !r.skipped) { noteSnapshotTaken(); console.info("Periodic session snapshot saved", r.counts || ""); }
      else if (r && r.ok && r.skipped === "fresh") console.info("Periodic session snapshot skipped - a snapshot newer than 6 h exists");
      else if (r && r.ok) console.warn("Periodic session snapshot skipped:", r.skipped);
      else { console.warn("Periodic session snapshot FAILED:", r && r.error); showToast("The automatic backup snapshot failed - " + ((r && r.error) || "unknown error") + ". Export a JSON backup from Settings before any destructive change.", "error"); }
    }).catch(e => { console.warn("Periodic session snapshot threw:", e); showToast("The automatic backup snapshot failed - check your connection.", "error"); });
    // The strip's "last snapshot" age: the newest row, once, for schedulers.
    snapshots.list(1).then(rows => { if (Array.isArray(rows) && rows[0] && rows[0].created_at) setLastSnapshotAt(rows[0].created_at); }).catch(e => console.warn("last-snapshot lookup failed:", e));
  }, [loaded, isScheduler]);

  // ====================================================================
  // ONE RULES CONTEXT for the whole UI (Prompt 6 Slice B/D).
  // Built from the blob (roster / surgeonRules / groupRules / holidays), the
  // time_off and availability rows, the three East caches and the current
  // schedule; memoised on exactly those inputs and rebuilt when any changes.
  // eligibility(rulesCtx, ...) is the single chokepoint (rules.js) - the day
  // editor, badges and (Slice E) the generator all read this one ctx or a
  // draft built from the same ctxInputs. No surgeon-specific branch: which
  // East feature applies to whom is read from surgeonRules[id].eastFeed.
  // ====================================================================
  // Resolve Davenport ids by CODE once the East caches are in (never a literal id).
  useEffect(() => {
    if (eastIdByCode && eastIdByCode._source !== "failed") return;
    const needCodes = surgeons.filter(s => {
      const ef = surgeonRules && surgeonRules[s.id] && surgeonRules[s.id].eastFeed;
      return ef && ef.enabled && (ef.eastBlocksPrimary || ef.eastBlocksBackup) && s.code;
    }).map(s => String(s.code).toUpperCase());
    if (!needCodes.length) return;
    // 1) the forecast rows carry the Davenport id they were built for (code FAK by construction)
    const fc = eastForecastRows.find(r => r && r.data && r.data.fakId);
    if (fc && needCodes.length === 1 && needCodes[0] === "FAK") { setEastIdByCode({ FAK: fc.data.fakId, _source: "forecast" }); return; }
    if (!eastFeedRows.length || (eastIdByCode && eastIdByCode._source === "failed")) return;
    // 2) the Davenport roster, read-only, through east-feed.js (GET only)
    let cancelled = false;
    (async () => {
      try {
        const rows = await eastGetJson("call_schedule_data?id=eq.main&select=data");
        let blob = rows[0] && rows[0].data;
        if (typeof blob === "string") blob = JSON.parse(blob);
        const m = { _source: "davenport" };
        (blob && Array.isArray(blob.surgeons) ? blob.surgeons : []).forEach(s => { if (s && s.name && s.id) m[String(s.name).toUpperCase()] = s.id; });
        if (!cancelled) setEastIdByCode(m);
      } catch (e) {
        console.warn("Davenport roster read failed - East ids unresolved, East days show as unknown:", e);
        if (!cancelled) setEastIdByCode({ _source: "failed" });
      }
    })();
    return () => { cancelled = true; };
  }, [surgeons, surgeonRules, eastFeedRows, eastForecastRows, eastIdByCode]);

  const ctxInputs = useMemo(() => {
    const weeks = eastFeedRows.map(r => ({ weekMonday: r.week_monday, data: r.data || {} }));
    // Prompt 12 C (9/22): published > override > forecast. The forecast is pruned
    // to the weeks Davenport has NOT published (published coverage = coverageOf of
    // the cached weeks; rules.js ignores the forecast inside it anyway - pruning
    // here keeps the badges, the coverage strip and the day editor consistent),
    // and the east_overrides rows go to buildContext as their own input
    // (eastOverrides, grouped per person) so a busy:false override clears a
    // forecast-busy day too. applyOverrides on the busy set stays for the display.
    const publishedCoverage = coverageOf(weeks);
    const forecastAll = forecastFromFeedRows(eastForecastRows);
    const eastOverrides = overridesByPerson(eastOverrideRows);
    const eastBusyDays = {}, eastForecast = {}, eastDerived = [], eastMeta = {};
    const forecastIds = []; // surgeons whose eastFeed.forecast is on - filled after the prune below
    let unresolved = false;
    surgeons.forEach(s => {
      const ef = (surgeonRules && surgeonRules[s.id] && surgeonRules[s.id].eastFeed) || null;
      if (!ef || !ef.enabled) return;
      const meta = { code: s.code, busyDays: false, derivedWeeks: false, forecast: false, eastId: null };
      if (ef.eastBlocksPrimary || ef.eastBlocksBackup) {
        meta.busyDays = true;
        meta.eastId = (eastIdByCode && eastIdByCode[String(s.code || "").toUpperCase()]) || null;
        let busy = new Set();
        if (meta.eastId) busy = deriveKhanBusyDays(weeks, meta.eastId, { eastBackupCountsAsBusy: ef.eastBackupCountsAsBusy !== false }).busy;
        else if (weeks.length) unresolved = true;
        eastBusyDays[s.id] = applyOverrides(busy, eastOverrideRows, s.id);
        if (ef.forecast) forecastIds.push(s.id);
      }
      if (ef.deriveFrom || ef.statedWeeks) {
        meta.derivedWeeks = true;
        deriveFierceWeeks(weeks, { statedWeeks: ef.statedWeeks || null }).forEach(w => {
          eastDerived.push({ surgeonId: s.id, weekMonday: w.weekMonday, silvisRole: w.silvisRole, source: w.source });
        });
      }
      eastMeta[s.id] = meta;
    });
    // Coverage is claimed only when every busy-days surgeon resolved: an
    // unresolved id must read as "unknown" (soft penalty), never as "clear".
    const coverage = unresolved ? null : publishedCoverage;
    // Fix round (9/22, findings 3 + 8): prune the forecast with the SAME coverage the
    // engine receives. While an East id is unresolved the coverage is null and the
    // forecast stays whole, so a hard forecast block is never downgraded to a soft
    // 'east-unknown' by the pruning; once resolved, published rows win.
    const forecast = forecastOutsideCoverage(forecastAll, coverage);
    if (Object.keys(forecast).length) forecastIds.forEach(id => { eastForecast[id] = forecast; eastMeta[id].forecast = true; });
    return {
      roster: surgeons, surgeonRules: surgeonRules || {}, groupRules: groupRules || {}, holidays: holidays || {},
      timeOffRows, availabilityRows, schedule,
      eastBusyDays, eastForecast, eastOverrides, eastDerived, eastFeedCoverage: coverage, eastMeta,
    };
  }, [surgeons, surgeonRules, groupRules, holidays, timeOffRows, availabilityRows, schedule, eastFeedRows, eastForecastRows, eastOverrideRows, eastIdByCode]);
  const rulesCtxState = useMemo(() => safeBuildContext(ctxInputs), [ctxInputs]);
  const rulesCtx = rulesCtxState.ctx;
  // Prompt 12 C.4 (9/22): the East conflict report over the WHOLE schedule map
  // (published schedule_days rows) - recomputed whenever the ctx changes, which is
  // after every load / East refresh / override save. Shown in the East feed card.
  const eastConflictRows = useMemo(() => {
    if (!rulesCtx || typeof eastConflicts !== "function") return [];
    try { return eastConflicts(rulesCtx, Object.keys(schedule || {}).sort()); }
    catch (e) { console.warn("East conflict report failed", e); return []; }
  }, [rulesCtx, schedule]);
  useEffect(() => {
    if (rulesCtxState.error) showToast("Couldn't build the rules context - eligibility checks are unavailable (" + rulesCtxState.error.slice(0, 90) + ").", "error");
    else if (rulesCtx && rulesCtx.warnings && rulesCtx.warnings.length) console.warn("rules context warnings:", rulesCtx.warnings);
  }, [rulesCtxState]);

  // --- Day editor save: the ONLY manual schedule mutation path ---
  // DayEditor (module scope) validates every pick through eligibility() and
  // collects explicit overrides; this applies the result: undo point, note
  // prefixed '[override: ...]', source "manual", audit 'schedule.day_edit'
  // with before/after rows, a schedule_changed notification for everyone
  // affected. Persistence is unchanged: the autosave's days leg pushes the
  // new map through syncScheduleDays (per-day CAS; a conflict toasts
  // "Changed by someone else - reloaded").
  const saveDayEdit = (day, next, meta) => {
    if (!isScheduler || isPublicMode) { showToast("Only the scheduler can change the schedule.", "error"); return false; }
    const before = schedule[day] || emptyDayAssignment();
    const after = { ...emptyDayAssignment(), ...next };
    if (after.primary && after.primary === after.backup) { showToast("Primary and backup must be different people.", "error"); return false; }
    if (after.primary) after.externalCover = null; // a roster primary replaces an external cover
    after.externalCover = (after.externalCover || "").trim() || null;
    const overrides = (meta && meta.overrides) || [];
    let note = (after.note || "").replace(/^\[override:[^\]]*\]\s*/, "").trim();
    if (overrides.length) {
      const tag = "[override: " + overrides.map(o => nameOf(o.id) + " " + o.role + ": " + o.reasons.join(", ")).join("; ") + "]";
      note = note ? tag + " " + note : tag;
    }
    after.note = note || null;
    // Prompt 12 M: a day that carries an outside surgeon (roster type "external") in either role is a
    // hand-written assignment - source manual-external (the generator never moves such a slot).
    const isExternalId = (id) => !!(id && sMap[id] && sMap[id].type === "external");
    after.source = (isExternalId(after.primary) || isExternalId(after.backup)) ? "manual-external" : "manual";
    if (sameAssignment(day, before, after)) return true; // nothing changed - nothing to write
    pushUndo(schedule);
    setSchedule(p => ({ ...p, [day]: after }));

      if (!res.ok || (result && result.failed > 0)) {
        console.warn("Email notification issue:", type, res.status, JSON.stringify(result));
        showToast(res.status === 404 ? "Email function is not deployed yet (Prompt 10) - no email sent." : "Some notification emails didn't send.", "error");
        return { ok: false, status: res.status, error: errText || `HTTP ${res.status}`, sent: result && Number(result.sent) || 0, failed: result && Number(result.failed) || 0 };
      }
      return { ok: true, sent: result && Number(result.sent) || 0, failed: 0, skippedPrefOff: result && Number(result.skipped_pref_off) || 0 };
    } catch(e) { console.warn("Email notification error:", e); showToast("Couldn't send email notifications - check your connection.", "error"); return { ok: false, status: 0, error: String(e && e.message || e), sent: 0, failed: 0 }; }
  }, []);

  // ====================================================================
  // TRADES by day + role (Prompt 6 Slice G). Rows live in shift_trade_requests;
  // status moves pending -> accepted -> applied (or declined / cancelled).
  // Writes: POST (propose), PATCH status (accept / decline / cancel; RLS +
  // trade_update_guard decide who may), POST rpc/apply_trade (the security
  // definer swaps the schedule_days rows, flips the trade to applied and
  // writes the audit row 'trade.apply'). Every write uses dbAuthHeaders() and
  // checks its response; a 200 + zero rows on the PATCH is an RLS no-op and
  // is reported, never treated as success. The scheduler's revert is the day
  // editor (link on applied trades).
  // ====================================================================
  // Eligibility for a counter-party taking `day`/`role` (rules.js chokepoint).
  // Locks are ignored - the holder consents by proposing; vacations, patterns,
  // East, caps, consecutive runs and the other role that day all still apply.
  // fg-2: FAILS CLOSED. No rules context (setup not loaded) or a thrown check
  // -> { ok: false, unknown: true }: members are stopped, the scheduler gets a
  // confirm (rulesUnknownGate) - never a silent skip. `opts` passes through
  // (assume: the other days of a unit).
  const tradeEligibility = (day, role, candidateId, opts) => {
    if (!suIsIso(day) || !candidateId) return { ok: false, hard: ["bad-input"], soft: [] };
    if (!rulesCtx) return { ok: false, hard: ["rules-unavailable"], soft: [], unknown: true };
    try { return eligibility(rulesCtx, day, role, candidateId, { ignoreLocks: true, ...(opts || {}) }); }
    catch (e) {
      console.warn("trade eligibility check failed:", e);
      const msg = String(e && e.message || e).slice(0, 80);
      return { ok: false, hard: ["rules-unavailable:" + msg], soft: [], unknown: true, error: msg };
    }
  };
  // Eligibility over EVERY day of a unit (the other unit days assumed held, as
  // holidayUnitCandidates does): the first failing day's result, else ok with
  // the union of the soft notes.
  // Small items (9/22): a full Fri+Sat+Sun block (three consecutive days from a
  // Friday, none in a holiday unit) offered to a BLOCK-style receiver is evaluated
  // with asBlockMember on every day - exactly as the generator evaluates a block -
  // so Fierce can receive a weekend block (his Friday alone is weekend-block-only).
  const tradeIsFullWeekendBlock = (days) => {
    if (!days || days.length !== 3 || !days.every(suIsIso)) return false;
    const d0 = parse(days[0]);
    if (d0.getDay() !== 5 || days[1] !== fmt(addD(d0, 1)) || days[2] !== fmt(addD(d0, 2))) return false;
    return !(rulesCtx && rulesCtx.holidayByDay && days.some(d => rulesCtx.holidayByDay[d]));
  };
  const tradeEligibilityOver = (days, role, candidateId) => {
    const soft = [];
    const PR = rulesCtx && rulesCtx.per ? rulesCtx.per[candidateId] : null;
    const asBlock = !!(PR && PR.weekendStyle === "block" && tradeIsFullWeekendBlock(days));
    for (let i = 0; i < days.length; i++) {
      const r = tradeEligibility(days[i], role, candidateId, { assume: days.filter(x => x !== days[i]).map(x => ({ date: x, role })), ...(asBlock ? { asBlockMember: true } : {}) });
      if (!r.ok) return { ...r, day: days[i] };
      (r.soft || []).forEach(s => { if (!soft.some(x => x.reason === s.reason)) soft.push(s); });
    }
    return { ok: true, hard: [], soft };
  };
  const tradeReasonText = (r) => (r && r.hard && r.hard.length) ? reasonLabel(r.hard[0], nameOf) + (r.day ? " (" + fmtMD(r.day) + ")" : "") : "";
  // The scheduler may confirm past an UNKNOWN check; members are told to retry. True = proceed.
  const rulesUnknownGate = (elig, whoId, what, verb) => {
    if (elig.error) showToast("Eligibility check failed: " + elig.error, "error");
    if (!isScheduler) { showToast(`Can't ${verb}: the rules have not loaded yet - try again in a moment.`, "error"); return false; }
    return confirm(`The rules have not loaded, so ${nameOf(whoId)}'s eligibility for ${what} could not be checked. ${verb === "accept" ? "Accept" : "Propose"} anyway as the scheduler?`);
  };
  // fg-1: unit integrity. A holiday unit (rules doc s5) and a block-style
  // surgeon's Fri-Sun block (s4) are ONE commitment - one primary and one
  // backup stick through the whole unit - so a trade moves every unit day the
  // holder holds in that role, or nothing. Returns { kind, name, days } for a
  // multi-day unit, else null (a single held day cannot be split further).
  const tradeUnitOf = (day, role, holderId) => {
    if (!rulesCtx || !suIsIso(day) || !holderId) return null;
    const sched = scheduleRef.current || schedule || {};
    const holds = (d) => !!(sched[d] && sched[d][role] === holderId);
    const hol = rulesCtx.holidayByDay ? rulesCtx.holidayByDay[day] : null;
    if (hol) {
      const held = hol.days.filter(holds);
      return held.length > 1 ? { kind: "holiday", name: hol.name, days: held } : null;
    }
    const P = rulesCtx.per ? rulesCtx.per[holderId] : null;
    if (!P || P.weekendStyle !== "block") return null;
    const dow = parse(day).getDay();
    if (dow !== 5 && dow !== 6 && dow !== 0) return null;
    const fri = fmt(addD(parse(day), dow === 5 ? 0 : dow === 6 ? -1 : -2));
    const days = [fri, fmt(addD(parse(fri), 1)), fmt(addD(parse(fri), 2))];
    if (days.some(d => rulesCtx.holidayByDay[d])) return null; // a holiday unit takes precedence over the weekend it overlaps (s5)
    return days.every(holds) ? { kind: "weekend-block", name: "weekend block", days } : null;
  };
  const unitText = (u) => `${u.name} unit ${fmtMD(u.days[0])}-${fmtMD(u.days[u.days.length - 1])} (${u.days.length} days)`;
  // Unit stamp written into detail, e.g. "[unit holiday 2026-11-26 4: Thanksgiving unit 11/26-11/29 (4 days), day 1 of 4]".
  const tradeUnitStamp = (u, i) => `[unit ${u.kind} ${u.days[0]} ${u.days.length}: ${unitText(u)}, day ${i + 1} of ${u.days.length}]`;
  const tradeUnitTag = (r) => { const m = /\[unit (holiday|weekend-block) (\d{4}-\d{2}-\d{2}) (\d+): ([^\]]+), day (\d+) of \d+\]/.exec(String(r && r.detail || "")); return m ? { kind: m[1], start: m[2], n: Number(m[3]), text: m[4], index: Number(m[5]) } : null; };
  // Rows proposed together as one unit (same stamp, parties and role) that are
  // still in `status` (default: the row's own): they are accepted, declined,
  // cancelled and applied together. Sorted by day.
  const tradeGroupOf = (r, status) => {
    const tag = tradeUnitTag(r);
    if (!tag) return [r];
    const st = status || r.status;
    const same = (x) => { const t = tradeUnitTag(x); return !!t && t.kind === tag.kind && t.start === tag.start && t.n === tag.n && x.from_surgeon_id === r.from_surgeon_id && x.to_surgeon_id === r.to_surgeon_id && x.role === r.role && x.status === st; };
    return [r].concat(tradeRequests.filter(x => x.id !== r.id && same(x))).sort((a, b) => a.day < b.day ? -1 : a.day > b.day ? 1 : 0);
  };
  const roleWordOf = (r) => r === "primary" ? "Primary" : "Backup";
  // Days a person holds from today on (role, the other role's holder), for the pickers and My schedule.
  const upcomingDaysOf = (pid, horizonDays) => {
    if (!pid) return [];
    const limit = typeof horizonDays === "number" ? fmt(addD(parse(todayStr), horizonDays)) : null;
    return Object.keys(schedule).sort().filter(d => d >= todayStr && (!limit || d <= limit) && schedule[d] && (schedule[d].primary === pid || schedule[d].backup === pid))
      .map(d => { const a = schedule[d]; const role = a.primary === pid ? "primary" : "backup"; return { day: d, role, other: role === "primary" ? dayHolder(a, "backup") : dayHolder(a, "primary"), locked: role === "primary" ? a.primaryLocked : a.backupLocked, a }; });
  };
  const tradeNamed = (r) => ({ ...r, from_surgeon_name: r.from_surgeon_name || nameOf(r.from_surgeon_id), to_surgeon_name: r.to_surgeon_name || nameOf(r.to_surgeon_id) });

  // --- Propose ---
  const submitTradeRequest = async () => {
    if (isPublicMode) return;
    const fromId = isScheduler ? tradeFrom : (mySurgeon || "");
    if (!fromId || !tradeTo || !tradeDay || !tradeRole) { showToast("Pick both surgeons, the day and the role.", "error"); return; }
    if (fromId === tradeTo) { showToast("Pick a different surgeon to trade with.", "error"); return; }
    if (!isScheduler && fromId !== mySurgeon) { showToast("You can only propose trades for your own days.", "error"); return; }
    const sched = scheduleRef.current || {};
    const holder = sched[tradeDay] ? sched[tradeDay][tradeRole] : null;
    if (holder !== fromId) { showToast(`${nameOf(fromId)} is not ${tradeRole} on ${fmtMD(tradeDay)} (that slot is ${holderLabel(holder, nameOf)}).`, "error"); return; }
    // fg-1: unit integrity of the given leg - a unit day goes as the whole
    // unit (one row per day); a member cannot split it, the scheduler confirms.
    const unit = tradeUnitOf(tradeDay, tradeRole, fromId);
    const whole = !!unit && tradeWholeUnit;
    if (unit && !whole) {
      if (!isScheduler) { showToast(`Blocked: ${fmtMD(tradeDay)} is ${reasonLabel("unit-split:" + unitText(unit))}.`, "error"); return; }
      if (!confirm(`${fmtMD(tradeDay)} is part of the ${unitText(unit)}. One primary and one backup stick through a unit; moving this day alone splits it. Split the unit anyway as the scheduler?`)) return;
    }
    const days = whole ? unit.days : [tradeDay];
    const givenLabel = whole ? "the " + unitText(unit) : slotLabel(tradeDay, tradeRole);
    // fg-2: the check fails closed - unknown stops a member and confirm-gates the scheduler.
    const elig = whole ? tradeEligibilityOver(days, tradeRole, tradeTo) : tradeEligibility(tradeDay, tradeRole, tradeTo);
    if (!elig.ok) {
      if (!elig.unknown) { showToast(`Blocked: ${nameOf(tradeTo)} can't take ${givenLabel} - ${tradeReasonText(elig)}.`, "error"); return; }
      if (!rulesUnknownGate(elig, tradeTo, givenLabel, "propose")) return;
    }
    // The return leg: a unit day of the counter-party's comes back as a whole
    // unit too (day for day when the sizes match), never as a split.
    let retDays = [], retUnit = null;
    if (tradeReturnDay) {
      const rHolder = sched[tradeReturnDay] ? sched[tradeReturnDay][tradeReturnRole] : null;
      if (rHolder !== tradeTo) { showToast(`${nameOf(tradeTo)} is not ${tradeReturnRole} on ${fmtMD(tradeReturnDay)} (that slot is ${holderLabel(rHolder, nameOf)}).`, "error"); return; }
      retUnit = tradeUnitOf(tradeReturnDay, tradeReturnRole, tradeTo);
      if (retUnit && whole && retUnit.days.length === days.length) retDays = retUnit.days;
      else if (retUnit) {
        if (!isScheduler) { showToast(`Blocked: ${nameOf(tradeTo)}'s ${fmtMD(tradeReturnDay)} is ${reasonLabel("unit-split:" + unitText(retUnit))}${whole ? " (it does not match the " + days.length + "-day unit you give)" : ""}.`, "error"); return; }
        if (!confirm(`${nameOf(tradeTo)}'s ${fmtMD(tradeReturnDay)} is part of the ${unitText(retUnit)}; taking that day alone splits it. Split it anyway as the scheduler?`)) return;
        retUnit = null; retDays = [tradeReturnDay];
      } else retDays = [tradeReturnDay];
      const retLabel = retDays.length > 1 ? "the " + unitText(retUnit) : slotLabel(tradeReturnDay, tradeReturnRole);
      const rElig = retDays.length > 1 ? tradeEligibilityOver(retDays, tradeReturnRole, fromId) : tradeEligibility(tradeReturnDay, tradeReturnRole, fromId);
      if (!rElig.ok) {
        if (!rElig.unknown) { showToast(`Blocked: ${nameOf(fromId)} can't take ${retLabel} in return - ${tradeReasonText(rElig)}.`, "error"); return; }
        if (!rulesUnknownGate(rElig, fromId, retLabel + " in return", "propose")) return;
      }
    } else if (!isScheduler) {
      showToast("A return shift is required - pick the day and role you'll take in return. One-way trades are the scheduler's call.", "error");
      return;
    } else if (!confirm("No return shift specified. One-way trades are for emergencies only. Submit anyway?")) return;
    const fromName = nameOf(fromId), toName = nameOf(tradeTo);
    setTradeBusy("propose");
    try {
      // One row per given day. A single return day rides on the first row (the
      // rest of the unit is one-way inside the group); a matching return unit
      // pairs day for day. The unit stamp in detail ties the rows together.
      const rows = days.map((d, i) => {
        const back = retDays.length === days.length ? retDays[i] : (i === 0 ? (retDays[0] || null) : null);
        const req = {
          from_surgeon_id: fromId, from_surgeon_name: fromName,
          to_surgeon_id: tradeTo, to_surgeon_name: toName,
          day: d, role: tradeRole,
          return_day: back || null, return_role: back ? tradeReturnRole : null,
          status: "pending", submitted_at: new Date().toISOString(),
        };
        req.detail = tradeProposeMsg(req) + (whole ? " " + tradeUnitStamp(unit, i) : "");
        return req;
      });
      const inserted = [];
      for (const req of rows) {
        const { data: row, error } = await db.insert("shift_trade_requests", req);
        if (error || !row) {
          console.warn("trade insert failed", error);
          showToast(`Couldn't submit the trade${inserted.length ? ` (${inserted.length} of ${rows.length} unit days were submitted - cancel them or ask the scheduler)` : ""}: ` + describeDbError(error), "error");
          break;
        }
        inserted.push(row);
      }
      if (!inserted.length) return;
      setTradeRequests(prev => [...inserted.slice().reverse(), ...prev.filter(r => !inserted.some(x => x.id === r.id))]);
      const first = inserted[0];
      const msg = !whole ? first.detail
        : `${fromName} proposed a trade: ${toName} would take ${roleWordOf(tradeRole)} ${fmtMD(days[0])}-${fmtMD(days[days.length - 1])} (the ${unitText(unit)}, moved as one)`
          + (retDays.length > 1 ? `; ${fromName} would take ${roleWordOf(tradeReturnRole)} ${fmtMD(retDays[0])}-${fmtMD(retDays[retDays.length - 1])} in return` : retDays.length === 1 ? `; ${fromName} would take ${slotLabel(retDays[0], tradeReturnRole)} in return` : " (one-way - no return shift)");
      logAudit("trade.propose", msg, { trade_id: first.id, trade_ids: inserted.map(r => r.id), from: fromId, to: tradeTo, day: tradeDay, role: tradeRole, days, return_day: first.return_day, return_role: first.return_role, return_days: retDays, unit: unit ? unit.name : null });
      await addNotification("trade_proposed", "Shift trade proposed", msg, { from_surgeon_id: fromId, to_surgeon_id: tradeTo, trade_id: first.id, trade_ids: inserted.map(r => r.id), day: tradeDay });
      sendEmailNotif("trade_proposed", { message: msg, subject: "Shift trade proposed - " + (whole ? unitText(unit) : slotLabel(tradeDay, tradeRole)) }, [fromId, tradeTo]);
      setTradeDay(""); setTradeReturnDay("");
      if (inserted.length === rows.length) showToast(whole ? `Trade proposed for the ${unitText(unit)} - ${inserted.length} rows.` : "Trade proposed.", "success");
    } catch(e) { console.warn("Submit trade error:", e); showToast("Couldn't submit the trade - check your connection and try again.", "error"); }
    finally { setTradeBusy(""); }
  };

  // --- Status writes ---
  // PATCH one trade's status. RLS (parties + scheduler) and trade_update_guard
  // (counter-party -> accepted/declined, proposer -> cancelled, pending only)
  // decide who may; their raised messages come back verbatim. A 200 with zero
  // rows is an RLS-filtered no-op and is reported as a failure.
  const patchTradeStatus = async (trade, status) => {
    try {
      const res = await fetch(`${SUPABASE_URL}/rest/v1/shift_trade_requests?id=eq.${encodeURIComponent(trade.id)}`, {
        method: "PATCH", headers: { ...dbAuthHeaders(), Prefer: "return=representation" },
        body: JSON.stringify({ status, decided_at: new Date().toISOString() }),
      });
      const text = await res.text().catch(() => "");
      if (!res.ok) return { ok: false, error: describeDbError(text) || `HTTP ${res.status}` };
      let rows = []; try { rows = JSON.parse(text); } catch (e) { console.warn("trade status write: 2xx with a non-JSON body (treated as no row updated)", text.slice(0, 160), e); rows = []; }
      if (!Array.isArray(rows) || rows.length !== 1) return { ok: false, error: "no row was updated - the trade was already decided, or your account is not a party to it (list reloaded)" };
      return { ok: true, row: rows[0] };
    } catch (e) { console.warn("trade status write failed:", e); return { ok: false, error: "network error - check your connection and try again" }; }
  };
  // POST rest/v1/rpc/apply_trade { p_trade_id } - callable by a party or the
  // scheduler once the trade is 'accepted'. Errors (TRADE_STALE, the
  // distinct-roles check, ...) are returned verbatim for the UI.
  const applyTradeRpc = async (trade) => {
    try {
      const res = await fetch(`${SUPABASE_URL}/rest/v1/rpc/apply_trade`, { method: "POST", headers: dbAuthHeaders(), body: JSON.stringify({ p_trade_id: trade.id }) });
      const text = await res.text().catch(() => "");
      if (!res.ok) return { ok: false, error: describeDbError(text) || `HTTP ${res.status}` };
      let body = null; try { body = text ? JSON.parse(text) : null; } catch (e) { console.warn("apply_trade: 2xx with a non-JSON body", text.slice(0, 160), e); body = null; }
      return { ok: true, result: body };
    } catch (e) { console.warn("apply_trade call failed:", e); return { ok: false, error: "network error - the trade stays accepted; use Retry apply" }; }
  };
  // opts.silent: a unit group's caller sends ONE notification for all its rows.
  const runApplyTrade = async (trade, opts) => {
    const t = tradeNamed(trade);
    const a = await applyTradeRpc(t);
    if (!a.ok) {
      console.warn("apply_trade refused:", a.error);
      setTradeApplyErr(prev => ({ ...prev, [t.id]: a.error }));
      showToast("The trade is accepted but NOT applied: " + a.error, "error");
      if (refreshTradesRef.current) refreshTradesRef.current();
      return false;
    }
    setTradeApplyErr(prev => { const n = { ...prev }; delete n[t.id]; return n; });
    const applied = { ...t, status: "applied", decided_at: t.decided_at || new Date().toISOString() };
    setTradeRequests(prev => prev.map(r => r.id === t.id ? applied : r));
    // The function wrote schedule_days (version+1, source 'trade'); realtime
    // delivers the rows too, but refetch so the calendar is right immediately.
    try { if (refreshDaysRef.current) await refreshDaysRef.current(); } catch (e) { console.warn("schedule refetch after apply_trade failed:", e); showToast("Trade applied, but the calendar could not be refreshed - reload to see it.", "error"); }
    if (refreshTradesRef.current) refreshTradesRef.current();
    if (opts && opts.silent) return true;
    const msg = tradeAppliedMsg(applied);
    await addNotification("trade_applied", "Shift trade applied", msg, { from_surgeon_id: t.from_surgeon_id, to_surgeon_id: t.to_surgeon_id, trade_id: t.id, day: t.day });
    sendEmailNotif("trade_applied", { message: msg, subject: "Shift trade applied - " + slotLabel(t.day, t.role) }, [t.from_surgeon_id, t.to_surgeon_id]);
    showToast("Trade applied to the schedule.", "success");
    return true;
  };
  // Accept: the recipient's eligibility is re-checked at acceptance (the
  // schedule may have moved since the proposal); PATCH accepted, then apply.
  const acceptTrade = async (trade) => {
    if (!trade || trade.status !== "pending" || tradeBusy) return;
    const t = tradeNamed(trade);
    if (!isScheduler && t.to_surgeon_id !== mySurgeon) { showToast("Only the surgeon asked can accept this trade.", "error"); return; }
    // fg-1: a unit proposal is accepted as one (every pending row of the group);
    // fg-2: both checks fail closed (unknown -> member stopped, scheduler confirms).
    const group = tradeGroupOf(t, "pending").map(tradeNamed);
    const gDays = group.map(g => g.day);
    const tag = tradeUnitTag(t);
    const what = group.length > 1 ? "the " + (tag ? tag.text : gDays.length + " unit days") : slotLabel(t.day, t.role);
    const elig = group.length > 1 ? tradeEligibilityOver(gDays, t.role, t.to_surgeon_id) : tradeEligibility(t.day, t.role, t.to_surgeon_id);
    if (!elig.ok) {
      const why = tradeReasonText(elig);
      if (elig.unknown) { if (!rulesUnknownGate(elig, t.to_surgeon_id, what, "accept")) return; }
      else if (!isScheduler) { showToast(`Can't accept: ${nameOf(t.to_surgeon_id)} can't take ${what} - ${why}. Ask the scheduler.`, "error"); return; }
      else if (!confirm(`The rules say ${nameOf(t.to_surgeon_id)} can't take ${what} (${why}). Accept anyway as the scheduler?`)) return;
    }
    const retRows = group.filter(g => g.return_day);
    if (retRows.length) {
      const rRole = retRows[0].return_role;
      const retDays = retRows.map(g => g.return_day);
      const rWhat = retRows.length > 1 ? `${roleWordOf(rRole)} ${fmtMD(retDays[0])}-${fmtMD(retDays[retDays.length - 1])} (${retDays.length} days)` : slotLabel(retRows[0].return_day, rRole);
      const rElig = retRows.length > 1 ? tradeEligibilityOver(retDays, rRole, t.from_surgeon_id) : tradeEligibility(retRows[0].return_day, rRole, t.from_surgeon_id);
      if (!rElig.ok) {
        const why = tradeReasonText(rElig);
        if (rElig.unknown) { if (!rulesUnknownGate(rElig, t.from_surgeon_id, rWhat + " in return", "accept")) return; }
        else if (!isScheduler) { showToast(`Can't accept: ${nameOf(t.from_surgeon_id)} can't take ${rWhat} in return - ${why}. Ask the scheduler.`, "error"); return; }
        else if (!confirm(`The rules say ${nameOf(t.from_surgeon_id)} can't take ${rWhat} (${why}). Accept anyway as the scheduler?`)) return;
      }
    }
    setTradeBusy(t.id);
    try {
      const accepted = [];
      for (const g of group) {
        const p = await patchTradeStatus(g, "accepted");
        if (!p.ok) {
          showToast(`Couldn't accept the trade${accepted.length ? ` (${accepted.length} of ${group.length} unit days are accepted - use Retry apply on them)` : ""}: ` + p.error, "error");
          if (refreshTradesRef.current) refreshTradesRef.current();
          if (!accepted.length) return;
          break;
        }
        const row = { ...g, ...p.row, status: "accepted" };
        accepted.push(row);
        setTradeRequests(prev => prev.map(r => r.id === row.id ? row : r));
      }
      const first = accepted[0], last = accepted[accepted.length - 1];
      const unitName = tag ? "the " + tag.text : accepted.length + " unit days";
      const msg = accepted.length > 1 ? `${first.to_surgeon_name} accepted the trade: ${first.to_surgeon_name} takes ${roleWordOf(first.role)} ${fmtMD(first.day)}-${fmtMD(last.day)} (${unitName}, moved as one)${first.return_day ? "; " + first.from_surgeon_name + " takes " + slotLabel(first.return_day, first.return_role) + (retRows.length > 1 ? " and " + (retRows.length - 1) + " more return day(s)" : "") : ""}` : tradeAcceptMsg(first);
      logAudit("trade.accept", msg, { trade_id: first.id, trade_ids: accepted.map(r => r.id), day: first.day, role: first.role, days: accepted.map(r => r.day), return_day: first.return_day, return_role: first.return_role, from: first.from_surgeon_id, to: first.to_surgeon_id });
      await addNotification("trade_accepted", "Shift trade accepted", msg, { from_surgeon_id: first.from_surgeon_id, to_surgeon_id: first.to_surgeon_id, trade_id: first.id, trade_ids: accepted.map(r => r.id), day: first.day });
      let appliedAll = true;
      for (let i = 0; i < accepted.length; i++) {
        if (!(await runApplyTrade(accepted[i], { silent: accepted.length > 1 }))) { appliedAll = false; break; }
      }
      if (accepted.length > 1 && appliedAll) {
        const amsg = `Trade applied to the schedule: ${first.to_surgeon_name} takes ${roleWordOf(first.role)} ${fmtMD(first.day)}-${fmtMD(last.day)} (${unitName})${first.return_day ? "; " + first.from_surgeon_name + " takes " + slotLabel(first.return_day, first.return_role) + (retRows.length > 1 ? " and " + (retRows.length - 1) + " more return day(s)" : "") : ""}`;
        await addNotification("trade_applied", "Shift trade applied", amsg, { from_surgeon_id: first.from_surgeon_id, to_surgeon_id: first.to_surgeon_id, trade_id: first.id, trade_ids: accepted.map(r => r.id), day: first.day });
        sendEmailNotif("trade_applied", { message: amsg, subject: "Shift trade applied - " + (tag ? tag.text : slotLabel(first.day, first.role)) }, [first.from_surgeon_id, first.to_surgeon_id]);
        showToast(`Trade applied to the schedule (${accepted.length} days).`, "success");
      }
    } catch (e) { console.warn("accept trade error:", e); showToast("Couldn't accept the trade - check your connection and try again.", "error"); }
    finally { setTradeBusy(""); }
  };
  const retryApplyTrade = async (trade) => {
    if (!trade || trade.status !== "accepted" || tradeBusy) return;
    setTradeBusy(trade.id);
    try { await runApplyTrade(trade); }
    catch (e) { console.warn("retry apply error:", e); showToast("Couldn't apply the trade - check your connection and try again.", "error"); }
    finally { setTradeBusy(""); }
  };
  const declineTrade = async (trade) => {
    if (!trade || trade.status !== "pending" || tradeBusy) return;
    const t = tradeNamed(trade);
    if (!isScheduler && t.to_surgeon_id !== mySurgeon) { showToast("Only the surgeon asked can decline this trade.", "error"); return; }
    const group = tradeGroupOf(t, "pending").map(tradeNamed); // fg-1: a unit is declined as one
    setTradeBusy(t.id);
    try {
      const done = [];
      for (const g of group) {
        const p = await patchTradeStatus(g, "declined");
        if (!p.ok) { showToast(`Couldn't decline the trade${done.length ? ` (${done.length} of ${group.length} unit days were declined)` : ""}: ` + p.error, "error"); if (refreshTradesRef.current) refreshTradesRef.current(); if (!done.length) return; break; }
        const row = { ...g, ...p.row, status: "declined" };
        done.push(row);
        setTradeRequests(prev => prev.map(r => r.id === row.id ? row : r));
      }
      const first = done[0], tag = tradeUnitTag(first);
      const msg = done.length > 1 ? `${first.to_surgeon_name} declined the trade: ${tag ? "the " + tag.text : done.length + " unit days"} (${done.length} days) - ${tradeLegsText(first, "would have taken")}` : tradeDeclineMsg(first);
      logAudit("trade.decline", msg, { trade_id: first.id, trade_ids: done.map(r => r.id), day: first.day, role: first.role, from: first.from_surgeon_id, to: first.to_surgeon_id });
      await addNotification("trade_declined", "Shift trade declined", msg, { from_surgeon_id: first.from_surgeon_id, to_surgeon_id: first.to_surgeon_id, trade_id: first.id, trade_ids: done.map(r => r.id), day: first.day });
      sendEmailNotif("trade_declined", { message: msg, subject: "Shift trade declined - " + (tag ? tag.text : slotLabel(first.day, first.role)) }, [first.from_surgeon_id, first.to_surgeon_id]);
      showToast(done.length > 1 ? `Trade declined (${done.length} days).` : "Trade declined.", "info");
    } catch (e) { console.warn("decline trade error:", e); showToast("Couldn't decline the trade - check your connection and try again.", "error"); }
    finally { setTradeBusy(""); }
  };
  const cancelTrade = async (trade) => {
    if (!trade || trade.status !== "pending" || tradeBusy) return;
    const t = tradeNamed(trade);
    if (!isScheduler && t.from_surgeon_id !== mySurgeon) { showToast("Only the proposer can cancel this trade.", "error"); return; }
    const group = tradeGroupOf(t, "pending").map(tradeNamed); // fg-1: a unit is withdrawn as one
    if (!confirm(group.length > 1 ? `Cancel this unit trade proposal (${group.length} days)?` : "Cancel this trade proposal?")) return;
    setTradeBusy(t.id);
    try {
      const done = [];
      for (const g of group) {
        const p = await patchTradeStatus(g, "cancelled");
        if (!p.ok) { showToast(`Couldn't cancel the trade${done.length ? ` (${done.length} of ${group.length} unit days were cancelled)` : ""}: ` + p.error, "error"); if (refreshTradesRef.current) refreshTradesRef.current(); if (!done.length) return; break; }
        const row = { ...g, ...p.row, status: "cancelled" };
        done.push(row);
        setTradeRequests(prev => prev.map(r => r.id === row.id ? row : r));
      }
      const first = done[0], tag = tradeUnitTag(first);
      const msg = done.length > 1 ? `${first.from_surgeon_name} cancelled the trade: ${tag ? "the " + tag.text : done.length + " unit days"} (${done.length} days) - ${tradeLegsText(first, "would have taken")}` : tradeCancelMsg(first);
      logAudit("trade.cancel", msg, { trade_id: first.id, trade_ids: done.map(r => r.id), day: first.day, role: first.role, from: first.from_surgeon_id, to: first.to_surgeon_id });
      // In-app only: send-notification has no 'cancelled' category (a withdrawn proposal needs no email).
      await addNotification("trade_cancelled", "Shift trade cancelled", msg, { from_surgeon_id: first.from_surgeon_id, to_surgeon_id: first.to_surgeon_id, trade_id: first.id, trade_ids: done.map(r => r.id), day: first.day });
      showToast(done.length > 1 ? `Trade cancelled (${done.length} days).` : "Trade cancelled.", "info");
    } catch (e) { console.warn("cancel trade error:", e); showToast("Couldn't cancel the trade - check your connection and try again.", "error"); }
    finally { setTradeBusy(""); }

  // --- Mark Notifications as Seen ---

  // --- Test Notification ---

  // --- Office Contact Handlers (office_contacts: name, email, role, active) ---
  const addOfficeContact = async () => {

      setNewOfficeName(""); setNewOfficeEmail(""); setNewOfficeRole("");
    } catch (e) { console.warn("Office contact add failed:", e); showToast("Couldn't add the contact - check your connection.", "error"); }
    finally { setOfficeNotifBusy(false); }
  };
  const updateOfficeContact = async (id, patch) => {
    const before = officeContacts;
    setOfficeContacts(prev => prev.map(c => c.id === id ? { ...c, ...patch } : c));
    try {
      const { error } = await db.update("office_contacts", id, patch);
      if (error) { console.warn("Office contact update failed:", error); setOfficeContacts(before); showToast("Couldn't update the contact: " + describeDbError(error), "error"); return; }
      // Audited like add / remove (the one mutation that had no row): ids and
      // the toggled field only - never the address.

      logAudit("office_contact.update", `Office contact ${c ? c.name : id}: ${Object.keys(patch).map(k => k + " -> " + String(patch[k])).join(", ")}`, { id, patch: { active: patch.active } });
    } catch(e) { console.warn("Office contact update failed:", e); setOfficeContacts(before); showToast("Couldn't update the contact - check your connection and try again.", "error"); }
  };
  const deleteOfficeContact = async (id) => {
    const c = officeContacts.find(x => x.id === id);
    if (!c) return;
    if (!confirm(`Remove ${c.name} from the office distribution list?`)) return;

      if (!res.ok) { console.warn("Office contact delete failed:", res.status); showToast("Couldn't remove the contact - check your connection and try again.", "error"); return; }
      setOfficeContacts(prev => prev.filter(x => x.id !== id));
      logAudit("office_contact.remove", `Removed office contact ${c.name}`, { id });
    } catch(e) { console.warn("Office contact delete failed:", e); showToast("Couldn't remove the contact - check your connection and try again.", "error"); }
  };

  // --- Publish = the office-notification step ---
  // Edits go live on save. "Publish" diffs the current schedule against the
  // lastPublished watermark (blob key), shows the changes grouped by month as
  // "10/12 P Philip -> Fierce", sends them to office-notifications with mode
  // "publish", then stores the new watermark.
  const publishedAsSchedule = (lp) => {
    const out = {};
    const days = (lp && lp.days) || {};
    Object.keys(days).forEach(d => { out[d] = { ...emptyDayAssignment(), primary: days[d].primary || null, backup: days[d].backup || null, externalCover: days[d].externalCover || null }; });
    return out;
  };
  const snapshotForPublish = (sched) => {
    const days = {};
    Object.keys(sched).forEach(d => {
      const a = sched[d];
      if (a && (a.primary || a.backup || a.externalCover)) days[d] = { primary: a.primary || null, backup: a.backup || null, externalCover: a.externalCover || null };
    });
    return days;
  };
  const computePeriodLabel = () => {
    try {
      const days = Object.keys(schedule).filter(d => schedule[d] && (schedule[d].primary || schedule[d].backup)).sort();
      if (days.length === 0) return "";
      const f = parse(days[0]), l = parse(days[days.length - 1]);
      const nice = (d) => `${MO[d.getMonth()].slice(0,3)} ${d.getDate()}`;
      return `${nice(f)} - ${nice(l)}`;
    } catch(e) { console.warn("computePeriodLabel failed - the publish dialog opens with a blank period label:", e); return ""; }
  };
  const openPublishDialog = () => {
    const changes = diffScheduleDays(publishedAsSchedule(lastPublished), schedule).filter(c => c.role === "primary" || c.role === "backup");
    setPublishChanges(changes);
    setPublishLabel(computePeriodLabel());
    setShowPublishDialog(true);
  };
  publishRef.current = openPublishDialog; // latest closure for acceptPreview (conventions item 1)
  // Armed by acceptMerged (Accept & Publish) once the generated days are on
  // file: the open-shifts notice to the group then goes out exactly once when
  // the publish dialog closes - Send (after the office POST, folded into the
  // Published toast), Skip the notice, or the backdrop. A failed office POST
  // keeps the dialog open, so the notice still follows on Skip or a retry.
  // The header's "Publish and notify office" does not arm it: only Send
  // announces there (a publish), a mere look at the diff sends nothing.
  const pendingOpenShiftsNoticeRef = useRef(false);
  const closePublishDialog = () => {
    setShowPublishDialog(false);
    if (!pendingOpenShiftsNoticeRef.current) return;
    pendingOpenShiftsNoticeRef.current = false;
    announceOpenShiftsAfterPublish(false);
  };
  const triggerPublishNotify = async () => {
    const active = officeContacts.filter(c => c.active).length;
    if (!confirm(`Send the publish notice (${publishChanges.length} change(s)) to ${active} active office contact(s) and post it in the app?`)) return;
    setOfficeNotifBusy(true);
    try {
      const lines = publishChanges.map(c => formatDayChange(c, nameOf));
      const res = await fetch(`${EDGE_FN_BASE}/office-notifications`, {
        method: "POST",
        headers: dbAuthHeaders(), // scheduler JWT
        body: JSON.stringify({
          mode: "publish",
          period_label: publishLabel || "",
          changes: publishChanges.map(c => ({ day: c.day, role: c.role, from: c.from, to: c.to, from_name: holderLabel(c.from, nameOf), to_name: holderLabel(c.to, nameOf), text: formatDayChange(c, nameOf) })),
          change_lines: lines,
          groups: describePublishDiff(publishChanges, nameOf),
        }),
      });
      const body = await res.json().catch(() => ({}));
      if (!res.ok) {
        showToast(res.status === 404 ? "office-notifications is not deployed yet (Prompt 10) - nothing sent, watermark unchanged." : "Publish failed: " + JSON.stringify(body).slice(0, 200), "error");
        return;
      }
      const ts = new Date().toISOString();
      setLastPublished({ at: ts, days: snapshotForPublish(schedule) }); // autosaved into the blob
      logAudit("schedule.publish", `Published ${publishChanges.length} change(s) to the office (${publishLabel || "no label"})`, { count: publishChanges.length, sent: body.sent ?? null });
      await addNotification("schedule_published", "Schedule published", publishLabel ? `Call schedule ${publishLabel} was published.` : "The call schedule was published.", {});
      // Broadcast (no targetIds): the period plus the change lines, composed here.

      // slot the published range still leaves open (feed row + broadcast e-mail
      // through the same composer the board uses). Nothing is sent when the
      // range is fully covered; a failure here never undoes the publish. The

      pendingOpenShiftsNoticeRef.current = false;

  // --- Month painter (bulk vacation entry) - full-screen sheet ---
  // The sheet (MonthPainterSheet, a TOP-LEVEL component) holds the unsaved

  // (atomic all-or-nothing at the DB), one audit entry after it is known good.

      const res = await fetch(`${SUPABASE_URL}/rest/v1/time_off`, { method: "POST", headers: { ...dbAuthHeaders(), Prefer: "return=representation" }, body: JSON.stringify(rows) });
      if (!res.ok) {

      return { ok: true };
    } catch (e) {
      console.warn("Paint vacations: commit threw", e);

  // --- Snapshot restore (Settings -> Restore from Snapshot) + JSON import ---
  const [snapshotList, setSnapshotList] = useState(null);   // null = not loaded yet
  const [snapshotsLoading, setSnapshotsLoading] = useState(false);

  const [openSettingsCards, setOpenSettingsCards] = useState({});
  const toggleSettingsCard = (key) => setOpenSettingsCards(p => ({ ...p, [key]: !p[key] }));
  const loadSnapshots = async () => {

      const rows = await snapshots.list(15);

    } finally { setSnapshotsLoading(false); }
  };
  const snapshotReasonLabel = (r) => ({
    reset_all_data: "Before factory reset",
    clear_schedule: "Before schedule clear",

  const sendOpenShiftsNotice = async (origin, n, quiet) => {

    const mail = await sendEmailNotif("open_shifts", { subject: n.subject, message: n.message, detail: n.detail, slots: n.slots, through: thru });
    logAudit("openshifts.notify", `announced ${count} open shift(s) through ${thru || "-"}`, { count: count, through: thru, origin: origin || "board", slots: n.slots, email: mail && mail.ok ? "sent " + mail.sent : mail && mail.notEnabled ? "not enabled" : "failed" });

          </Collapsible>

          <Collapsible css={css} ck="setup_availability" defaultOpen={false} title={<>Availability statements <span style={{fontWeight:400,fontSize:11,color:"#7a8a98"}}>- {availabilityRows.length} row(s)</span></>}>
