          <Collapsible css={css} ck="setup_vacations" defaultOpen={false} title="Vacations (everyone)"
            right={<button onClick={(e)=>{e.stopPropagation(); setPaintSheet(true);}} style={{...css.btn(false),padding:"3px 10px",fontSize:11}}>Paint month</button>}>
            <p style={sectionNote}>Self-entered, no approval. A range is refused when the person is already published as primary or backup on any of its days (or primary the day before) - trade first. The scheduler can enter or remove anyone's; the database trigger enforces the same rule and its message is shown as-is.</p>
            {renderVacationForm(poolSurgeons)}
            <label style={{display:"flex",alignItems:"center",gap:6,fontSize:11,color:"#7a8a98",marginBottom:8,cursor:"pointer"}}>
              <input type="checkbox" checked={showPastVacations} onChange={e=>setShowPastVacations(e.target.checked)}/> Show past vacations
            </label>
            {renderVacationList(surgeons.map(s => s.id), true)}
          </Collapsible>

          <Collapsible css={css} ck="setup_holidays" defaultOpen={false} title="Holidays (units per year)">
            <HolidaysCard css={css} holidays={holidays} groupRules={groupRules} schedule={schedule} roster={surgeons} nameOf={nameOf} onSave={saveHolidays} onEditDay={goToDay} showToast={showToast} rulesImported={rulesImported}/>
          </Collapsible>

          <Collapsible css={css} ck="setup_east" defaultOpen={false} title="East feed (Davenport, read-only)">
            <EastFeedCard css={css} feedRows={eastFeedRows} forecastRows={eastForecastRows} overrideRows={eastOverrideRows} loadState={eastLoadState} ctx={rulesCtx} ctxInputs={ctxInputs} roster={surgeons} nameOf={nameOf}
              calMonth={calMonth} calYear={calYear} onRefresh={refreshEastFeed} refreshing={eastRefreshing} onSaveOverride={saveEastOverride} onDeleteOverride={deleteEastOverride} threshold={forecastThreshold} today={todayStr}
              conflicts={eastConflictRows} onEditDay={goToDay}/>
          </Collapsible>

          <Collapsible css={css} ck="setup_generate" defaultOpen={true} title="Generate (preview, then publish)">
            <GeneratePanel css={css} presets={genPresets} opts={genOpts} setOpts={setGenOpts} busy={genBusy} preview={previewGen} onRun={runGenerate} onReroll={rerollGenerate} onAccept={acceptPreview} onDiscard={discardPreview} nameOf={nameOf} roster={surgeons} rulesImported={rulesImported} lastPublishedDay={lastPublishedDay} genStart={genStart} genFirstOpenDay={genFirstOpenDay} laterRanges={laterAssignedRanges} holidayNames={holidayNameByDay(holidays)}/>
          </Collapsible>

          <Collapsible css={css} ck="setup_import" defaultOpen={false} title="Import seed (docs/silvis-seed.json)">
            <SeedImportCard css={css} state={seedState} onPick={pickSeedFile} onApply={applySeedImport} nameOf={nameOf}/>
          </Collapsible>

          <Collapsible css={css} ck="setup_office" defaultOpen={false} title="Office contacts">
            <p style={sectionNote}>Office staff who receive the publish notice and the Saturday change digest. Entered by hand; this table is authenticated-read only (never anon-readable), which is why an address may be typed here and nowhere else in the app.</p>
            <div style={{display:"flex",gap:8,flexWrap:"wrap",alignItems:"flex-end",marginBottom:12}}>
              <div style={{flex:"1 1 140px"}}><label style={label}>Name</label><input value={newOfficeName} onChange={e=>setNewOfficeName(e.target.value)} style={{...inp,width:"100%"}}/></div>
              <div style={{flex:"1 1 200px"}}><label style={label}>Email</label><input value={newOfficeEmail} onChange={e=>setNewOfficeEmail(e.target.value)} type="email" style={{...inp,width:"100%"}}/></div>
              <div style={{flex:"1 1 160px"}}><label style={label}>Role (optional)</label><input value={newOfficeRole} onChange={e=>setNewOfficeRole(e.target.value)} placeholder="Trauma coordinator" style={{...inp,width:"100%"}}/></div>
              <button onClick={addOfficeContact} disabled={officeNotifBusy} style={{...css.btn(true),padding:"6px 14px",fontSize:12,opacity:officeNotifBusy?0.6:1}}>Add</button>
            </div>
            {officeContacts.length === 0 ? <p style={{...muted,fontStyle:"italic"}}>No office contacts yet.</p> : (
              <div style={{display:"flex",flexDirection:"column",gap:6}}>
                {officeContacts.map(c => (
                  <div key={c.id} style={{display:"flex",alignItems:"center",gap:10,padding:"8px 12px",background:c.active?"#fff":"#f4f6f8",borderRadius:6,border:"1px solid #e0e4ea",opacity:c.active?1:0.6}}>
                    <div style={{flex:"1 1 auto",minWidth:0}}>
                      <div style={{fontSize:13,fontWeight:600,color:"#2c3e50"}}>{c.name}{c.role ? <span style={{...muted,marginLeft:6}}>{c.role}</span> : null}</div>
                      <div style={{fontSize:11,color:"#7a8a98",fontFamily:mono,overflow:"hidden",textOverflow:"ellipsis"}}>{c.email}</div>
                    </div>
                    <label style={{display:"flex",alignItems:"center",gap:4,cursor:"pointer",flexShrink:0}}>
                      <span style={{fontSize:10,color:c.active?"#1a8040":"#a0a8b0",fontWeight:600}}>{c.active?"Active":"Off"}</span>
                      <input type="checkbox" checked={!!c.active} onChange={e=>updateOfficeContact(c.id,{active:e.target.checked})} style={{cursor:"pointer",width:14,height:14}}/>
                    </label>
                    <button onClick={()=>deleteOfficeContact(c.id)} style={{background:"none",border:"none",color:"#c04040",cursor:"pointer",fontSize:14,flexShrink:0,padding:"0 4px"}}>x</button>
                  </div>
                ))}
              </div>
            )}
          </Collapsible>

          <Collapsible css={css} ck="setup_clear" defaultOpen={false} title="Clear schedule (range)">
            <p style={sectionNote}>Sets primary and backup to OPEN on the non-locked days in the range. A snapshot is saved first (if it can't be, nothing is cleared). Rows are kept; vacations and setup are untouched.</p>
            <div style={{display:"flex",gap:8,flexWrap:"wrap",alignItems:"flex-end"}}>
              <div><label style={label}>From</label><input type="date" value={clearStart} onChange={e=>setClearStart(e.target.value)} style={{...inp,width:145}}/></div>
              <div><label style={label}>To (blank = last scheduled day{lastScheduledDay ? ` ${fmtMD(lastScheduledDay)}` : ""})</label><input type="date" value={clearEnd} onChange={e=>setClearEnd(e.target.value)} style={{...inp,width:145}}/></div>
              <button onClick={clearSchedule} style={{background:"none",border:"1px solid #e8c0c0",color:"#804040",borderRadius:6,padding:"6px 14px",fontSize:12,cursor:"pointer",fontFamily:font}}>Clear range</button>
            </div>
          </Collapsible>
        </>}

        {/* ================ CALENDAR (Slice B grid + Slice C week rows + Slice D editor) ================ */}
        {view==="calendar" && (() => {
          const SlotLine = ({ role, day, holder, locked }) => {
            const isExt = typeof holder === "string" && holder.indexOf("ext:") === 0;
            let body;
            if (!holder && !loaded) body = <span className="cal-skel" data-testid="loading-slot" style={{background:dk?"#243250":"#e4e8ee"}}/>;
            // Unassigned before today (Central): a blank pill-height line - no text, no red (Faraz 9/22).
            else if (!holder && !slotIsOpen(day, holder, todayStr)) body = <span className="cal-pill cal-blank" aria-hidden="true">&nbsp;</span>;
            else if (!holder) body = <span className="cal-pill cal-open" style={{color:"#c04040",fontWeight:800,letterSpacing:0.4}}>OPEN</span>;
            else if (isExt) { const ext = holder.slice(4); body = <span className="cal-pill cal-ext" title={ext + " (external cover, outside the roster)"} style={{color:dk?"#a0a8b0":"#6a7a88",fontStyle:"italic",background:dk?"#1e2a44":"#eef1f4",borderColor:dk?"#2a3a5e":"#d8dee6"}}><span className="cal-name">{ext}</span><span className="cal-code">{ext.slice(0, 3).toUpperCase()}</span></span>; }
            else { const c = colorOf(holder); body = <span className="cal-pill" title={nameOf(holder)} style={{background:c.tg,color:c.tx,borderColor:c.bd}}><span className="cal-name">{nameOf(holder)}</span><span className="cal-code">{codeOf(holder)}</span></span>; }
            return <div className="cal-line"><span className="cal-role">{role}</span>{body}{locked ? <Padlock className="cal-lock" title={(role === "P" ? "Primary" : "Backup") + " locked"}/> : null}</div>;
          };
          const badge = (solid, color) => ({ display:"inline-flex",alignItems:"center",justifyContent:"center",width:13,height:13,borderRadius:3,fontSize:9,fontWeight:800,lineHeight:1,
            background: solid ? color : "transparent", color: solid ? "#fff" : color, border: "1px solid " + color });
          // Week-row text sits directly on the page background, so dark mode
          // uses the lightened per-code text palette (vis-003), not the pill's tx.
          const entryStyle = (e) => e.kind === "open" ? { color:"#c04040", fontWeight:800 } : e.kind === "external" ? { color: dk ? "#a0a8b0" : "#6a7a88", fontStyle:"italic" } : { color: textColorOf(e.id), fontWeight:600 };
          const chipStyle = (on, c) => ({ background: on ? c.tg : "transparent", color: on ? c.tx : (dk ? "#8a8aaa" : "#6a7a88"), border: "1px solid " + (on ? c.bd : (dk ? "#2a3a5e" : "#c8d0d8")), borderRadius: 6, padding: "3px 8px", fontSize: 11, fontWeight: 700, cursor: "pointer", fontFamily: mono, letterSpacing: 0.3 });
          return <>
          <div style={css.card}>
            {/* Coverage at a glance (Prompt 11): every count links to its first day. */}
            {(() => {
              const covItem = (key, text, days, color) => {
                const n = days.length;
                const first = n ? days[0] : null;
                return (
                  <button key={key} type="button" data-testid={key} data-count={loaded ? n : ""} data-first={first || ""} disabled={!loaded || !n} onClick={() => { if (first) goToDay(first); }}
                    title={n ? "Open " + fmtMD(first) + " in the day editor" : "none in the next 60 days"}
                    style={{...css.mini(false),color: !loaded ? dkSubtext : n ? color : "#1a8040",borderColor: !loaded ? "#c8d0d8" : n ? color : "#a0d8b0",fontFamily:font,cursor: n ? "pointer" : "default"}}>
                    <span style={{fontFamily:mono,fontWeight:800}}>{loaded ? n : "..."}</span> {text}{n ? " - first " + fmtMD(first) : ""}
                  </button>
                );
              };
              return (
                <div data-testid="coverage-strip" style={{display:"flex",flexWrap:"wrap",gap:6,alignItems:"center",marginBottom:10,fontSize:11.5,color:dkSubtext,padding:"6px 8px",borderRadius:6,background:dk?"#141c30":"#f4f6f8",border:"1px solid " + dkCardBorder}}>
                  <span style={{fontWeight:700,color:dkText,marginRight:2}}>Next 60 days:</span>
                  {covItem("cov-open-primary", "open primary", glance.openPrimary, "#c04040")}
                  {covItem("cov-open-backup", "open backup", glance.openBackup, "#c04040")}
                  {covItem("cov-forecast-primary", "forecast-busy as primary", glance.forecastPrimary.map(x => x.day), "#8a5a10")}
                  <span data-testid="cov-east-end" data-value={eastCoverageEnd || ""} title="Last day covered by a published Davenport week in the East feed cache">East feed through <strong style={{fontFamily:mono}}>{eastCoverageEnd ? fmtMD(eastCoverageEnd) : "unknown"}</strong></span>
                  <span data-testid="cov-last-published" data-value={(lastPublished && lastPublished.at) || ""}>last published <strong>{lastPublished && lastPublished.at ? fmtAuditTime(lastPublished.at) : "never"}</strong></span>
                  {isScheduler && !isPublicMode && <span data-testid="cov-last-snapshot" data-value={lastSnapshotAt || ""}>last snapshot <strong>{snapshotAgeText(lastSnapshotAt)}</strong></span>}
                </div>
              );
            })()}
            <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",flexWrap:"wrap",gap:8,marginBottom:10}}>
              <div style={{display:"flex",alignItems:"center",gap:6,flexWrap:"wrap"}}>
                <button onClick={prevMonth} aria-label="Previous month" style={{...css.btn(false),minWidth:40,padding:"5px 10px"}}>&lsaquo;</button>
                <span data-testid="cal-month" style={{fontSize:15,fontWeight:700,color:dkText,minWidth:150,textAlign:"center"}}>{MO[calMonth]} {calYear}</span>
                <button onClick={nextMonth} aria-label="Next month" style={{...css.btn(false),minWidth:40,padding:"5px 10px"}}>&rsaquo;</button>
                <button onClick={goToday} style={{...css.btn(false),padding:"5px 10px",fontSize:11}}>Today</button>
                <select data-testid="cal-month-select" aria-label="Month" value={calMonth} onChange={e=>setCalMonth(Number(e.target.value))} style={{...inp,fontSize:12,padding:"4px 6px"}}>
                  {MO.map((m,i) => <option key={m} value={i}>{m}</option>)}
                </select>
                <input data-testid="cal-year-input" aria-label="Year" type="number" inputMode="numeric" min="2020" max="2100" value={calYearText}
                  onChange={e=>{ const t = e.target.value; setCalYearText(t); const y = Number(t); if (/^\d{4}$/.test(t) && y >= 2020 && y <= 2100) setCalYear(y); }}
                  onBlur={()=>setCalYearText(String(calYear))}
                  onKeyDown={e=>{ if (e.key === "Enter") { e.preventDefault(); setCalYearText(String(calYear)); e.currentTarget.blur(); } }}
                  style={{...inp,width:78,fontSize:12,padding:"4px 6px"}}/>
              </div>
              <div style={{display:"flex",alignItems:"center",gap:5,flexWrap:"wrap"}}>
                {activeSurgeons.map(s => { const on = calSurgeonFilters.includes(s.id); return (
                  <button key={s.id} data-filter={s.code} aria-pressed={on} title={"Show " + s.name + (on ? " (on)" : "")} onClick={()=>toggleCalFilter(s.id)} style={chipStyle(on, colorOf(s.id))}>{s.code}</button>
                ); })}
                {calSurgeonFilters.length > 0 && <button onClick={()=>setCalSurgeonFilters([])} style={{...css.btn(false),padding:"3px 8px",fontSize:11}}>All</button>}
                <label style={{display:"flex",alignItems:"center",gap:4,fontSize:11,color:dkSubtext,cursor:"pointer",marginLeft:4}}>
                  <input type="checkbox" data-testid="cal-only-open" checked={calOnlyOpen} onChange={e=>setCalOnlyOpen(e.target.checked)}/> only OPEN
                </label>
              </div>
            </div>

            {/* On call today */}
            <div data-testid="today-banner" style={{fontSize:12.5,color:dkText,background:dk?"#16213e":"#f8f9fb",border:"1px solid " + dkCardBorder,borderRadius:6,padding:"6px 10px",marginBottom:10,display:"flex",gap:8,alignItems:"center",flexWrap:"wrap"}}>
              <strong>On call today {fmtMD(todayStr)}:</strong>
              <span>P</span> <HolderTag a={todayAssign} role="primary" small/>
              <span>B</span> <HolderTag a={todayAssign} role="backup" small/>
              <span style={{fontFamily:mono,fontSize:11,color:dkSubtext}}>{buildTonightMsg()}</span>
              {!isPublicMode && <button onClick={shareTonightMsg} style={{...css.btn(false),padding:"4px 10px",fontSize:11,marginLeft:"auto"}}>{copied ? "Copied" : "Share today"}</button>}
            </div>
            {!loaded && <p style={muted}>Loading schedule</p>}
            {previewGen && (
              <div data-testid="preview-banner" style={{...css.warnBox,marginBottom:10,display:"flex",gap:8,alignItems:"center",flexWrap:"wrap",borderColor:"#b9a0e0",background:"#f4eefb",color:"#4a2a80"}}>
                <strong>Generated preview</strong>
                <span>{fmtMD(previewGen.start)} - {fmtMD(previewGen.end)}, seed <span style={{fontFamily:mono}}>{String(previewGen.seed)}</span>, best of {previewGen.bestOf}: {Object.keys(previewGen.schedule || {}).length} day(s) drawn with a dashed outline. NOT saved.</span>
                <span style={{flex:1}}/>
                {isScheduler && <button data-testid="preview-accept" onClick={acceptPreview} disabled={genBusy} style={{...css.btn(true),padding:"4px 12px",fontSize:11}}>Accept &amp; Publish</button>}
                <button data-testid="preview-discard" onClick={discardPreview} style={css.danger}>Discard</button>
                <button onClick={()=>setView("setup")} style={css.mini(false)}>Diagnostics</button>
              </div>
            )}
            {loaded && Object.keys(schedule).length === 0 && <p style={{...muted,fontStyle:"italic",marginBottom:8}}>No schedule days in the database yet - every day from today shows OPEN.</p>}
            {!rulesImported && loaded && <p style={{...muted,marginBottom:8}}>Rules not imported yet: East and holiday badges appear once Setup imports the seed (Slice E).</p>}

            {/* The grid */}
            <div className="cal-grid" data-testid="cal-grid">
              {["Mon","Tue","Wed","Thu","Fri","Sat","Sun"].map((h, i) => (
                <div key={h} className="cal-hdr" style={{color: i >= 4 ? "#3d6a8c" : dkSubtext, background: i >= 4 ? (dk ? "#141c30" : "#eef3f8") : "transparent", borderRadius: i === 4 ? "6px 0 0 6px" : i === 6 ? "0 6px 6px 0" : 0}}>{h}{i === 4 ? <span className="cal-wk-label" style={{fontWeight:500,letterSpacing:0,textTransform:"none",marginLeft:4,fontSize:9}}>weekend unit</span> : null}</div>
              ))}
              {gridDays.map(d => {
                // A generator preview (Setup > Generate) overlays its days: drawn
                // from previewGen, styled cal-preview, never persisted until accepted.
                const pv = previewGen && previewGen.schedule ? previewGen.schedule[d] : null;
                const a = pv || schedule[d] || null;
                const isPreview = !!pv;
                const dt = parse(d); const dow = dt.getDay();
                const inMonth = d >= monthStartStr && d <= monthEndStr;
                const isWk = dow === 5 || dow === 6 || dow === 0;
                const hol = rulesCtx ? isHolidayDay(rulesCtx, d) : null;
                const derived = rulesCtx ? rulesCtx.derivedByDay[d] : null;
                const fc = forecastByDay[d];
                const pH = dayHolder(a, "primary"); const bH = a ? a.backup : null;
                const openP = slotIsOpen(d, pH, todayStr), openB = slotIsOpen(d, bH, todayStr); // past unassigned days are blank, not OPEN
                const inFilter = calSurgeonFilters.length === 0 || (a && (calSurgeonFilters.includes(a.primary) || calSurgeonFilters.includes(a.backup)));
                const dim = !inFilter || (calOnlyOpen && !(openKeys.has(openSlotKey(d, "primary")) || openKeys.has(openSlotKey(d, "backup")))); // only-OPEN reads the openSlots Set, never a per-cell rule
                const isToday = d === todayStr;
                const bg = hol ? (dk ? "#3a3418" : "#fdf6dc") : isWk ? (dk ? "#141c30" : "#f3f6f9") : (dk ? "#16213e" : "#ffffff");
                const bracket = isWk ? { borderTop: "2px solid #a9c4da", borderTopLeftRadius: dow === 5 ? 8 : 6, borderTopRightRadius: dow === 0 ? 8 : 6 } : {};
                const derivedWho = derived ? Object.keys(derived).map(r => nameOf(derived[r]) + " Silvis " + r).join(", ") : "";
                // The hover title follows the cell: a past unassigned slot reads "-", not OPEN (holderLabel itself stays as the publish diff needs it).
                const titleBits = [DAY_HDR[dow] + " " + fmtMD(d), "P " + (pH || openP ? holderLabel(pH, nameOf) : "-"), "B " + (bH || openB ? holderLabel(bH, nameOf) : "-")];
                if (hol) titleBits.push(hol.name + " (holiday unit)"); if (derivedWho) titleBits.push("East-derived: " + derivedWho); if (a && a.note) titleBits.push("note: " + a.note);
                // The header reserves 15px per 13px badge shown (E / F / confirm), at least the 30px two badges need, so a badge never covers the holiday label.
                const nBadges = (derived ? 1 : 0) + (fc && fc.p >= 0.2 ? 1 : 0) + (awaitingConfirmation(a) ? 1 : 0);
                return (
                  <div key={d} className={"cal-cell" + (isPreview ? " cal-preview" : "")} role="button" tabIndex={0} data-day={d} data-preview={isPreview ? "1" : ""} data-primary={(a && a.primary) || ""} data-backup={bH || ""} data-ext={(a && a.externalCover) || ""} data-open={(openP ? "P" : "") + (openB ? "B" : "")}
                    onClick={()=>setEditorDay(d)} onKeyDown={e=>{ if (e.key === "Enter" || e.key === " ") { e.preventDefault(); setEditorDay(d); } }}
                    title={titleBits.join(" | ")}
                    style={{background:bg, border: isToday ? "2px solid #1a6fa8" : "1px solid " + dkCardBorder, ...bracket, opacity: dim ? 0.28 : inMonth ? 1 : 0.5, color:dkText, boxShadow: isToday ? "0 0 0 2px rgba(26,111,168,0.18)" : "none"}}>
                    <div style={{display:"flex",alignItems:"center",gap:4,minWidth:0,paddingRight:Math.max(30, 4 + 15 * nBadges)}}>
                      <span style={{fontFamily:mono,fontSize:11,fontWeight:isToday?800:600,color:isToday?"#1a6fa8":inMonth?dkText:"#9aa4ae"}}>{dt.getDate()}</span>
                      {hol && <span className="cal-hol" title={hol.name + " - holiday unit (" + hol.tier + ")"} style={{fontSize:9,fontWeight:700,color:"#8a6a10",whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis",minWidth:0}}>{hol.name}</span>}
                    </div>
                    <div className="cal-badges">
                      {derived && <span data-badge="E" title={"East-derived week: " + derivedWho} style={badge(true, "#1a6fa8")}>E</span>}
                      {fc && fc.p >= 0.2 && <span data-badge={fc.p >= forecastThreshold ? "F" : "f"} title={"East forecast: " + Math.round(fc.p * 100) + "% that " + nameOf(fc.id) + " is on East call (busy at " + Math.round(forecastThreshold * 100) + "% or more)"} style={badge(fc.p >= forecastThreshold, "#8a5a10")}>F</span>}
                      {awaitingConfirmation(a) && <span data-badge="confirm" data-testid="confirm-badge" title="awaiting the scheduler's confirmation" style={badge(true, "#c2410c")}>?</span>}
                    </div>
                    <SlotLine role="P" day={d} holder={pH} locked={!!(a && a.primaryLocked)}/>
                    <SlotLine role="B" day={d} holder={bH} locked={!!(a && a.backupLocked)}/>
                    {(vacByDay[d] || []).length > 0 && (
                      <div className="cal-dots" title={"On vacation: " + vacByDay[d].map(nameOf).join(", ")}>
                        {vacByDay[d].map(pid => <span key={pid} data-vac={pid} style={{width:6,height:6,borderRadius:3,background:textColorOf(pid),display:"inline-block"}}/>)}
                      </div>
                    )}
                    {a && a.note && <span className="cal-note" title={a.note} style={{position:"absolute",bottom:2,right:4,fontSize:8,color:"#9aa4ae",fontWeight:700,letterSpacing:0.5}}>NOTE</span>}
                    {isPreview && <span className="cal-preview-tag" title="Generated preview - not saved">PREVIEW</span>}
                  </div>
                );
              })}
            </div>

            {/* Legend */}
            <div className="cal-legend" style={{display:"flex",flexWrap:"wrap",gap:"6px 14px",alignItems:"center",marginTop:10,fontSize:11,color:dkSubtext,lineHeight:1.6}}>
              {activeSurgeons.map(s => { const c = colorOf(s.id); return (
                <span key={s.id} style={{display:"inline-flex",alignItems:"center",gap:4}}><span style={{width:10,height:10,borderRadius:3,background:c.tg,border:"1px solid " + c.bd,display:"inline-block"}}/>{s.name} <span style={{fontFamily:mono,fontSize:10}}>{s.code}</span></span>
              ); })}
              <span className="cal-mobile-note">top line = primary, bottom line = backup (tap a day for details)</span>
              <span><span style={{color:"#c04040",fontWeight:800}}>OPEN</span> = nobody assigned (today onward)</span>
              <span><span style={{fontStyle:"italic"}}>Atwell</span> = external cover</span>
              <span style={{display:"inline-flex",alignItems:"center",gap:3}}><Padlock/> locked slot</span>
              <span style={{display:"inline-flex",alignItems:"center",gap:3}}><span style={badge(true, "#1a6fa8")}>E</span> East-derived week</span>
              <span style={{display:"inline-flex",alignItems:"center",gap:3}}><span style={badge(true, "#8a5a10")}>F</span> East forecast at or above {Math.round(forecastThreshold * 100)}%, <span style={badge(false, "#8a5a10")}>F</span> 20% or more</span>
              <span>Fri-Sun tinted = weekend unit</span>
              <span>gold = holiday unit</span>
              <span>dots = vacations</span>
              <span>blue outline = today</span>
              {isScheduler && !isPublicMode && <span>Click a day to edit (eligibility-checked); saves per day with compare-and-swap.</span>}
            </div>
          </div>

          <Collapsible css={css} ck="cal_weekrows" defaultOpen={true} title="Week rows (ER Call Panels layout)">
            <p style={sectionNote}>the ER-panel author's layout: one row per Mon-Sun week, consecutive days with the same surgeon collapsed, open days in red. Partial weeks show the neighbouring month's days too.</p>
            <div className="table-wrap" style={{overflowX:"auto"}}>
              <table className="week-rows" data-testid="week-rows" style={{width:"100%",borderCollapse:"collapse",fontSize:12}}>
                <thead><tr><th style={thS}>MON/SUN DATES</th><th style={thS}>TRAUMA</th><th style={thS}>TRAUMA BACKUP</th></tr></thead>
                <tbody>
                  {!loaded && <tr><td colSpan={3} style={{...tdS,fontFamily:font,fontStyle:"italic",color:dkSubtext}}>Loading schedule</td></tr>}
                  {loaded && weekRows.map(r => (
                    <tr key={r.monday} data-week={r.monday} style={{borderTop:"1px solid " + dkCardBorder}}>
                      <td style={{...tdS,whiteSpace:"nowrap",fontSize:12}}>{r.label}</td>
                      <td style={{...tdS,fontFamily:font}}>{r.primary.map(e => <div key={e.start} data-kind={e.kind} style={entryStyle(e)}>{e.text}</div>)}</td>
                      <td style={{...tdS,fontFamily:font}}>{r.backup.map(e => <div key={e.start} data-kind={e.kind} style={entryStyle(e)}>{e.text}</div>)}</td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          </Collapsible>

          <Collapsible css={css} ck="cal_tools" defaultOpen={false} title="Calendar tools (exports)">
            <div data-testid="calendar-tools">
              <div style={css.toolBlock}>
                <div style={{...css.toolTitle,color:dkText}}>Calendar files (.ics)</div>
                <p style={sectionNote}>One event per shift, 07:00 to 07:00 the next day in Central time (the file carries the America/Chicago clock-change rules). Import the file once; for a feed that keeps itself current use the subscribe links in Settings.</p>
                <div style={{display:"flex",gap:6,flexWrap:"wrap",alignItems:"center"}}>
                  {activeSurgeons.map(s => <button key={s.id} data-testid={"ics-" + s.code} onClick={()=>downloadMyCal(s.id)} title={"Download " + icsFileName(s)} style={{...css.badge(sMap[s.id]?.idx||0, s.name),cursor:"pointer",padding:"4px 10px",fontSize:11}}>{s.name}</button>)}
                  <button data-testid="ics-all" onClick={downloadGroupCal} style={{...css.btn(true),padding:"5px 12px",fontSize:11}}>Full group</button>
                </div>
              </div>
              <div style={css.toolBlock}>
                <div style={{...css.toolTitle,color:dkText}}>Share and print</div>
                <div style={{display:"flex",gap:8,flexWrap:"wrap",alignItems:"center"}}>
                  <label style={{fontSize:12,color:dkSubtext,display:"flex",alignItems:"center",gap:6}}>Months from {MO[calMonth]} {calYear}:
                    <select data-testid="tool-months" aria-label="Months" value={toolMonths} onChange={e=>setToolMonths(Number(e.target.value))} style={{...inp,fontSize:12,padding:"4px 6px"}}>{[1,2,3,4,6,12].map(n=><option key={n} value={n}>{n}</option>)}</select>
                  </label>
                  <button data-testid="share-download" onClick={downloadSharePage} style={{...css.btn(true),padding:"5px 12px",fontSize:11}}>Share read-only page</button>
                  <button data-testid="share-copy" onClick={copySharePage} style={{...css.btn(copiedUrl==="share"),padding:"5px 12px",fontSize:11}}>{copiedUrl==="share" ? "Copied" : "Copy"}</button>
                  <button data-testid="print-open" onClick={openPrintable} style={{...css.btn(false),padding:"5px 12px",fontSize:11}}>Open printable view</button>
                </div>
                <p style={{...muted,marginTop:6,lineHeight:1.5}}>The read-only page is one self-contained file (month grids plus the week rows) that opens in any browser with no sign-in - attach it to an email or drop it on a shared drive. Copy puts the same page on the clipboard. The printable view opens in a new tab; use the browser's print dialog to print or save as PDF.</p>
              </div>
              <div style={{...css.toolBlock,borderBottom:"none",marginBottom:0,paddingBottom:0}}>
                <div style={{...css.toolTitle,color:dkText}}>ER Call Panels (the ER-panel author's layout)</div>
                <p style={sectionNote}>One row per Mon-Sun week, consecutive days with the same surgeon collapsed, open days in red. Copy for Word pastes as a table into the ER-panel author's document.</p>
                <div style={{display:"flex",gap:8,flexWrap:"wrap",alignItems:"center",marginBottom:8}}>
                  <label style={{fontSize:12,color:dkSubtext,display:"flex",alignItems:"center",gap:4}}>From <input data-testid="er-from" aria-label="From" type="date" value={erFrom} onChange={e=>setErRange({from:e.target.value,to:erTo})} style={{...inp,fontSize:12,padding:"4px 6px"}}/></label>
                  <label style={{fontSize:12,color:dkSubtext,display:"flex",alignItems:"center",gap:4}}>To <input data-testid="er-to" aria-label="To" type="date" value={erTo} onChange={e=>setErRange({from:erFrom,to:e.target.value})} style={{...inp,fontSize:12,padding:"4px 6px"}}/></label>
                  <button data-testid="er-preset-1213" onClick={()=>setErRange({from:"2026-11-02",to:"2026-12-13"})} style={{...css.btn(false),padding:"4px 10px",fontSize:11}}>11/2 through 12/13</button>
                  <button data-testid="er-reset" onClick={()=>setErRange(null)} style={{...css.btn(false),padding:"4px 10px",fontSize:11}}>Visible month</button>
                  <button data-testid="er-copy" onClick={copyErForWord} disabled={!erRangeOk} style={{...css.btn(copiedUrl==="er"),padding:"5px 12px",fontSize:11,opacity:erRangeOk?1:0.5}}>{copiedUrl==="er" ? "Copied" : "Copy for Word"}</button>
                  <button data-testid="er-download" onClick={downloadErHtml} disabled={!erRangeOk} style={{...css.btn(false),padding:"5px 12px",fontSize:11,opacity:erRangeOk?1:0.5}}>Download .html</button>
                </div>
                {!erRangeOk && <p style={{...muted,color:"#c04040",marginBottom:6}}>Enter a valid range (From on or before To).</p>}
                {erRangeOk && erSpan.widened && <p data-testid="er-span-note" style={{...muted,marginBottom:6}}>Whole weeks: the table runs {fmtMD(erSpan.from)} - {fmtMD(erSpan.to)} (the Mon-Sun weeks around {fmtMD(erFrom)} - {fmtMD(erTo)}), so no covered day is left out of a week row.</p>}
                <div data-testid="er-panel-preview" className="table-wrap" ref={erPreviewRef} style={{overflowX:"auto",background:"#ffffff",color:"#000000",padding:10,borderRadius:6,border:"1px solid " + dkCardBorder}} dangerouslySetInnerHTML={{__html: erPanelHtml}}/>
              </div>
            </div>
          </Collapsible>
          </>;
        })()}

        {/* Day editor - shared by the calendar and the Open shifts board (Assign... / Outside cover open it on the slot's day; the write still goes through its Save). */}
        {(view==="calendar" || view==="openshifts") && editorDay && (
          <DayEditor key={editorDay} day={editorDay} entry={schedule[editorDay] || null}
            roster={surgeons} ctxInputs={ctxInputs} ctxError={rulesCtxState.error}
            canEdit={isScheduler && !isPublicMode} rulesImported={rulesImported} isPublicMode={isPublicMode}
            nameOf={nameOf} codeOf={codeOf} colorOf={colorOf} mySurgeon={mySurgeon}
            vacationNames={vacNamesOn(editorDay)} focusExternal={editorFocus === "external"}
            onSave={(next, meta) => { if (saveDayEdit(editorDay, next, meta)) setEditorDay(null); }}
            onCancel={() => setEditorDay(null)} onNav={editorNav} onTrade={proposeTradeForDay}
            css={css} dk={dk}/>
        )}

        {/* ================ OPEN SHIFTS (Prompt 13 part 3) ================ */}
        {view==="openshifts" && !isPublicMode && (() => {
          const rows = boardRows;
          const canAct = !!mySurgeon || isScheduler;
          const horizonBtn = (v, text) => <button key={String(v)} type="button" data-testid={"ob-horizon-" + v} onClick={() => setObHorizon(v)} style={{...css.mini(obHorizon === v),padding:"6px 10px"}}>{text}</button>;
          const chip = (o) => { const c = colorOf(o.id); return <span key={o.id} data-eligible-id={o.id} title={o.soft.length ? "allowed - " + o.soft.map(x => reasonLabel(x.reason, nameOf)).join("; ") : "no rule warnings"} style={{background:c.tg,color:c.tx,border:"1px solid " + c.bd,borderRadius:5,padding:"1px 7px",fontSize:11,fontWeight:700,whiteSpace:"nowrap",marginRight:4,marginBottom:2,display:"inline-block"}}>{nameOf(o.id)}</span>; };
          const takeTitle = (me) => !rulesCtx ? reasonLabel("rules-unavailable") : me ? reasonLabel(me.hard[0], nameOf) : reasonLabel("unknown-surgeon");
          const sheetDate = (d) => { try { return parse(d).toLocaleDateString(undefined, { weekday: "long", month: "long", day: "numeric", year: "numeric" }); } catch (e) { return d; } };
          return (
            <div style={css.card} data-testid="openshifts-card">
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",flexWrap:"wrap",gap:8}}>
                <div style={css.cardT}>Open shifts</div>
                <span style={{fontSize:11,color:"#7a8a98"}}>{!loaded ? "Loading schedule" : !boardEnd ? "No schedule days on file yet" : `${boardSlots.length} open slot(s) from ${fmtMD(todayStr)} to ${boardEndText}${boardRanges.length ? ", plus the assigned days " + boardRanges.map(r => r.start === r.end ? fmtMD(r.start) : fmtMD(r.start) + "-" + fmtMD(r.end)).join(", ") : ""}`}</span>
              </div>
              <p style={sectionNote}>Every slot the published schedule leaves open, from today to the last published day (and on any day already assigned beyond it, such as a holiday unit) - each is one 24-hour shift, 07:00 to 07:00.{mySurgeon ? " Take any shift the rules allow you: it is written to the schedule at once (no approval) and the scheduler is told." : ""}{isScheduler ? " As the scheduler you can assign anyone from the day editor or write in outside cover." : ""} The generator's reason for leaving a slot open appears after the next Generate.</p>
              <div style={{display:"flex",flexWrap:"wrap",gap:6,alignItems:"center",marginBottom:10}}>
                <span style={{fontSize:10,color:"#7a8a98",fontWeight:700,textTransform:"uppercase",letterSpacing:0.5}}>Show</span>
                {horizonBtn(30, "Next 30 days")}{horizonBtn(60, "Next 60 days")}{horizonBtn("all", "All")}
                <select data-testid="ob-role" value={obRole} onChange={e => setObRole(e.target.value)} style={{...css.inp,...dkInp,padding:"4px 8px",fontSize:12}}>
                  <option value="all">Both roles</option><option value="primary">Primary only</option><option value="backup">Backup only</option>
                </select>
                <label style={{fontSize:12,color:"#5a6a78",display:"inline-flex",alignItems:"center",gap:5,minHeight:36,cursor:"pointer"}}><input type="checkbox" data-testid="ob-weekend" checked={obWeekend} onChange={e => setObWeekend(e.target.checked)}/> weekends only</label>
                <span style={{flex:"1 1 auto"}}/>
                <button type="button" data-testid="ob-copy" onClick={boardCopyList} disabled={!rows.length} title="Plain text, one line per slot - ready for an email or Word" style={{...css.btn(copiedUrl==="ob"),padding:"6px 12px",fontSize:11,opacity:rows.length?1:0.5}}>{copiedUrl==="ob" ? "Copied" : "Copy list"}</button>
                {isScheduler && <button type="button" data-testid="ob-email" ref={obEmailBtnRef} onClick={() => notifyOpenShifts("board", boardSlots, boardEnd)} disabled={!boardSlots.length} title="In-app note for everyone + e-mail to those who accept schedule updates; every open slot in the published range" style={{...css.btn(true),padding:"6px 12px",fontSize:11,opacity:boardSlots.length?1:0.5}}>Email the group now</button>}
              </div>
              {!rulesCtx && <div data-testid="ob-rules-unavailable" style={{...css.warnBox,marginBottom:10}}>Rules unavailable - the setup has not loaded, so nobody's eligibility can be checked and no shift can be taken until it does.</div>}
              <div className="table-wrap" data-testid="openshifts-wrap" style={css.tableWrap}>
                <table className="setup-table" data-testid="openshifts-table" data-from={todayStr} data-to={boardEnd || ""} data-total={boardSlots.length} data-ranges={boardRanges.map(r => r.start + ".." + r.end).join(",")}>
                  <thead><tr><th>Date</th><th>Role</th><th>Unit</th><th>Why</th><th>Eligible now</th><th>Last announced</th>{canAct && <th>Action</th>}</tr></thead>
                  <tbody>
                    {rows.length === 0 && <tr><td colSpan={canAct ? 7 : 6} style={{color:"#1a8040",fontWeight:600,padding:"12px 8px"}}>{!loaded ? "Loading schedule" : !boardEnd ? "No schedule days on file yet - nothing is published, so there is nothing to take." : boardSlots.length ? "No open shift matches the filters." : "No open shifts - every published day is covered."}</td></tr>}
                    {rows.map(s => {
                      const key = openSlotKey(s.day, s.role);
                      const elig = boardElig[key] || null;
                      const eligible = elig ? elig.filter(o => o.ok) : [];
                      const me = elig ? elig.find(o => o.id === mySurgeon) || null : null;
                      const announced = obLastAnnounced(boardAnnounced, s.day, s.role);
                      // A locked-but-empty slot is open (a lock never holds a slot) but the function refuses CLAIM_LOCKED - the scheduler assigns it from the editor.
                      const locked = !!(schedule[s.day] && schedule[s.day][s.role + "Locked"]);
                      return (
                        <tr key={key} data-slot={key} data-day={s.day} data-role={s.role}>
                          <td style={{whiteSpace:"nowrap",fontWeight:700}}>{DAY_HDR[parse(s.day).getDay()]} {fmtMD(s.day)}{s.day === todayStr ? <span style={{fontSize:10,color:"#7a8a98",marginLeft:4,fontWeight:400}}>today</span> : null}</td>
                          <td style={{whiteSpace:"nowrap"}}><span style={{color:"#c04040",fontWeight:800,fontSize:10,letterSpacing:0.5}}>OPEN</span> {s.role === "primary" ? "Primary (TRAUMA)" : "Backup"}</td>
                          <td style={{whiteSpace:"nowrap",fontSize:12}}>{boardUnitText(s.unit)}</td>
                          <td style={{fontSize:12,minWidth:110}}>{s.reason || "-"}</td>
                          <td style={{fontSize:12,minWidth:150}}>{!rulesCtx ? "-" : eligible.length ? eligible.map(chip) : <span style={{color:"#c04040",fontStyle:"italic"}}>nobody under the current rules</span>}</td>
                          <td data-testid="ob-announced" style={{whiteSpace:"nowrap",fontSize:12}}>{announced ? fmtAuditTime(announced) : "never"}</td>
                          {canAct && <td style={{whiteSpace:"nowrap"}}>
                            <div style={{display:"flex",gap:4,alignItems:"center"}}>
                              {mySurgeon ? (me && me.ok && !locked
                                ? <button type="button" data-testid="ob-take" onClick={(e) => openClaimSheet(s, e.currentTarget)} style={{...css.btn(true),padding:"6px 10px",fontSize:11}}>Take this shift</button>
                                : <button type="button" data-testid="ob-take" disabled title={locked ? "slot locked - ask the scheduler to assign it" : takeTitle(me)} style={{...css.btn(false),padding:"6px 10px",fontSize:11,opacity:0.55,cursor:"not-allowed"}}>Take this shift</button>) : null}
                              {isScheduler && <button type="button" data-testid="ob-assign" onClick={() => { setEditorFocus(null); setEditorDay(s.day); }} title="Open the day editor on this day" style={{...css.mini(false),padding:"6px 9px"}}>Assign...</button>}
                              {isScheduler && s.role === "primary" && <button type="button" data-testid="ob-external" onClick={() => { setEditorFocus("external"); setEditorDay(s.day); }} title="Write in someone outside the roster as primary cover (saved from the day editor)" style={{...css.mini(false),padding:"6px 9px"}}>Outside cover</button>}
                            </div>
                          </td>}
                        </tr>
                      );
                    })}
                  </tbody>
                </table>
              </div>
              <div data-testid="openshifts-tail" data-primary={boardTail.primary} data-backup={boardTail.backup} data-through={boardTail.through} style={{fontSize:11,color:"#7a8a98",marginTop:8,lineHeight:1.5}}>
                {boardTail.primary + boardTail.backup > 0
                  ? <>Not listed: {boardTail.primary} primary / {boardTail.backup} backup day(s) between {fmtMD(boardTail.from)} and {fmtMD(boardTail.through)} have no schedule row yet{boardEnd ? ` (after the last published day, ${boardEndText})` : ""}. The coverage strip counts them as open; Generate covers them.</>
                  : <>The published schedule runs through {boardEndText} - this board and the coverage strip's next-60-days counts agree.</>}
              </div>
              {claimSheet && (
                <div data-testid="claim-sheet" onClick={() => { if (!claimBusy) closeClaimSheet(); }} style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.45)",display:"flex",alignItems:"center",justifyContent:"center",zIndex:9500,padding:14}}>
                  <div role="dialog" aria-modal="true" aria-label="Take this shift" onClick={e => e.stopPropagation()} onKeyDown={claimSheetKeyDown} style={{background:dk?"#16213e":"#ffffff",color:dkText,borderRadius:12,padding:"16px 18px",maxWidth:460,width:"100%",maxHeight:"92vh",overflowY:"auto",boxShadow:"0 8px 32px rgba(0,0,0,0.25)",fontFamily:font}}>
                    <h3 style={{margin:"0 0 8px",fontSize:16,color:dkText}}>Take this shift?</h3>
                    <div style={{fontSize:13,lineHeight:1.7}}>
                      <div><strong>{DAY_HDR[parse(claimSheet.day).getDay()]} {fmtMD(claimSheet.day)}</strong> - {sheetDate(claimSheet.day)}</div>
                      <div>Role: <strong>{claimSheet.role === "primary" ? "Primary (TRAUMA, in Silvis)" : "Backup"}</strong> - one 24-hour shift, 07:00 to 07:00.</div>
                      <div>Unit: {boardUnitText(claimSheet.unit)}</div>
                    </div>
                    {claimSheet.mates.length > 0 && (
                      <div data-testid="claim-unit-mates" style={{...css.warnBox,marginTop:10}}>
                        <strong>This takes one day only.</strong> The group keeps one primary and one backup through a {claimSheet.unit.kind === "holiday" ? "holiday unit" : "weekend block"}; the other open {claimSheet.role} day{claimSheet.mates.length === 1 ? "" : "s"} of this unit stay{claimSheet.mates.length === 1 ? "s" : ""} open: {claimSheet.mates.map(m => DAY_HDR[parse(m.day).getDay()] + " " + fmtMD(m.day)).join(", ")}. Take {claimSheet.mates.length === 1 ? "it" : "them"} too from the board, or tell the scheduler.
                      </div>
                    )}
                    {claimSheet.soft.length
                      ? <div data-testid="claim-soft" style={{...css.warnBox,marginTop:10}}><strong>Allowed, shown so you know:</strong><ul style={{margin:"4px 0 0",paddingLeft:18}}>{claimSheet.soft.map((x, i) => <li key={i}>{reasonLabel(x.reason, nameOf)} <span style={{fontFamily:mono,fontSize:11}}>(weight {x.weight})</span></li>)}</ul></div>
                      : <div style={{...css.okBox,marginTop:10}}>No rule warnings for you on this day.</div>}
                    <p style={{fontSize:12,color:"#5a6a78",margin:"10px 0 0",lineHeight:1.5}}>Confirm writes you into the published schedule immediately (no approval step), logs it, and tells the scheduler. To hand it back later, propose a trade.</p>
                    <div style={{display:"flex",justifyContent:"flex-end",gap:8,marginTop:14,flexWrap:"wrap"}}>
                      <button type="button" ref={claimCancelRef} data-testid="claim-cancel" onClick={closeClaimSheet} disabled={claimBusy} style={css.btn(false)}>Cancel</button>
                      <button type="button" data-testid="claim-confirm" onClick={runClaim} disabled={claimBusy} style={css.btn(true)}>{claimBusy ? "Taking..." : "Confirm - take this shift"}</button>
                    </div>
                  </div>
                </div>
              )}
              {obNotice && (
                <div data-testid="ob-email-dialog" onClick={() => { if (!obNoticeBusy) closeObNotice(); }} style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.45)",display:"flex",alignItems:"center",justifyContent:"center",zIndex:9500,padding:14}}>
                  <div role="dialog" aria-modal="true" aria-label="Email the group about open shifts" onClick={e => e.stopPropagation()} onKeyDown={claimSheetKeyDown} style={{background:dk?"#16213e":"#ffffff",color:dkText,borderRadius:12,padding:"16px 18px",maxWidth:560,width:"100%",maxHeight:"92vh",overflowY:"auto",boxShadow:"0 8px 32px rgba(0,0,0,0.25)",fontFamily:font}}>
                    <h3 style={{margin:"0 0 8px",fontSize:16,color:dkText}}>Email the group about {obNotice.count} open shift{obNotice.count === 1 ? "" : "s"}?</h3>
                    <p style={{fontSize:12.5,color:"#5a6a78",margin:"0 0 10px",lineHeight:1.5}}>Everyone gets an in-app note; the e-mail goes to every linked surgeon who accepts schedule updates in Settings. Each slot listed gets a new "last announced" time on the board.</p>
                    <div data-testid="ob-email-preview" style={{border:"1px solid " + (dk ? "#2a3a5e" : "#e0e4ea"),borderRadius:8,padding:"10px 12px",fontSize:12,lineHeight:1.5}}>
                      <div style={{fontSize:10,fontWeight:700,textTransform:"uppercase",letterSpacing:0.6,color:"#7a8a98",marginBottom:4}}>Preview</div>
                      <div data-testid="ob-email-subject"><strong>Subject:</strong> {obNotice.subject}</div>
                      <pre data-testid="ob-email-message" style={{whiteSpace:"pre-wrap",fontFamily:mono,fontSize:11.5,margin:"8px 0",maxHeight:260,overflowY:"auto",color:"inherit"}}>{obNotice.message}</pre>
                      <div data-testid="ob-email-detail" style={{fontFamily:mono,fontSize:11.5,wordBreak:"break-all"}}>{obNotice.detail}</div>
                    </div>
                    <div style={{display:"flex",justifyContent:"flex-end",gap:8,marginTop:14,flexWrap:"wrap"}}>
                      <button type="button" ref={obCancelRef} data-testid="ob-email-cancel" onClick={closeObNotice} disabled={obNoticeBusy} style={css.btn(false)}>Cancel</button>
                      <button type="button" data-testid="ob-email-send" onClick={sendBoardNotice} disabled={obNoticeBusy} style={css.btn(true)}>{obNoticeBusy ? "Sending..." : "Send to the group"}</button>
                    </div>
                  </div>
                </div>
              )}
            </div>
          );
        })()}

        {/* ================ MY SCHEDULE (Prompt 6 Slice G) ================ */}
        {view==="myschedule" && !isPublicMode && (() => {
          const pid = (isScheduler && minePerson && sMap[minePerson]) ? minePerson : mySurgeon;
          if (!pid) return (
            <div style={css.card}><div style={css.cardT}>My schedule</div><p style={muted}>Your account is not linked to a roster entry yet - the scheduler will link it.</p></div>
          );
          const upcoming = upcomingDaysOf(pid, 90);
          const next = upcomingDaysOf(pid, null)[0] || null;
          const P = rulesCtx && rulesCtx.per ? rulesCtx.per[pid] : null;
          const badgesFor = (d) => {
            const out = [];
            const u = rulesCtx && rulesCtx.holidayByDay ? rulesCtx.holidayByDay[d] : null;
            if (u) out.push({ k: "H", text: u.name, title: u.name + " (" + (u.tier || "major") + " holiday unit)", bg: "#fbf1d8", fg: "#7a5a20" });
            if (P && P.derived[d]) out.push({ k: "E", text: "E", title: "East week: Silvis " + P.derived[d] + " (derived from the Davenport feed)", bg: "#e8e0f8", fg: "#5a3a90" });
            // Fix round (9/22, finding 13): an override busy:false clears the day - no F badge
            // (the day editor says "no East call (override: force clear)"; the O badge mirrors it).
            const ovClear = !!(P && P.eastOverrides && P.eastOverrides[d] === false);
            if (ovClear) out.push({ k: "O", text: "O", title: "East override: no East call (force clear)", bg: "#e4f3e8", fg: "#1a6a3a" });
            const fc = P && P.eastForecast && !ovClear ? P.eastForecast[d] : undefined;
            if (typeof fc === "number" && rulesCtx && fc >= rulesCtx.forecastThreshold) out.push({ k: "F", text: "F", title: "East forecast " + Math.round(fc * 100) + "% (treated as busy)", bg: "#e0eef8", fg: "#1a5a88" });
            return out;
          };
          const countdown = (d) => { const n = suDaysBetween(todayStr, d); return n === 0 ? "today" : n === 1 ? "tomorrow" : "in " + n + " days"; };
          const roleWord = (r) => r === "primary" ? "Primary" : "Backup";
          const syncUrl = `${EDGE_FN_BASE}/calendar-sync?surgeon=${codeOf(pid)}`;
          const pidVacs = (vacations[pid] || []).filter(([vs, ve]) => ve >= todayStr).length;
          return <>
            <div style={css.card} data-testid="mine-card">
              <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:10,flexWrap:"wrap"}}>
                <div style={{...css.cardT,margin:0}}>My schedule</div>
                {isScheduler ? (
                  <select data-testid="mine-person" value={pid} onChange={e=>setMinePerson(e.target.value)} style={{...inp,width:130}} title="As the scheduler you can view anyone's schedule">
                    {surgeons.map(s=><option key={s.id} value={s.id}>{s.name}</option>)}
                  </select>
                ) : <Badge id={pid}/>}
                <span style={{marginLeft:"auto",display:"flex",gap:6,flexWrap:"wrap"}}>
                  <button data-testid="download-my-calendar" onClick={()=>downloadMyCal(pid)} title="One 07:00-to-07:00 event per shift (America/Chicago), importable into Google, Apple or Outlook calendars" style={{...css.btn(false),padding:"5px 12px",fontSize:11}}>Download my calendar</button>
                  <button data-testid="copy-sync-url" onClick={()=>copyText(syncUrl, "mine-sync")} title={"Subscribe your phone or Outlook to this feed (it updates itself): " + syncUrl} style={{...css.btn(false),padding:"5px 12px",fontSize:11}}>{copiedUrl === "mine-sync" ? "Copied" : "Copy my calendar-sync URL"}</button>
                </span>
              </div>
              <div data-testid="next-call" data-next-day={next ? next.day : ""} data-next-role={next ? next.role : ""} style={{padding:"12px 14px",borderRadius:8,marginBottom:12,background:next ? (next.role === "primary" ? "linear-gradient(135deg,#1a6fa8,#2488c8)" : "linear-gradient(135deg,#8a6a20,#b08a30)") : (dk ? "#16213e" : "#f0f2f5"),color:next ? "#fff" : dkText}}>
                {!loaded ? <span style={{fontStyle:"italic"}}>Loading schedule</span> : !next ? <span>No upcoming call on file for {nameOf(pid)}.</span> : (
                  <>
                    <div style={{fontSize:11,fontWeight:700,letterSpacing:1,textTransform:"uppercase",opacity:0.85}}>Next call - {countdown(next.day)}</div>
                    <div style={{fontSize:18,fontWeight:700,marginTop:2}}>{roleWord(next.role)} - {dowShort(next.day)} {MO[parse(next.day).getMonth()]} {parse(next.day).getDate()}, {parse(next.day).getFullYear()}</div>
                    <div style={{fontSize:12.5,marginTop:4,opacity:0.95}}>{next.role === "primary" ? "Backup" : "Primary"}: {holderLabel(next.other, nameOf)} - 07:00 to 07:00 next day{next.locked ? " - locked" : ""}{badgesFor(next.day).map(b => " - " + b.title).join("")}</div>
                  </>
                )}
              </div>
              <div style={{display:"flex",alignItems:"baseline",gap:8,flexWrap:"wrap"}}>
                <div style={css.subT}>Upcoming - next 90 days ({upcoming.length})</div>
                <span style={muted}>H holiday unit - E East-derived week - F East forecast busy</span>
              </div>
              {upcoming.length === 0 ? <p style={{...muted,fontStyle:"italic"}}>No call in the next 90 days.</p> : (
                <div data-testid="mine-upcoming" style={{maxHeight:420,overflowY:"auto"}}>
                  {upcoming.map(x => (
                    <div key={x.day} data-testid="mine-day" data-day={x.day} data-role={x.role} style={{display:"flex",gap:10,alignItems:"center",padding:"5px 8px",borderBottom:`1px solid ${dkCardBorder}`,flexWrap:"wrap"}}>
                      <span style={{fontFamily:mono,fontSize:12,color:dkText,width:92}}>{dowShort(x.day)} {fmtMD(x.day)}</span>
                      <span style={{fontSize:11,fontWeight:700,width:58,color:x.role==="primary"?"#1a6fa8":"#7a5a20"}}>{roleWord(x.role)}</span>
                      <span style={{...muted,minWidth:120}}>{x.role === "primary" ? "backup" : "primary"}: {holderLabel(x.other, nameOf)}</span>
                      {x.locked && <Padlock title="locked" size={9}/>}
                      {badgesFor(x.day).map(b => <span key={b.k} title={b.title} data-badge={b.k} style={{fontSize:9,fontWeight:800,padding:"0 5px",borderRadius:4,background:b.bg,color:b.fg}}>{b.text}</span>)}
                      <button data-testid="mine-trade" onClick={()=>proposeTradeForDay(x.day, x.role)} style={{...css.mini(false),marginLeft:"auto",color:"#6030a0",borderColor:"#c0a8e0"}}>Propose a trade</button>
                    </div>
                  ))}
                </div>
              )}
            </div>
            <div style={css.card}>
              <div style={{display:"flex",alignItems:"center",gap:8,flexWrap:"wrap",marginBottom:8}}>
                <div style={{...css.cardT,margin:0}}>My vacations ({pidVacs} upcoming)</div>
                <button onClick={()=>setView("timeoff")} style={{...css.mini(false),marginLeft:"auto"}}>Enter a vacation</button>
              </div>
              {renderVacationList([pid], true)}
            </div>
          </>;
        })()}

        {/* ================ TIME OFF & TRADES (Prompt 6 Slice G) ================ */}
        {view==="timeoff" && !isPublicMode && <>
          <div style={css.card} data-testid="timeoff-card">
            <div style={css.cardT}>{isScheduler ? "Vacations" : "My vacations"}</div>
            <p style={sectionNote}>Enter your own vacations - no approval, the group is notified. The entry is refused if you are already published as primary or backup on any of those days (or primary the day before): trade those shifts first. A vacation that has started stays on record{isScheduler ? " (as the scheduler you can enter or remove anyone's)" : ""}. Notes are operational and visible to the whole group.</p>
            {!mySurgeon && !isScheduler ? <p style={muted}>Your account is not linked to a roster entry yet - the scheduler will link it.</p> : (
              <>
                {renderVacationForm(isScheduler ? poolSurgeons : poolSurgeons.filter(s => s.id === mySurgeon))}
                <label style={{display:"flex",alignItems:"center",gap:6,fontSize:11,color:"#7a8a98",marginBottom:8,cursor:"pointer"}}>
                  <input type="checkbox" checked={showPastVacations} onChange={e=>setShowPastVacations(e.target.checked)}/> Show past
                </label>
                {renderVacationList(isScheduler ? surgeons.map(s => s.id) : [mySurgeon], true)}
              </>
            )}
          </div>

          {(() => {
            const fromId = isScheduler ? (tradeFrom || mySurgeon || "") : (mySurgeon || "");
            const mine = upcomingDaysOf(fromId, null);
            const theirs = upcomingDaysOf(tradeTo, null);
            const dayOk = suIsIso(tradeDay);
            const holder = dayOk && schedule[tradeDay] ? schedule[tradeDay][tradeRole] : null;
            // fg-1: the picked day's unit (holiday unit / Fri-Sun block) and whether the whole unit is on offer
            const unit = dayOk && holder === fromId ? tradeUnitOf(tradeDay, tradeRole, fromId) : null;
            const whole = !!unit && tradeWholeUnit;
            const offerDays = whole ? unit.days : [tradeDay];
            const eligOf = (cand) => whole ? tradeEligibilityOver(offerDays, tradeRole, cand) : tradeEligibility(tradeDay, tradeRole, cand);
            const cands = poolSurgeons.filter(s => s.id !== fromId).map(s => ({ s, e: dayOk ? eligOf(s.id) : null }));
            cands.sort((a, b) => ((a.e && !a.e.ok) ? 1 : 0) - ((b.e && !b.e.ok) ? 1 : 0));
            const toElig = dayOk && tradeTo ? eligOf(tradeTo) : null;
            const retUnit = suIsIso(tradeReturnDay) && tradeTo && schedule[tradeReturnDay] && schedule[tradeReturnDay][tradeReturnRole] === tradeTo ? tradeUnitOf(tradeReturnDay, tradeReturnRole, tradeTo) : null;
            const retPaired = !!(retUnit && whole && retUnit.days.length === offerDays.length);
            const retElig = suIsIso(tradeReturnDay) && fromId ? (retPaired ? tradeEligibilityOver(retUnit.days, tradeReturnRole, fromId) : tradeEligibility(tradeReturnDay, tradeReturnRole, fromId)) : null;
            const unitOfDay = (d) => rulesCtx && rulesCtx.holidayByDay ? rulesCtx.holidayByDay[d] : null;
            const givenLabel = whole ? "the " + unitText(unit) : slotLabel(tradeDay, tradeRole);
            const pending = myTradeRequests.filter(r => r.status === "pending" || r.status === "accepted");
            const done = myTradeRequests.filter(r => r.status === "applied" || r.status === "declined" || r.status === "cancelled");
            const statusColor = (st) => st === "pending" ? "#c09030" : st === "declined" || st === "cancelled" ? "#c04040" : st === "accepted" ? "#6030a0" : "#1a8040";
            const tenseFor = (st) => st === "accepted" || st === "applied" ? "takes" : st === "declined" || st === "cancelled" ? "would have taken" : "would take";
            const rowBox = { padding:"8px 12px", background: dk ? "#16213e" : "#f8f9fb", borderRadius:6, border:`1px solid ${dkCardBorder}` };
            const tradeRow = (r) => {
              const named = tradeNamed(r);
              const canAnswer = r.status === "pending" && (isScheduler || r.to_surgeon_id === mySurgeon);
              const canCancel = r.status === "pending" && (isScheduler || r.from_surgeon_id === mySurgeon);
              const canRetry = r.status === "accepted" && (isScheduler || r.from_surgeon_id === mySurgeon || r.to_surgeon_id === mySurgeon);
              const busy = tradeBusy === r.id;
              const err = tradeApplyErr[r.id];
              const tag = tradeUnitTag(r);                       // fg-1: part of a unit proposal
              const groupN = tag ? tradeGroupOf(r).length : 1;   // rows in the same status that move with this one
              return (
                <div key={r.id} data-testid="trade-row" data-trade-id={r.id} data-status={r.status} data-unit={tag ? tag.kind + ":" + tag.start : undefined} data-group={groupN} style={rowBox}>
                  <div style={{display:"flex",justifyContent:"space-between",gap:8,flexWrap:"wrap",alignItems:"center"}}>
                    <span style={{fontSize:12.5,color:dkText}}>{tradeLegsText(named, tenseFor(r.status))}{tag && <span data-testid="trade-unit-tag" title="A holiday unit or Fri-Sun block moves as one: these rows are accepted, declined and applied together" style={{marginLeft:8,fontSize:10,fontWeight:700,color:"#7a5a20",background:"#fbf1d8",borderRadius:4,padding:"1px 6px",whiteSpace:"nowrap"}}>{tag.text} - day {tag.index} of {tag.n}</span>}</span>
                    <span style={{fontSize:10,fontWeight:700,textTransform:"uppercase",color:statusColor(r.status)}}>{r.status === "accepted" ? "accepted - not applied yet" : r.status}</span>
                  </div>
                  <div style={{fontSize:10,color:"#9aa4ae",fontFamily:mono,marginTop:2}}>proposed by {named.from_surgeon_name} {fmtAuditTime(r.submitted_at)}{r.decided_at ? ` - decided ${fmtAuditTime(r.decided_at)}` : ""}</div>
                  {err && <div data-testid="trade-apply-error" style={{...css.errBox,marginTop:6}}>Apply failed: {err}</div>}
                  {(canAnswer || canCancel || canRetry || (isScheduler && r.status === "applied")) && (
                    <div style={{display:"flex",gap:6,marginTop:6,flexWrap:"wrap"}}>
                      {canAnswer && <button data-testid="trade-accept" disabled={busy} onClick={()=>acceptTrade(r)} style={{...css.btn(true),padding:"4px 12px",fontSize:11}}>{busy ? "Working" : groupN > 1 ? `Accept (${groupN} days)` : "Accept"}</button>}
                      {canAnswer && <button data-testid="trade-decline" disabled={busy} onClick={()=>declineTrade(r)} style={{...css.btn(false),padding:"4px 12px",fontSize:11}}>{groupN > 1 ? `Decline (${groupN} days)` : "Decline"}</button>}
                      {canCancel && <button data-testid="trade-cancel" disabled={busy} onClick={()=>cancelTrade(r)} style={css.danger}>{groupN > 1 ? `Cancel (${groupN} days)` : "Cancel"}</button>}
                      {canRetry && <button data-testid="trade-retry" disabled={busy} onClick={()=>retryApplyTrade(r)} style={{...css.btn(true),padding:"4px 12px",fontSize:11,background:"linear-gradient(135deg,#6030a0,#8050c0)",borderColor:"#6030a0"}}>{busy ? "Working" : "Retry apply"}</button>}
                      {isScheduler && (r.status === "applied" || r.status === "accepted") && <button onClick={()=>goToDay(r.day)} title="The scheduler reverts a trade by editing the day" style={css.mini(false)}>Open {fmtMD(r.day)} in the day editor</button>}
                    </div>
                  )}
                </div>
              );
            };
            return <>
              <div style={css.card} data-testid="trade-card">
                <div style={css.cardT}>Propose a shift trade</div>
                <p style={sectionNote}>By day and role. The other surgeon is checked against the rules (vacations, patterns, East call, caps, consecutive days) before you propose and again when they accept; an accepted trade is applied to the schedule and both of you are notified. {isScheduler ? "As the scheduler you can propose for anyone, accept or decline any trade, allow a one-way trade, and revert an applied trade in the day editor." : "All trades are two-way: pick the day and role you take in return."}</p>
                {!fromId ? <p style={muted}>Your account is not linked to a roster entry yet - the scheduler will link it.</p> : (
                  <div style={{display:"flex",gap:8,flexWrap:"wrap",alignItems:"flex-end"}}>
                    {!rulesCtx && <div data-testid="trade-rules-unavailable" style={{...css.warnBox,flex:"1 1 100%"}}>Rules unavailable - the setup has not loaded, so nobody's eligibility can be checked. Members cannot propose or accept until it does; the scheduler is asked to confirm each step.</div>}
                    <div><label style={label}>From</label>
                      {isScheduler ? (
                        <select data-testid="trade-from" value={fromId} onChange={e=>{ setTradeFrom(e.target.value); setTradeDay(""); }} style={{...inp,width:120}}>
                          {poolSurgeons.map(s=><option key={s.id} value={s.id}>{s.name}</option>)}
                        </select>
                      ) : <div style={{paddingTop:4}}><Badge id={fromId}/></div>}
                    </div>
                    <div className="trade-pick-wrap"><label style={label}>My day + role</label>
                      <select data-testid="trade-mine-pick" className="trade-pick" value={dayOk && holder === fromId ? tradeDay + "|" + tradeRole : ""} onChange={e=>{ const v = e.target.value.split("|"); if (v[0]) { setTradeDay(v[0]); setTradeRole(v[1]); } }} style={{...inp,width:260,maxWidth:"100%"}}>
                        <option value="">{mine.length ? "Pick one of my upcoming days" : "No upcoming days on file"}</option>
                        {mine.map(x=><option key={x.day+x.role} value={x.day+"|"+x.role}>{slotLabel(x.day, x.role)}{unitOfDay(x.day) ? " - " + unitOfDay(x.day).name + " unit" : ""}</option>)}
                      </select>
                    </div>
                    <div><label style={label}>or date</label><input data-testid="trade-day" type="date" value={tradeDay} onChange={e=>setTradeDay(e.target.value)} style={{...inp,width:145}}/></div>
                    <div><label style={label}>Role</label>
                      <select data-testid="trade-role" value={tradeRole} onChange={e=>setTradeRole(e.target.value)} style={{...inp,width:100}}><option value="primary">Primary</option><option value="backup">Backup</option></select></div>
                    {dayOk && holder !== fromId && <div data-testid="trade-holder-warning" style={{...css.warnBox,flex:"1 1 100%"}}>{nameOf(fromId)} is not {tradeRole} on {fmtMD(tradeDay)} - that slot is {holderLabel(holder, nameOf)}.</div>}
                    {unit && <div data-testid="trade-unit" data-unit-kind={unit.kind} data-unit-days={unit.days.join(",")} style={{...css.warnBox,flex:"1 1 100%",display:"flex",gap:8,alignItems:"center",flexWrap:"wrap"}}>
                      <span><strong>{fmtMD(tradeDay)} is part of the {unitText(unit)}.</strong> One primary and one backup stick through a unit, so it trades as a whole: one row per day, accepted or declined together.</span>
                      <label style={{display:"flex",alignItems:"center",gap:5,cursor:"pointer",fontWeight:600}}><input type="checkbox" data-testid="trade-whole-unit" checked={tradeWholeUnit} onChange={e=>setTradeWholeUnit(e.target.checked)}/> Trade the whole unit</label>
                      {!tradeWholeUnit && <span data-testid="trade-unit-split" style={{color:"#8a3030",fontWeight:600}}>{isScheduler ? "Unchecked: this single day would split the unit - you will be asked to confirm." : "A single day of a unit cannot be traded - tick the box to trade the whole unit."}</span>}
                    </div>}
                    <div className="trade-pick-wrap"><label style={label}>Trade with</label>
                      <select data-testid="trade-to" className="trade-pick" value={tradeTo} onChange={e=>{ setTradeTo(e.target.value); setTradeReturnDay(""); }} style={{...inp,width:230,maxWidth:"100%"}}>
                        <option value="">Select</option>
                        {cands.map(({ s, e }) => {
                          const bad = e && !e.ok;
                          return <option key={s.id} value={s.id} data-eligible={e ? (e.unknown ? "unknown" : String(!bad)) : "unknown"} style={bad ? {color:"#a0a8b0"} : undefined}>{s.name}{bad ? " - " + (e.unknown ? "rules not loaded" : e.hard[0]) : ""}</option>;
                        })}
                      </select>
                    </div>
                    {toElig && !toElig.ok && <div data-testid="trade-to-reason" style={{...css.errBox,flex:"1 1 100%"}}>{nameOf(tradeTo)} can't take {givenLabel}: {tradeReasonText(toElig)}. {toElig.unknown ? "" : "Pick someone else or ask the scheduler."}</div>}
                    {toElig && toElig.ok && toElig.soft && toElig.soft.length > 0 && <div style={{...css.warnBox,flex:"1 1 100%"}}>Allowed with a note: {toElig.soft.map(softTag).join(", ")}.</div>}
                    <div className="trade-pick-wrap"><label style={label}>Their day + role (return)</label>
                      <select data-testid="trade-theirs-pick" className="trade-pick" value={suIsIso(tradeReturnDay) && schedule[tradeReturnDay] && schedule[tradeReturnDay][tradeReturnRole] === tradeTo ? tradeReturnDay + "|" + tradeReturnRole : ""} onChange={e=>{ const v = e.target.value.split("|"); if (v[0]) { setTradeReturnDay(v[0]); setTradeReturnRole(v[1]); } else setTradeReturnDay(""); }} style={{...inp,width:260,maxWidth:"100%"}} disabled={!tradeTo}>
                        <option value="">{isScheduler ? "None (one-way)" : (tradeTo ? "Pick one of their days" : "Pick a surgeon first")}</option>
                        {theirs.map(x=><option key={x.day+x.role} value={x.day+"|"+x.role}>{slotLabel(x.day, x.role)}{unitOfDay(x.day) ? " - " + unitOfDay(x.day).name + " unit" : ""}</option>)}
                      </select>
                    </div>
                    <div><label style={label}>or date</label><input data-testid="trade-return-day" type="date" value={tradeReturnDay} onChange={e=>setTradeReturnDay(e.target.value)} style={{...inp,width:145}}/></div>
                    <div><label style={label}>Return role</label>
                      <select data-testid="trade-return-role" value={tradeReturnRole} onChange={e=>setTradeReturnRole(e.target.value)} style={{...inp,width:100}}><option value="primary">Primary</option><option value="backup">Backup</option></select></div>
                    {retUnit && <div data-testid="trade-return-unit" data-paired={retPaired ? "1" : "0"} style={{...css.warnBox,flex:"1 1 100%"}}>{nameOf(tradeTo)}'s {fmtMD(tradeReturnDay)} is part of the {unitText(retUnit)}{retPaired ? " - it comes back as a whole unit, day for day." : (isScheduler ? " - taking that day alone would split it (you will be asked to confirm)." : " - it can only come back as a whole unit matching the " + offerDays.length + "-day unit you give; pick another day.")}</div>}
                    {retElig && !retElig.ok && <div data-testid="trade-return-reason" style={{...css.errBox,flex:"1 1 100%"}}>{nameOf(fromId)} can't take {retPaired ? "the " + unitText(retUnit) : slotLabel(tradeReturnDay, tradeReturnRole)} in return: {tradeReasonText(retElig)}.</div>}
                    <button data-testid="trade-submit" disabled={tradeBusy === "propose"} onClick={submitTradeRequest} style={{...css.btn(true),padding:"7px 18px",background:"linear-gradient(135deg,#6030a0,#8050c0)",borderColor:"#6030a0"}}>{tradeBusy === "propose" ? "Submitting" : whole ? `Propose unit trade (${offerDays.length} days)` : "Propose trade"}</button>
                  </div>
                )}
              </div>

              <div style={css.card} data-testid="trades-pending">
                <div style={css.cardT}>Pending trades ({pending.length})</div>
                <p style={sectionNote}>{isScheduler ? "Every open trade. The surgeon asked answers; you can answer or cancel any of them." : "Trades waiting on you show Accept / Decline; ones you proposed show Cancel."}</p>
                {pending.length === 0 ? <p style={{...muted,fontStyle:"italic"}}>No pending trades.</p> : <div style={{display:"flex",flexDirection:"column",gap:6}}>{pending.map(tradeRow)}</div>}
              </div>
              <div style={css.card} data-testid="trades-completed">
                <div style={css.cardT}>Completed trades ({done.length})</div>
                {done.length === 0 ? <p style={{...muted,fontStyle:"italic"}}>No completed trades.</p> : <div style={{display:"flex",flexDirection:"column",gap:6}}>{done.slice(0, 40).map(tradeRow)}</div>}
              </div>
            </>;
          })()}
        </>}

        {/* ================ TOTALS (Prompt 6 Slice F) - counts only, never $ ================ */}
        {view==="totals" && !isPublicMode && (
          <TotalsCard css={css} dk={dk} roster={surgeons} schedule={schedule} ctx={rulesCtx} surgeonRules={surgeonRules} preview={previewGen} today={todayStr} nameOf={nameOf} Badge={Badge} showToast={showToast} ytdFloors={{ "2026": "2026-09-14" }} loaded={loaded}/>
        )}

        {/* ================ SETTINGS ================ */}
        {view==="settings" && !isPublicMode && <>
          <div style={css.card}>
            <div style={css.cardT}>Appearance</div>
            <div style={{display:"flex",alignItems:"center",gap:12}}>
              <span style={{fontSize:13,color:"#5a6a78"}}>Theme</span>
              <button onClick={()=>setDarkMode(false)} style={{...css.btn(!darkMode),padding:"6px 16px",fontSize:12}}>Light</button>
              <button onClick={()=>setDarkMode(true)} style={{...css.btn(darkMode),padding:"6px 16px",fontSize:12}}>Dark</button>
            </div>
          </div>

          {isScheduler && (
            <Collapsible css={css} ck="settings_audit" defaultOpen={false}
              title={<>Activity log <span style={{fontWeight:400,fontSize:11,color:"#7a8a98"}}>- who changed what</span></>}
              right={<button onClick={(e)=>{e.stopPropagation(); loadAudit();}} title="Refresh" style={{background:"none",border:"1px solid #d0d8e0",borderRadius:6,color:"#5a6a78",cursor:"pointer",fontSize:11,padding:"2px 8px",fontFamily:font}}>Refresh</button>}>
              {auditLoading ? (
                <div style={{fontSize:12,color:"#8a94a0",padding:"6px 0"}}>Loading</div>
              ) : auditEntries.length === 0 ? (
                <div style={{fontSize:12,color:"#8a94a0",padding:"6px 0"}}>No activity recorded yet.</div>
              ) : (
                <div style={{maxHeight:420,overflowY:"auto"}}>
                  {auditEntries.map(en => {
                    const si = surgeons.findIndex(s => s.id === en.actor_id);

const thS = {textAlign:"left",padding:"7px 8px",color:"#5a6a78",fontWeight:600,fontSize:10,textTransform:"uppercase",letterSpacing:0.5};

// --- Month painter - full-screen bulk vacation entry (phone-first) ---
// Defined at MODULE SCOPE deliberately: inside CallSchedule its identity would
// change every parent render and React would remount it, silently resetting
// the draft. Painting NEVER writes per tap; commit happens on explicit Save
// through the parent's onCommit (one bulk insert, one audit entry). A failed
// commit wrote NOTHING: the draft stays, the error names every pending entry.
function MonthPainterSheet({ css, dk, surgeons, vacations, onCommit, onClose }) {
  const today = new Date();
  const [ym, setYm] = React.useState({ y: today.getFullYear(), m: today.getMonth() });
  const [armedPerson, setArmedPerson] = React.useState(surgeons.length === 1 ? surgeons[0].id : "");
  const [draftEntries, setDraftEntries] = React.useState([]); // [{personId, start, end}]
  const [pendingStart, setPendingStart] = React.useState(null);
  const [busy, setBusy] = React.useState(false);
  const [commitError, setCommitError] = React.useState(null);
  const [savedNote, setSavedNote] = React.useState("");
  const savedTimerRef = React.useRef(null);
  const dirtyCount = draftEntries.length;

  React.useEffect(() => () => { if (savedTimerRef.current) clearTimeout(savedTimerRef.current); }, []);

  const border = dk ? "#2a3a5e" : "#e0e4ea";

// Reusable collapsible section. Persists open/closed per-device via localStorage
// (keyed by `ck`). Defined at module scope so it never remounts on parent re-render.
function Collapsible({ title, ck, defaultOpen = false, summary = null, children, css, right = null, style = null }) {
  const [open, setOpen] = React.useState(() => {
    try {
      const v = localStorage.getItem("silvis_collapse_" + ck);
      if (v === "1") return true;
      if (v === "0") return false;
    } catch (e) { console.warn("Couldn't read panel collapse state:", e); }
    return defaultOpen;
  });
  const toggle = () => setOpen(o => {
    const n = !o;
    try { localStorage.setItem("silvis_collapse_" + ck, n ? "1" : "0"); } catch (e) { console.warn("Couldn't persist panel collapse state:", e); }
    return n;
  });
  return (
    <div data-testid={"card-" + ck} data-open={open ? "1" : "0"} style={style ? { ...css.card, ...style } : css.card}>
      <div data-testid={"card-toggle-" + ck} onClick={toggle} style={{ display: "flex", alignItems: "center", gap: 8, cursor: "pointer", userSelect: "none" }}>
        <span style={{ fontSize: 11, color: "#8a94a0", transition: "transform .15s", transform: open ? "rotate(90deg)" : "rotate(0deg)", display: "inline-block", width: 10, flexShrink: 0 }}>&#9654;</span>
        <div style={{ ...css.cardT, marginBottom: 0, flex: 1 }}>{title}</div>
        {right}
      </div>
      {!open && summary != null && <div style={{ marginTop: 10 }}>{summary}</div>}
      {open && <div style={{ marginTop: 12 }}>{children}</div>}
    </div>
  );
}

// --- Rules-context helpers shared by the app and the day editor ---
// buildContext never throws on well-formed data; on anything else the UI

function safeBuildContext(inputs) {
