        {/* ================ SETUP (scheduler) ================ */}
        {view==="setup" && !isPublicMode && isScheduler && <>
          <div style={css.card}>
            <div style={css.cardT}>Setup issues</div>
            {setupIssues.length === 0 ? <p style={{...muted,color:"#1a8040"}}>None.</p> : (
              <ul style={{margin:0,paddingLeft:18,fontSize:12.5,color:"#7a5a20",lineHeight:1.7}}>{setupIssues.map(s => <li key={s}>{s}</li>)}</ul>
            )}
          </div>

          <Collapsible css={css} ck="setup_roster" defaultOpen={true} title="Roster">
            {/* TODO(Slice E): roster editing + Users (link auth accounts to roster ids, set roles). Names/codes only here. */}
            <table style={{width:"100%",borderCollapse:"collapse"}}>
              <thead><tr><th style={thS}>Id</th><th style={thS}>Name</th><th style={thS}>Code</th><th style={thS}>Full name</th><th style={thS}>Active</th><th style={thS}>Roles</th></tr></thead>
              <tbody>
                {surgeons.map(s => (
                  <tr key={s.id} style={{borderTop:`1px solid ${dkCardBorder}`}}>
                    <td style={tdS}>{s.id}</td>
                    <td style={{...tdS,fontFamily:font}}><Badge id={s.id}/></td>
                    <td style={tdS}>{s.code}</td>
                    <td style={{...tdS,fontFamily:font}}>{s.fullName || ""}</td>
                    <td style={tdS}>{s.active === false ? "no" : "yes"}</td>
                    <td style={{...tdS,fontFamily:font,fontSize:11}}>{(s.roles || []).join(", ")}</td>
                  </tr>
                ))}
              </tbody>
            </table>
            <p style={{...muted,marginTop:8}}>Roster editing and account linking arrive with Slice E. The roster is read from the config blob (fallback: built-in six).</p>
          </Collapsible>

          <Collapsible css={css} ck="setup_rules" defaultOpen={false} title="Rules, holidays and generate">
            <StubNote slice="Prompt 5 / Slice E" text="Per-surgeon rules editor, availability entry, holiday units editor and the Generate panel (range presets) are built there."/>
            <div style={{display:"flex",gap:8,flexWrap:"wrap",alignItems:"center"}}>
              <button disabled title="Prompt 5" style={{...css.btn(false),opacity:0.5,cursor:"not-allowed"}}>Import seed (Prompt 5)</button>
              <button disabled title="Slice E" style={{...css.btn(false),opacity:0.5,cursor:"not-allowed"}}>Generate (Slice E)</button>
              <span style={muted}>{rulesImported ? "Rules present in the config blob." : "Rules not imported yet."}</span>
            </div>
            {availabilityRows.length > 0 && (
              <div style={{marginTop:12}}>
                <div style={{fontSize:11,fontWeight:700,color:"#5a6a78",marginBottom:4}}>Availability statements ({availabilityRows.length})</div>
                <div style={{maxHeight:220,overflowY:"auto"}}>
                  {availabilityRows.map(r => (
                    <div key={r.id} style={{display:"flex",gap:8,alignItems:"center",padding:"4px 0",borderBottom:`1px solid ${dkCardBorder}`,fontSize:12}}>
                      <Badge id={r.person_id} small/>
                      <span style={{fontFamily:mono}}>{r.kind}{r.role && r.role !== "any" ? "/" + r.role : ""}</span>
                      <span style={{fontFamily:mono}}>{r.start_date}{r.end_date !== r.start_date ? ` to ${r.end_date}` : ""}</span>
                      {r.note && <span style={{...muted,fontStyle:"italic"}}>{r.note}</span>}
                    </div>
                  ))}
                </div>
              </div>
            )}
          </Collapsible>

          <Collapsible css={css} ck="setup_vacations" defaultOpen={true} title="Vacations (everyone)"
            right={<button onClick={(e)=>{e.stopPropagation(); setPaintSheet(true);}} style={{...css.btn(false),padding:"3px 10px",fontSize:11}}>Paint month</button>}>
            <p style={sectionNote}>Self-entered, no approval. A range is refused when the person is already published as primary or backup on any of its days (or primary the day before) - trade first.</p>
            {renderVacationForm(activeSurgeons)}
            <label style={{display:"flex",alignItems:"center",gap:6,fontSize:11,color:"#7a8a98",marginBottom:8,cursor:"pointer"}}>
              <input type="checkbox" checked={showPastVacations} onChange={e=>setShowPastVacations(e.target.checked)}/> Show past vacations
            </label>
            {renderVacationList(surgeons.map(s => s.id), true)}
          </Collapsible>

          <Collapsible css={css} ck="setup_office" defaultOpen={false} title="Office contacts">
            <p style={sectionNote}>Office staff who receive the publish notice and the Saturday change digest. Entered by hand; this table is authenticated-read only.</p>
            <div style={{display:"flex",gap:8,flexWrap:"wrap",alignItems:"flex-end",marginBottom:12}}>
              <div style={{flex:"1 1 140px"}}><label style={label}>Name</label><input value={newOfficeName} onChange={e=>setNewOfficeName(e.target.value)} style={{...inp,width:"100%"}}/></div>
              <div style={{flex:"1 1 200px"}}><label style={label}>Email</label><input value={newOfficeEmail} onChange={e=>setNewOfficeEmail(e.target.value)} type="email" style={{...inp,width:"100%"}}/></div>
              <div style={{flex:"1 1 160px"}}><label style={label}>Role (optional)</label><input value={newOfficeRole} onChange={e=>setNewOfficeRole(e.target.value)} placeholder="Trauma coordinator" style={{...inp,width:"100%"}}/></div>
              <button onClick={addOfficeContact} disabled={officeNotifBusy} style={{...css.btn(true),padding:"6px 14px",fontSize:12,opacity:officeNotifBusy?0.6:1}}>Add</button>
            </div>
            {officeContacts.length === 0 ? <p style={{...muted,fontStyle:"italic"}}>No office contacts yet.</p> : (
              <div style={{display:"flex",flexDirection:"column",gap:6}}>
                {officeContacts.map(c => (
                  <div key={c.id} style={{display:"flex",alignItems:"center",gap:10,padding:"8px 12px",background:c.active?"#fff":"#f4f6f8",borderRadius:6,border:"1px solid #e0e4ea",opacity:c.active?1:0.6}}>
                    <div style={{flex:"1 1 auto",minWidth:0}}>
                      <div style={{fontSize:13,fontWeight:600,color:"#2c3e50"}}>{c.name}{c.role ? <span style={{...muted,marginLeft:6}}>{c.role}</span> : null}</div>
                      <div style={{fontSize:11,color:"#7a8a98",fontFamily:mono,overflow:"hidden",textOverflow:"ellipsis"}}>{c.email}</div>
                    </div>
                    <label style={{display:"flex",alignItems:"center",gap:4,cursor:"pointer",flexShrink:0}}>
                      <span style={{fontSize:10,color:c.active?"#1a8040":"#a0a8b0",fontWeight:600}}>{c.active?"Active":"Off"}</span>
                      <input type="checkbox" checked={!!c.active} onChange={e=>updateOfficeContact(c.id,{active:e.target.checked})} style={{cursor:"pointer",width:14,height:14}}/>
                    </label>
                    <button onClick={()=>deleteOfficeContact(c.id)} style={{background:"none",border:"none",color:"#c04040",cursor:"pointer",fontSize:14,flexShrink:0,padding:"0 4px"}}>x</button>
                  </div>
                ))}
              </div>
            )}
          </Collapsible>

          <Collapsible css={css} ck="setup_clear" defaultOpen={false} title="Clear schedule (range)">
            <p style={sectionNote}>Sets primary and backup to OPEN on the non-locked days in the range. A snapshot is saved first (if it can't be, nothing is cleared). Rows are kept; vacations and setup are untouched.</p>
            <div style={{display:"flex",gap:8,flexWrap:"wrap",alignItems:"flex-end"}}>
              <div><label style={label}>From</label><input type="date" value={clearStart} onChange={e=>setClearStart(e.target.value)} style={{...inp,width:145}}/></div>
              <div><label style={label}>To (blank = last scheduled day{lastScheduledDay ? ` ${fmtMD(lastScheduledDay)}` : ""})</label><input type="date" value={clearEnd} onChange={e=>setClearEnd(e.target.value)} style={{...inp,width:145}}/></div>
              <button onClick={clearSchedule} style={{background:"none",border:"1px solid #e8c0c0",color:"#804040",borderRadius:6,padding:"6px 14px",fontSize:12,cursor:"pointer",fontFamily:font}}>Clear range</button>
            </div>
          </Collapsible>
        </>}

        {/* ================ CALENDAR (Slice B grid + Slice C week rows + Slice D editor) ================ */}
        {view==="calendar" && (() => {
          const SlotLine = ({ role, holder, locked }) => {
            const isExt = typeof holder === "string" && holder.indexOf("ext:") === 0;
            let body;
            if (!holder && !loaded) body = <span className="cal-skel" data-testid="loading-slot" style={{background:dk?"#243250":"#e4e8ee"}}/>;
            else if (!holder) body = <span className="cal-pill cal-open" style={{color:"#c04040",fontWeight:800,letterSpacing:0.4}}>OPEN</span>;
            else if (isExt) { const ext = holder.slice(4); body = <span className="cal-pill cal-ext" title={ext + " (external cover, outside the roster)"} style={{color:dk?"#a0a8b0":"#6a7a88",fontStyle:"italic",background:dk?"#1e2a44":"#eef1f4",borderColor:dk?"#2a3a5e":"#d8dee6"}}><span className="cal-name">{ext}</span><span className="cal-code">{ext.slice(0, 3).toUpperCase()}</span></span>; }
            else { const c = colorOf(holder); body = <span className="cal-pill" title={nameOf(holder)} style={{background:c.tg,color:c.tx,borderColor:c.bd}}><span className="cal-name">{nameOf(holder)}</span><span className="cal-code">{codeOf(holder)}</span></span>; }
            return <div className="cal-line"><span className="cal-role">{role}</span>{body}{locked ? <Padlock className="cal-lock" title={(role === "P" ? "Primary" : "Backup") + " locked"}/> : null}</div>;
          };
          const badge = (solid, color) => ({ display:"inline-flex",alignItems:"center",justifyContent:"center",width:13,height:13,borderRadius:3,fontSize:9,fontWeight:800,lineHeight:1,
            background: solid ? color : "transparent", color: solid ? "#fff" : color, border: "1px solid " + color });
          // Week-row text sits directly on the page background, so dark mode
          // uses the lightened per-code text palette (vis-003), not the pill's tx.
          const entryStyle = (e) => e.kind === "open" ? { color:"#c04040", fontWeight:800 } : e.kind === "external" ? { color: dk ? "#a0a8b0" : "#6a7a88", fontStyle:"italic" } : { color: textColorOf(e.id), fontWeight:600 };
          const chipStyle = (on, c) => ({ background: on ? c.tg : "transparent", color: on ? c.tx : (dk ? "#8a8aaa" : "#6a7a88"), border: "1px solid " + (on ? c.bd : (dk ? "#2a3a5e" : "#c8d0d8")), borderRadius: 6, padding: "3px 8px", fontSize: 11, fontWeight: 700, cursor: "pointer", fontFamily: mono, letterSpacing: 0.3 });
          return <>
          <div style={css.card}>
            <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",flexWrap:"wrap",gap:8,marginBottom:10}}>
              <div style={{display:"flex",alignItems:"center",gap:6,flexWrap:"wrap"}}>
                <button onClick={prevMonth} aria-label="Previous month" style={{...css.btn(false),minWidth:40,padding:"5px 10px"}}>&lsaquo;</button>
                <span data-testid="cal-month" style={{fontSize:15,fontWeight:700,color:dkText,minWidth:150,textAlign:"center"}}>{MO[calMonth]} {calYear}</span>
                <button onClick={nextMonth} aria-label="Next month" style={{...css.btn(false),minWidth:40,padding:"5px 10px"}}>&rsaquo;</button>
                <button onClick={goToday} style={{...css.btn(false),padding:"5px 10px",fontSize:11}}>Today</button>
                <select data-testid="cal-month-select" aria-label="Month" value={calMonth} onChange={e=>setCalMonth(Number(e.target.value))} style={{...inp,fontSize:12,padding:"4px 6px"}}>
                  {MO.map((m,i) => <option key={m} value={i}>{m}</option>)}
                </select>
                <input data-testid="cal-year-input" aria-label="Year" type="number" inputMode="numeric" min="2020" max="2100" value={calYearText}
                  onChange={e=>{ const t = e.target.value; setCalYearText(t); const y = Number(t); if (/^\d{4}$/.test(t) && y >= 2020 && y <= 2100) setCalYear(y); }}
                  onBlur={()=>setCalYearText(String(calYear))}
                  onKeyDown={e=>{ if (e.key === "Enter") { e.preventDefault(); setCalYearText(String(calYear)); e.currentTarget.blur(); } }}
                  style={{...inp,width:78,fontSize:12,padding:"4px 6px"}}/>
              </div>
              <div style={{display:"flex",alignItems:"center",gap:5,flexWrap:"wrap"}}>
                {activeSurgeons.map(s => { const on = calSurgeonFilters.includes(s.id); return (
                  <button key={s.id} data-filter={s.code} aria-pressed={on} title={"Show " + s.name + (on ? " (on)" : "")} onClick={()=>toggleCalFilter(s.id)} style={chipStyle(on, colorOf(s.id))}>{s.code}</button>
                ); })}
                {calSurgeonFilters.length > 0 && <button onClick={()=>setCalSurgeonFilters([])} style={{...css.btn(false),padding:"3px 8px",fontSize:11}}>All</button>}
                <label style={{display:"flex",alignItems:"center",gap:4,fontSize:11,color:dkSubtext,cursor:"pointer",marginLeft:4}}>
                  <input type="checkbox" data-testid="cal-only-open" checked={calOnlyOpen} onChange={e=>setCalOnlyOpen(e.target.checked)}/> only OPEN
                </label>
              </div>
            </div>

            {/* On call today */}
            <div data-testid="today-banner" style={{fontSize:12.5,color:dkText,background:dk?"#16213e":"#f8f9fb",border:"1px solid " + dkCardBorder,borderRadius:6,padding:"6px 10px",marginBottom:10,display:"flex",gap:8,alignItems:"center",flexWrap:"wrap"}}>
              <strong>On call today {fmtMD(todayStr)}:</strong>
              <span>P</span> <HolderTag a={todayAssign} role="primary" small/>
              <span>B</span> <HolderTag a={todayAssign} role="backup" small/>
              <span style={{fontFamily:mono,fontSize:11,color:dkSubtext}}>{buildTonightMsg()}</span>
              {!isPublicMode && <button onClick={shareTonightMsg} style={{...css.btn(false),padding:"4px 10px",fontSize:11,marginLeft:"auto"}}>{copied ? "Copied" : "Share today"}</button>}
            </div>
            {!loaded && <p style={muted}>Loading schedule</p>}
            {loaded && Object.keys(schedule).length === 0 && <p style={{...muted,fontStyle:"italic",marginBottom:8}}>No schedule days in the database yet - every day shows OPEN.</p>}
            {!rulesImported && loaded && <p style={{...muted,marginBottom:8}}>Rules not imported yet: East and holiday badges appear once Setup imports the seed (Slice E).</p>}

            {/* The grid */}
            <div className="cal-grid" data-testid="cal-grid">
              {["Mon","Tue","Wed","Thu","Fri","Sat","Sun"].map((h, i) => (
                <div key={h} className="cal-hdr" style={{color: i >= 4 ? "#3d6a8c" : dkSubtext, background: i >= 4 ? (dk ? "#141c30" : "#eef3f8") : "transparent", borderRadius: i === 4 ? "6px 0 0 6px" : i === 6 ? "0 6px 6px 0" : 0}}>{h}{i === 4 ? <span className="cal-wk-label" style={{fontWeight:500,letterSpacing:0,textTransform:"none",marginLeft:4,fontSize:9}}>weekend unit</span> : null}</div>
              ))}
              {gridDays.map(d => {
                const a = schedule[d] || null;
                const dt = parse(d); const dow = dt.getDay();
                const inMonth = d >= monthStartStr && d <= monthEndStr;
                const isWk = dow === 5 || dow === 6 || dow === 0;
                const hol = rulesCtx ? isHolidayDay(rulesCtx, d) : null;
                const derived = rulesCtx ? rulesCtx.derivedByDay[d] : null;
                const fc = forecastByDay[d];
                const pH = dayHolder(a, "primary"); const bH = a ? a.backup : null;
                const openP = !pH, openB = !bH;
                const inFilter = calSurgeonFilters.length === 0 || (a && (calSurgeonFilters.includes(a.primary) || calSurgeonFilters.includes(a.backup)));
                const dim = !inFilter || (calOnlyOpen && !(openP || openB));
                const isToday = d === todayStr;
                const bg = hol ? (dk ? "#3a3418" : "#fdf6dc") : isWk ? (dk ? "#141c30" : "#f3f6f9") : (dk ? "#16213e" : "#ffffff");
                const bracket = isWk ? { borderTop: "2px solid #a9c4da", borderTopLeftRadius: dow === 5 ? 8 : 6, borderTopRightRadius: dow === 0 ? 8 : 6 } : {};
                const derivedWho = derived ? Object.keys(derived).map(r => nameOf(derived[r]) + " Silvis " + r).join(", ") : "";
                const titleBits = [DAY_HDR[dow] + " " + fmtMD(d), "P " + holderLabel(pH, nameOf), "B " + holderLabel(bH, nameOf)];
                if (hol) titleBits.push(hol.name + " (holiday unit)"); if (derivedWho) titleBits.push("East-derived: " + derivedWho); if (a && a.note) titleBits.push("note: " + a.note);
                return (
                  <div key={d} className="cal-cell" role="button" tabIndex={0} data-day={d} data-primary={(a && a.primary) || ""} data-backup={bH || ""} data-ext={(a && a.externalCover) || ""} data-open={(openP ? "P" : "") + (openB ? "B" : "")}
                    onClick={()=>setEditorDay(d)} onKeyDown={e=>{ if (e.key === "Enter" || e.key === " ") { e.preventDefault(); setEditorDay(d); } }}
                    title={titleBits.join(" | ")}
                    style={{background:bg, border: isToday ? "2px solid #1a6fa8" : "1px solid " + dkCardBorder, ...bracket, opacity: dim ? 0.28 : inMonth ? 1 : 0.5, color:dkText, boxShadow: isToday ? "0 0 0 2px rgba(26,111,168,0.18)" : "none"}}>
                    <div style={{display:"flex",alignItems:"center",gap:4,minWidth:0,paddingRight:30}}>
                      <span style={{fontFamily:mono,fontSize:11,fontWeight:isToday?800:600,color:isToday?"#1a6fa8":inMonth?dkText:"#9aa4ae"}}>{dt.getDate()}</span>
                      {hol && <span className="cal-hol" title={hol.name + " - holiday unit (" + hol.tier + ")"} style={{fontSize:9,fontWeight:700,color:"#8a6a10",whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis",minWidth:0}}>{hol.name}</span>}
                    </div>
                    <div className="cal-badges">
                      {derived && <span data-badge="E" title={"East-derived week: " + derivedWho} style={badge(true, "#1a6fa8")}>E</span>}
                      {fc && fc.p >= 0.2 && <span data-badge={fc.p >= forecastThreshold ? "F" : "f"} title={"East forecast: " + Math.round(fc.p * 100) + "% that " + nameOf(fc.id) + " is on East call (busy at " + Math.round(forecastThreshold * 100) + "% or more)"} style={badge(fc.p >= forecastThreshold, "#8a5a10")}>F</span>}
                    </div>
                    <SlotLine role="P" holder={pH} locked={!!(a && a.primaryLocked)}/>
                    <SlotLine role="B" holder={bH} locked={!!(a && a.backupLocked)}/>
                    {(vacByDay[d] || []).length > 0 && (
                      <div className="cal-dots" title={"On vacation: " + vacByDay[d].map(nameOf).join(", ")}>
                        {vacByDay[d].map(pid => <span key={pid} data-vac={pid} style={{width:6,height:6,borderRadius:3,background:textColorOf(pid),display:"inline-block"}}/>)}
                      </div>
                    )}
                    {a && a.note && <span className="cal-note" title={a.note} style={{position:"absolute",bottom:2,right:4,fontSize:8,color:"#9aa4ae",fontWeight:700,letterSpacing:0.5}}>NOTE</span>}
                  </div>
                );
              })}
            </div>

            {/* Legend */}

          <div style={css.card}>

          {isScheduler && <div style={css.card}>
            <div style={css.cardT}>Data management</div>
            <p style={sectionNote}>Download a full JSON backup: config (roster, rules, holidays, settings), every schedule day, vacations and availability rows. It can be re-imported below or used to rebuild the database.</p>
            <div style={{display:"flex",gap:8,flexWrap:"wrap",alignItems:"center"}}>
              <button onClick={exportBackup} style={{...css.btn(true),padding:"8px 16px",fontSize:13,borderRadius:7}}>Export backup (JSON)</button>
              <input ref={importFileRef} type="file" accept="application/json,.json" style={{display:"none"}} onChange={e=>{ const f = e.target.files && e.target.files[0]; e.target.value = ""; if (f) importBackupFile(f); }}/>
              <button onClick={()=>importFileRef.current && importFileRef.current.click()} style={{...css.btn(false),padding:"8px 16px",fontSize:13,borderRadius:7}}>Import backup (JSON)</button>
            </div>
            <p style={{fontSize:10,color:"#8a94a0",margin:"6px 0 0",lineHeight:1.5}}>Import validates the shape, snapshots the current state first, then restores through the same compare-and-swap path as a snapshot restore. It never deletes vacation or availability rows.</p>
            <div style={{borderTop:"1px solid #f0d8d8",marginTop:16,paddingTop:12}}>
              <div style={{fontSize:11,fontWeight:700,color:"#a05050",letterSpacing:1,textTransform:"uppercase",marginBottom:6}}>Danger zone</div>
              <p style={{fontSize:11,color:"#a06868",marginBottom:10,lineHeight:1.4}}>Deletes every schedule day and resets the config blob for everyone. A snapshot is saved automatically first (if it can't be, nothing happens). Requires typing <strong>RESET</strong>.</p>
              <button onClick={resetAllData} style={{background:"none",border:"1px solid #e8c0c0",color:"#804040",borderRadius:6,padding:"6px 14px",fontSize:12,cursor:"pointer",fontFamily:font}}>Reset all data</button>
            </div>
          </div>}

          {isScheduler && <div style={css.card}>
            <div onClick={()=>toggleSettingsCard("restoreSnap")} style={{...css.cardT,margin:openSettingsCards.restoreSnap?"0 0 12px":0,cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"space-between",userSelect:"none"}}>
              <span>Restore from snapshot</span>
              <span style={{fontSize:12,color:"#7a8a98"}}>{openSettingsCards.restoreSnap ? "-" : "+"}</span>
            </div>
            {openSettingsCards.restoreSnap && <>
              <p style={sectionNote}>Snapshots are saved automatically before destructive actions and periodically. Restoring replaces the current schedule and setup for everyone with the selected copy and re-adds its vacation/availability rows. A fresh snapshot of the current state is saved first, so a restore can itself be undone.</p>
              {snapshotsLoading && <div style={{fontSize:12,color:"#7a8a98"}}>Loading snapshots</div>}
              {!snapshotsLoading && snapshotLoadFailed && (
                <div style={{fontSize:12,fontWeight:600,color:"#a02020",background:"#fce8e8",border:"1px solid #e0a8a8",borderRadius:6,padding:"6px 10px"}}>Couldn't load your backups - this does NOT mean none exist. Tap Refresh; if it keeps failing, reload the app (your session may have expired).</div>
              )}
              {!snapshotsLoading && !snapshotLoadFailed && (!snapshotList || snapshotList.length === 0) && <div style={{fontSize:12,color:"#7a8a98"}}>No snapshots yet.</div>}
              {!snapshotsLoading && snapshotList && snapshotList.map(sn => (
                <div key={sn.id} style={{display:"flex",alignItems:"center",gap:8,padding:"7px 0",borderBottom:"1px solid #f0f2f4"}}>

                    <div style={{fontSize:10,color:"#8a94a0",fontFamily:mono}}>{new Date(sn.created_at).toLocaleString(undefined,{month:"short",day:"numeric",year:"numeric",hour:"numeric",minute:"2-digit"})}</div>
                  </div>
                  <button disabled={!!restoreBusyId} onClick={()=>restoreSnapshot(sn)} style={{background:"none",border:"1px solid #b8cfe0",color:restoreBusyId?"#a8b4c0":"#1a6fa8",borderRadius:6,padding:"5px 12px",fontSize:11,fontWeight:600,cursor:restoreBusyId?"default":"pointer",fontFamily:font}}>{restoreBusyId===sn.id ? "Restoring" : "Restore"}</button>
                </div>
              ))}
              <button onClick={loadSnapshots} disabled={snapshotsLoading} style={{background:"none",border:"none",color:"#1a6fa8",fontSize:11,cursor:"pointer",fontFamily:font,padding:"8px 0 0",fontWeight:600}}>Refresh list</button>
            </>}

const thS = {textAlign:"left",padding:"7px 8px",color:"#5a6a78",fontWeight:600,fontSize:10,textTransform:"uppercase",letterSpacing:0.5};
const tdS = {padding:"7px 8px",fontFamily:"'JetBrains Mono',monospace",color:"#4a5a68",fontSize:13};

// --- Month painter - full-screen bulk vacation entry (phone-first) ---
// Defined at MODULE SCOPE deliberately: inside CallSchedule its identity would
// change every parent render and React would remount it, silently resetting
// the draft. Painting NEVER writes per tap; commit happens on explicit Save
// through the parent's onCommit (one bulk insert, one audit entry). A failed
// commit wrote NOTHING: the draft stays, the error names every pending entry.
function MonthPainterSheet({ css, dk, surgeons, vacations, onCommit, onClose }) {
  const today = new Date();
  const [ym, setYm] = React.useState({ y: today.getFullYear(), m: today.getMonth() });
  const [armedPerson, setArmedPerson] = React.useState(surgeons.length === 1 ? surgeons[0].id : "");
  const [draftEntries, setDraftEntries] = React.useState([]); // [{personId, start, end}]
  const [pendingStart, setPendingStart] = React.useState(null);
  const [busy, setBusy] = React.useState(false);
  const [commitError, setCommitError] = React.useState(null);
  const [savedNote, setSavedNote] = React.useState("");
  const savedTimerRef = React.useRef(null);
  const dirtyCount = draftEntries.length;
  const personName = (id) => (surgeons.find(s => s.id === id) || {}).name || id;
  const pillStyle = (id) => {
    const si = surgeons.findIndex(s => s.id === id);
    const c = surgeonColors(si >= 0 ? surgeons[si].name : id, si >= 0 ? si : 0);
    return { background: c.tg, color: c.tx, border: `1px solid ${c.bd}` };
  };
  const days = React.useMemo(() => {
    const out = []; const n = new Date(ym.y, ym.m + 1, 0).getDate();
    for (let d = 1; d <= n; d++) out.push(new Date(ym.y, ym.m, d));
    return out;
  }, [ym]);
  const offByDay = React.useMemo(() => {
    const map = {};
    const monthStart = fmt(new Date(ym.y, ym.m, 1));
    const monthEnd = fmt(new Date(ym.y, ym.m + 1, 0));
    for (const [pid, ranges] of Object.entries(vacations || {})) for (const r of (ranges || [])) {
      if (!Array.isArray(r)) continue;
      const [vs, ve] = r;
      if (!vs || !ve || ve < monthStart || vs > monthEnd) continue;
      let d = parse(vs < monthStart ? monthStart : vs);
      const stop = ve > monthEnd ? monthEnd : ve;
      while (fmt(d) <= stop) { const ds = fmt(d); (map[ds] = map[ds] || []).push(pid); d = addD(d, 1); }
    }
    return map;
  }, [ym, vacations]);
  const draftCoveringAll = (ds) => draftEntries.map((en, i) => ({ en, i })).filter(x => x.en.start <= ds && ds <= x.en.end);
  const draftCoveringArmed = (ds) => draftEntries.findIndex(en => en.personId === armedPerson && en.start <= ds && ds <= en.end);
  const tapDay = (ds) => {
    setCommitError(null);
    if (!armedPerson) return;
    const covered = draftCoveringArmed(ds);
    if (covered >= 0) { setDraftEntries(p => p.filter((_, i) => i !== covered)); return; }
    if (!pendingStart) { setPendingStart(ds); return; }
    const [s, e] = pendingStart <= ds ? [pendingStart, ds] : [ds, pendingStart];
    setDraftEntries(p => [...p, { personId: armedPerson, start: s, end: e }]);
    setPendingStart(null);
  };
  const describeDraft = () => draftEntries.map(en => `${personName(en.personId)} ${en.start}${en.end !== en.start ? " - " + en.end : ""}`);
  const doSave = async () => {
    if (!dirtyCount || busy) return;
    setBusy(true); setCommitError(null); setSavedNote("");
    const items = describeDraft();
    let r;
    try { r = await onCommit(draftEntries); }
    catch (e) { r = { ok: false, error: String(e?.message || e) }; }
    finally { setBusy(false); }
    if (r && r.ok) {
      setDraftEntries([]); setPendingStart(null);
      setSavedNote(`Saved ${items.length} entr${items.length === 1 ? "y" : "ies"}`);
      if (savedTimerRef.current) clearTimeout(savedTimerRef.current);
      savedTimerRef.current = setTimeout(() => setSavedNote(""), 3000);
    } else {
      setCommitError({ msg: (r && r.error) || "unknown error", items });
    }
  };
  const doDiscard = () => {
    if (!dirtyCount) return;
    if (!confirm(`Discard ${dirtyCount} unsaved entr${dirtyCount === 1 ? "y" : "ies"}?`)) return;
    setDraftEntries([]); setPendingStart(null); setCommitError(null); setSavedNote("");
  };
  const doClose = () => {
    if (busy) return;
    if (dirtyCount && !confirm(`Discard ${dirtyCount} unsaved entr${dirtyCount === 1 ? "y" : "ies"} and close?`)) return;
    onClose();
  };
  React.useEffect(() => () => { if (savedTimerRef.current) clearTimeout(savedTimerRef.current); }, []);
  const bg = dk ? "#1a1a2e" : "#f0f2f5";
  const panelBg = dk ? "#16213e" : "#fff";
  const border = dk ? "#2a3a5e" : "#e0e4ea";
  const text = dk ? "#e0e0f0" : "#2c3e50";
  const muted = dk ? "#8a8aaa" : "#7a8a98";
  return (
    <div style={{ position: "fixed", inset: 0, zIndex: 9300, background: bg, display: "flex", flexDirection: "column", fontFamily: font }}>
      <div style={{ background: panelBg, borderBottom: `1px solid ${border}`, padding: "10px 14px 10px", paddingTop: "calc(env(safe-area-inset-top, 0px) + 10px)", flexShrink: 0 }}>
        <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", gap: 8 }}>
          <div style={{ fontSize: 15, fontWeight: 800, color: text }}>Paint vacations</div>
          <button onClick={doClose} aria-label="Close" style={{ background: "none", border: "none", color: muted, fontSize: 22, cursor: "pointer", padding: "6px 10px", minWidth: 44, minHeight: 44 }}>x</button>
        </div>
        <div style={{ display: "flex", alignItems: "center", justifyContent: "center", gap: 6, marginTop: 2 }}>
          <button onClick={() => setYm(p => { const m = p.m - 1; return m < 0 ? { y: p.y - 1, m: 11 } : { y: p.y, m }; })} aria-label="Previous month" style={{ ...css.btn(false), minWidth: 48, minHeight: 44, fontSize: 15 }}>&lsaquo;</button>
          <span style={{ fontSize: 14, fontWeight: 700, color: text, minWidth: 150, textAlign: "center" }}>{MO[ym.m]} {ym.y}</span>
          <button onClick={() => setYm(p => { const m = p.m + 1; return m > 11 ? { y: p.y + 1, m: 0 } : { y: p.y, m }; })} aria-label="Next month" style={{ ...css.btn(false), minWidth: 48, minHeight: 44, fontSize: 15 }}>&rsaquo;</button>
        </div>
        <div style={{ marginTop: 8 }}>
          <div style={{ display: "flex", flexWrap: "wrap", gap: 6, alignItems: "center" }}>
            <select value={armedPerson} onChange={e => { setArmedPerson(e.target.value); setPendingStart(null); }} disabled={surgeons.length === 1}
              style={{ ...css.inp, ...(dk ? { background: "#0f3460", border: "1px solid #2a3a5e", color: "#e0e0f0" } : {}), minHeight: 40, flex: "1 1 140px" }}>
              <option value="">Select person</option>
              {surgeons.map(s => <option key={s.id} value={s.id}>{s.name}</option>)}
            </select>
          </div>
          <div style={{ fontSize: 11, color: muted, marginTop: 6, display: "flex", alignItems: "center", gap: 8, flexWrap: "wrap" }}>
            {!armedPerson ? "Select a person, then tap a start day and an end day."
              : pendingStart ? <>
                  <span>Start {pendingStart} - tap the end day (same day = just that day).</span>
                  <button onClick={() => setPendingStart(null)} style={{ minHeight: 30, padding: "3px 10px", borderRadius: 7, fontSize: 11, fontWeight: 700, fontFamily: font, cursor: "pointer", background: "transparent", color: "#c04040", border: "1px solid #c05050" }}>cancel start</button>
                </>
              : `Tap ${personName(armedPerson)}'s start day. Tap a painted range to remove it before saving.`}
          </div>
        </div>
      </div>
      <div style={{ flex: 1, overflowY: "auto", WebkitOverflowScrolling: "touch", padding: "6px 10px 12px" }}>
        {days.map(d => {
          const ds = fmt(d);
          const dow = d.getDay();
          const isWknd = dow === 0 || dow === 6;
          const off = offByDay[ds] || [];
          const coveredAll = draftCoveringAll(ds);
          const isPending = pendingStart === ds;
          const rowBg = isPending ? (dk ? "#1a3a5e" : "#dcecf8") : coveredAll.length > 0 ? (dk ? "#1c3050" : "#e6f2ea") : isWknd ? (dk ? "#141c30" : "#f6f8fa") : panelBg;
          return (
            <button key={ds} onClick={() => tapDay(ds)}
              style={{ display: "flex", alignItems: "center", gap: 10, width: "100%", textAlign: "left", minHeight: 52, padding: "7px 10px", marginBottom: 4, borderRadius: 9, cursor: "pointer", fontFamily: font, background: rowBg, border: `1px solid ${isPending ? "#2488c8" : border}` }}>
              <div style={{ width: 44, flexShrink: 0, textAlign: "center" }}>
                <div style={{ fontSize: 17, fontWeight: 800, color: text, fontFamily: mono }}>{d.getDate()}</div>
                <div style={{ fontSize: 9.5, fontWeight: 700, color: isWknd ? "#a05010" : muted, textTransform: "uppercase" }}>{DAY_HDR[dow]}</div>
              </div>
              <div style={{ flex: 1, minWidth: 0 }}>
                {coveredAll.length > 0 && (
                  <div style={{ display: "flex", alignItems: "center", gap: 6, flexWrap: "wrap", marginBottom: 2 }}>
                    {coveredAll.map(({ en }, k) => (
                      <span key={k} style={{ ...pillStyle(en.personId), display: "inline-flex", alignItems: "center", padding: "2px 8px", borderRadius: 6, fontSize: 11.5, fontWeight: 800 }}>{personName(en.personId)}</span>
                    ))}
                    <span style={{ fontSize: 9.5, fontWeight: 800, color: "#a05010" }}>unsaved - tap with that person armed to remove</span>
                  </div>
                )}
                {isPending && <div style={{ fontSize: 11, fontWeight: 700, color: "#2488c8", marginBottom: 2 }}>range starts here</div>}
                <div style={{ display: "flex", flexWrap: "wrap", gap: 4 }}>
                  {off.length === 0 && coveredAll.length === 0 && !isPending && <span style={{ fontSize: 10.5, color: muted }}>nobody off</span>}
                  {off.map((pid, i) => (
                    <span key={i} style={{ ...pillStyle(pid), display: "inline-flex", alignItems: "center", gap: 3, padding: "1px 7px", borderRadius: 5, fontSize: 10, fontWeight: 700, opacity: 0.9 }}>{personName(pid)}</span>
                  ))}
                </div>
              </div>
            </button>
          );
        })}
      </div>
      <div style={{ background: panelBg, borderTop: `1px solid ${border}`, padding: "10px 14px", paddingBottom: "calc(env(safe-area-inset-bottom, 0px) + 10px)", flexShrink: 0 }}>
        {commitError && (
          <div role="alert" style={{ marginBottom: 8, padding: "8px 10px", borderRadius: 8, background: dk ? "#3a1a1a" : "#fdeaea", border: "1px solid #c05050", maxHeight: 130, overflowY: "auto" }}>
            <div style={{ fontSize: 12, fontWeight: 800, color: "#c04040" }}>Nothing was saved - {commitError.items.length} entr{commitError.items.length === 1 ? "y is" : "ies are"} still unsaved:</div>
            {commitError.items.map((it, i) => <div key={i} style={{ fontSize: 11, color: dk ? "#e0b0b0" : "#8a3030", fontFamily: mono }}>- {it}</div>)}
            <div style={{ fontSize: 10.5, color: muted, marginTop: 3 }}>({commitError.msg}) - your taps are kept; fix the issue and Save again.</div>
          </div>
        )}
        <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
          <div style={{ flex: 1, fontSize: 12.5, fontWeight: 800, color: dirtyCount ? "#a05010" : muted }}>
            {dirtyCount ? `${dirtyCount} unsaved` : savedNote ? <span style={{ color: "#1a8040" }}>{savedNote}</span> : "No unsaved changes"}
          </div>
          <button onClick={doDiscard} disabled={!dirtyCount || busy} style={{ ...css.btn(false), minHeight: 44, opacity: dirtyCount && !busy ? 1 : 0.45 }}>Discard</button>
          <button onClick={doSave} disabled={!dirtyCount || busy} style={{ ...css.btn(true), minHeight: 44, minWidth: 110, opacity: dirtyCount && !busy ? 1 : 0.55 }}>{busy ? "Saving" : `Save${dirtyCount ? ` (${dirtyCount})` : ""}`}</button>
        </div>
      </div>
    </div>
  );
}

// Reusable collapsible section. Persists open/closed per-device via localStorage
// (keyed by `ck`). Defined at module scope so it never remounts on parent re-render.
function Collapsible({ title, ck, defaultOpen = false, summary = null, children, css, right = null, style = null }) {
  const [open, setOpen] = React.useState(() => {
    try {
      const v = localStorage.getItem("silvis_collapse_" + ck);
      if (v === "1") return true;
      if (v === "0") return false;
    } catch (e) { console.warn("Couldn't read panel collapse state:", e); }
    return defaultOpen;
  });
  const toggle = () => setOpen(o => {
    const n = !o;
    try { localStorage.setItem("silvis_collapse_" + ck, n ? "1" : "0"); } catch (e) { console.warn("Couldn't persist panel collapse state:", e); }
    return n;
  });
  return (
    <div style={style ? { ...css.card, ...style } : css.card}>
      <div onClick={toggle} style={{ display: "flex", alignItems: "center", gap: 8, cursor: "pointer", userSelect: "none" }}>
        <span style={{ fontSize: 11, color: "#8a94a0", transition: "transform .15s", transform: open ? "rotate(90deg)" : "rotate(0deg)", display: "inline-block", width: 10, flexShrink: 0 }}>&#9654;</span>
        <div style={{ ...css.cardT, marginBottom: 0, flex: 1 }}>{title}</div>
        {right}
      </div>
      {!open && summary != null && <div style={{ marginTop: 10 }}>{summary}</div>}
      {open && <div style={{ marginTop: 12 }}>{children}</div>}
    </div>
  );
}

// --- Rules-context helpers shared by the app and the day editor ---
// buildContext never throws on well-formed data; on anything else the UI
// must say "eligibility unavailable" rather than render nothing (fail loud).
function safeBuildContext(inputs) {
  try { return { ctx: buildContext(inputs), error: null }; }
  catch (e) { console.warn("buildContext failed - eligibility unavailable:", e); return { ctx: null, error: String(e && e.message || e) }; }
}

// Human wording for rules.js reason codes. The raw code stays visible in the
// dropdown label (it matches docs/SILVIS-CALL-RULES.md and the regression
// test); this adds the plain-English gloss shown beside it.
const REASON_WORDS = {
  "external-cover": "primary is covered externally", "inactive": "inactive on the roster",
  "unavailable-row": "stated unavailable", "no-backup-row": "stated no backup", "backup-only-row": "stated backup only",
  "east-busy": "on East (Davenport) call", "day-before-vacation": "vacation starts the next morning",
  "weekend-block-only": "weekends only as a full Fri-Sun block", "day-before-aledo": "Aledo clinic the next day",
  "whitelist-month": "not on this month's stated list", "outside-available-weeks": "outside the listed weeks",
  "outside-window": "outside the availability window", "not-recurring-available": "not a recurring available day",
  "holds-other-role": "already holds the other role that day", "unknown-surgeon": "not on the roster", "bad-role": "unknown role",
};
function reasonLabel(code, nameOf) {
  const s = String(code || ""); const i = s.indexOf(":");
  const key = i < 0 ? s : s.slice(0, i); const arg = i < 0 ? "" : s.slice(i + 1);
  const who = (id) => (typeof nameOf === "function" ? nameOf(id) : id);
  switch (key) {
    case "slot-locked": return "slot locked to " + who(arg);
    case "derived-lock": return "East week: Silvis " + arg + " that week";
    case "derived-lock-held": return "East week slot belongs to " + who(arg);
    case "hard-never-weekday": return "never on " + arg;
    case "recurring-unavailable": return "recurring unavailable on " + arg;
    case "weekday-not-allowed": return arg + " is not one of the allowed weekdays";
    case "weekday-pattern": return "weekday pattern excludes " + arg;
    case "holiday-opt-out": return "opted out of " + arg;
    case "time-off": return "on vacation";
    case "east-forecast-busy": return "East forecast " + Math.round(Number(arg) * 100) + "% (treated as busy)";
    case "monthly-cap": return "monthly cap of " + arg + " reached";
    case "max-consecutive": return "more than " + arg + " consecutive days";
    case "backup-cap": return "backup cap of " + arg + " per month reached";
    case "backup-weekend-cap": return "backup weekend cap of " + arg + " reached";
    case "window-week-max": return "over " + arg + " days in the window week";
    case "max-major-holidays": return "already holds " + arg + " major holiday(s) in 12 months";
    default: return REASON_WORDS[key] ? REASON_WORDS[key] + (arg ? " (" + arg + ")" : "") : s;
  }
}
// Compact tag for a soft penalty ("avoid: Tue", "preferred", "East 25%").
function softTag(soft) {
  const s = String(soft && soft.reason || ""); const i = s.indexOf(":");
  const key = i < 0 ? s : s.slice(0, i); const arg = i < 0 ? "" : s.slice(i + 1);
  switch (key) {
    case "recurring-avoid": return "avoid: " + arg;
    case "avoid-row": return "avoid";
    case "prefer-row": case "preferred": return "preferred";
    case "east-forecast": return "East " + Math.round(Number(arg) * 100) + "%";
    case "east-unknown": return "East unknown";
    case "auto-offer-weekday": return "auto-offer";
    case "over-preferred-cap": return "over preferred cap " + arg;
    case "over-target": return "over target +" + arg;
    case "under-target": return "under target";
    case "window-week-below-min": return "under window min " + arg;
    case "handoff-partner": return "handoff";
    case "back-to-back-weekend": return "back-to-back weekend";
    case "backup-after-primary": return "backup after primary";
    case "pattern-mismatch": return "style: " + arg;
    case "aledo-week": return "Aledo week";
    case "holiday-waiver": return "holiday waiver";
    default: return s;
  }
}
// East status lines for one day, per surgeon with an East feature (data-driven
// from ctxInputs.eastMeta): published busy / forecast p / clear / unknown for
// busy-days surgeons, derived Silvis role for derived-week surgeons.
function eastStatusLines(ctx, ctxInputs, day, nameOf) {
  const out = [];
  const meta = (ctxInputs && ctxInputs.eastMeta) || {};
  Object.keys(meta).forEach(id => {
    const m = meta[id]; const P = ctx && ctx.per ? ctx.per[id] : null; const name = nameOf(id);
    if (m.busyDays) {
      if (!m.eastId) out.push({ id, text: name + ": East id unresolved - status unknown", tone: "warn" });
      else if (P && P.eastBusy.has(day)) out.push({ id, text: name + ": East call (published) - Silvis primary blocked", tone: "busy" });
      else {
        const p = P && P.eastForecast ? P.eastForecast[day] : undefined;
        if (typeof p === "number") out.push({ id, text: name + ": East forecast " + Math.round(p * 100) + "% (" + (p >= ctx.forecastThreshold ? "treated as busy" : "below the " + Math.round(ctx.forecastThreshold * 100) + "% threshold") + ")", tone: p >= ctx.forecastThreshold ? "busy" : "ok" });
        else if (ctx && ctx.eastCoverage && day >= ctx.eastCoverage.from && day <= ctx.eastCoverage.to) out.push({ id, text: name + ": no East call (published)", tone: "ok" });
        else out.push({ id, text: name + ": East unknown (no published week or forecast for this day)", tone: "warn" });
      }
    }
    if (m.derivedWeeks && P) {
      const dRole = P.derived[day];
      if (dRole) out.push({ id, text: name + ": East week -> Silvis " + dRole + " (derived)", tone: "busy" });
      else if (P.eastDays.has(day)) out.push({ id, text: name + ": on East call this week (not derived - before the derive-from date)", tone: "warn" });
      else out.push({ id, text: name + ": no East week", tone: "ok" });
    }
  });
  return out;
}

// Small padlock glyph (inline SVG so no emoji / non-ASCII is needed).
function Padlock({ title, size, className }) {
  const s = size || 9;
  return (
    <svg role="img" aria-label={title || "locked"} className={className} width={s} height={s} viewBox="0 0 10 10" style={{flexShrink:0,display:"inline-block"}}>
      <title>{title || "locked"}</title>
      <rect x="1.5" y="4.5" width="7" height="5" rx="1" fill="#7a8a98"/>
      <path d="M3 4.7V3a2 2 0 0 1 4 0v1.7" fill="none" stroke="#7a8a98" strokeWidth="1.3"/>
    </svg>
  );
}

// --- Day editor (Slice D) ---
// Module scope so a parent re-render never remounts it mid-edit (the parent
// keys it by day, so moving to another day starts a fresh draft). Every
// dropdown option is evaluated through eligibility() on a DRAFT ctx: the
// app's ctxInputs with this day's draft swapped in, so the OTHER role's
// current pick counts ("holds-other-role") and a lock toggled off in the
// draft stops blocking. Ineligible options stay selectable for the scheduler
// but only through the Override panel, which lists ALL hard reasons; the
// overrides ride along to onSave (note prefix + audit). Non-schedulers get
// the read-only detail. Esc closes; Left/Right arrows move a day when the
// draft is clean and focus is not in a field.
function DayEditor(props) {
  const { day, entry, roster, ctxInputs, ctxError, canEdit, rulesImported, isPublicMode, nameOf, codeOf, colorOf, mySurgeon, vacationNames, onSave, onCancel, onNav, onTrade, css, dk } = props;
  const opened = React.useMemo(() => ({ ...emptyDayAssignment(), ...(entry || {}) }), [day]); // eslint-disable-line
  const [draft, setDraft] = React.useState(opened);
  const [overrides, setOverrides] = React.useState([]);   // [{ id, role, reasons }]
  const [pending, setPending] = React.useState(null);     // { id, role, reasons } awaiting the Override confirm
  const [hint, setHint] = React.useState("");
  const norm = (a) => JSON.stringify(assignmentToDayRow(day, a));
  const dirty = norm(draft) !== norm(opened);

  const draftState = React.useMemo(() => safeBuildContext({ ...ctxInputs, schedule: { ...ctxInputs.schedule, [day]: { ...draft, source: draft.source || "manual" } } }), [ctxInputs, day, draft]);
  const ctx = draftState.ctx;
  const hol = ctx ? isHolidayDay(ctx, day) : null;
  const east = ctx ? eastStatusLines(ctx, ctxInputs, day, nameOf) : [];
  const evalRole = (role) => {
    const list = roster.map(s => {
      let r;
      try { r = ctx ? eligibility(ctx, day, role, s.id) : { ok: true, hard: [], soft: [] }; }
      catch (e) { console.warn("eligibility threw for", s.id, role, day, e); r = { ok: true, hard: [], soft: [], error: true }; }
      return { id: s.id, name: s.name, code: s.code, active: s.active !== false, ok: !!r.ok, hard: r.hard || [], soft: r.soft || [], lockHolder: !!r.lockHolder, conflicts: r.conflicts || [], error: !!r.error };
    });
    // eligible first, then ineligible (roster order kept inside each group); inactive only if currently held
    return list.filter(o => o.active && o.ok).concat(list.filter(o => o.active && !o.ok)).concat(list.filter(o => !o.active && o.id === draft[role]));
  };
  const opts = React.useMemo(() => ({ primary: evalRole("primary"), backup: evalRole("backup") }), [ctx, day, draft, roster]); // eslint-disable-line

  const pick = (role, value) => {
    setHint("");
    if (!value) { setDraft(d => ({ ...d, [role]: null })); setOverrides(o => o.filter(x => x.role !== role)); return; }
    const opt = opts[role].find(o => o.id === value);
    if (opt && !opt.ok) { setPending({ id: value, role, reasons: opt.hard.slice() }); return; }
    setDraft(d => ({ ...d, [role]: value, ...(role === "primary" ? { externalCover: null } : {}) }));
    setOverrides(o => o.filter(x => x.role !== role));
  };
  const confirmOverride = () => {
    if (!pending) return;
    const p = pending;
    setDraft(d => ({ ...d, [p.role]: p.id, ...(p.role === "primary" ? { externalCover: null } : {}) }));
    setOverrides(o => o.filter(x => x.role !== p.role).concat([p]));
    setPending(null);
  };
  const clearRole = (role) => {
    if (draft[role + "Locked"]) { setHint((role === "primary" ? "Primary" : "Backup") + " is locked - unlock it first."); return; }
    pick(role, "");
  };
  const toggleLock = (role) => setDraft(d => ({ ...d, [role + "Locked"]: !d[role + "Locked"] }));
  const save = () => {
    if (!dirty) { onCancel(); return; }
    if (draft.primary && draft.primary === draft.backup) { setHint("Primary and backup must be different people."); return; }
    onSave({ ...draft }, { overrides });
  };
  React.useEffect(() => {
    const onKey = (e) => {
      if (e.key === "Escape") { e.preventDefault(); if (pending) setPending(null); else onCancel(); return; }
      const tag = (e.target && e.target.tagName || "").toLowerCase();
      if (tag === "input" || tag === "textarea" || tag === "select") return;
      if (e.key === "ArrowLeft" || e.key === "ArrowRight") {
        e.preventDefault();
        if (dirty) { setHint("Save or cancel your changes before moving to another day."); return; }
        onNav(e.key === "ArrowLeft" ? -1 : 1);
      }
    };
    window.addEventListener("keydown", onKey);
    return () => window.removeEventListener("keydown", onKey);
  }, [pending, dirty, onCancel, onNav]);

  const dt = parse(day);
  const title = DAY_HDR[dt.getDay()] + " " + MO[dt.getMonth()] + " " + dt.getDate() + ", " + dt.getFullYear();
  const panelBg = dk ? "#16213e" : "#ffffff";
  const text = dk ? "#e0e0f0" : "#2c3e50";
  const sub = dk ? "#8a8aaa" : "#7a8a98";
  const border = dk ? "#2a3a5e" : "#e0e4ea";
  const inp = { ...css.inp, ...(dk ? { background: "#0f3460", border: "1px solid #2a3a5e", color: "#e0e0f0" } : {}) };
  const label = { fontSize: 10, color: sub, fontWeight: 700, textTransform: "uppercase", letterSpacing: 0.5, display: "block", marginBottom: 3 };
  const pill = (id) => { const c = colorOf(id); return <span style={{background:c.tg,color:c.tx,border:"1px solid " + c.bd,borderRadius:5,padding:"1px 8px",fontSize:12,fontWeight:700}}>{nameOf(id)}</span>; };
  const holderView = (role) => {
    const v = role === "primary" ? (draft.primary || (draft.externalCover ? "ext:" + draft.externalCover : null)) : draft.backup;
    if (!v) return <span style={{color:"#c04040",fontWeight:800}}>OPEN</span>;
    if (String(v).indexOf("ext:") === 0) return <span style={{fontStyle:"italic",color:sub}}>{String(v).slice(4)} (external cover)</span>;
    return pill(v);
  };
  const myRole = mySurgeon && entry ? (entry.primary === mySurgeon ? "primary" : entry.backup === mySurgeon ? "backup" : null) : null;
  const optionLabel = (o) => {
    if (!o.ok) return o.name + " - " + (o.hard[0] || "ineligible");
    const tags = o.soft.map(softTag).filter(Boolean);
    return o.name + (o.lockHolder ? " (locked holder)" : "") + (tags.length ? " (" + tags.join(", ") + ")" : "");
  };
  const roleBlock = (role) => {
    const list = opts[role];
    const locked = !!draft[role + "Locked"];
    const cur = list.find(o => o.id === draft[role]) || null;
    const ineligible = list.filter(o => !o.ok);
    const ov = overrides.find(x => x.role === role);
    return (
      <div data-testid={"editor-" + role + "-block"} style={{border:"1px solid " + border,borderRadius:8,padding:"10px 12px",marginBottom:10,background: dk ? "#1a2540" : "#fafbfc"}}>
        <div style={{display:"flex",alignItems:"center",gap:8,flexWrap:"wrap",marginBottom:6}}>
          <span style={{...label,marginBottom:0,minWidth:60}}>{role === "primary" ? "Primary" : "Backup"}</span>
          {holderView(role)}
          {locked && <Padlock title={role + " locked"} size={11}/>}
          {cur && cur.lockHolder && cur.conflicts.length > 0 && <span title={cur.conflicts.join(", ")} style={{fontSize:10,color:"#8a5a10",fontWeight:700}}>locked holder breaks: {cur.conflicts.map(c => reasonLabel(c, nameOf)).join("; ")}</span>}
          {ov && <span data-testid={"override-tag-" + role} style={{fontSize:10,color:"#a83232",fontWeight:700}}>override: {ov.reasons.join(", ")}</span>}
        </div>
        {canEdit && (
          <div style={{display:"flex",gap:8,alignItems:"center",flexWrap:"wrap"}}>
            <select data-testid={"editor-" + role} aria-label={role} value={draft[role] || ""} disabled={locked} onChange={e => pick(role, e.target.value)} style={{...inp,minWidth:230,fontSize:13,opacity:locked?0.6:1}}>
              <option value="" data-eligible="true">{role === "primary" && draft.externalCover ? draft.externalCover + " (external cover)" : "OPEN"}</option>
              {list.map(o => (
                <option key={o.id} value={o.id} data-eligible={o.ok ? "true" : "false"} style={o.ok ? {} : {color:"#a0a8b0"}}>{optionLabel(o)}</option>
              ))}
            </select>
            <label style={{display:"flex",alignItems:"center",gap:4,fontSize:11,color:sub,cursor:"pointer"}}>
              <input type="checkbox" data-testid={"editor-lock-" + role} checked={locked} onChange={() => toggleLock(role)}/> Lock {role}
            </label>
            <button type="button" data-testid={"editor-clear-" + role} onClick={() => clearRole(role)} disabled={locked || !draft[role]} title={locked ? "Unlock first" : "Set to OPEN"} style={{...css.btn(false),padding:"4px 10px",fontSize:11,opacity:(locked || !draft[role])?0.5:1}}>Clear</button>
          </div>
        )}
        {canEdit && cur && cur.ok && cur.soft.length > 0 && (
          <div style={{fontSize:11,color:"#8a5a10",marginTop:5}}>Soft penalties for {cur.name}: {cur.soft.map(softTag).join(", ")}</div>
        )}
        {canEdit && ineligible.length > 0 && (
          <div data-testid={"editor-" + role + "-reasons"} style={{fontSize:11,color:sub,marginTop:6,lineHeight:1.5}}>
            <span style={{fontWeight:700}}>Not eligible:</span> {ineligible.map(o => o.name + " - " + reasonLabel(o.hard[0], nameOf)).join("; ")}
          </div>
        )}
      </div>
    );
  };

  return (
    <div data-testid="day-editor" onClick={onCancel} style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.45)",display:"flex",alignItems:"center",justifyContent:"center",zIndex:9500,padding:14}}>
      <div role="dialog" aria-modal="true" aria-label={"Day editor " + day} onClick={e => e.stopPropagation()} style={{background:panelBg,color:text,borderRadius:12,padding:"16px 18px",maxWidth:600,width:"100%",maxHeight:"92vh",overflowY:"auto",boxShadow:"0 8px 32px rgba(0,0,0,0.25)",fontFamily:font}}>
        <div style={{display:"flex",alignItems:"center",gap:6,marginBottom:8}}>
          <button type="button" aria-label="Previous day" onClick={() => { if (dirty) setHint("Save or cancel your changes before moving to another day."); else onNav(-1); }} style={{...css.btn(false),minWidth:34,padding:"4px 8px"}}>&lsaquo;</button>
          <h3 data-testid="editor-title" style={{margin:0,fontSize:16,color:text,flex:1,textAlign:"center"}}>{title}</h3>
          <button type="button" aria-label="Next day" onClick={() => { if (dirty) setHint("Save or cancel your changes before moving to another day."); else onNav(1); }} style={{...css.btn(false),minWidth:34,padding:"4px 8px"}}>&rsaquo;</button>
          <button type="button" aria-label="Close" onClick={onCancel} style={{background:"none",border:"none",color:sub,fontSize:20,cursor:"pointer",padding:"0 4px",marginLeft:4}}>x</button>
        </div>
        <div style={{fontSize:12,color:sub,lineHeight:1.6,marginBottom:10}}>
          <div>{hol ? <><span style={{fontWeight:700,color:"#8a6a10"}}>{hol.name}</span> holiday unit ({hol.tier}): {hol.days.map(fmtMD).join(", ")} - one primary and one backup stick through the unit.</> : "Not in a holiday unit."}</div>
          {east.length === 0 ? <div>East: {rulesImported ? "no East features configured" : "rules not imported yet"}</div> : east.map(l => <div key={l.id + l.text} data-testid="east-status" style={{color: l.tone === "busy" ? "#a83232" : l.tone === "warn" ? "#8a5a10" : sub}}>East - {l.text}</div>)}
          <div>Vacations: {vacationNames.length ? vacationNames.join(", ") : "nobody off"}</div>
          {ctxError && <div style={{color:"#a83232",fontWeight:700}}>Eligibility unavailable: {ctxError}</div>}
          {!rulesImported && <div>Rules not imported yet - eligibility reflects locks, vacations and availability rows only.</div>}
          {entry && entry.source && <div>Source: {entry.source}</div>}
        </div>

        {roleBlock("primary")}
        {roleBlock("backup")}

        {pending && (
          <div data-testid="override-confirm" role="alertdialog" style={{border:"1px solid #c05050",background: dk ? "#3a1a1a" : "#fdeaea",borderRadius:8,padding:"10px 12px",marginBottom:10}}>
            <div style={{fontSize:13,fontWeight:800,color:"#a83232",marginBottom:4}}>{nameOf(pending.id)} is not eligible for {pending.role} on {fmtMD(day)}</div>
            <ul style={{margin:"0 0 8px",paddingLeft:18,fontSize:12,color: dk ? "#e0b0b0" : "#8a3030",lineHeight:1.5}}>
              {pending.reasons.map(r => <li key={r}><span style={{fontFamily:mono}}>{r}</span> - {reasonLabel(r, nameOf)}</li>)}
            </ul>
            <div style={{fontSize:11,color:sub,marginBottom:8}}>Overriding assigns anyway and prefixes the day's note with [override: ...]; the audit log records it.</div>
            <div style={{display:"flex",gap:8,justifyContent:"flex-end"}}>
              <button type="button" onClick={() => setPending(null)} style={{...css.btn(false),padding:"5px 12px",fontSize:12}}>Keep as is</button>
              <button type="button" data-testid="override-accept" onClick={confirmOverride} style={{...css.btn(true),padding:"5px 12px",fontSize:12,background:"linear-gradient(135deg,#a83232,#c04a4a)",borderColor:"#a83232"}}>Override and assign</button>
            </div>
          </div>
        )}

        {canEdit ? (
          <div style={{display:"flex",gap:10,flexWrap:"wrap",marginBottom:10}}>
            <div style={{flex:"1 1 200px"}}>
              <label style={label}>Note</label>
              <input data-testid="editor-note" value={draft.note || ""} onChange={e => setDraft(d => ({ ...d, note: e.target.value }))} placeholder="operational note (shown on the day)" style={{...inp,width:"100%"}}/>
            </div>
            <div style={{flex:"1 1 160px"}}>
              <label style={label}>External cover (primary)</label>
              <input data-testid="editor-external" value={draft.externalCover || ""} disabled={!!draft.primary} onChange={e => setDraft(d => ({ ...d, externalCover: e.target.value }))} placeholder={draft.primary ? "clear primary to use" : "e.g. Atwell"} title="Someone outside the roster covering primary; counts toward nobody's tally" style={{...inp,width:"100%",opacity:draft.primary?0.6:1}}/>
            </div>
          </div>
        ) : (
          <div style={{fontSize:12,color:sub,marginBottom:10}}>{draft.note ? <>Note: {draft.note}</> : "No note."}</div>
        )}

        {hint && <div role="status" data-testid="editor-hint" style={{fontSize:12,color:"#a83232",fontWeight:700,marginBottom:8}}>{hint}</div>}
        <div style={{display:"flex",alignItems:"center",gap:8,flexWrap:"wrap"}}>
          {!isPublicMode && (canEdit || myRole) && (
            <button type="button" data-testid="editor-trade" onClick={() => onTrade(day, myRole || (entry && entry.primary ? "primary" : "backup"))} style={{background:"none",border:"none",color:"#1a6fa8",fontSize:12,cursor:"pointer",fontFamily:font,textDecoration:"underline",padding:0}}>Propose a trade for this day</button>
          )}
          <span style={{flex:1}}/>
          <span style={{fontSize:10,color:sub}}>Esc closes - arrow keys move a day</span>
          <button type="button" onClick={onCancel} style={{...css.btn(false),padding:"7px 14px",fontSize:12}}>{canEdit ? "Cancel" : "Close"}</button>
          {canEdit && <button type="button" data-testid="editor-save" onClick={save} disabled={!dirty} style={{...css.btn(true),padding:"7px 16px",fontSize:12,opacity:dirty?1:0.5}}>Save</button>}
        </div>
      </div>
    </div>
  );
}

// --- Error boundary ---

// A render exception anywhere in the tree would otherwise white-screen the
// whole app - the worst possible failure for someone checking who's on call.
class ErrorBoundary extends React.Component {
  constructor(props) { super(props); this.state = { error: null }; }
  static getDerivedStateFromError(error) { return { error: error }; }
  componentDidCatch(error, info) { try { console.error("App crashed:", error, info); } catch (e) { /* console unavailable */ } }
  render() {
    if (this.state.error) {
      var msg = (this.state.error && this.state.error.message) ? this.state.error.message : String(this.state.error);
      return React.createElement(
        "div",
        { style: { minHeight: "100vh", display: "flex", alignItems: "center", justifyContent: "center", padding: 20, fontFamily: (typeof font !== "undefined" ? font : "system-ui, sans-serif"), background: "#f0f2f5", boxSizing: "border-box" } },
        React.createElement(
          "div",
          { style: { maxWidth: 460, width: "100%", background: "#fff", border: "1px solid #e0e4ea", borderRadius: 12, padding: 24, boxShadow: "0 2px 12px rgba(0,0,0,0.06)", textAlign: "center" } },
          React.createElement("div", { style: { fontSize: 18, fontWeight: 700, color: "#1a2a3a", marginBottom: 6 } }, "Something went wrong"),
          React.createElement("div", { style: { fontSize: 13, color: "#5a6a78", lineHeight: 1.5, marginBottom: 16 } }, "The app hit an unexpected error and stopped rendering. Your saved schedule is safe - reloading should recover it. If it keeps happening, export a JSON backup from the Settings tab and note what you were doing."),
          React.createElement("div", { style: { fontFamily: (typeof mono !== "undefined" ? mono : "monospace"), fontSize: 11, color: "#a04040", background: "#fcecec", border: "1px solid #f0d0d0", borderRadius: 6, padding: "8px 10px", marginBottom: 16, wordBreak: "break-word", textAlign: "left" } }, msg),
          React.createElement(
            "button",
            { onClick: function () { try { window.location.reload(); } catch (e) { /* reload blocked */ } }, style: { background: "linear-gradient(135deg,#1a6fa8,#2488c8)", border: "1px solid #1a6fa8", color: "#fff", borderRadius: 8, padding: "10px 22px", fontSize: 14, fontWeight: 600, cursor: "pointer", fontFamily: (typeof font !== "undefined" ? font : "system-ui, sans-serif") } },
            "Reload app"
          )
        )
      );
    }
    return this.props.children;
  }
}

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(React.createElement(ErrorBoundary, null, React.createElement(CallSchedule)));
  </script>
</body>
