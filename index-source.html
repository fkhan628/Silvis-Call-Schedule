// Human wording for rules.js reason codes. The raw code stays visible in the
// dropdown label (it matches docs/SILVIS-CALL-RULES.md and the regression
// test); this adds the plain-English gloss shown beside it.
const REASON_WORDS = {
  "external-cover": "primary is covered externally", "inactive": "inactive on the roster",
  "unavailable-row": "stated unavailable", "no-backup-row": "stated no backup", "backup-only-row": "stated backup only",
  "east-busy": "on East (Davenport) call", "day-before-vacation": "vacation starts the next morning",
  "weekend-block-only": "weekends only as a full Fri-Sun block", "day-before-aledo": "Aledo clinic the next day",
  "whitelist-month": "not on this month's stated list", "outside-available-weeks": "outside the listed weeks",
  "outside-window": "outside the availability window", "not-recurring-available": "not a recurring available day",
  "holds-other-role": "already holds the other role that day", "unknown-surgeon": "not on the roster", "bad-role": "unknown role",
  "backup-opt-out": "does not take backup", "external-surgeon": "outside surgeon (written in by hand)",
  "derived-lock-held": "East week slot belongs to someone else", "rules-error": "eligibility check failed",
  // soft vocabulary (softTag falls back here) - Prompt 12 L / N / A, 9/22
  "weekend-primary": "weekend primary block (contribution bonus)", "weekend-backup": "weekend backup (contribution penalty)",
  "window-week-below-target": "at or under the window-week target", "window-week-over-target": "over the window-week target",
  "consecutive-primary": "consecutive primary days (prefers alternate days)", "long-run": "long any-role run",
};
// Read an AUTHENTICATED-ONLY table (shift_trade_requests, notifications: RLS
// 'to authenticated'). db.query reads with dbReadHeaders(), which falls back
// to the ANON key when the stored token is expired - RLS then answers
// 200 + [] and a caller that adopts it wipes its list (a failed read dressed
// as an empty one). So: no fresh token -> no read; returns null ("not read"),
// never []. A 401 on a sent token still throws inside db.query. (datalayer-001)
async function readAuthOnlyTable(table, opts) {
  let token = null;
  try { token = localStorage.getItem("silvis-auth-token"); } catch (e) { console.warn(table + ": session token read failed", e); token = null; }
  if (!token || !jwtIsFresh(token)) {
    console.warn(table + ": read skipped - the session token is missing or expired; an anon read would answer 200 + [] and wipe the current list (kept as is until the session refreshes)");
    return null;
  }
  const rows = await db.query(table, opts);
  return Array.isArray(rows) ? rows : null;
}
function reasonLabel(code, nameOf) {
  const s = String(code || ""); const i = s.indexOf(":");
  const key = i < 0 ? s : s.slice(0, i); const arg = i < 0 ? "" : s.slice(i + 1);
  const who = (id) => (typeof nameOf === "function" ? nameOf(id) : id);
  switch (key) {
    case "rules-unavailable": return "the rules have not loaded yet - try again in a moment" + (arg ? " (" + arg + ")" : "");
    case "rules-error": return "eligibility check failed: " + arg;
    case "unit-split": return "part of the " + arg + " - trade the whole unit";
    case "slot-locked": return "slot locked to " + who(arg);
    case "derived-lock": return "East week: Silvis " + arg + " that week";
    case "derived-lock-held": return "East week slot belongs to " + who(arg);
    case "hard-never-weekday": return "never on " + arg;
    case "recurring-unavailable": return "recurring unavailable on " + arg;
    case "weekday-not-allowed": return arg + " is not one of the allowed weekdays";
    case "weekday-pattern": return "weekday pattern excludes " + arg;
    case "holiday-opt-out": return "opted out of " + arg;
    case "time-off": return "on vacation";
    case "east-forecast-busy": return "East forecast " + Math.round(Number(arg) * 100) + "% (treated as busy)";
    case "monthly-cap": return "monthly cap of " + arg + " reached";
    case "max-consecutive": return "more than " + arg + " consecutive days";
    case "backup-cap": return "backup cap of " + arg + " per month reached";
    case "backup-weekend-cap": return "backup weekend cap of " + arg + " reached";
    case "max-major-holidays": return "already holds " + arg + " major holiday(s) in 12 months";
    default: return REASON_WORDS[key] ? REASON_WORDS[key] + (arg ? " (" + arg + ")" : "") : s;

}
// Compact tag for a soft penalty ("avoid: Tue", "preferred", "East 25%").
function softTag(soft) {
  const s = String(soft && soft.reason || ""); const i = s.indexOf(":");
  const key = i < 0 ? s : s.slice(0, i); const arg = i < 0 ? "" : s.slice(i + 1);

// East status lines for one day, per surgeon with an East feature (data-driven
// from ctxInputs.eastMeta): published busy / forecast p / clear / unknown for
// busy-days surgeons, derived Silvis role for derived-week surgeons.
function eastStatusLines(ctx, ctxInputs, day, nameOf) {
  const out = [];
  const meta = (ctxInputs && ctxInputs.eastMeta) || {};
  Object.keys(meta).forEach(id => {
    const m = meta[id]; const P = ctx && ctx.per ? ctx.per[id] : null; const name = nameOf(id);
    if (m.busyDays) {
      // Prompt 12 V: a standing East day (surgeonRules.<id>.eastStanding, every year) is known whatever the feed says
      const standing = P && P.eastStanding && P.eastStanding.size ? P.eastStanding.get(day.slice(5)) : null;
      if (standing) out.push({ id, text: name + ": East call (standing rule: " + standing + ", every year) - Silvis primary blocked", tone: "busy" });
      else if (!m.eastId) out.push({ id, text: name + ": East id unresolved - status unknown", tone: "warn" });
      else if (P && P.eastBusy.has(day)) out.push({ id, text: name + ": East call (" + (P.eastOverrides && P.eastOverrides[day] === true ? "override" : "published") + ") - Silvis primary blocked", tone: "busy" });
      else {
        // Prompt 12 C (9/22): published > override > forecast - inside the published
        // coverage the forecast is never consulted, and an override busy:false clears
        // the day whatever the feed or forecast says.
        const ovFree = !!(P && P.eastOverrides && P.eastOverrides[day] === false);
        const covered = !!(ctx && ctx.eastCoverage && day >= ctx.eastCoverage.from && day <= ctx.eastCoverage.to);
        const p = (!covered && !ovFree && P && P.eastForecast) ? P.eastForecast[day] : undefined;
        if (ovFree) out.push({ id, text: name + ": no East call (override: force clear)", tone: "ok" });
        else if (covered) out.push({ id, text: name + ": no East call (published)", tone: "ok" });
        else if (typeof p === "number") out.push({ id, text: name + ": East forecast " + Math.round(p * 100) + "% (" + (p >= ctx.forecastThreshold ? "treated as busy" : "below the " + Math.round(ctx.forecastThreshold * 100) + "% threshold") + ")", tone: p >= ctx.forecastThreshold ? "busy" : "ok" });
        else out.push({ id, text: name + ": East unknown (no published week or forecast for this day)", tone: "warn" });
      }
    }
    if (m.derivedWeeks && P) {
      const dRole = P.derived[day];
      if (dRole) out.push({ id, text: name + ": East week -> Silvis " + dRole + " (derived)", tone: "busy" });
      else if (P.eastDays.has(day)) out.push({ id, text: name + ": on East call this week (not derived - before the derive-from date)", tone: "warn" });
      else out.push({ id, text: name + ": no East week", tone: "ok" });
    }
  });
  return out;
}

// Prompt 12 B: a LOCKED day whose schedule_days note starts with this marker (importer.js writes it for an
// existingAssignments row flagged awaitingConfirmation - the four Thanksgiving rows) is a lock the scheduler still
// has to re-confirm. The month grid and the day editor show a small "confirm" badge on it; nothing else changes
// (the lock stays a lock until it is edited). Same literal as importer.js IMP_AWAITING_MARKER, pinned by

// that needed an override puts the app's own '[override: ...] ' tag in front of the note (saveDayEdit) - the predicate

// --- Day editor (Slice D) ---
// Module scope so a parent re-render never remounts it mid-edit (the parent
// keys it by day, so moving to another day starts a fresh draft). Every
// dropdown option is evaluated through eligibility() on a DRAFT ctx: the
// app's ctxInputs with this day's draft swapped in, so the OTHER role's
// current pick counts ("holds-other-role") and a lock toggled off in the
// draft stops blocking. Ineligible options stay selectable for the scheduler
// but only through the Override panel, which lists ALL hard reasons; the
// overrides ride along to onSave (note prefix + audit). Non-schedulers get
// the read-only detail. Esc closes; Left/Right arrows move a day when the
// draft is clean and focus is not in a field.
function DayEditor(props) {
  const { day, entry, roster, ctxInputs, ctxError, canEdit, rulesImported, isPublicMode, nameOf, codeOf, colorOf, mySurgeon, vacationNames, onSave, onCancel, onNav, onTrade, css, dk, focusExternal } = props;
  // focusExternal (optional): the Open shifts board's 'Outside cover' opened
  // this editor - put the caret in the external-cover input (the write still
  // goes through Save below).
  const externalRef = React.useRef(null);
  React.useEffect(() => {
    if (!focusExternal || !externalRef.current) return;
    try { externalRef.current.focus(); externalRef.current.scrollIntoView({ block: "center" }); } catch (e) { console.warn("focusExternal: could not focus the external-cover input", e); }
  }, [focusExternal, day]);
  const opened = React.useMemo(() => ({ ...emptyDayAssignment(), ...(entry || {}) }), [day]); // eslint-disable-line
  const [draft, setDraft] = React.useState(opened);
  const [overrides, setOverrides] = React.useState([]);   // [{ id, role, reasons }]
  const [pending, setPending] = React.useState(null);     // { id, role, reasons } awaiting the Override confirm
  const [hint, setHint] = React.useState("");
  const [info, setInfo] = React.useState("");   // M: the hand-written outside-surgeon note (an info line, never the red error hint)
  const extInfo = (name) => name + " is an outside surgeon - written in by hand and locked; the generator never moves it.";
  const norm = (a) => JSON.stringify(assignmentToDayRow(day, a));
  const dirty = norm(draft) !== norm(opened);

  const draftState = React.useMemo(() => safeBuildContext({ ...ctxInputs, schedule: { ...ctxInputs.schedule, [day]: { ...draft, source: draft.source || "manual" } } }), [ctxInputs, day, draft]);
  const ctx = draftState.ctx;
  const hol = ctx ? isHolidayDay(ctx, day) : null;
  const east = ctx ? eastStatusLines(ctx, ctxInputs, day, nameOf) : [];
  // Small items (9/22): the Fri/Sat/Sun triple this day belongs to (null on Mon-Thu, or
  // when any of the three days is a holiday-unit day - a holiday unit is not a weekend
  // unit). A candidate who holds the OTHER two days of it in the role being asked about
  // (ctxInputs.schedule - the saved rows) is evaluated as a full-block member, as the
  // generator evaluates a block, so Fierce can complete a Fri-Sun block by hand.
  const editorBlockDays = React.useMemo(() => {
    const dow = parse(day).getDay();
    const idx = dow === 5 ? 0 : dow === 6 ? 1 : dow === 0 ? 2 : -1;
    if (idx < 0) return null;
    const fri = addD(parse(day), -idx);
    const days = [0, 1, 2].map(i => fmt(addD(fri, i)));
    if (ctx && ctx.holidayByDay && days.some(d => ctx.holidayByDay[d])) return null;
    return days;
  }, [day, ctx]);
  const holdsOtherBlockDays = (role, id) => !!editorBlockDays && editorBlockDays.every(d => d === day || !!(ctxInputs.schedule && ctxInputs.schedule[d] && ctxInputs.schedule[d][role] === id));
  const evalRole = (role) => {
    const list = roster.map(s => {
      const external = s.type === "external";
      let r;
      // Prompt 12 M: an outside surgeon is asked on the manual path (slot facts only, never external-surgeon);
      // a pool surgeon completing a Fri-Sun block is asked as a block member (small items 9/22)
      const eopts = external ? { manual: true } : (holdsOtherBlockDays(role, s.id) ? { asBlockMember: true } : undefined);
      try { r = ctx ? eligibility(ctx, day, role, s.id, eopts) : { ok: true, hard: [], soft: [] }; }
      catch (e) {
        // fail CLOSED (small items 9/22): a thrown check makes the option ineligible with the error as its
        // reason, and evalBroken (below) disables Save until the rules evaluate again - never a silent ok
        console.warn("eligibility threw for", s.id, role, day, e);
        const msg = String(e && e.message || e).slice(0, 120);
        r = { ok: false, hard: ["rules-error:" + msg], soft: [], error: msg };
      }
      return { id: s.id, name: s.name, code: s.code, active: s.active !== false, external, ok: !!r.ok, hard: r.hard || [], soft: r.soft || [], lockHolder: !!r.lockHolder, conflicts: r.conflicts || [], error: r.error || null, eastStanding: r.eastStanding || null }; // eastStanding: Prompt 12 V - the standing East entry's name behind an east-busy
    });
    // pool: eligible first, then ineligible (roster order kept inside each group); inactive only if currently held;
    // outside surgeons (M) come last as their own group - the select shows them under "Outside surgeons"
    const pool = list.filter(o => !o.external), ext = list.filter(o => o.external);
    return pool.filter(o => o.active && o.ok).concat(pool.filter(o => o.active && !o.ok)).concat(pool.filter(o => !o.active && o.id === draft[role]))
      .concat(ext.filter(o => o.active || o.id === draft[role]));
  };
  const opts = React.useMemo(() => ({ primary: evalRole("primary"), backup: evalRole("backup") }), [ctx, day, draft, roster]); // eslint-disable-line
  // Small items (9/22): any option whose check THREW -> the error is shown and Save is disabled (fail closed).
  const evalErrors = [].concat(opts.primary, opts.backup).filter(o => o.error);
  const evalBroken = evalErrors.length > 0;

  const pick = (role, value) => {
    setHint(""); setInfo("");
    if (!value) { setDraft(d => ({ ...d, [role]: null })); setOverrides(o => o.filter(x => x.role !== role)); return; }
    const opt = opts[role].find(o => o.id === value);
    // a thrown check is not overridable - the error is shown; Save stays disabled while evalBroken
    if (opt && opt.error) { setHint("Eligibility check failed for " + opt.name + " (" + opt.error + ") - nobody can be assigned until the rules evaluate again."); return; }
    if (opt && !opt.ok) { setPending({ id: value, role, reasons: opt.hard.slice() }); return; }
    // Prompt 12 M: an outside surgeon is written in by hand - the role locks with the pick and the save
    // carries source manual-external (saveDayEdit reads the roster type). His only blocks are slot facts
    // (locked to someone else, holds the other role), which take the ordinary override path above.
    const external = !!(opt && opt.external);
    setDraft(d => ({ ...d, [role]: value, ...(external ? { [role + "Locked"]: true } : {}), ...(role === "primary" ? { externalCover: null } : {}) }));
    setOverrides(o => o.filter(x => x.role !== role));
    if (external) setInfo(extInfo(opt.name));
  };
  const confirmOverride = () => {
    if (!pending) return;
    const p = pending;
    // M (review 9/22): an outside surgeon written in over a slot fact (locked to someone else, holds the other
    // role) locks the role and shows the note exactly like a plain pick.
    const opt = opts[p.role].find(o => o.id === p.id);
    const external = !!(opt && opt.external);
    setDraft(d => ({ ...d, [p.role]: p.id, ...(external ? { [p.role + "Locked"]: true } : {}), ...(p.role === "primary" ? { externalCover: null } : {}) }));
    setOverrides(o => o.filter(x => x.role !== p.role).concat([p]));
    setPending(null);
    if (external) setInfo(extInfo(opt.name));
  };
  const clearRole = (role) => {
    if (draft[role + "Locked"]) { setHint((role === "primary" ? "Primary" : "Backup") + " is locked - unlock it first."); return; }
    pick(role, "");
  };
  const toggleLock = (role) => setDraft(d => ({ ...d, [role + "Locked"]: !d[role + "Locked"] }));
  const save = () => {
    if (evalBroken) { setHint("Eligibility check failed - saving is disabled until the rules evaluate again."); return; }
    if (!dirty) { onCancel(); return; }
    if (draft.primary && draft.primary === draft.backup) { setHint("Primary and backup must be different people."); return; }
    onSave({ ...draft }, { overrides });
  };
  React.useEffect(() => {
    const onKey = (e) => {
      if (e.key === "Escape") { e.preventDefault(); if (pending) setPending(null); else onCancel(); return; }
      const tag = (e.target && e.target.tagName || "").toLowerCase();
      if (tag === "input" || tag === "textarea" || tag === "select") return;
      if (e.key === "ArrowLeft" || e.key === "ArrowRight") {
        e.preventDefault();
        if (dirty) { setHint("Save or cancel your changes before moving to another day."); return; }
        onNav(e.key === "ArrowLeft" ? -1 : 1);
      }
    };
    window.addEventListener("keydown", onKey);
    return () => window.removeEventListener("keydown", onKey);
  }, [pending, dirty, onCancel, onNav]);

  const dt = parse(day);
  const title = DAY_HDR[dt.getDay()] + " " + MO[dt.getMonth()] + " " + dt.getDate() + ", " + dt.getFullYear();
  const panelBg = dk ? "#16213e" : "#ffffff";
  const text = dk ? "#e0e0f0" : "#2c3e50";
  const sub = dk ? "#8a8aaa" : "#7a8a98";
  const border = dk ? "#2a3a5e" : "#e0e4ea";
  const inp = { ...css.inp, ...(dk ? { background: "#0f3460", border: "1px solid #2a3a5e", color: "#e0e0f0" } : {}) };
  const label = { fontSize: 10, color: sub, fontWeight: 700, textTransform: "uppercase", letterSpacing: 0.5, display: "block", marginBottom: 3 };
  const pill = (id) => { const c = colorOf(id); return <span style={{background:c.tg,color:c.tx,border:"1px solid " + c.bd,borderRadius:5,padding:"1px 8px",fontSize:12,fontWeight:700}}>{nameOf(id)}</span>; };
  const holderView = (role) => {
    const v = role === "primary" ? (draft.primary || (draft.externalCover ? "ext:" + draft.externalCover : null)) : draft.backup;
    if (!v) return <span style={{color:"#c04040",fontWeight:800}}>OPEN</span>;
    if (String(v).indexOf("ext:") === 0) return <span style={{fontStyle:"italic",color:sub}}>{String(v).slice(4)} (external cover)</span>;
    return pill(v);
  };
  const myRole = mySurgeon && entry ? (entry.primary === mySurgeon ? "primary" : entry.backup === mySurgeon ? "backup" : null) : null;
  const optionLabel = (o) => {
    if (!o.ok) return o.name + " - " + (o.hard[0] || "ineligible");
    const tags = o.soft.map(softTag).filter(Boolean);
    return o.name + (o.lockHolder ? " (locked holder)" : "") + (tags.length ? " (" + tags.join(", ") + ")" : "");
  };
  const roleBlock = (role) => {
    const list = opts[role];
    const locked = !!draft[role + "Locked"];
    const cur = list.find(o => o.id === draft[role]) || null;
    const ineligible = list.filter(o => !o.ok);
    const ov = overrides.find(x => x.role === role);
    return (
      <div data-testid={"editor-" + role + "-block"} style={{border:"1px solid " + border,borderRadius:8,padding:"10px 12px",marginBottom:10,background: dk ? "#1a2540" : "#fafbfc"}}>
        <div style={{display:"flex",alignItems:"center",gap:8,flexWrap:"wrap",marginBottom:6}}>
          <span style={{...label,marginBottom:0,minWidth:60}}>{role === "primary" ? "Primary" : "Backup"}</span>
          {holderView(role)}
          {locked && <Padlock title={role + " locked"} size={11}/>}
          {locked && awaitingConfirmation(opened) && <span data-testid="confirm-badge" title="awaiting the scheduler's confirmation" style={confirmBadgeStyle}>confirm</span>}
          {cur && cur.external && <span data-testid={"editor-" + role + "-external-tag"} style={{fontSize:10,color:sub,fontWeight:700}}>outside surgeon - written in by hand</span>}
          {cur && cur.lockHolder && cur.conflicts.length > 0 && <span title={cur.conflicts.join(", ")} style={{fontSize:10,color:"#8a5a10",fontWeight:700}}>locked holder breaks: {cur.conflicts.map(c => reasonLabel(c, nameOf)).join("; ")}</span>}
          {ov && <span data-testid={"override-tag-" + role} style={{fontSize:10,color:"#a83232",fontWeight:700}}>override: {ov.reasons.join(", ")}</span>}
        </div>
        {canEdit && (
          <div style={{display:"flex",gap:8,alignItems:"center",flexWrap:"wrap"}}>
            <select data-testid={"editor-" + role} aria-label={role} value={draft[role] || ""} disabled={locked} onChange={e => pick(role, e.target.value)} style={{...inp,minWidth:230,fontSize:13,opacity:locked?0.6:1}}>
              <option value="" data-eligible="true">{role === "primary" && draft.externalCover ? draft.externalCover + " (external cover)" : "OPEN"}</option>
              {list.filter(o => !o.external).map(o => (
                <option key={o.id} value={o.id} data-eligible={o.ok ? "true" : "false"} style={o.ok ? {} : {color:"#a0a8b0"}}>{optionLabel(o)}</option>
              ))}
              {list.some(o => o.external) && (
                <optgroup label="Outside surgeons" data-testid={"editor-" + role + "-externals"}>
                  {list.filter(o => o.external).map(o => (
                    <option key={o.id} value={o.id} data-eligible={o.ok ? "true" : "false"} style={o.ok ? {} : {color:"#a0a8b0"}}>{optionLabel(o)}</option>
                  ))}
                </optgroup>
              )}
            </select>
            <label style={{display:"flex",alignItems:"center",gap:4,fontSize:11,color:sub,cursor:"pointer"}}>
              <input type="checkbox" data-testid={"editor-lock-" + role} checked={locked} onChange={() => toggleLock(role)}/> Lock {role}
            </label>
            <button type="button" data-testid={"editor-clear-" + role} onClick={() => clearRole(role)} disabled={locked || !draft[role]} title={locked ? "Unlock first" : "Set to OPEN"} style={{...css.btn(false),padding:"4px 10px",fontSize:11,opacity:(locked || !draft[role])?0.5:1}}>Clear</button>
          </div>
        )}
        {canEdit && cur && cur.ok && cur.soft.length > 0 && (
          <div style={{fontSize:11,color:"#8a5a10",marginTop:5}}>Soft penalties for {cur.name}: {cur.soft.map(softTag).join(", ")}</div>
        )}
        {canEdit && ineligible.length > 0 && (
          <div data-testid={"editor-" + role + "-reasons"} style={{fontSize:11,color:sub,marginTop:6,lineHeight:1.5}}>
            <span style={{fontWeight:700}}>Not eligible:</span> {ineligible.map(o => o.name + " - " + reasonLabel(o.hard[0], nameOf) + (o.eastStanding && o.hard[0] === "east-busy" ? " (standing rule: " + o.eastStanding + ", every year)" : "")).join("; ")}
          </div>
        )}
      </div>
    );
  };

  return (
    <div data-testid="day-editor" onClick={onCancel} style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.45)",display:"flex",alignItems:"center",justifyContent:"center",zIndex:9500,padding:14}}>
      <div role="dialog" aria-modal="true" aria-label={"Day editor " + day} onClick={e => e.stopPropagation()} style={{background:panelBg,color:text,borderRadius:12,padding:"16px 18px",maxWidth:600,width:"100%",maxHeight:"92vh",overflowY:"auto",boxShadow:"0 8px 32px rgba(0,0,0,0.25)",fontFamily:font}}>
        <div style={{display:"flex",alignItems:"center",gap:6,marginBottom:8}}>
          <button type="button" aria-label="Previous day" onClick={() => { if (dirty) setHint("Save or cancel your changes before moving to another day."); else onNav(-1); }} style={{...css.btn(false),minWidth:34,padding:"4px 8px"}}>&lsaquo;</button>
          <h3 data-testid="editor-title" style={{margin:0,fontSize:16,color:text,flex:1,textAlign:"center"}}>{title}</h3>
          <button type="button" aria-label="Next day" onClick={() => { if (dirty) setHint("Save or cancel your changes before moving to another day."); else onNav(1); }} style={{...css.btn(false),minWidth:34,padding:"4px 8px"}}>&rsaquo;</button>
          <button type="button" aria-label="Close" onClick={onCancel} style={{background:"none",border:"none",color:sub,fontSize:20,cursor:"pointer",padding:"0 4px",marginLeft:4}}>x</button>
        </div>
        <div style={{fontSize:12,color:sub,lineHeight:1.6,marginBottom:10}}>
          <div>{hol ? <><span style={{fontWeight:700,color:"#8a6a10"}}>{hol.name}</span> holiday unit ({hol.tier}): {hol.days.map(fmtMD).join(", ")} - one primary and one backup stick through the unit.</> : "Not in a holiday unit."}</div>
          {east.length === 0 ? <div>East: {rulesImported ? "no East features configured" : "rules not imported yet"}</div> : east.map(l => <div key={l.id + l.text} data-testid="east-status" style={{color: l.tone === "busy" ? "#a83232" : l.tone === "warn" ? "#8a5a10" : sub}}>East - {l.text}</div>)}
          <div>Vacations: {vacationNames.length ? vacationNames.join(", ") : "nobody off"}</div>
          {ctxError && <div style={{color:"#a83232",fontWeight:700}}>Eligibility unavailable: {ctxError}</div>}
          {!rulesImported && <div>Rules not imported yet - eligibility reflects locks, vacations and availability rows only.</div>}
          {entry && entry.source && <div>Source: {entry.source}</div>}
        </div>

        {roleBlock("primary")}
        {roleBlock("backup")}

        {pending && (
          <div data-testid="override-confirm" role="alertdialog" style={{border:"1px solid #c05050",background: dk ? "#3a1a1a" : "#fdeaea",borderRadius:8,padding:"10px 12px",marginBottom:10}}>
            <div style={{fontSize:13,fontWeight:800,color:"#a83232",marginBottom:4}}>{nameOf(pending.id)} is not eligible for {pending.role} on {fmtMD(day)}</div>
            <ul style={{margin:"0 0 8px",paddingLeft:18,fontSize:12,color: dk ? "#e0b0b0" : "#8a3030",lineHeight:1.5}}>
              {pending.reasons.map(r => <li key={r}><span style={{fontFamily:mono}}>{r}</span> - {reasonLabel(r, nameOf)}</li>)}
            </ul>
            <div style={{fontSize:11,color:sub,marginBottom:8}}>Overriding assigns anyway and prefixes the day's note with [override: ...]; the audit log records it.</div>
            <div style={{display:"flex",gap:8,justifyContent:"flex-end"}}>
              <button type="button" onClick={() => setPending(null)} style={{...css.btn(false),padding:"5px 12px",fontSize:12}}>Keep as is</button>
              <button type="button" data-testid="override-accept" onClick={confirmOverride} style={{...css.btn(true),padding:"5px 12px",fontSize:12,background:"linear-gradient(135deg,#a83232,#c04a4a)",borderColor:"#a83232"}}>Override and assign</button>
            </div>
          </div>
        )}

        {canEdit ? (
          <div style={{display:"flex",gap:10,flexWrap:"wrap",marginBottom:10}}>
            <div style={{flex:"1 1 200px"}}>
              <label style={label}>Note</label>
              <input data-testid="editor-note" value={draft.note || ""} onChange={e => setDraft(d => ({ ...d, note: e.target.value }))} placeholder="operational note (shown on the day)" style={{...inp,width:"100%"}}/>
            </div>
            <div style={{flex:"1 1 160px"}}>
              <label style={label}>External cover (primary)</label>
              <input data-testid="editor-external" ref={externalRef} value={draft.externalCover || ""} disabled={!!draft.primary} onChange={e => setDraft(d => ({ ...d, externalCover: e.target.value }))} placeholder={draft.primary ? "clear primary to use" : "e.g. Atwell"} title="Someone outside the roster covering primary; counts toward nobody's tally" style={{...inp,width:"100%",opacity:draft.primary?0.6:1}}/>
            </div>
          </div>
        ) : (
          <div style={{fontSize:12,color:sub,marginBottom:10}}>{draft.note ? <>Note: {draft.note}</> : "No note."}</div>
        )}

        {info && <div role="status" data-testid="editor-info" style={{fontSize:12,color:sub,fontWeight:600,marginBottom:8}}>{info}</div>}
        {evalBroken && <div role="alert" data-testid="editor-eval-error" style={{fontSize:12,color:"#a83232",fontWeight:700,marginBottom:8}}>Eligibility check failed for {Array.from(new Set(evalErrors.map(o => o.name))).join(", ")}: {evalErrors[0].error} - saving is disabled until the rules evaluate again (reload the page; if it persists, tell the scheduler).</div>}
        {hint && <div role="status" data-testid="editor-hint" style={{fontSize:12,color:"#a83232",fontWeight:700,marginBottom:8}}>{hint}</div>}
        {/* Sticky footer: the Cancel / Save row stays in view while the dialog body scrolls (a phone showed it below the fold - Prompt 11). */}
        <div data-testid="editor-footer" style={{display:"flex",alignItems:"center",gap:8,flexWrap:"wrap",position:"sticky",bottom:-16,background:panelBg,margin:"0 -18px -16px",padding:"8px 18px 12px",borderTop:"1px solid " + border}}>
          {!isPublicMode && (canEdit || myRole) && (
            <button type="button" data-testid="editor-trade" onClick={() => onTrade(day, myRole || (entry && entry.primary ? "primary" : "backup"))} style={{background:"none",border:"none",color:"#1a6fa8",fontSize:12,cursor:"pointer",fontFamily:font,textDecoration:"underline",padding:0}}>Propose a trade for this day</button>
          )}
          <span style={{flex:1}}/>
          <span style={{fontSize:10,color:sub}}>Esc closes - arrow keys move a day</span>
          <button type="button" onClick={onCancel} style={{...css.btn(false),padding:"7px 14px",fontSize:12}}>{canEdit ? "Cancel" : "Close"}</button>
          {canEdit && <button type="button" data-testid="editor-save" onClick={save} disabled={!dirty || evalBroken} title={evalBroken ? "Eligibility check failed - saving is disabled" : undefined} style={{...css.btn(true),padding:"7px 16px",fontSize:12,opacity:(dirty && !evalBroken)?1:0.5}}>Save</button>}
        </div>
      </div>
    </div>
  );
}

// ===================== SETUP VIEW COMPONENTS (Prompt 6 Slice E) =====================
// Module scope on purpose: a parent re-render (a 60s refresh, a realtime row)
// never remounts them, so an unsaved draft - a roster row, a rules form, a
// holiday list, a pasted date list - survives. Each card gets its data and its
// write callbacks from CallSchedule; no card talks to Supabase directly. Every
// rule field here is DATA in surgeonRules / groupRules (rules.js reads it);
// nothing is keyed on a surgeon's name.
const SU_WEEKDAYS = ["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"];
const SU_HOLIDAY_NAMES = ["New Year's", "Memorial Day", "July 4th", "Labor Day", "Thanksgiving", "Christmas"];
const SU_MODES = ["", "weekends-plus-weekdays", "whitelist-recurring", "blacklist-recurring", "whitelist-weeks", "whitelist-windows", "derived-from-east-plus-weekday-pattern"];
const SU_AVAIL_KINDS = ["available", "unavailable", "avoid", "prefer", "backup_only", "no_backup"];
const SU_CONTACT_KEY = /e-?_?mail|phone|contact|mobile|cell/i;
const SU_CONTACT_VALUE = /[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}|(?:\+?1[-. ]?)?\(?\b\d{3}\)?[-. ]\s?\d{3}[-. ]\d{4}\b/;
// Prompt 12 M: an outside surgeon's roster note is the one roster string that reaches the anon-readable
// blob - operational wording only. Same word list as importer.js IMP_NOTE_DENYLIST (item F).
const SU_NOTE_DENYLIST = /\b(family|families|wife|husband|kid|kids|child|children|daughter|son|parents|in-laws|school|medical|maternity|hosts|hosting|illness|funeral)\b/i;
function suClone(v) { return v === undefined ? undefined : JSON.parse(JSON.stringify(v)); }
function suNumOrNull(v) { if (v === "" || v === null || v === undefined) return null; const n = Number(v); return isNaN(n) ? null : n; }
function suIntList(text) { return String(text || "").split(/[,\s]+/).map(t => t.trim()).filter(Boolean).map(Number).filter(n => Number.isInteger(n) && n >= 1 && n <= 6); }
function suIsoList(text) { return String(text || "").split(/[,\s;]+/).map(t => t.trim()).filter(Boolean); }
// Any key named like contact data, or any value that looks like an address or
// phone number, anywhere in an object (the blob is anon-readable - guide 3.1).
function suContactPaths(obj, path, out) {
  out = out || []; path = path || "";
  if (obj == null) return out;
  if (typeof obj === "string") { if (SU_CONTACT_VALUE.test(obj)) out.push(path || "(value)"); return out; }
  if (typeof obj !== "object") return out;
  if (Array.isArray(obj)) { obj.forEach((v, i) => suContactPaths(v, path + "[" + i + "]", out)); return out; }
  Object.keys(obj).forEach(k => { const p = path ? path + "." + k : k; if (SU_CONTACT_KEY.test(k)) out.push(p); suContactPaths(obj[k], p, out); });
  return out;
}
function suPatternKind(p) {
  if (!p) return "every";
  if (p.dates) return "dates";
  if (p.nth !== undefined && p.nth !== null) return "nth";
  if (p.nthWeekOfMonth !== undefined && p.nthWeekOfMonth !== null) return "week";
  if (p.beforeNthMonday !== undefined && p.beforeNthMonday !== null) return "before";
  return "every";
}
function suPatternValueText(p) {

// --- Roster (names / codes only; no contact fields by design) ---
function RosterEditor({ css, roster, schedule, availabilityRows, timeOffRows, onSave, showToast }) {
  const [rows, setRows] = React.useState(() => suClone(roster || []));
  const [dirty, setDirty] = React.useState(false);
  React.useEffect(() => { if (!dirty) setRows(suClone(roster || [])); }, [roster]); // eslint-disable-line
  const inp = { ...css.inp, padding: "3px 6px", fontSize: 12 };
  const edit = (i, k, v) => { setDirty(true); setRows(r => r.map((x, j) => j === i ? { ...x, [k]: v } : x)); };
  const referenced = (id) => {
    const sched = schedule || {};
    return Object.keys(sched).some(d => sched[d] && (sched[d].primary === id || sched[d].backup === id)) || (availabilityRows || []).some(r => r.person_id === id) || (timeOffRows || []).some(r => r.person_id === id);
  };
  const add = () => {
    const used = new Set(rows.map(r => r.id));
    let n = 1; while (used.has("s" + n)) n++;
    setDirty(true); setRows(r => [...r, { id: "s" + n, name: "", code: "", fullName: "", active: true, roles: ["surgeon"] }]);
  };
  // Prompt 12 M: an outside surgeon (internal locum) - ids x1, x2, ...; type "external"; no account needed.
  // Written in by hand in the day editor, never generated, tallied under its own heading in Totals.
  const addExternal = () => {
    const used = new Set(rows.map(r => r.id));
    let n = 1; while (used.has("x" + n)) n++;
    setDirty(true); setRows(r => [...r, { id: "x" + n, name: "", code: "", fullName: "", active: true, roles: ["surgeon"], type: "external", note: "" }]);
  };
  const remove = (i) => {
    const r = rows[i];
    if (referenced(r.id)) { showToast(`${r.name || r.id} is referenced by schedule days, availability or vacations - set Active off instead of removing.`, "error"); return; }
    setDirty(true); setRows(list => list.filter((_, j) => j !== i));
  };
  const save = () => {
    const ids = new Set(), codes = new Set();
    for (const r of rows) {
      const isExt = r.type === "external";
      if (!(isExt ? /^x\d+$/ : /^s\d+$/).test(String(r.id || ""))) { showToast(isExt ? `Outside-surgeon id "${r.id}" must look like x1, x2, ...` : `Roster id "${r.id}" must look like s1, s2, ...`, "error"); return; }
      if (!String(r.name || "").trim() || !String(r.code || "").trim()) { showToast(`Roster entry ${r.id} needs a last name and a code.`, "error"); return; }
      if (ids.has(r.id)) { showToast(`Roster id ${r.id} is used twice.`, "error"); return; }
      const c = String(r.code).trim().toUpperCase();
      if (codes.has(c)) { showToast(`Roster code ${c} is used twice.`, "error"); return; }
      ids.add(r.id); codes.add(c);
    }
    const clean = rows.map(r => {
      const base = { id: r.id, name: String(r.name).trim(), code: String(r.code).trim().toUpperCase(), fullName: String(r.fullName || "").trim(), active: r.active !== false, roles: Array.isArray(r.roles) ? r.roles : String(r.roles || "surgeon").split(/[,\s]+/).filter(Boolean) };
      if (r.type !== "external") return base;
      const note = String(r.note || "").trim();
      return { ...base, type: "external", ...(note ? { note } : {}) };
    });
    const badNote = clean.find(r => r.note && SU_NOTE_DENYLIST.test(r.note));
    if (badNote) { showToast(`Refused: the note for ${badNote.name || badNote.id} carries a personal word - keep roster notes operational (the setup is readable with the public key).`, "error"); return; }
    const leaks = suContactPaths(clean);
    if (leaks.length) { showToast("Refused: the roster would carry contact-looking data at " + leaks.join(", ") + " - names and codes only.", "error"); return; }
    onSave(clean); setDirty(false);
  };
  return (
    <div data-testid="roster-editor">
      <p style={{ fontSize: 12, color: "#5a6a78", margin: "0 0 8px", lineHeight: 1.5 }}>Names and codes only - the schedule stores ids, the calendar shows last names, narrow cells show the code. Contact details never live here (accounts are linked under Users; addresses stay in Supabase Auth). Outside surgeons (internal locums, 9/22) get their own button: written in by hand in the day editor, never generated, tallied under their own heading; their note is operational only (no personal wording - the setup is readable with the public key).</p>
      <div className="table-wrap" style={css.tableWrap}>
        <table className="setup-table">
          <thead><tr><th>Id</th><th>Type</th><th>Last name</th><th>Code</th><th>Full name</th><th>Active</th><th>Roles</th><th>Note</th><th></th></tr></thead>
          <tbody>
            {rows.map((r, i) => (
              <tr key={r.id + ":" + i}>
                <td style={{ fontFamily: mono }}>{r.id}</td>
                <td data-testid={"roster-type-" + r.id} style={{ fontSize: 11, fontWeight: 600, color: r.type === "external" ? "#8a5a10" : "#7a8a98" }}>{r.type === "external" ? "outside" : "pool"}</td>
                <td><input type="text" data-testid={"roster-name-" + r.id} value={r.name || ""} onChange={e => edit(i, "name", e.target.value)} style={{ ...inp, width: 110 }} /></td>
                <td><input type="text" data-testid={"roster-code-" + r.id} value={r.code || ""} maxLength={4} onChange={e => edit(i, "code", e.target.value.toUpperCase())} style={{ ...inp, width: 60, fontFamily: mono }} /></td>
                <td><input type="text" value={r.fullName || ""} onChange={e => edit(i, "fullName", e.target.value)} style={{ ...inp, width: 190 }} /></td>
                <td><input type="checkbox" checked={r.active !== false} onChange={e => edit(i, "active", e.target.checked)} /></td>
                <td><input type="text" value={Array.isArray(r.roles) ? r.roles.join(", ") : (r.roles || "")} onChange={e => edit(i, "roles", e.target.value.split(/[,\s]+/).filter(Boolean))} style={{ ...inp, width: 120 }} /></td>
                <td>{r.type === "external" ? <input type="text" data-testid={"roster-note-" + r.id} value={r.note || ""} maxLength={120} onChange={e => edit(i, "note", e.target.value)} placeholder="operational note (shown here only)" title="Operational only - the setup is readable with the public key; never a personal reason" style={{ ...inp, width: 200 }} /> : <span style={{ color: "#b0b8c0", fontSize: 11 }}>-</span>}</td>
                <td><button onClick={() => remove(i)} style={css.danger} title="Remove (refused while the id is referenced)">Remove</button></td>
              </tr>
            ))}
          </tbody>
        </table>
      </div>
      <div style={{ display: "flex", gap: 8, alignItems: "center", marginTop: 8, flexWrap: "wrap" }}>
        <button onClick={add} style={css.mini(false)}>Add surgeon</button>
        <button data-testid="roster-add-external" onClick={addExternal} style={css.mini(false)} title="An outside surgeon (internal locum): written in by hand in the day editor, never generated, tallied under its own heading">Add outside surgeon</button>
        <button data-testid="roster-save" onClick={save} disabled={!dirty} style={{ ...css.btn(true), padding: "5px 14px", opacity: dirty ? 1 : 0.5 }}>Save roster</button>
        {dirty && <button onClick={() => { setRows(suClone(roster || [])); setDirty(false); }} style={css.mini(false)}>Revert</button>}
        <span style={{ fontSize: 11, color: "#7a8a98" }}>{dirty ? "Unsaved changes" : "Saved in the shared setup (autosave)."}</span>
      </div>
    </div>
  );
}

// --- Recurring pattern list with a live "next 8 matching dates" preview ---

  const setKind = (i, kind) => {
    const p = items[i]; const n = { weekday: p.weekday || "Mon" };
    if (kind === "nth") n.nth = [1]; else if (kind === "week") n.nthWeekOfMonth = 1; else if (kind === "before") n.beforeNthMonday = [2, 4]; else if (kind === "dates") { n.dates = []; delete n.weekday; }
    if (p.weight) n.weight = p.weight; if (p.note) n.note = p.note;
    update(i, n);
  };
  const setValue = (i, text) => {
    const p = { ...items[i] }; const k = suPatternKind(p);
    if (k === "nth") p.nth = suIntList(text);
    else if (k === "week") { const n = Number(text); p.nthWeekOfMonth = Number.isInteger(n) && n >= 1 && n <= 5 ? n : 1; }
    else if (k === "before") p.beforeNthMonday = suIntList(text);
    else if (k === "dates") p.dates = suIsoList(text).filter(suIsIso);

      {items.map((p, i) => {
        const kind = suPatternKind(p);
        const text = texts[i] !== undefined ? texts[i] : suPatternValueText(p);
        const next = suNextMatchingDates(typeof matchesPattern === "function" ? matchesPattern : null, p, today, 8);
        return (

              <select value={kind} onChange={e => setKind(i, e.target.value)} style={{ ...inp, width: 190 }}>

                <option value="nth">nth of the month (1-5)</option>
                <option value="week">week of month (Mon-Sun week containing the nth Wed)</option>
                <option value="before">the day before the nth Monday</option>
                <option value="dates">explicit dates</option>
              </select>
              {kind !== "every" && <input type="text" value={text} placeholder={kind === "dates" ? "2026-11-02, 2026-11-09" : kind === "week" ? "3" : "2,4"} onChange={e => { setTexts(t => ({ ...t, [i]: e.target.value })); setValue(i, e.target.value); }} style={{ ...inp, width: kind === "dates" ? 260 : 70, fontFamily: mono }} />}
              {withWeight && <select value={p.weight || "medium"} onChange={e => update(i, { ...p, weight: e.target.value })} style={{ ...inp, width: 90 }}>{["low", "medium", "strong"].map(w => <option key={w} value={w}>{w}</option>)}</select>}
              <input type="text" value={p.note || ""} placeholder="operational note (public)" onChange={e => update(i, { ...p, note: e.target.value })} style={{ ...inp, flex: "1 1 160px" }} />
              <button onClick={() => onChange(items.filter((_, j) => j !== i))} style={css.danger}>Remove</button>
            </div>
            <div data-testid="pattern-preview" style={{ fontSize: 11, color: "#5a6a78", marginTop: 4, fontFamily: mono }}>
              <span style={{ fontFamily: font, color: "#7a8a98" }}>{suPatternLabel(p)} - next 8: </span>{next.error ? <span data-testid="pattern-error" style={{ color: "#a83232", fontFamily: font }}>pattern is invalid - the rules engine refused it ({next.error})</span> : next.length ? next.join(", ") : "no matching date in the next two years"}
            </div>
          </div>
        );
      })}
      <button onClick={() => onChange([...items, { weekday: "Mon", nth: [1] }])} style={css.mini(false)}>Add pattern</button>
    </div>
  );
}

// --- Rules editor: per-surgeon form over surgeonRules[id] + groupRules ---
function RulesEditor({ css, dk, roster, surgeonRules, groupRules, holidayNames, onSaveSurgeon, onSaveGroup, showToast, today }) {
  const ids = (roster || []).map(s => s.id);
  const [sel, setSel] = React.useState(ids[0] || "");
  const [draft, setDraft] = React.useState(() => suClone(surgeonRules[ids[0]] || {}));
  const [dirty, setDirty] = React.useState(false);
  const [rawOpen, setRawOpen] = React.useState(false);
  const [rawText, setRawText] = React.useState("");
  const [rawErr, setRawErr] = React.useState("");
  const [group, setGroup] = React.useState(() => suClone(groupRules || {}));
  const [groupDirty, setGroupDirty] = React.useState(false);
  const [groupRawOpen, setGroupRawOpen] = React.useState(false);
  const [groupRaw, setGroupRaw] = React.useState("");
  const [groupRawErr, setGroupRawErr] = React.useState("");
  React.useEffect(() => { if (!dirty) setDraft(suClone(surgeonRules[sel] || {})); }, [surgeonRules, sel]); // eslint-disable-line
  React.useEffect(() => { if (!groupDirty) setGroup(suClone(groupRules || {})); }, [groupRules]); // eslint-disable-line
  const inp = { ...css.inp, padding: "3px 6px", fontSize: 12 };
  const pick = (id) => { if (dirty && !confirm("Discard the unsaved changes to this surgeon's rules?")) return; setSel(id); setDraft(suClone(surgeonRules[id] || {})); setDirty(false); setRawOpen(false); setRawErr(""); };
  const get = (path, dflt) => { let o = draft; for (const k of path.split(".")) { if (!o || typeof o !== "object") return dflt; o = o[k]; } return o === undefined ? dflt : o; };
  const set = (path, value) => {
    setDirty(true);
    setDraft(d => {
      const n = suClone(d) || {}; let o = n; const parts = path.split(".");
      for (let i = 0; i < parts.length - 1; i++) { if (!o[parts[i]] || typeof o[parts[i]] !== "object") o[parts[i]] = {}; o = o[parts[i]]; }
      if (value === undefined) delete o[parts[parts.length - 1]]; else o[parts[parts.length - 1]] = value;
      return n;
    });
  };
  // dflt: the engine default the checkboxes display when the key is absent - the toggle starts from the same list, and emptying it drops the key (back to the default) rather than saving [].
  const toggleList = (path, item, on, dflt) => { const cur = get(path, dflt || []); const list = Array.isArray(cur) ? cur.filter(x => x !== item) : []; if (on) list.push(item); if (dflt && !list.length) { set(path, undefined); return; } set(path, list); };
  const save = () => {
    const leaks = suContactPaths(draft);
    if (leaks.length) { showToast("Refused: the rules would carry contact-looking data at " + leaks.join(", ") + " (the blob is public).", "error"); return; }
    const hr = draft.holidayRules || {};
    const clean = suClone(draft);
    if (clean.holidayRules) clean.holidayRules.neverThanksgiving = (hr.holidaysOff || []).indexOf("Thanksgiving") >= 0;
    onSaveSurgeon(sel, clean); setDirty(false);
  };
  const applyRaw = () => {
    try {
      const obj = JSON.parse(rawText);
      if (!obj || typeof obj !== "object" || Array.isArray(obj)) throw new Error("the rules must be a JSON object");
      const leaks = suContactPaths(obj);
      if (leaks.length) throw new Error("contact-looking data at " + leaks.join(", "));
      setDraft(obj); setDirty(true); setRawErr(""); setRawOpen(false);
    } catch (e) { console.warn("Rules JSON not applied:", e); setRawErr(String(e && e.message || e)); }
  };
  const capMode = Object.prototype.hasOwnProperty.call(draft, "monthlyCap") ? (draft.monthlyCap === null ? "none" : "number") : "default";
  // 9/22 (Prompt 12 K): the cap is on PRIMARY days (monthlyCap.primary). A legacy
  // 'total' value is shown in the field and rewritten as 'primary' on the first edit.
  const capObj = draft.monthlyCap && typeof draft.monthlyCap === "object" ? draft.monthlyCap : (typeof draft.monthlyCap === "number" ? { primary: draft.monthlyCap } : {});
  const capPrimaryVal = typeof capObj.primary === "number" ? capObj.primary : (typeof capObj.total === "number" ? capObj.total : undefined);
  const setCapPrimary = (v) => { if (Object.prototype.hasOwnProperty.call(capObj, "total")) set("monthlyCap.total", undefined); set("monthlyCap.primary", v); };
  const wp = get("outsideDerivedWeeks.weekdayPattern", null);
  const holNames = holidayNames && holidayNames.length ? holidayNames : SU_HOLIDAY_NAMES;
  const s = (roster || []).find(x => x.id === sel) || {};
  const gset = (path, value) => { setGroupDirty(true); setGroup(g => { const n = suClone(g) || {}; let o = n; const parts = path.split("."); for (let i = 0; i < parts.length - 1; i++) { if (!o[parts[i]] || typeof o[parts[i]] !== "object") o[parts[i]] = {}; o = o[parts[i]]; } if (value === undefined) delete o[parts[parts.length - 1]]; else o[parts[parts.length - 1]] = value; return n; }); };
  const gget = (path, dflt) => { let o = group; for (const k of path.split(".")) { if (!o || typeof o !== "object") return dflt; o = o[k]; } return o === undefined ? dflt : o; };
  // Weight keys: the engine defaults plus any numeric extra the blob carries (a prose "note" key is not a weight).
  const weightKeys = Array.from(new Set(Object.keys(typeof defaultWeights === "function" ? defaultWeights() : {}).concat(Object.keys(gget("weights", {}) || {}).filter(k => typeof gget("weights." + k, null) === "number"))));
  const box = { border: "1px solid #e8ecf0", borderRadius: 8, padding: "10px 12px", marginBottom: 10, background: dk ? "#1a2540" : "#fafbfc" };
  return (
    <div data-testid="rules-editor">
      <div style={{ display: "flex", gap: 6, flexWrap: "wrap", alignItems: "center", marginBottom: 10 }}>
        {/* M: no rule applies to an outside surgeon (type "external") - no rules editing for him, East derived weeks included */}
        {(roster || []).filter(x => x.type !== "external").map(x => <button key={x.id} data-testid={"rules-pick-" + x.id} onClick={() => pick(x.id)} style={css.mini(sel === x.id)}>{x.name} <span style={{ fontFamily: mono, fontSize: 10 }}>{x.id}</span>{surgeonRules[x.id] ? "" : " (no rules)"}</button>)}
      </div>
      {!sel ? null : <>
        <div style={box}>
          <div style={css.subT}>Availability and shape - {s.name || sel}</div>
          <SuField label="Availability mode"><select value={get("availabilityMode", "")} onChange={e => set("availabilityMode", e.target.value || undefined)} style={{ ...inp, width: 260 }}>{SU_MODES.map(m => <option key={m} value={m}>{m || "(open - every day unless blocked)"}</option>)}</select></SuField>
          <SuField label="Weekend style"><select data-testid="rules-weekend-style" value={get("weekendStyle", "")} onChange={e => set("weekendStyle", e.target.value || undefined)} style={{ ...inp, width: 190 }}><option value="">(none)</option><option value="block">block (Fri+Sat+Sun)</option><option value="split">split (Fri+Sun / Sat)</option><option value="daily">daily (standalone days)</option><option value="saturday-only">saturday-only (legacy)</option></select></SuField>
          <SuField label="Primary contribution" hint="soft; weekends = a bonus for a full Fri-Sun primary block and a penalty for a weekend backup (weights.weekendContribution)"><select data-testid="rules-primary-contribution" value={get("primaryContribution", "")} onChange={e => set("primaryContribution", e.target.value || undefined)} style={{ ...inp, width: 190 }}><option value="">(none)</option><option value="weekends">weekends (Prompt 12 L)</option></select></SuField>
          <SuField label="Fri-Sun block penalty" hint="soft; added to every multi-day block or split membership of this surgeon"><select data-testid="rules-weekend-block-penalty" value={get("weekendBlockPenalty", "") === null ? "" : String(get("weekendBlockPenalty", ""))} onChange={e => set("weekendBlockPenalty", e.target.value === "" ? undefined : (/^\d+(\.\d+)?$/.test(e.target.value) ? Number(e.target.value) : e.target.value))} style={{ ...inp, width: 130 }}><option value="">none</option><option value="medium">medium</option><option value="strong">strong</option>{(() => { const v = get("weekendBlockPenalty", ""); return v === null || v === undefined || v === "" || v === "medium" || v === "strong" ? null : <option value={String(v)}>custom: {String(v)}</option>; })()}</select></SuField>
          <SuCheck label="prefer alternate days (soft)" title="Prompt 12 N (9/22 evening): a medium penalty on a primary whose day before or after is this surgeon's own primary." checked={draft.preferAlternateDays === true} onChange={v => set("preferAlternateDays", v ? true : undefined)} testid="rules-prefer-alternate-days" />
          <SuField label="Split partner"><select value={get("splitPartner", "")} onChange={e => set("splitPartner", e.target.value || undefined)} style={{ ...inp, width: 130 }}><option value="">(none)</option>{(roster || []).filter(x => x.id !== sel).map(x => <option key={x.id} value={x.id}>{x.name}</option>)}</select></SuField>
          <SuField label="Max consecutive days" hint="blank = group default; hard, primary days only"><input type="number" min="1" max="14" value={get("maxConsecutiveDays", "") === null ? "" : get("maxConsecutiveDays", "")} onChange={e => set("maxConsecutiveDays", e.target.value === "" ? undefined : Number(e.target.value))} style={{ ...inp, width: 70 }} /></SuField>
          <SuField label="Max consecutive any role (soft)" hint="blank = none; primary or backup, a penalty that grows per day beyond it"><input data-testid="rules-max-consec-any" type="number" min="1" max="14" value={get("maxConsecutiveAnyRole", "") === null ? "" : get("maxConsecutiveAnyRole", "")} onChange={e => set("maxConsecutiveAnyRole", e.target.value === "" ? undefined : Number(e.target.value))} style={{ ...inp, width: 70 }} /></SuField>
          <SuCheck label="a holiday unit counts as one day for the consecutive limits" title="Prompt 12 A (9/22): a per-surgeon opt-in (Khan: his 4-day Thanksgiving unit vs his max 3). Unchecked = real days." checked={draft.holidayUnitCountsAsOneDay === true} onChange={v => set("holidayUnitCountsAsOneDay", v ? true : undefined)} testid="rules-holiday-unit-one-day" />
          <SuField label="Monthly target" hint="blank = equal share; a number = primary target"><input data-testid="rules-monthly-target" type="number" min="0" max="31" value={get("monthlyTarget", null) === null ? "" : get("monthlyTarget", "")} onChange={e => set("monthlyTarget", e.target.value === "" ? null : Number(e.target.value))} style={{ ...inp, width: 70 }} /></SuField>
          <div>
            <SuField label="Monthly cap">
              <select data-testid="rules-cap-mode" value={capMode} onChange={e => { const v = e.target.value; if (v === "default") set("monthlyCap", undefined); else if (v === "none") set("monthlyCap", null); else set("monthlyCap", { primary: capPrimaryVal || 8 }); }} style={{ ...inp, width: 200 }}>
                <option value="default">group default</option><option value="none">no cap (explicit null)</option><option value="number">a number</option>
              </select>
            </SuField>
            {capMode === "number" && <>
              <SuField label="Primary days per month" hint="hard; backup days never count"><input type="number" min="1" max="31" data-testid="rules-cap-primary" value={capPrimaryVal === undefined || capPrimaryVal === null ? "" : capPrimaryVal} onChange={e => setCapPrimary(e.target.value === "" ? undefined : Number(e.target.value))} style={{ ...inp, width: 70 }} /></SuField>
              <SuField label="Preferred (soft)"><input type="number" min="0" max="31" value={capObj.preferred === undefined || capObj.preferred === null ? "" : capObj.preferred} onChange={e => set("monthlyCap.preferred", e.target.value === "" ? undefined : Number(e.target.value))} style={{ ...inp, width: 70 }} /></SuField>
              <SuCheck label="count East primary-week days toward the cap" checked={capObj.countsEastDays === true || capObj.countsEastDays === "distinct-days"} onChange={v => set("monthlyCap.countsEastDays", v ? true : undefined)} />
            </>}
          </div>
          <div style={{ marginTop: 4 }}>
            <span style={{ fontSize: 10, color: "#7a8a98", fontWeight: 600, textTransform: "uppercase", letterSpacing: 0.5, marginRight: 8 }}>Hard never on</span>
            {SU_WEEKDAYS.map(w => <SuCheck key={w} label={w} checked={(get("hardNeverWeekdays", []) || []).indexOf(w) >= 0} onChange={v => toggleList("hardNeverWeekdays", w, v)} />)}
            <span style={{ fontSize: 10, color: "#7a8a98", marginRight: 6 }}>applies to</span>
            {["primary", "backup"].map(r => <SuCheck key={r} label={r} checked={(get("hardNeverWeekdaysRoles", ["primary"]) || []).indexOf(r) >= 0} onChange={v => toggleList("hardNeverWeekdaysRoles", r, v, ["primary"])} />)}
            <span style={{ fontSize: 10, color: "#7a8a98" }}>(default: primary only - backup is open to everyone since 9/22; at least one role stays ticked)</span>
          </div>
          <div>
            <SuCheck label="Does not take backup" title="9/22: backup is open to everyone unless the surgeon explicitly opts out. Checked = a hard block on every backup slot, holiday units included; primary is unaffected." checked={draft.backupOptOut === true} onChange={v => set("backupOptOut", v ? true : undefined)} testid="rules-backup-opt-out" />
          </div>
          <div>
            <SuCheck label="weekday allow-list (Mon-Thu; weekends stay pool days)" checked={!!draft.weekdays} onChange={v => set("weekdays", v ? { allowed: [], autoOffer: true } : undefined)} />
            {draft.weekdays && <>
              {["Mon", "Tue", "Wed", "Thu"].map(w => <SuCheck key={w} label={w} checked={(get("weekdays.allowed", []) || []).indexOf(w) >= 0} onChange={v => toggleList("weekdays.allowed", w, v)} />)}
              <SuCheck label="auto-offer those days (soft)" checked={get("weekdays.autoOffer", true) !== false} onChange={v => set("weekdays.autoOffer", v)} />
            </>}
          </div>
          <div>
            <SuCheck label="weekends available under a recurring whitelist" checked={!!draft.weekendsAvailable} onChange={v => set("weekendsAvailable", v ? { primary: true, backup: true } : undefined)} />
            {draft.weekendsAvailable && typeof draft.weekendsAvailable === "object" && ["primary", "backup"].map(r => <SuCheck key={r} label={r} checked={!!draft.weekendsAvailable[r]} onChange={v => set("weekendsAvailable." + r, v)} />)}
          </div>
        </div>

        <div style={box}>
          <PatternListEditor css={css} label="Recurring available (whitelist days)" list={get("recurringAvailable", [])} onChange={l => set("recurringAvailable", l.length ? l : undefined)} today={today} />
          <PatternListEditor css={css} label="Recurring unavailable (hard)" list={get("recurringUnavailable", [])} onChange={l => set("recurringUnavailable", l.length ? l : undefined)} today={today} />
          <PatternListEditor css={css} label="Recurring avoid (soft)" list={get("recurringAvoid", [])} onChange={l => set("recurringAvoid", l.length ? l : undefined)} withWeight today={today} />
        </div>

        <div style={box}>
          <div style={css.subT}>Dated whitelists</div>
          <SuField label="Available weeks (Mondays, comma separated)" width="100%" hint="whitelist-weeks: governs from the month of the first Monday onward">
            <input type="text" value={(get("availableWeeks", []) || []).join(", ")} onChange={e => set("availableWeeks", suIsoList(e.target.value).length ? suIsoList(e.target.value) : undefined)} style={{ ...inp, width: "100%", fontFamily: mono }} />
          </SuField>
          <div style={css.subT}>Availability windows <span style={{ fontWeight: 400, color: "#7a8a98" }}>(whitelist-windows: only these date ranges)</span></div>
          {(get("availableWindows", []) || []).map((w, i) => (
            <div key={i} style={{ display: "flex", gap: 6, alignItems: "center", marginBottom: 4 }}>
              <input type="date" value={w.start || ""} onChange={e => { const l = suClone(get("availableWindows", [])); l[i] = { ...l[i], start: e.target.value }; set("availableWindows", l); }} style={inp} />
              <span style={{ fontSize: 11 }}>to</span>
              <input type="date" value={w.end || ""} onChange={e => { const l = suClone(get("availableWindows", [])); l[i] = { ...l[i], end: e.target.value }; set("availableWindows", l); }} style={inp} />
              <button onClick={() => { const l = suClone(get("availableWindows", [])).filter((_, j) => j !== i); set("availableWindows", l.length ? l : undefined); }} style={css.danger}>Remove</button>
            </div>
          ))}
          <button onClick={() => set("availableWindows", (get("availableWindows", []) || []).concat([{ start: today, end: suAddDays(today, 5) }]))} style={css.mini(false)}>Add window</button>
          <div style={{ marginTop: 8 }}>
            <SuCheck label="days per window week" title="Prompt 12 N (9/22 evening): a SOFT target of primary days per Mon-Sun window week; a week off target is a diagnostics warning, never a violation. Older min / max keys are ignored by the engine (one warning) - the first edit here drops them." checked={!!draft.daysPerWindowWeek} onChange={v => set("daysPerWindowWeek", v ? { target: 2, countsBackup: false } : undefined)} testid="rules-window-week" />
            {draft.daysPerWindowWeek && <>
              <SuField label="Target primary days per window week (soft)" hint="blank = none"><input data-testid="rules-window-week-target" type="number" min="0" max="7" value={get("daysPerWindowWeek.target", "") === null ? "" : get("daysPerWindowWeek.target", "")} onChange={e => { ["min", "max", "minIsSoft"].forEach(k => { if (get("daysPerWindowWeek." + k, undefined) !== undefined) set("daysPerWindowWeek." + k, undefined); }); set("daysPerWindowWeek.target", e.target.value === "" ? undefined : Number(e.target.value)); }} style={{ ...inp, width: 60 }} /></SuField>
              <SuCheck label="backup days count" checked={get("daysPerWindowWeek.countsBackup", false) === true} onChange={v => set("daysPerWindowWeek.countsBackup", v)} />
              {(get("daysPerWindowWeek.min", undefined) !== undefined || get("daysPerWindowWeek.max", undefined) !== undefined) && <span style={{ fontSize: 10, color: "#c04040" }}>legacy min / max keys present - ignored by the engine; edit the target to drop them</span>}
            </>}
            <SuCheck label="handoff partner required (diagnostics: warns when the day after a primary is the same surgeon or open)" checked={!!draft.handoffPartnerRequired} onChange={v => set("handoffPartnerRequired", v || undefined)} />
          </div>
        </div>

        <div style={box}>
          <div style={css.subT}>Weekday pattern outside East-derived weeks <span style={{ fontWeight: 400, color: "#7a8a98" }}>(per weekday: allowed / not / only inside a Fri+Sat+Sun block)</span></div>
          <SuCheck label="use a weekday pattern" checked={!!wp} onChange={v => set("outsideDerivedWeeks", v ? { canBePrimary: true, weekdayPattern: {} } : undefined)} />
          {wp && (
            <div className="table-wrap" style={css.tableWrap}>
              <table className="setup-table">
                <thead><tr><th>Day</th><th>Primary</th><th>Backup</th><th>Preferred</th><th>Where</th></tr></thead>
                <tbody>
                  {SU_WEEKDAYS.map(w => {
                    const pd = wp[w] || {};
                    const opt = (role) => <select value={pd[role] === true ? "yes" : pd[role] === "weekend-block-only" ? "block" : "no"} onChange={e => { const v = e.target.value; set("outsideDerivedWeeks.weekdayPattern." + w + "." + role, v === "yes" ? true : v === "block" ? "weekend-block-only" : false); }} style={{ ...inp, width: 150 }}><option value="yes">allowed</option><option value="no">not allowed</option><option value="block">Fri+Sat+Sun block only</option></select>;
                    return (
                      <tr key={w}><td style={{ fontWeight: 700 }}>{w}</td><td>{opt("primary")}</td><td>{opt("backup")}</td>
                        <td><input type="checkbox" checked={!!pd.preferred} onChange={e => set("outsideDerivedWeeks.weekdayPattern." + w + ".preferred", e.target.checked || undefined)} /></td>
                        <td><input type="text" value={pd.where || ""} onChange={e => set("outsideDerivedWeeks.weekdayPattern." + w + ".where", e.target.value || undefined)} style={{ ...inp, width: 160 }} /></td></tr>
                    );
                  })}
                </tbody>
              </table>
            </div>
          )}
        </div>

        <div style={box}>
          <div style={css.subT}>Clinic day-before rule (Aledo pattern)</div>
          <SuCheck label="has clinic days that block the day before" checked={!!draft.aledo} onChange={v => set("aledo", v ? { weekdays: [], avoidWholeWeek: "strong", hardAvoidDayBefore: true } : undefined)} />
          {draft.aledo && <>
            <PatternListEditor css={css} label="Clinic days" list={get("aledo.weekdays", [])} onChange={l => set("aledo.weekdays", l)} today={today} />
            <SuCheck label="the day before a clinic day is a hard block (primary)" checked={get("aledo.hardAvoidDayBefore", true) !== false} onChange={v => set("aledo.hardAvoidDayBefore", v)} />
            <SuField label="Avoid the whole clinic week (soft)"><select value={get("aledo.avoidWholeWeek", "") || ""} onChange={e => set("aledo.avoidWholeWeek", e.target.value || undefined)} style={{ ...inp, width: 110 }}><option value="">off</option><option value="low">low</option><option value="medium">medium</option><option value="strong">strong</option></select></SuField>
          </>}
          <div style={css.subT}>Backup caps</div>
          <SuField label="Backup days per month" hint="blank = none"><input type="number" min="0" max="31" value={get("backupCap.perMonthDays", "") === null ? "" : get("backupCap.perMonthDays", "")} onChange={e => set("backupCap.perMonthDays", e.target.value === "" ? undefined : Number(e.target.value))} style={{ ...inp, width: 70 }} /></SuField>
          <SuField label="Backup weekends per month" hint="blank = none"><input type="number" min="0" max="5" value={get("backupCap.weekendsPerMonth", "") === null ? "" : get("backupCap.weekendsPerMonth", "")} onChange={e => set("backupCap.weekendsPerMonth", e.target.value === "" ? undefined : Number(e.target.value))} style={{ ...inp, width: 70 }} /></SuField>
        </div>

        <div style={box}>
          <div style={css.subT}>Holiday rules</div>
          <span style={{ fontSize: 10, color: "#7a8a98", fontWeight: 600, textTransform: "uppercase", letterSpacing: 0.5, marginRight: 8 }}>Never covers</span>
          {holNames.map(h => <SuCheck key={h} label={h} checked={(get("holidayRules.holidaysOff", []) || []).indexOf(h) >= 0} onChange={v => toggleList("holidayRules.holidaysOff", h, v)} />)}
          <div><SuField label="Max major holidays (rolling 12 months)" hint="blank = no limit"><input type="number" min="0" max="3" value={get("holidayRules.maxMajorHolidays", null) === null ? "" : get("holidayRules.maxMajorHolidays", "")} onChange={e => set("holidayRules.maxMajorHolidays", e.target.value === "" ? undefined : Number(e.target.value))} style={{ ...inp, width: 70 }} /></SuField></div>
        </div>

        <div style={box}>
          <div style={css.subT}>East (Davenport) feed</div>
          <SuCheck label="East feed applies to this surgeon" checked={!!get("eastFeed.enabled", false)} onChange={v => set("eastFeed.enabled", v)} />
          {get("eastFeed.enabled", false) && <>
            <div>
              <SuCheck label="East busy days block Silvis PRIMARY" checked={!!get("eastFeed.eastBlocksPrimary", false)} onChange={v => set("eastFeed.eastBlocksPrimary", v)} />
              <SuCheck label="East busy days block Silvis BACKUP" checked={!!get("eastFeed.eastBlocksBackup", false)} onChange={v => set("eastFeed.eastBlocksBackup", v)} />
              <SuCheck label="East backup call counts as busy" checked={get("eastFeed.eastBackupCountsAsBusy", true) !== false} onChange={v => set("eastFeed.eastBackupCountsAsBusy", v)} />
              <SuCheck label="use the East forecast while Davenport is unpublished" checked={!!get("eastFeed.forecast", false)} onChange={v => set("eastFeed.forecast", v)} />
            </div>
            <SuField label="Derive Silvis weeks from" hint="blank = no derived weeks (East-primary week = Silvis backup all week; East-backup week = Silvis primary)"><input type="date" value={get("eastFeed.deriveFrom", "") || ""} onChange={e => set("eastFeed.deriveFrom", e.target.value || undefined)} style={inp} /></SuField>
            <SuField label="Stated East-primary weeks (Mondays)" width={300}><input type="text" value={(get("eastFeed.statedWeeks.eastPrimary", []) || []).join(", ")} onChange={e => set("eastFeed.statedWeeks.eastPrimary", suIsoList(e.target.value))} style={{ ...inp, width: "100%", fontFamily: mono }} /></SuField>
            <SuField label="Stated East-backup weeks (Mondays)" width={300}><input type="text" value={(get("eastFeed.statedWeeks.eastBackup", []) || []).join(", ")} onChange={e => set("eastFeed.statedWeeks.eastBackup", suIsoList(e.target.value))} style={{ ...inp, width: "100%", fontFamily: mono }} /></SuField>
          </>}
        </div>

        <div style={{ display: "flex", gap: 8, alignItems: "center", flexWrap: "wrap", marginBottom: 6 }}>
          <button data-testid="rules-save" onClick={save} disabled={!dirty} style={{ ...css.btn(true), padding: "6px 14px", opacity: dirty ? 1 : 0.5 }}>Save rules for {s.name || sel}</button>
          {dirty && <button onClick={() => { setDraft(suClone(surgeonRules[sel] || {})); setDirty(false); }} style={css.mini(false)}>Revert</button>}
          <button onClick={() => { setRawText(JSON.stringify(draft, null, 2)); setRawOpen(o => !o); setRawErr(""); }} style={css.mini(rawOpen)}>{rawOpen ? "Hide JSON" : "Edit as JSON (everything else)"}</button>
          <span style={{ fontSize: 11, color: "#7a8a98" }}>{dirty ? "Unsaved" : "Saved to surgeonRules." + sel + " (autosave)"}</span>
        </div>
        {rawOpen && (
          <div style={{ marginBottom: 10 }}>
            <textarea data-testid="rules-raw" value={rawText} onChange={e => setRawText(e.target.value)} spellCheck={false} style={{ ...inp, width: "100%", minHeight: 220, fontFamily: mono, fontSize: 11 }} />
            {rawErr && <div style={css.errBox}>Not applied: {rawErr}</div>}
            <button onClick={applyRaw} style={{ ...css.btn(true), padding: "5px 12px", marginTop: 6 }}>Apply JSON to the form</button>
          </div>
        )}
      </>}

      <div style={{ ...box, borderColor: "#c8d8e8" }}>
        <div style={css.subT}>Group rules</div>
        {/* K (9/22): bound to defaultMonthlyCap.primary; a legacy 'total' value is shown and replaced on the first edit */}
        <SuField label="Default monthly cap (primary days)" hint="blank = none; backup days never count"><input type="number" min="1" max="31" data-testid="group-default-cap-primary" value={(() => { const p = gget("defaultMonthlyCap.primary", null); if (typeof p === "number") return p; const t = gget("defaultMonthlyCap.total", null); return typeof t === "number" ? t : ""; })()} onChange={e => { if (gget("defaultMonthlyCap.total", null) !== null) gset("defaultMonthlyCap.total", undefined); gset("defaultMonthlyCap.primary", e.target.value === "" ? undefined : Number(e.target.value)); }} style={{ ...inp, width: 70 }} /></SuField>
        <SuField label="Default max consecutive"><input type="number" min="1" max="14" value={gget("defaultMaxConsecutiveDays", "")} onChange={e => gset("defaultMaxConsecutiveDays", e.target.value === "" ? undefined : Number(e.target.value))} style={{ ...inp, width: 70 }} /></SuField>
        <SuField label="Forecast busy threshold (0-1)"><input type="number" min="0" max="1" step="0.05" value={gget("eastFeed.forecast.busyThreshold", "")} onChange={e => gset("eastFeed.forecast.busyThreshold", e.target.value === "" ? undefined : Number(e.target.value))} style={{ ...inp, width: 80 }} /></SuField>
        <div>
          <SuCheck label="backup days count toward consecutive runs" checked={!!gget("countBackupInConsecutive", false)} onChange={v => gset("countBackupInConsecutive", v)} />
          <SuCheck label="backup must differ from primary" checked={gget("backupDistinctFromPrimary", true) !== false} onChange={v => gset("backupDistinctFromPrimary", v)} />
          <SuCheck label="holiday units waive weekday rules" checked={gget("holidays.ignoreWeekdayRules", true) !== false} onChange={v => gset("holidays.ignoreWeekdayRules", v)} />
          <SuCheck label="anyone may cover a holiday unless opted out" checked={gget("holidays.anyoneMayCoverUnlessOptedOut", true) !== false} onChange={v => gset("holidays.anyoneMayCoverUnlessOptedOut", v)} />
        </div>
        <div style={css.subT}>Weights</div>
        <div style={{ display: "flex", flexWrap: "wrap", gap: 4 }}>
          {weightKeys.map(k => <SuField key={k} label={k}><input type="number" step="0.5" value={gget("weights." + k, "") === null ? "" : gget("weights." + k, "")} placeholder={String((typeof defaultWeights === "function" ? defaultWeights() : {})[k] === undefined ? "" : defaultWeights()[k])} onChange={e => gset("weights." + k, e.target.value === "" ? undefined : Number(e.target.value))} style={{ ...inp, width: 70 }} /></SuField>)}
        </div>
        <div style={{ display: "flex", gap: 8, alignItems: "center", flexWrap: "wrap" }}>
          <button data-testid="group-save" onClick={() => { const leaks = suContactPaths(group); if (leaks.length) { showToast("Refused: contact-looking data at " + leaks.join(", "), "error"); return; } onSaveGroup(group); setGroupDirty(false); }} disabled={!groupDirty} style={{ ...css.btn(true), padding: "6px 14px", opacity: groupDirty ? 1 : 0.5 }}>Save group rules</button>
          {groupDirty && <button onClick={() => { setGroup(suClone(groupRules || {})); setGroupDirty(false); }} style={css.mini(false)}>Revert</button>}
          <button onClick={() => { setGroupRaw(JSON.stringify(group, null, 2)); setGroupRawOpen(o => !o); setGroupRawErr(""); }} style={css.mini(groupRawOpen)}>{groupRawOpen ? "Hide JSON" : "Edit as JSON"}</button>
        </div>
        {groupRawOpen && (
          <div style={{ marginTop: 8 }}>
            <textarea value={groupRaw} onChange={e => setGroupRaw(e.target.value)} spellCheck={false} style={{ ...inp, width: "100%", minHeight: 200, fontFamily: mono, fontSize: 11 }} />
            {groupRawErr && <div style={css.errBox}>Not applied: {groupRawErr}</div>}
            <button onClick={() => { try { const o = JSON.parse(groupRaw); if (!o || typeof o !== "object" || Array.isArray(o)) throw new Error("groupRules must be a JSON object"); const leaks = suContactPaths(o); if (leaks.length) throw new Error("contact-looking data at " + leaks.join(", ")); setGroup(o); setGroupDirty(true); setGroupRawOpen(false); setGroupRawErr(""); } catch (e) { console.warn("Group rules JSON not applied:", e); setGroupRawErr(String(e && e.message || e)); } }} style={{ ...css.btn(true), padding: "5px 12px", marginTop: 6 }}>Apply JSON</button>
          </div>
        )}
      </div>
    </div>
  );
}

// --- Availability statements (dated rows) with a paste-a-date-list box ---
function AvailabilityCard({ css, rows, roster, nameOf, onAdd, onDelete, busy, today }) {
  const inp = { ...css.inp, padding: "3px 6px", fontSize: 12 };
  const [filter, setFilter] = React.useState("");
  const [form, setForm] = React.useState({ person_id: "", kind: "available", role: "any", start: today, end: today, note: "" });
  const [paste, setPaste] = React.useState({ person_id: "", kind: "available", role: "any", year: String(new Date().getFullYear()), text: "", note: "" });
  const parsed = React.useMemo(() => suParseDateList(paste.text, paste.year), [paste.text, paste.year]);
  const ranges = React.useMemo(() => suCollapseDates(parsed.dates), [parsed]);
  const shown = (rows || []).filter(r => !filter || r.person_id === filter).slice().sort((a, b) => a.start_date < b.start_date ? -1 : a.start_date > b.start_date ? 1 : 0);
  const existingKeys = new Set((rows || []).map(suAvailKey));
  const pasteRows = ranges.map(r => ({ person_id: paste.person_id, kind: paste.kind, role: paste.role, start_date: r.start, end_date: r.end, note: paste.note.trim() || null, source: "setup" }));
  const pasteNew = pasteRows.filter(r => !existingKeys.has(suAvailKey(r))).length;
  const contactNote = (t) => SU_CONTACT_VALUE.test(String(t || ""));
  const submitForm = async () => {
    if (!form.person_id || !form.start || !form.end) return;
    if (form.end < form.start) return;
    if (contactNote(form.note)) return;
    const r = await onAdd([{ person_id: form.person_id, kind: form.kind, role: form.role, start_date: form.start, end_date: form.end, note: form.note, source: "setup" }]);
    if (r && r.ok) setForm(f => ({ ...f, note: "" }));
  };
  const submitPaste = async () => {
    if (!paste.person_id || !pasteRows.length) return;
    if (contactNote(paste.note)) return;
    const r = await onAdd(pasteRows);
    if (r && r.ok) setPaste(p => ({ ...p, text: "" }));
  };
  const years = []; for (let y = new Date().getFullYear() - 1; y <= new Date().getFullYear() + 2; y++) years.push(String(y));
  return (
    <div data-testid="availability-card">
      <p style={{ fontSize: 12, color: "#5a6a78", margin: "0 0 8px", lineHeight: 1.5 }}>Dated statements the rules engine reads: <em>available</em> rows make a month a whitelist for that surgeon (only listed days are eligible), <em>unavailable</em> always blocks, <em>backup_only</em> blocks primary, <em>no_backup</em> blocks backup, <em>avoid</em>/<em>prefer</em> are soft. Recurring patterns live in Rules, not here. Notes are public (operational wording only).</p>
      <div style={{ display: "flex", gap: 8, flexWrap: "wrap", alignItems: "flex-end", marginBottom: 8, padding: "8px 10px", border: "1px solid #e8ecf0", borderRadius: 8 }}>
        <SuField label="Person"><select value={form.person_id} onChange={e => setForm(f => ({ ...f, person_id: e.target.value }))} style={{ ...inp, width: 120 }}><option value="">Select</option>{(roster || []).map(s => <option key={s.id} value={s.id}>{s.name}</option>)}</select></SuField>
        <SuField label="Kind"><select value={form.kind} onChange={e => setForm(f => ({ ...f, kind: e.target.value }))} style={{ ...inp, width: 120 }}>{SU_AVAIL_KINDS.map(k => <option key={k} value={k}>{k}</option>)}</select></SuField>
        <SuField label="Role"><select value={form.role} onChange={e => setForm(f => ({ ...f, role: e.target.value }))} style={{ ...inp, width: 90 }}><option value="any">any</option><option value="primary">primary</option><option value="backup">backup</option></select></SuField>
        <SuField label="Start"><input type="date" value={form.start} onChange={e => setForm(f => ({ ...f, start: e.target.value, end: f.end < e.target.value ? e.target.value : f.end }))} style={inp} /></SuField>
        <SuField label="End"><input type="date" value={form.end} onChange={e => setForm(f => ({ ...f, end: e.target.value }))} style={inp} /></SuField>
        <SuField label="Note (public)" width={180}><input type="text" value={form.note} onChange={e => setForm(f => ({ ...f, note: e.target.value }))} style={{ ...inp, width: "100%" }} /></SuField>
        <button data-testid="avail-add" onClick={submitForm} disabled={busy || !form.person_id || !form.start || !form.end || form.end < form.start || contactNote(form.note)} style={{ ...css.btn(true), padding: "5px 12px", marginBottom: 8, opacity: busy ? 0.6 : 1 }}>Add row</button>
        {contactNote(form.note) && <span style={{ ...css.errBox, marginBottom: 8 }}>The note looks like contact data - this table is public.</span>}
      </div>
      <div style={{ padding: "8px 10px", border: "1px solid #e8ecf0", borderRadius: 8, marginBottom: 10 }}>
        <div style={{ ...css.subT, margin: "0 0 6px" }}>Paste a date list</div>
        <div style={{ display: "flex", gap: 8, flexWrap: "wrap", alignItems: "flex-end" }}>
