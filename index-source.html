<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Silvis Call">

  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">

  <title>Silvis Call Schedule</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #f0f2f5; overflow-x: hidden; }
    #root { min-height: 100vh; }
    /* Print-friendly styles */
    @media print {
      body { background: #fff !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
      #root > div > div:first-child { display: none !important; } /* hide header */
      button, select, input { display: none !important; }
      [style*="position: absolute"] { display: none !important; } /* hide notification panel */
      div[style*="maxWidth"] { max-width: 100% !important; padding: 0 !important; }
      @page { margin: 0.5cm; size: landscape; }
    }
    /* Mobile improvements */
    @media (max-width: 600px) {
      select, input[type="date"], input[type="text"], input[type="password"], input[type="email"] { font-size: 16px !important; min-height: 38px; }
      button { min-height: 36px; }
    }
    /* Calendar month grid (Prompt 6 Slice B). Classes only carry the layout
       that inline styles cannot (grid + the phone breakpoint); colors stay
       inline so dark mode's selectors keep working. */
    .cal-grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 3px; }
    .cal-hdr { font-size: 10px; font-weight: 700; letter-spacing: 0.6px; text-transform: uppercase; text-align: center; padding: 4px 0; }
    .cal-cell { min-height: 84px; border: 1px solid #e0e4ea; border-radius: 6px; padding: 4px 5px 3px; position: relative; font-size: 11.5px; line-height: 1.3; overflow: hidden; cursor: pointer; background: #fff; }
    .cal-cell:focus-visible { outline: 2px solid #1a6fa8; outline-offset: 1px; }
    .cal-line { display: flex; align-items: center; gap: 3px; margin-top: 2px; min-width: 0; }
    .cal-pill { display: inline-block; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; border-radius: 4px; padding: 0 5px; font-weight: 600; border: 1px solid transparent; }
    .cal-code { display: none; }
    .cal-role { font-size: 9px; font-weight: 800; color: #8a94a0; width: 8px; flex-shrink: 0; }
    .cal-lock { flex-shrink: 0; }
    .cal-skel { display: inline-block; width: 58%; height: 9px; border-radius: 4px; background: #e4e8ee; opacity: 0.9; }
    .cal-mobile-note { display: none; }
    .cal-badges { position: absolute; top: 3px; right: 4px; display: flex; gap: 2px; align-items: center; }
    .cal-dots { display: flex; gap: 3px; margin-top: 3px; flex-wrap: wrap; }
    .week-rows td, .week-rows th { vertical-align: top; }
    /* Generate preview (Prompt 6 Slice E): a previewed day is drawn with a
       dashed violet outline and a light hatch so it can never pass for a
       saved assignment. Nothing is written until Accept & Publish. */
    .cal-cell.cal-preview { outline: 2px dashed #7a4fbf; outline-offset: -2px; background-image: repeating-linear-gradient(135deg, rgba(122,79,191,0.08) 0 6px, transparent 6px 12px) !important; }
    .cal-preview-tag { position: absolute; bottom: 2px; left: 4px; font-size: 8px; font-weight: 800; letter-spacing: 0.6px; color: #7a4fbf; }
    .setup-table { width: 100%; border-collapse: collapse; font-size: 12px; }
    .setup-table th { text-align: left; padding: 6px 8px; color: #5a6a78; font-weight: 600; font-size: 10px; text-transform: uppercase; letter-spacing: 0.5px; }
    .setup-table td { padding: 5px 8px; border-top: 1px solid #e8ecf0; vertical-align: top; }
    .setup-table input[type="text"], .setup-table input[type="number"], .setup-table input[type="date"], .setup-table select { font-size: 12px; padding: 3px 6px; }
    /* Phone (<= 600px): a 7-column grid leaves ~43px per cell, so the P/B
       role letter, holiday name, weekend label and NOTE tag give way (line
       order = role, the cell title still spells everything out), the pill
       shows the 3-letter code and never shrinks below its text (vis-001; the
       harness asserts no pill is clipped), the padlock shrinks to 7px. */
    @media (max-width: 600px) {
      .cal-grid { gap: 2px; }
      .cal-cell { min-height: 66px; padding: 3px 2px 2px; font-size: 10px; border-radius: 4px; }
      .cal-line { gap: 1px; }
      .cal-pill { padding: 0 1px; flex-shrink: 0; max-width: none; }
      .cal-pill.cal-open { padding: 0; letter-spacing: 0 !important; font-size: 9.5px; }
      .cal-role { display: none; }
      .cal-lock { width: 6px; height: 6px; }
      .cal-name { display: none; }
      .cal-code { display: inline; }
      .cal-hol, .cal-wk-label, .cal-note { display: none; }
      .cal-mobile-note { display: inline; }
      .cal-badges { top: 2px; right: 2px; }
      .cal-legend { font-size: 10px !important; }
      /* Prompt 11 mobile pass: the PREVIEW tag no longer clips or sits on the
         B line / vacation dots (smaller, no tracking, and the cell grows). */
      .cal-cell.cal-preview { min-height: 78px; padding-bottom: 12px; }
      .cal-preview-tag { font-size: 7px; letter-spacing: 0; left: 2px; bottom: 1px; }
      /* Tables wider than the phone scroll INSIDE their card (never the page):
         a right-edge shade + caption say so, because the action column
         (Delete / Remove / Save / coverage) sits past the edge. */
      .table-wrap { background: linear-gradient(90deg, #ffffff 30%, rgba(255,255,255,0)), linear-gradient(90deg, rgba(255,255,255,0), #ffffff 70%) 100% 0, radial-gradient(farthest-side at 0 50%, rgba(0,0,0,0.22), rgba(0,0,0,0)), radial-gradient(farthest-side at 100% 50%, rgba(0,0,0,0.22), rgba(0,0,0,0)) 100% 0; background-repeat: no-repeat; background-size: 40px 100%, 40px 100%, 14px 100%, 14px 100%; background-attachment: local, local, scroll, scroll; }
      .table-wrap::after { content: "swipe sideways for more columns"; display: block; font-size: 10px; color: #7a8a98; padding: 3px 8px; font-style: italic; }
      .setup-table input[type="text"] { max-width: 150px !important; }
      input[type="checkbox"] { width: 20px; height: 20px; }
      .trade-pick { width: 100% !important; }
      .trade-pick-wrap { flex: 1 1 100%; }
    }
  </style>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script type="module">
    // Load the Supabase JS SDK as an ES module. Exposes createClient under
    // window._supabaseSDK so our non-module scripts below can use it (Realtime
    // only - every read/write goes through the REST wrapper in config.js),
    // without polluting the global scope with a `supabase` identifier that
    // would collide with our const supabase REST wrapper.
    import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm";
    window._supabaseSDK = { createClient };
    window.dispatchEvent(new CustomEvent("supabase-sdk-ready"));
  </script>
  <script>
    // --- Auto-update: bump this version string each deploy ---
    // SINGLE SOURCE OF TRUTH for the app version. CI (bump-version.js) bumps it
    // on every push to main; never edit it by hand. The cache-bust loader below
    // reads APP_VERSION directly - do not duplicate.
    var APP_VERSION = "2026.09.22n";
    (function() {
      var stored = localStorage.getItem("silvis_app_version");
      var mismatch = stored && stored !== APP_VERSION;

      function nukeAndReload() {
        var promises = [];
        if (window.caches) {
          promises.push(caches.keys().then(function(names) {
            return Promise.all(names.map(function(n) { return caches.delete(n); }));
          }));
        }
        if (navigator.serviceWorker) {
          promises.push(navigator.serviceWorker.getRegistrations().then(function(regs) {
            return Promise.all(regs.map(function(r) { return r.unregister(); }));
          }));
        }
        Promise.all(promises).then(function() {
          var url = new URL(window.location.href);
          // Unique per reload: reusing the bare APP_VERSION could hit the very
          // cache entry that served THIS (stale) build within max-age.
          url.searchParams.set("_v", APP_VERSION + "-" + Date.now());
          window.location.replace(url.toString());
        }).catch(function(e) { console.warn("nukeAndReload: cache/service-worker clear failed - plain reload:", e); window.location.reload(true); });
      }

      if (mismatch) {
        localStorage.setItem("silvis_app_version", APP_VERSION);
        nukeAndReload();
      } else {
        localStorage.setItem("silvis_app_version", APP_VERSION);
        window.__silvisHardReset = nukeAndReload;
      }
    })();
  </script>
</head>
<body>
  <div id="root"></div>
  <script>
    // Cache-bust uses APP_VERSION (defined at the top of this file).
    var _v = APP_VERSION;
    ['config.js','helpers.js','rules.js','east-feed.js','generator.js','importer.js','app-styles.js'].forEach(function(f) {
      document.write('<script src="'+f+'?v='+_v+'"><\/script>');
    });
  </script>
  <script type="text/babel">
    /* ===================================================================
       IN-FILE CONVENTIONS - read before editing (Babel strips this from the
       build; it exists for the next person editing THIS file).

       1. REF-BRIDGE for []-memoized callbacks. Any useCallback with [] deps
          captures its FIRST render's closure forever. Calling a per-render
          helper (logAudit, nameOf, anything reading userProfile/surgeons)
          from inside one silently uses stale state - audit entries
          attributed to "Unknown", decisions made on day-one data. The fix
          is a ref updated every render (auditRef) and calling through
          ref.current. This idiom was independently rediscovered TWICE in
          the Davenport app (PR #30, PR #40); both failure modes were
          silent. If your callback has [] deps and calls anything that isn't
          a setState or a ref, route it through a bridge.

       2. TWO SOURCES OF TRUTH need a same-action writer and a tripwire.
          The schedule has exactly two representations: the in-memory map
          (`schedule`) and the persisted rows (`schedule_days`), bridged by
          dayRowToAssignment / assignmentToDayRow in helpers.js and by
          lastSyncRef (the last map known to be persisted). Do not add a
          third copy (a blob mirror, a per-view cache) without a writer that
          updates it in the SAME action and a test that pins it.

       3. FAIL LOUD. Every write checks its result and toasts on failure;
          every read distinguishes "failed" from "empty" (an RLS-blocked
          read is HTTP 200 + [] - silent). db.query and .single() THROW on
          HTTP failure. Never add an empty catch; never return [] for a
          failed load. The Davenport incident history is silent failures.

          3a. A LOUD-FAILURE CONVERSION MUST NOT GATE AN INDEPENDENT
          DOWNSTREAM WRITE BEHIND ITS THROW. When you turn a discarded
          result into a `throw`, look at what follows it in the same `try`:
          anything that was merely SEQUENTIAL becomes CONDITIONAL, and a
          previously-independent write silently stops happening. The
          autosave below has TWO LEGS - schedule_days (leg 1, every
          session) and the config blob (leg 2, scheduler only). Leg 1 runs
          FIRST and UNCONDITIONALLY; neither leg may sit inside the other's
          failure path. Sequential is not dependent.

       4. GUARD REFS are one-shot grant/consume. everHadRealDataRef,
          allowWipeSaveRef, intentionalScheduleWipeRef each have pinned
          grant/consume site COUNTS in test/data-layer.test.js section E.
          A new site means updating the pinned count in the same PR - the
          red check is the review prompt, not an obstacle.

       5. SOURCE PINS scan this file for exact substrings. Comments count
          too - write prose in comments, not code patterns, or a comment
          can silently satisfy (or break) a pin. Verify the live build by
          IDENTIFIERS and string literals, never comments (Babel strips
          them).

       6. THE STATE BUNDLE (buildStateBundle) is arguments, not persistence.
          Its schedule / vacations / availability keys feed the empty-save
          guard, the schedule_days CAS leg, the keepalive flush and the
          JSON export, and are stripped from every blob write - see the
          comment on the function before "simplifying" it.

       7. NEVER round-trip this file through PowerShell 5.1 text cmdlets
          (Get-Content/Set-Content) - it double-encodes UTF-8. build.js
          fails the build on the corruption signatures (the mojibake gate).

       8. SLICE MARKERS. Every Prompt 6 slice (A-G) is built; no view is a
          stub any more. If a future feature needs a placeholder, mark it
          "TODO(<name>)" and replace it wholesale, do not grow it.
       =================================================================== */
    const { useState, useMemo, useCallback, useRef, useEffect } = React;

function CallSchedule() {
  // --- Public mode detection ---
  // When the URL contains ?public=1, render a stripped-down read-only
  // calendar view for external schedulers. Skips auth entirely.
  const isPublicMode = useMemo(() => {
    try {
      const params = new URLSearchParams(window.location.search);
      return params.get("public") === "1";
    } catch(e) { console.warn("isPublicMode: could not read the URL query (treated as signed-in mode):", e); return false; }
  }, []);

  const [view, setView] = useState("calendar");

  // --- Roster / rules / settings (the call_schedule_data blob, id=main) ---
  // roster: { id, name (last name), code, fullName, active, roles }. The
  // schedule stores ids. surgeonRules / groupRules / holidays stay undefined
  // until Prompt 5 imports them (Setup shows "Rules not imported yet").
  const [surgeons, setSurgeons] = useState(INIT_SURGEONS);
  const [surgeonRules, setSurgeonRules] = useState(undefined);
  const [groupRules, setGroupRules] = useState(undefined);
  const [holidays, setHolidays] = useState(undefined);
  const [settings, setSettings] = useState({});
  // The office-notification watermark: { at, days: { day: { primary, backup, externalCover } } }.
  const [lastPublished, setLastPublished] = useState(null);
  // The last generate's operational record, blob key lastGenerate (Prompt 13
  // part 4 writes helpers.lastGenerateFromDiagnostics on Accept & Publish once
  // the days are on file; the board reads it for the Why column and weekend
  // kinds): { at, range: { start, end }, openSlots: [{ day, role, reason }],
  // weekendKinds: { friday: kind } }. The reasons are operational wording only
  // (the blob is anon-readable). undefined until the blob carries it.
  const [lastGenerate, setLastGenerate] = useState(undefined);

  // --- Operational data (own tables) ---
  // schedule: { "YYYY-MM-DD": { primary, backup, primaryLocked, backupLocked, source, externalCover, note } }
  const [schedule, setSchedule] = useState({});
  // vacations: { person_id: [[start, end, id, note], ...] } from time_off (vacations only).
  const [vacations, setVacations] = useState({});
  const [timeOffRows, setTimeOffRows] = useState([]); // raw rows (export / restore)
  const [availabilityRows, setAvailabilityRows] = useState([]); // dated availability statements

  // Calendar view defaults to the current month - the CENTRAL month (helpers.js
  // todayCentral), the same notion of today as the OPEN logic and the today ring
  // (small items 9/22), never the device clock.
  const [calMonth, setCalMonth] = useState(() => parse(todayCentral()).getMonth());
  const [calYear, setCalYear] = useState(() => parse(todayCentral()).getFullYear());
  // Calendar tools (Prompt 9 exports): month count for the share page /
  // printable view (from the visible month), and the ER Call Panels range
  // (null = the visible month; the date inputs and the presets set it).
  const [toolMonths, setToolMonths] = useState(1);
  const [erRange, setErRange] = useState(null);
  const erPreviewRef = useRef(null);
  // The year field's own text (vis-002): a controlled number input that only
  // accepts in-range values swallows every keystroke ("2", "20", "202" are all
  // out of range), so the text is local and commits to calYear once it is a
  // 4-digit year in range; blur / Enter snap it back to calYear.
  const [calYearText, setCalYearText] = useState(() => String(parse(todayCentral()).getFullYear()));
  useEffect(() => { setCalYearText(String(calYear)); }, [calYear]);
  const [calSurgeonFilters, setCalSurgeonFilters] = useState([]); // roster ids; [] = everyone (chips dim the rest)
  const [calOnlyOpen, setCalOnlyOpen] = useState(false);          // dim every day without an OPEN slot
  const [editorDay, setEditorDay] = useState(null);               // "YYYY-MM-DD" while the day editor is open
  const [editorFocus, setEditorFocus] = useState(null);           // "external" when the board's 'Outside cover' opened the editor (it focuses that input)
  // --- East feed inputs (read-only caches of the Davenport project; Setup's
  // East panel refreshes them in Slice E). A failed read keeps the previous
  // rows and is recorded in eastLoadState so the UI says "unknown", never
  // "clear" (guide section 7).
  const [eastFeedRows, setEastFeedRows] = useState([]);           // east_feed: published Davenport weeks
  const [eastForecastRows, setEastForecastRows] = useState([]);   // east_forecast: isForecast rows
  const [eastOverrideRows, setEastOverrideRows] = useState([]);   // east_overrides: per day/person busy true/false
  const [eastLoadState, setEastLoadState] = useState({ feed: "pending", forecast: "pending", overrides: "pending" });
  // Davenport ids for our roster CODES (FAK is s6 there). Resolved from data,
  // never a literal id: the forecast rows record the id they were built for;
  // failing that the Davenport roster is read once, read-only, via east-feed.js.
  const [eastIdByCode, setEastIdByCode] = useState(null);         // { CODE: davenportId, _source } | null

  const [auditEntries, setAuditEntries] = useState([]); // Activity log rows (scheduler/admin viewer)
  const [auditLoading, setAuditLoading] = useState(false);
  const [showPastVacations, setShowPastVacations] = useState(false);

  // --- Dark Mode ---
  const [darkMode, setDarkMode] = useState(() => {
    try { return localStorage.getItem("silvis-dark-mode") === "true"; } catch(e) { console.warn("Couldn't read the dark-mode setting (light mode used):", e); return false; }
  });
  useEffect(() => {
    try { localStorage.setItem("silvis-dark-mode", darkMode); } catch(e) { console.warn("Couldn't persist dark-mode setting:", e); }
  }, [darkMode]);

  // --- Undo History (in-memory, this device) ---
  const [scheduleHistory, setScheduleHistory] = useState([]);
  const pushUndo = useCallback((sched) => {
    setScheduleHistory(prev => [...prev.slice(-9), JSON.parse(JSON.stringify(sched))]);
  }, []);
  const undoLastChange = useCallback(() => {
    if (scheduleHistory.length === 0) return;
    const prev = scheduleHistory[scheduleHistory.length - 1];
    setSchedule(prev);
    setScheduleHistory(h => h.slice(0, -1));
  }, [scheduleHistory]);

  // Vacation entry form (Setup card + Time off tab share these)
  const [vacSurgeon, setVacSurgeon] = useState("");
  const [vacStart, setVacStart] = useState(() => fmt(new Date()));
  const [vacEnd, setVacEnd] = useState(() => fmt(new Date()));
  const [vacNote, setVacNote] = useState("");
  const [editVac, setEditVac] = useState(null); // { sid, idx, start, end }
  // Clear-schedule range (Setup, scheduler)
  const [clearStart, setClearStart] = useState(() => fmt(new Date()));
  const [clearEnd, setClearEnd] = useState("");
  // --- Setup view state (Prompt 6 Slice E) ---
  // previewGen: a generator result shown on the calendar with a dashed outline;
  // NOTHING is written until acceptPreview (snapshot -> CAS sync -> publish dialog).
  const [previewGen, setPreviewGen] = useState(null); // { schedule, diagnostics, start, end, seed, bestOf, respectLocks, ranAt, ms }
  const [genBusy, setGenBusy] = useState(false);
  const [genOpts, setGenOpts] = useState({ start: "", end: "", bestOf: 200, seed: "", respectLocks: true });
  const [profilesErr, setProfilesErr] = useState("");       // Users card: failed != empty
  const [profilesLoading, setProfilesLoading] = useState(false);
  const [availBusy, setAvailBusy] = useState(false);
  const [eastRefreshing, setEastRefreshing] = useState(false);
  const [seedState, setSeedState] = useState({ fileName: "", plan: null, diff: null, live: null, error: "", applying: false, result: null, loading: false });
  const [vacConflict, setVacConflict] = useState(null);     // { personId, items: [{ day, role }] } from the last refused vacation

  const [loaded, setLoaded] = useState(false);
  // Bumped after a successful login/biometric-unlock to re-run the data-load
  // effect WITH the now-stored session JWT, without a full page reload (a
  // page reload re-triggers the mount auth-gate and loops on biometric).
  const [reloadTrigger, setReloadTrigger] = useState(0);
  const [saveStatus, setSaveStatus] = useState("");
  const [saveError, setSaveError] = useState(false); // true = last save failed
  const importFileRef = useRef(null);
  // --- Sync refs ---
  // lastSyncRef: the schedule map as LAST KNOWN PERSISTED in schedule_days
  // (per day). syncScheduleDays diffs the in-memory map against it; only days
  // whose write landed advance it, so a failed day is retried next pass.
  const lastSyncRef = useRef(null);
  // dayVersionsRef: { day: version } last seen from the table, for the
  // per-day compare-and-swap writes.
  const dayVersionsRef = useRef({});
  // blobTsRef: call_schedule_data.updated_at of the last blob read/write -
  // the self-echo check for the background refresh.
  const blobTsRef = useRef(null);
  const loadedAtRef = useRef(null); // timestamp when initial load completed - prevents auto-save race
  const pendingSaveRef = useRef(null); // payload queued for debounced save; flushed immediately on page hide/unload
  const daySyncChainRef = useRef(Promise.resolve()); // serializes syncScheduleDays runs
  const daySyncRetryRef = useRef(null); // auto-retry timer after a failed day write
  // --- Data-loss guard refs ---
  // everHadRealDataRef arms the empty-save guard: it flips true the first time
  // we observe real operational data (schedule days / vacations / availability)
  // from the DB or build it locally. Once armed, a "wiped" autosave payload is
  // refused.
  const everHadRealDataRef = useRef(false);
  // allowWipeSaveRef is a one-shot bypass set by deliberate destructive ops
  // (factory reset) so their intended empty write isn't blocked by the guard.
  const allowWipeSaveRef = useRef(false);
  // loadFailedRef is true when the schedule_days read THREW (network/transient
  // error), as opposed to returning an empty table. A session that couldn't
  // read must not autosave - otherwise a privileged session with degraded
  // state could overwrite real data. Cleared by any later successful
  // schedule_days read (mount retry or the 60s refresh).
  const loadFailedRef = useRef(false);
  // blobLoadedRef is true only after a call_schedule_data read SUCCEEDED this
  // session (mount, background refresh, or a restore/reset we wrote ourselves).
  // It gates the blob leg of autosave and the keepalive flush INDEPENDENTLY of
  // loadFailedRef: a session whose blob read failed but whose days read later
  // succeeded used to adopt the schedule, fire the autosave and upsert
  // { roster: INIT_SURGEONS, settings: {}, lastPublished: null } over the real
  // blob (surgeonRules / groupRules / holidays undefined locally -> dropped by
  // JSON.stringify -> replaced wholesale). Finding safety-2 / datalayer-002.
  const blobLoadedRef = useRef(false);
  // intentionalScheduleWipeRef is a one-shot set by clearSchedule and the
  // restore/import applier immediately before they call syncScheduleDays with
  // a map that legitimately empties many populated days. Any OTHER attempt to
  // null out most of the populated primaries (a failed load, a transient
  // render, a stale tab) is treated as an accidental wipe and refused. This is
  // the table-side mirror of the blob's payloadLooksWiped protection; its
  // absence is how the Davenport schedule got wiped twice.
  const intentionalScheduleWipeRef = useRef(false);
  const scheduleRef = useRef({});
  useEffect(() => { scheduleRef.current = schedule; }, [schedule]);

  // --- Office Notifications ---
  const [officeContacts, setOfficeContacts] = useState([]);
  const [newOfficeName, setNewOfficeName] = useState("");
  const [newOfficeEmail, setNewOfficeEmail] = useState("");
  const [newOfficeRole, setNewOfficeRole] = useState("");
  const [officeNotifBusy, setOfficeNotifBusy] = useState(false);
  const [showPublishDialog, setShowPublishDialog] = useState(false);
  const [publishLabel, setPublishLabel] = useState("");
  const [publishChanges, setPublishChanges] = useState([]); // diffScheduleDays output (primary/backup only)

  // --- Shift Trade Requests (by day + role) ---
  const [tradeRequests, setTradeRequests] = useState([]);
  const [tradeFrom, setTradeFrom] = useState("");

  const [updateAvailable, setUpdateAvailable] = useState(null); // newer version string | null

        if (!res.ok) { console.warn(`version check: version.json answered HTTP ${res.status} (ignored until the next check)`); return; }

        const v = j && j.version;
        if (typeof v !== "string" || !/^\d{4}\.\d{2}\.\d{2}[a-z]*$/.test(v)) return;
        if (versionCmp(APP_VERSION, v) < 0 && v !== updateDismissedRef.current) {

  const fetchProfile = async (userId) => {

  const rosterPool = useMemo(() => surgeons.filter(s => s.type !== "external"), [surgeons]);

  const logAudit = (action, summary, details) => {

    catch (e) { console.warn("fmtAuditTime: could not format", iso, e); return iso; }

  const loadClientVersions = async () => {

      if (!res.ok) throw new Error(`HTTP ${res.status} ${(await res.text().catch(() => "")).slice(0, 200)}`);

  // rolls z->aa on the 27th same-day push). Suffixes order by length THEN
  // lexically, which keeps the comparison monotonic across the rollover.
  const versionCmp = (a, b) => {
    const da = String(a).slice(0, 10), db2 = String(b).slice(0, 10);
    if (da !== db2) return da < db2 ? -1 : 1;
    const sa = String(a).slice(10), sb = String(b).slice(10);
    if (sa.length !== sb.length) return sa.length - sb.length;
    return sa === sb ? 0 : (sa < sb ? -1 : 1);

  // ====================================================================
  const adoptTimeOffRows = (rows) => {

  const loadTimeOff = async (quiet) => {

  // others, and a failed table keeps its previous rows (marked "failed").
  const loadEastTables = async (quiet) => {
    const one = async (table, order, set, key) => {
      try {
        const rows = await db.query(table, { order });
        set(Array.isArray(rows) ? rows : []);
        setEastLoadState(s => ({ ...s, [key]: "ok" }));

      } catch (e) {
        console.warn(`${table} load failed`, e);
        setEastLoadState(s => ({ ...s, [key]: "failed" }));
        return false;
      }
    };
    const r = await Promise.all([
      one("east_feed", "week_monday.asc", setEastFeedRows, "feed"),
      one("east_forecast", "week_monday.asc", setEastForecastRows, "forecast"),
      one("east_overrides", "day.asc", setEastOverrideRows, "overrides"),
    ]);
    if (!quiet && r.some(x => !x)) showToast("Couldn't load the East (Davenport) feed cache - East status shows as unknown until it loads.", "error");
    return r.every(Boolean);
  };

  // Days in [start, end] where the person is published (primary or backup),
  // plus the day BEFORE the range when they are primary (the 07:00 handoff
  // falls on the first vacation day). Mirrors the DB trigger so the refusal is
  // explained before the round trip; the trigger is the real gate.
  const vacationConflictItems = (personId, start, end) => {
    const out = [];
    const sched = scheduleRef.current || {};
    const before = fmt(addD(parse(start), -1));
    if (sched[before] && sched[before].primary === personId) out.push({ day: before, role: "primary" });
    for (let d = parse(start); fmt(d) <= end; d = addD(d, 1)) {
      const ds = fmt(d), a = sched[ds];
      if (!a) continue;
      if (a.primary === personId) out.push({ day: ds, role: "primary" });
      else if (a.backup === personId) out.push({ day: ds, role: "backup" });
    }
    return out;
  };
  const vacationConflicts = (personId, start, end) => vacationConflictItems(personId, start, end).map(c => `${fmtMD(c.day)} (${c.role})`);
  const describeDbError = (err) => {
    const s = typeof err === "string" ? err : JSON.stringify(err || {});
    // A raised message from our own triggers / functions (ON_CALL_CONFLICT from
    // the time_off trigger, TRADE_STALE / TRADE_NOT_PENDING / TRADE_FORBIDDEN /
    // TRADE_IMMUTABLE / TRADE_NOT_ACCEPTED / TRADE_NOT_FOUND from the trade
    // guard and apply_trade) is shown VERBATIM (PostgREST wraps it as
    // { message, code, details, hint }).
    const OWN = /ON_CALL_CONFLICT|TRADE_[A-Z_]+|CLAIM_[A-Z_]+/; // CLAIM_* = claim_open_slot's nine refusals (Prompt 13 part 2), shown verbatim
    if (OWN.test(s)) {
      let verbatim = "";
      try { const o = typeof err === "string" ? JSON.parse(err) : err; verbatim = String((o && (o.message || o.details)) || ""); } catch (e) { console.warn("describeDbError: error body is not JSON - extracting the raised message by regex", e); verbatim = ""; }
      if (!OWN.test(verbatim)) { const m = /(ON_CALL_CONFLICT|TRADE_[A-Z_]+|CLAIM_[A-Z_]+)[^"}\\]*/.exec(s); verbatim = m ? m[0] : s.slice(0, 240); }
      return verbatim;
    }
    if (/23514|check constraint|distinct/i.test(s)) return "The database refused the change (a check constraint failed - e.g. the same person in both roles on one day): " + s.slice(0, 160);
    if (/42501|row-level security/i.test(s)) return "Your account doesn't have permission for that.";
    if (/JWT|401/.test(s)) return "Your session expired - sign in again.";
    return s.slice(0, 200);
  };
  // Scheduler / admin person ids for targeted notifications. Uses the loaded
  // profiles when present; otherwise reads user_profiles (authenticated read,
  // any signed-in user) so a surgeon's own session can still address the
  // scheduler. A failed read is reported (console + toast) and returns null -
  // the caller skips the email rather than broadcasting or failing silently.
  const schedulerIdsLoud = async () => {
    if (schedulerAdminIds.length) return schedulerAdminIds;
    try {
      const res = await fetch(`${SUPABASE_URL}/rest/v1/user_profiles?select=person_id,role&role=in.(scheduler,admin)&person_id=not.is.null`, { headers: dbAuthHeaders() });
      if (!res.ok) throw new Error(`HTTP ${res.status} ${(await res.text().catch(() => "")).slice(0, 160)}`);
      const rows = await res.json();
      return [...new Set((Array.isArray(rows) ? rows : []).map(r => r && r.person_id).filter(Boolean))];
    } catch (e) {
      console.warn("scheduler lookup failed - the email to the scheduler was skipped:", e);
      showToast("Couldn't look up the scheduler's account - the in-app note was posted but no email was sent.", "error");
      return null;
    }
  };
  // Insert FIRST, adopt on success (no optimistic entry: the trigger may refuse).
  const toAdd = async (personId, start, end, note) => {
    if (!personId || !start || !end) return { ok: false, error: "missing fields" };
    if (end < start) { showToast("End date is before the start date.", "error"); return { ok: false, error: "range" }; }
    const conflictItems = vacationConflictItems(personId, start, end);
    const conflicts = conflictItems.map(c => `${fmtMD(c.day)} (${c.role})`);
    if (conflicts.length) {
      const msg = `${nameOf(personId)} is on call ${conflicts.join(", ")} - trade those shifts before entering this vacation.`;
      setVacConflict({ personId, start, end, items: conflictItems });
      showToast(msg, "error");
      return { ok: false, error: msg, conflicts };
    }
    setVacConflict(null);
    try {
      const { data, error } = await db.insert("time_off", {
        person_id: personId, start_date: start, end_date: end, note: (note || "").trim() || null,
        created_by: userProfile?.person_id || authUser?.id || null,
      });
      if (error || !data) {
        console.warn("time_off insert error", error);
        showToast("Couldn't save the vacation: " + describeDbError(error), "error");
        return { ok: false, error: describeDbError(error) };
      }
      adoptTimeOffRows([...timeOffRows, data]);
      logAudit("timeoff.add", `Added vacation for ${nameOf(personId)}: ${start}${start !== end ? " -> " + end : ""}`, { person_id: personId, start, end, note: (note || "").trim() || null });
      // In-app note for the scheduler(s) + the composed email text (send-notification
      // renders data.message and rejects a payload without it).
      const actor = userProfile?.person_id || null;
      const msg = vacationLoggedMsg(nameOf(personId), start, end, (note || "").trim()) + (actor && actor !== personId ? " - entered by " + nameOf(actor) : "");
      addNotification("vacation_logged", "Vacation logged", msg, { surgeon_id: personId, entered_by: actor });
      (async () => {
        const ids = await schedulerIdsLoud();
        if (ids && ids.length) sendEmailNotif("vacation_logged", { message: msg, subject: "Vacation logged - " + nameOf(personId) }, ids.filter(id => id !== personId));
      })();
      return { ok: true, row: data };
    } catch (e) {
      console.warn("time_off insert ex", e);
      showToast("Couldn't save the vacation - check your connection and try again.", "error");
      return { ok: false, error: String(e) };
    }
  };
  const deleteTimeOffRow = async (rowId) => {
    try {
      const res = await fetch(`${SUPABASE_URL}/rest/v1/time_off?id=eq.${encodeURIComponent(rowId)}`, { method: "DELETE", headers: dbAuthHeaders() });
      if (!res.ok) {
        const t = await res.text().catch(() => "");
        console.warn("time_off delete failed", res.status, t);
        showToast("Couldn't remove that vacation: " + describeDbError(t), "error");
        return { ok: false };
      }
      return { ok: true };
    } catch (e) { console.warn("time_off delete ex", e); showToast("Couldn't remove that - check your connection and try again.", "error"); return { ok: false }; }
  };
  const toRemove = async (personId, rowId) => {
    const row = timeOffRows.find(r => r.id === rowId);
    // Self-service covers FUTURE vacations only; a past or started one is a
    // record (the scheduler can still remove it).
    if (!isScheduler && personId !== mySurgeon) { showToast("You can only remove your own vacations.", "error"); return { ok: false }; }
    if (!isScheduler && row && String(row.start_date).slice(0, 10) <= todayStr) { showToast("That vacation has started or passed - it stays on record. Ask the scheduler if it needs to go.", "error"); return { ok: false }; }
    const r = await deleteTimeOffRow(rowId);
    if (!r.ok) return r;
    adoptTimeOffRows(timeOffRows.filter(x => x.id !== rowId));
    // Always audited - the DELETE succeeded even when the local list was stale
    // and no longer held the row (then the ids stand in for the dates).
    if (row) logAudit("timeoff.remove", `Removed vacation for ${nameOf(personId)}: ${row.start_date}${row.start_date !== row.end_date ? " -> " + row.end_date : ""}`, { person_id: personId, row_id: rowId, start: row.start_date, end: row.end_date });
    else logAudit("timeoff.remove", `Removed vacation row ${rowId} for ${nameOf(personId)} (dates unknown - the local list was stale)`, { person_id: personId, row_id: rowId });
    return r;
  };
  const toEdit = async (personId, rowId, newStart, newEnd) => {
    if (!newStart || !newEnd) return { ok: false };
    const conflicts = vacationConflicts(personId, newStart, newEnd);
    if (conflicts.length) { showToast(`${nameOf(personId)} is on call ${conflicts.join(", ")} - trade first.`, "error"); return { ok: false }; }
    const old = timeOffRows.find(r => r.id === rowId);
    try {
      const res = await fetch(`${SUPABASE_URL}/rest/v1/time_off?id=eq.${encodeURIComponent(rowId)}`, {
        method: "PATCH", headers: { ...dbAuthHeaders(), Prefer: "return=representation" },
        body: JSON.stringify({ start_date: newStart, end_date: newEnd }),
      });
      if (!res.ok) { const t = await res.text().catch(() => ""); console.warn("time_off update error", res.status, t); showToast("Couldn't save that change: " + describeDbError(t), "error"); return { ok: false }; }
      const rows = await res.json().catch(() => []);
      const updated = rows[0] || { ...old, start_date: newStart, end_date: newEnd };
      adoptTimeOffRows(timeOffRows.map(r => r.id === rowId ? updated : r));
      logAudit("timeoff.edit", `Changed vacation for ${nameOf(personId)}: ${old ? old.start_date + "->" + old.end_date : "?"} to ${newStart}->${newEnd}`, { person_id: personId, row_id: rowId, before: old ? { start: old.start_date, end: old.end_date } : null, start: newStart, end: newEnd });
      return { ok: true };
    } catch (e) { console.warn("time_off edit ex", e); showToast("Couldn't save that change - check your connection and try again.", "error"); return { ok: false }; }
  };

  // ====================================================================
  // SCHEDULE STORAGE: schedule_days is the sole source. One row per day,
  // compare-and-swap on `version`. The blob never carries the schedule.
  // ====================================================================
  const DAY_PAGE = 1000; // PostgREST max-rows default; page through it
  // Load every row. Throws on any non-2xx (an RLS-blocked read is 200 + [] and
  // is data, not failure). Returns { sched, vers, count }.
  const loadScheduleDays = async () => {
    const sched = {}, vers = {};
    let offset = 0, count = 0;
    for (;;) {
      const res = await fetch(`${SUPABASE_URL}/rest/v1/schedule_days?select=*&order=day.asc&limit=${DAY_PAGE}&offset=${offset}`, { headers: dbReadHeaders() });
      if (!res.ok) throw new Error(`schedule_days load failed: HTTP ${res.status} ${(await res.text().catch(() => "")).slice(0, 200)}`);
      const rows = await res.json();
      if (!Array.isArray(rows)) throw new Error("schedule_days load: unexpected response body");
      rows.forEach(r => { sched[r.day] = dayRowToAssignment(r); vers[r.day] = r.version; });
      count += rows.length;
      if (rows.length < DAY_PAGE) break;
      offset += DAY_PAGE;
    }
    if (count > 0) everHadRealDataRef.current = true; // real data confirmed -> arm the empty-save guard
    return { sched, vers, count };
  };
  const adoptLoadedDays = (loadedDays) => {
    setSchedule(loadedDays.sched);
    scheduleRef.current = loadedDays.sched;
    dayVersionsRef.current = loadedDays.vers;
    lastSyncRef.current = JSON.parse(JSON.stringify(loadedDays.sched));
  };
  const sameAssignment = (day, a, b) => JSON.stringify(assignmentToDayRow(day, a || emptyDayAssignment())) === JSON.stringify(assignmentToDayRow(day, b || emptyDayAssignment()));
  const writeFailToast = (status, body) => {
    const s = String(body || "");
    if (/schedule_days_distinct_roles|23514/.test(s)) return "Primary and backup must be different people - change not saved.";
    if (/42501|row-level security|\b403\b/.test(s) || status === 403) return "Couldn't save the schedule - your account doesn't have permission.";
    if (status === 401 || /JWT|expired/i.test(s)) return "Couldn't save the schedule - your session expired. Sign in again.";
    return "Couldn't save schedule changes - check your connection.";
  };
  const postDayRow = async (row, by, ts) => {
    const r = await fetch(`${SUPABASE_URL}/rest/v1/schedule_days`, {
      method: "POST", headers: { ...dbAuthHeaders(), Prefer: "return=representation" },
      body: JSON.stringify({ ...row, version: 1, updated_by: by, updated_at: ts }),
    });
    if (r.status === 409) return { duplicate: true };
    if (!r.ok) return { error: await r.text().catch(() => ""), status: r.status };
    const a = await r.json().catch(() => []);
    return { version: (a[0] && a[0].version) || 1 };
  };
  const patchDayRow = async (row, ver, by, ts) => {
    const r = await fetch(`${SUPABASE_URL}/rest/v1/schedule_days?day=eq.${row.day}&version=eq.${ver}`, {
      method: "PATCH", headers: { ...dbAuthHeaders(), Prefer: "return=representation" },
      body: JSON.stringify({ ...row, version: ver + 1, updated_by: by, updated_at: ts }),
    });
    if (!r.ok) return { error: await r.text().catch(() => ""), status: r.status };
    const a = await r.json().catch(() => []);
    if (!Array.isArray(a) || a.length === 0) return { conflict: true }; // version moved underneath us
    return { version: a[0].version };
  };
  const fetchDayRow = async (day) => {
    const r = await fetch(`${SUPABASE_URL}/rest/v1/schedule_days?day=eq.${day}&select=*`, { headers: dbAuthHeaders() });
    if (!r.ok) return null;
    const a = await r.json().catch(() => []);
    return Array.isArray(a) ? (a[0] || null) : null;
  };

  // The ONLY steady-state writer of schedule_days. Serialized: two runs never
  // interleave. Diff vs lastSyncRef; wipe guard; per changed day: unknown
  // version -> POST v1 (409 -> adopt the row's version, retry once as PATCH);
  // known version N -> PATCH ?day&version=N with version N+1; zero rows back
  // -> conflict -> reload the table, keep local edits that don't collide.
  // Rows are NEVER deleted here; a day dropped from memory is written empty.
  const syncScheduleDays = (nextSchedule) => {
    const run = daySyncChainRef.current.then(() => syncScheduleDaysNow(nextSchedule)).catch(e => {
      console.warn("schedule_days sync error", e);
      showToast("Couldn't save schedule changes - check your connection.", "error");
      return { ok: false, error: String(e) };
    });
    daySyncChainRef.current = run.then(() => undefined, () => undefined);
    return run;
  };
  const syncScheduleDaysNow = async (nextSchedule) => {
    if (!nextSchedule) return { ok: false, error: "no schedule" };
    const prev = lastSyncRef.current || {};
    const next = nextSchedule;
    // -- Accidental-wipe guard (schedule_days) --
    // A map that nulls out most of the populated primaries must never reach
    // the table unless clearSchedule / restore armed the one-shot.
    const chk = scheduleWipeCheck(prev, next);
    if (chk.wipe && !intentionalScheduleWipeRef.current) {
      console.warn(`schedule_days wipe BLOCKED: ${chk.removed} of ${chk.baseline} populated primaries would be emptied. Refusing - not an intentional clear.`);
      setSaveError(true);
      setSaveStatus("Wipe blocked - schedule not changed");
      showToast("Blocked an unexpected schedule wipe - your saved schedule is safe. Reload to resync.", "error");
      return { ok: false, error: "wipe blocked", blocked: true }; // lastSyncRef untouched; nothing written
    }
    // Consume the one-shot UNCONDITIONALLY once past the gate (wipe or no
    // wipe): the grant's window is over. Pinned in data-layer.test.js section E.
    intentionalScheduleWipeRef.current = false;
    const changed = [];
    for (const day of Object.keys(Object.assign({}, prev, next)).sort()) {
      if (!sameAssignment(day, prev[day], next[day])) changed.push(day);
    }
    if (changed.length === 0) return { ok: true, changed: 0 };
    const ts = new Date().toISOString();
    const by = userProfile?.person_id || authUser?.id || null;
    const persisted = JSON.parse(JSON.stringify(prev));
    let conflict = false, failed = 0, failMsg = "", written = 0;
    for (const day of changed) {
      const a = next[day] || emptyDayAssignment();
      const row = assignmentToDayRow(day, a);
      const ver = dayVersionsRef.current[day];
      let r;
      if (ver === undefined) {
        r = await postDayRow(row, by, ts);
        if (r.duplicate) {
          // The row exists (another device created it, or our version map is
          // stale): adopt its version and retry ONCE as a CAS update.
          const cur = await fetchDayRow(day);
          if (cur && typeof cur.version === "number") {
            dayVersionsRef.current[day] = cur.version;
            r = await patchDayRow(row, cur.version, by, ts);
          } else {
            r = { error: "duplicate day and re-read failed", status: 409 };
          }
        }
      } else {
        r = await patchDayRow(row, ver, by, ts);
      }
      if (r.error !== undefined) {
        failed++; failMsg = writeFailToast(r.status, r.error);
        console.warn("schedule_days write failed", day, r.status, String(r.error).slice(0, 200));
        continue; // this day stays un-advanced in lastSyncRef -> retried next pass
      }
      if (r.conflict) { conflict = true; continue; }
      dayVersionsRef.current[day] = r.version;
      persisted[day] = JSON.parse(JSON.stringify(a));
      written++;
    }
    lastSyncRef.current = persisted;
    if (failed) {
      setSaveError(true);
      setSaveStatus("Save failed - retrying");
      showToast(failMsg, "error");
      scheduleDaySyncRetry();
    } else if (written) {
      setSaveError(false);
      setSaveStatus("Saved");
      setTimeout(() => setSaveStatus(""), 2000);
    }
    if (conflict) {
      // Someone else wrote one of these days first. Pull the authoritative
      // table, keep our non-colliding local edits (they re-sync on the next
      // pass), adopt theirs where both sides changed - never a silent clobber.
      try {
        const fresh = await loadScheduleDays();
        const local = scheduleRef.current || {};
        const merged = { ...fresh.sched };
        let kept = 0;
        for (const day of Object.keys(local)) {
          const localChanged = !sameAssignment(day, local[day], prev[day]);
          const serverChanged = !sameAssignment(day, fresh.sched[day], prev[day]);

        }

        lastSyncRef.current = JSON.parse(JSON.stringify(fresh.sched));

      } catch (e) {
        console.warn("conflict reload failed", e);
        showToast("A day was changed by someone else and the reload failed - reload the app.", "error");

  const scheduleDaySyncRetry = () => {
    if (daySyncRetryRef.current) clearTimeout(daySyncRetryRef.current);

      if (loadFailedRef.current || isPublicMode) return;
      syncScheduleDays(scheduleRef.current);
    }, 5000);
  };

  // Adopt the config blob field-by-field (mount load, background refresh,
  // restore). Weekly-model keys are ignored on purpose.
  const adoptBlob = (d) => {
    if (!d || typeof d !== "object") return;
    if (Array.isArray(d.roster) && d.roster.length) setSurgeons(d.roster);
    if (d.surgeonRules !== undefined) setSurgeonRules(d.surgeonRules);
    if (d.groupRules !== undefined) setGroupRules(d.groupRules);
    if (d.holidays !== undefined) setHolidays(d.holidays);
    if (d.settings && typeof d.settings === "object") setSettings(d.settings);
    if (d.lastPublished !== undefined) setLastPublished(d.lastPublished);
    if (d.lastGenerate !== undefined) setLastGenerate(d.lastGenerate);
  };

  // --- Supabase: Load on mount + real-time sync ---
  useEffect(() => {
    (async () => {
      loadFailedRef.current = false; // reset each load attempt
      // Leg A - the config blob. Its OWN try: a failure leaves blobLoadedRef
      // false (the blob leg of autosave stays off) but must not stop the
      // schedule from loading. A missing row (fresh install) is a SUCCESSFUL
      // read: there is nothing to protect, so writing defaults is correct.
      try {
        const { data: row } = await supabase
          .from("call_schedule_data")
          .select("data,updated_at")
          .eq("id", "main")
          .single();
        blobLoadedRef.current = true;
        if (row?.data) {
          const d = typeof row.data === "string" ? JSON.parse(row.data) : row.data;
          if (row.updated_at) blobTsRef.current = row.updated_at; // prevent auto-save from re-saving unchanged data
          adoptBlob(d);
        }
      } catch (e) {
        console.error("Supabase load error (call_schedule_data):", e);
        showToast("Couldn't load the shared setup (roster/rules) - check your connection and reload. Setup changes won't save until it loads.", "error");
      }
      try {
        // Leg B - the schedule itself: schedule_days (throws on failure -> the
        // catch arms loadFailedRef, which suppresses autosave until a read
        // succeeds).
