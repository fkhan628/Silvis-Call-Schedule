  };

  // ====================================================================
  // TIME OFF = VACATIONS ONLY. Source: the time_off table. One row per range;
  // no approval, no kinds. Writes go through the helpers below and nowhere else.
  // ====================================================================
  const adoptTimeOffRows = (rows) => {
    setTimeOffRows(rows);
    setVacations(buildTimeOffMaps(rows));
    if (rows.length > 0) everHadRealDataRef.current = true;
  };
  // quiet=true (the 60s poll) logs failures console-only - a transient outage
  // must not toast once a minute; the initial load and realtime path stay loud.
  const loadTimeOff = async (quiet) => {
    try {
      const rows = await db.query("time_off", { order: "start_date.asc" });
      adoptTimeOffRows(Array.isArray(rows) ? rows : []);
      return true;
    } catch (e) {
      console.warn("time_off load failed", e);
      if (!quiet) showToast("Couldn't load vacations - data shown may be incomplete.", "error");
      return false;
    }
  };
  const loadAvailability = async (quiet) => {
    try {
      const rows = await db.query("availability", { order: "start_date.asc" });
      const list = Array.isArray(rows) ? rows : [];
      setAvailabilityRows(list);
      if (list.length > 0) everHadRealDataRef.current = true;
      return true;
    } catch (e) {
      console.warn("availability load failed", e);
      if (!quiet) showToast("Couldn't load availability statements - data shown may be incomplete.", "error");
      return false;
    }
  };
  // The three East tables, each in its own try: one failure cannot blank the
  // others, and a failed table keeps its previous rows (marked "failed").
  const loadEastTables = async (quiet) => {
    const one = async (table, order, set, key) => {
      try {
        const rows = await db.query(table, { order });
        set(Array.isArray(rows) ? rows : []);
        setEastLoadState(s => ({ ...s, [key]: "ok" }));
        return true;
      } catch (e) {
        console.warn(`${table} load failed`, e);
        setEastLoadState(s => ({ ...s, [key]: "failed" }));
        return false;
      }
    };
    const r = await Promise.all([
      one("east_feed", "week_monday.asc", setEastFeedRows, "feed"),
      one("east_forecast", "week_monday.asc", setEastForecastRows, "forecast"),
      one("east_overrides", "day.asc", setEastOverrideRows, "overrides"),
    ]);
    if (!quiet && r.some(x => !x)) showToast("Couldn't load the East (Davenport) feed cache - East status shows as unknown until it loads.", "error");
    return r.every(Boolean);
  };

  // Days in [start, end] where the person is published (primary or backup),
  // plus the day BEFORE the range when they are primary (the 07:00 handoff
  // falls on the first vacation day). Mirrors the DB trigger so the refusal is
  // explained before the round trip; the trigger is the real gate.
  const vacationConflicts = (personId, start, end) => {
    const out = [];
    const sched = scheduleRef.current || {};
    const before = fmt(addD(parse(start), -1));
    if (sched[before] && sched[before].primary === personId) out.push(`${fmtMD(before)} (primary)`);
    for (let d = parse(start); fmt(d) <= end; d = addD(d, 1)) {
      const ds = fmt(d), a = sched[ds];
      if (!a) continue;
      if (a.primary === personId) out.push(`${fmtMD(ds)} (primary)`);
      else if (a.backup === personId) out.push(`${fmtMD(ds)} (backup)`);
    }
    return out;
  };
  const describeDbError = (err) => {
    const s = typeof err === "string" ? err : JSON.stringify(err || {});
    if (/ON_CALL_CONFLICT/.test(s)) {
      const m = /ON_CALL_CONFLICT: (.*?)"?(,|}|$)/.exec(s);
      return "On call during that range - trade those shifts first. " + (m ? m[1] : "");
    }
    if (/42501|row-level security/i.test(s)) return "Your account doesn't have permission for that.";
    if (/JWT|401/.test(s)) return "Your session expired - sign in again.";
    return s.slice(0, 200);
  };
  // Insert FIRST, adopt on success (no optimistic entry: the trigger may refuse).
  const toAdd = async (personId, start, end, note) => {
    if (!personId || !start || !end) return { ok: false, error: "missing fields" };
    if (end < start) { showToast("End date is before the start date.", "error"); return { ok: false, error: "range" }; }
    const conflicts = vacationConflicts(personId, start, end);
    if (conflicts.length) {
      const msg = `${nameOf(personId)} is on call ${conflicts.join(", ")} - trade those shifts before entering this vacation.`;
      showToast(msg, "error");
      return { ok: false, error: msg, conflicts };
    }
    try {
      const { data, error } = await db.insert("time_off", {
        person_id: personId, start_date: start, end_date: end, note: (note || "").trim() || null,
        created_by: userProfile?.person_id || authUser?.id || null,
      });
      if (error || !data) {
        console.warn("time_off insert error", error);
        showToast("Couldn't save the vacation: " + describeDbError(error), "error");
        return { ok: false, error: describeDbError(error) };
      }
      adoptTimeOffRows([...timeOffRows, data]);
      logAudit("vacation.add", `Added vacation for ${nameOf(personId)}: ${start}${start !== end ? " -> " + end : ""}`, { person_id: personId, start, end });
      addNotification("vacation_logged", "Vacation logged", `${nameOf(personId)}: ${fmtMD(start)}${start !== end ? " - " + fmtMD(end) : ""}`, { surgeon_id: personId });
      return { ok: true, row: data };
    } catch (e) {
      console.warn("time_off insert ex", e);
      showToast("Couldn't save the vacation - check your connection and try again.", "error");
      return { ok: false, error: String(e) };
    }
  };
  const deleteTimeOffRow = async (rowId) => {
    try {
      const res = await fetch(`${SUPABASE_URL}/rest/v1/time_off?id=eq.${encodeURIComponent(rowId)}`, { method: "DELETE", headers: dbAuthHeaders() });
      if (!res.ok) {
        const t = await res.text().catch(() => "");
        console.warn("time_off delete failed", res.status, t);
        showToast("Couldn't remove that vacation: " + describeDbError(t), "error");
        return { ok: false };
      }
      return { ok: true };
    } catch (e) { console.warn("time_off delete ex", e); showToast("Couldn't remove that - check your connection and try again.", "error"); return { ok: false }; }
  };
  const toRemove = async (personId, rowId) => {
    const row = timeOffRows.find(r => r.id === rowId);
    const r = await deleteTimeOffRow(rowId);
    if (!r.ok) return r;
    adoptTimeOffRows(timeOffRows.filter(x => x.id !== rowId));
    if (row) logAudit("vacation.remove", `Removed vacation for ${nameOf(personId)}: ${row.start_date}${row.start_date !== row.end_date ? " -> " + row.end_date : ""}`, { person_id: personId, start: row.start_date, end: row.end_date });
    return r;
  };
  const toEdit = async (personId, rowId, newStart, newEnd) => {
    if (!newStart || !newEnd) return { ok: false };
    const conflicts = vacationConflicts(personId, newStart, newEnd);
    if (conflicts.length) { showToast(`${nameOf(personId)} is on call ${conflicts.join(", ")} - trade first.`, "error"); return { ok: false }; }
    const old = timeOffRows.find(r => r.id === rowId);
    try {
      const res = await fetch(`${SUPABASE_URL}/rest/v1/time_off?id=eq.${encodeURIComponent(rowId)}`, {
        method: "PATCH", headers: { ...dbAuthHeaders(), Prefer: "return=representation" },
        body: JSON.stringify({ start_date: newStart, end_date: newEnd }),
      });
      if (!res.ok) { const t = await res.text().catch(() => ""); console.warn("time_off update error", res.status, t); showToast("Couldn't save that change: " + describeDbError(t), "error"); return { ok: false }; }
      const rows = await res.json().catch(() => []);
      const updated = rows[0] || { ...old, start_date: newStart, end_date: newEnd };
      adoptTimeOffRows(timeOffRows.map(r => r.id === rowId ? updated : r));
      logAudit("vacation.edit", `Changed vacation for ${nameOf(personId)}: ${old ? old.start_date + "->" + old.end_date : "?"} to ${newStart}->${newEnd}`, { person_id: personId, newStart, newEnd });
      return { ok: true };
    } catch (e) { console.warn("time_off edit ex", e); showToast("Couldn't save that change - check your connection and try again.", "error"); return { ok: false }; }
  };

  // ====================================================================
  // SCHEDULE STORAGE: schedule_days is the sole source. One row per day,
  // compare-and-swap on `version`. The blob never carries the schedule.
  // ====================================================================
  const DAY_PAGE = 1000; // PostgREST max-rows default; page through it
  // Load every row. Throws on any non-2xx (an RLS-blocked read is 200 + [] and
  // is data, not failure). Returns { sched, vers, count }.
  const loadScheduleDays = async () => {
    const sched = {}, vers = {};
    let offset = 0, count = 0;
    for (;;) {
      const res = await fetch(`${SUPABASE_URL}/rest/v1/schedule_days?select=*&order=day.asc&limit=${DAY_PAGE}&offset=${offset}`, { headers: dbReadHeaders() });
      if (!res.ok) throw new Error(`schedule_days load failed: HTTP ${res.status} ${(await res.text().catch(() => "")).slice(0, 200)}`);
      const rows = await res.json();
      if (!Array.isArray(rows)) throw new Error("schedule_days load: unexpected response body");
      rows.forEach(r => { sched[r.day] = dayRowToAssignment(r); vers[r.day] = r.version; });
      count += rows.length;
      if (rows.length < DAY_PAGE) break;
      offset += DAY_PAGE;
    }
    if (count > 0) everHadRealDataRef.current = true; // real data confirmed -> arm the empty-save guard
    return { sched, vers, count };
  };
  const adoptLoadedDays = (loadedDays) => {
    setSchedule(loadedDays.sched);
    scheduleRef.current = loadedDays.sched;
    dayVersionsRef.current = loadedDays.vers;
    lastSyncRef.current = JSON.parse(JSON.stringify(loadedDays.sched));
  };
  const sameAssignment = (day, a, b) => JSON.stringify(assignmentToDayRow(day, a || emptyDayAssignment())) === JSON.stringify(assignmentToDayRow(day, b || emptyDayAssignment()));
  const writeFailToast = (status, body) => {
    const s = String(body || "");
    if (/schedule_days_distinct_roles|23514/.test(s)) return "Primary and backup must be different people - change not saved.";
    if (/42501|row-level security|\b403\b/.test(s) || status === 403) return "Couldn't save the schedule - your account doesn't have permission.";
    if (status === 401 || /JWT|expired/i.test(s)) return "Couldn't save the schedule - your session expired. Sign in again.";
    return "Couldn't save schedule changes - check your connection.";
  };
  const postDayRow = async (row, by, ts) => {
    const r = await fetch(`${SUPABASE_URL}/rest/v1/schedule_days`, {
      method: "POST", headers: { ...dbAuthHeaders(), Prefer: "return=representation" },
      body: JSON.stringify({ ...row, version: 1, updated_by: by, updated_at: ts }),
    });
    if (r.status === 409) return { duplicate: true };
    if (!r.ok) return { error: await r.text().catch(() => ""), status: r.status };
    const a = await r.json().catch(() => []);
    return { version: (a[0] && a[0].version) || 1 };
  };
  const patchDayRow = async (row, ver, by, ts) => {
    const r = await fetch(`${SUPABASE_URL}/rest/v1/schedule_days?day=eq.${row.day}&version=eq.${ver}`, {
      method: "PATCH", headers: { ...dbAuthHeaders(), Prefer: "return=representation" },
      body: JSON.stringify({ ...row, version: ver + 1, updated_by: by, updated_at: ts }),
    });
    if (!r.ok) return { error: await r.text().catch(() => ""), status: r.status };
    const a = await r.json().catch(() => []);
    if (!Array.isArray(a) || a.length === 0) return { conflict: true }; // version moved underneath us
    return { version: a[0].version };
  };
  const fetchDayRow = async (day) => {
    const r = await fetch(`${SUPABASE_URL}/rest/v1/schedule_days?day=eq.${day}&select=*`, { headers: dbAuthHeaders() });
    if (!r.ok) return null;
    const a = await r.json().catch(() => []);
    return Array.isArray(a) ? (a[0] || null) : null;
  };

  // The ONLY steady-state writer of schedule_days. Serialized: two runs never
  // interleave. Diff vs lastSyncRef; wipe guard; per changed day: unknown
  // version -> POST v1 (409 -> adopt the row's version, retry once as PATCH);
  // known version N -> PATCH ?day&version=N with version N+1; zero rows back
  // -> conflict -> reload the table, keep local edits that don't collide.
  // Rows are NEVER deleted here; a day dropped from memory is written empty.
  const syncScheduleDays = (nextSchedule) => {
    const run = daySyncChainRef.current.then(() => syncScheduleDaysNow(nextSchedule)).catch(e => {
      console.warn("schedule_days sync error", e);
      showToast("Couldn't save schedule changes - check your connection.", "error");
      return { ok: false, error: String(e) };
    });
    daySyncChainRef.current = run.then(() => undefined, () => undefined);
    return run;
  };
  const syncScheduleDaysNow = async (nextSchedule) => {
    if (!nextSchedule) return { ok: false, error: "no schedule" };
    const prev = lastSyncRef.current || {};
    const next = nextSchedule;
    // -- Accidental-wipe guard (schedule_days) --
    // A map that nulls out most of the populated primaries must never reach
    // the table unless clearSchedule / restore armed the one-shot.
    const chk = scheduleWipeCheck(prev, next);
    if (chk.wipe && !intentionalScheduleWipeRef.current) {
      console.warn(`schedule_days wipe BLOCKED: ${chk.removed} of ${chk.baseline} populated primaries would be emptied. Refusing - not an intentional clear.`);
      setSaveError(true);
      setSaveStatus("Wipe blocked - schedule not changed");
      showToast("Blocked an unexpected schedule wipe - your saved schedule is safe. Reload to resync.", "error");
      return { ok: false, error: "wipe blocked", blocked: true }; // lastSyncRef untouched; nothing written
    }
    // Consume the one-shot UNCONDITIONALLY once past the gate (wipe or no
    // wipe): the grant's window is over. Pinned in data-layer.test.js section E.
    intentionalScheduleWipeRef.current = false;
    const changed = [];
    for (const day of Object.keys(Object.assign({}, prev, next)).sort()) {
      if (!sameAssignment(day, prev[day], next[day])) changed.push(day);
    }
    if (changed.length === 0) return { ok: true, changed: 0 };
    const ts = new Date().toISOString();
    const by = userProfile?.person_id || authUser?.id || null;
    const persisted = JSON.parse(JSON.stringify(prev));
    let conflict = false, failed = 0, failMsg = "", written = 0;
    for (const day of changed) {
      const a = next[day] || emptyDayAssignment();
      const row = assignmentToDayRow(day, a);
      const ver = dayVersionsRef.current[day];
      let r;
      if (ver === undefined) {
        r = await postDayRow(row, by, ts);
        if (r.duplicate) {
          // The row exists (another device created it, or our version map is
          // stale): adopt its version and retry ONCE as a CAS update.
          const cur = await fetchDayRow(day);
          if (cur && typeof cur.version === "number") {
            dayVersionsRef.current[day] = cur.version;
            r = await patchDayRow(row, cur.version, by, ts);
          } else {
            r = { error: "duplicate day and re-read failed", status: 409 };
          }
        }
      } else {
        r = await patchDayRow(row, ver, by, ts);
      }
      if (r.error !== undefined) {
        failed++; failMsg = writeFailToast(r.status, r.error);
        console.warn("schedule_days write failed", day, r.status, String(r.error).slice(0, 200));
        continue; // this day stays un-advanced in lastSyncRef -> retried next pass
      }
      if (r.conflict) { conflict = true; continue; }
      dayVersionsRef.current[day] = r.version;
      persisted[day] = JSON.parse(JSON.stringify(a));
      written++;
    }
    lastSyncRef.current = persisted;
    if (failed) {
      setSaveError(true);
      setSaveStatus("Save failed - retrying");
      showToast(failMsg, "error");
      scheduleDaySyncRetry();
    } else if (written) {
      setSaveError(false);
      setSaveStatus("Saved");
      setTimeout(() => setSaveStatus(""), 2000);
    }
    if (conflict) {
      // Someone else wrote one of these days first. Pull the authoritative
      // table, keep our non-colliding local edits (they re-sync on the next
      // pass), adopt theirs where both sides changed - never a silent clobber.
      try {
        const fresh = await loadScheduleDays();
        const local = scheduleRef.current || {};
        const merged = { ...fresh.sched };
        let kept = 0;
        for (const day of Object.keys(local)) {
          const localChanged = !sameAssignment(day, local[day], prev[day]);
          const serverChanged = !sameAssignment(day, fresh.sched[day], prev[day]);
          if (localChanged && !serverChanged) { merged[day] = local[day]; kept++; }
        }
        dayVersionsRef.current = fresh.vers;
        lastSyncRef.current = JSON.parse(JSON.stringify(fresh.sched));
        scheduleRef.current = merged;
        setSchedule(merged);
        showToast("Changed by someone else - reloaded" + (kept ? ` (kept ${kept} of your edits)` : "") + ".", "error");
      } catch (e) {
        console.warn("conflict reload failed", e);
        showToast("A day was changed by someone else and the reload failed - reload the app.", "error");
      }
      return { ok: false, error: "conflict", conflict: true };
    }
    return failed ? { ok: false, error: failMsg, failed } : { ok: true, changed: written };
  };
  const scheduleDaySyncRetry = () => {
    if (daySyncRetryRef.current) clearTimeout(daySyncRetryRef.current);
    daySyncRetryRef.current = setTimeout(() => {
      daySyncRetryRef.current = null;
      if (loadFailedRef.current || isPublicMode) return;
      syncScheduleDays(scheduleRef.current);
    }, 5000);
  };

  // Adopt the config blob field-by-field (mount load, background refresh,
  // restore). Weekly-model keys are ignored on purpose.
  const adoptBlob = (d) => {
    if (!d || typeof d !== "object") return;
    if (Array.isArray(d.roster) && d.roster.length) setSurgeons(d.roster);
    if (d.surgeonRules !== undefined) setSurgeonRules(d.surgeonRules);
    if (d.groupRules !== undefined) setGroupRules(d.groupRules);
    if (d.holidays !== undefined) setHolidays(d.holidays);
    if (d.settings && typeof d.settings === "object") setSettings(d.settings);
    if (d.lastPublished !== undefined) setLastPublished(d.lastPublished);
  };

  // --- Supabase: Load on mount + real-time sync ---
  useEffect(() => {
    (async () => {
      loadFailedRef.current = false; // reset each load attempt
      // Leg A - the config blob. Its OWN try: a failure leaves blobLoadedRef
      // false (the blob leg of autosave stays off) but must not stop the
      // schedule from loading. A missing row (fresh install) is a SUCCESSFUL
      // read: there is nothing to protect, so writing defaults is correct.
      try {
        const { data: row } = await supabase
          .from("call_schedule_data")
          .select("data,updated_at")
          .eq("id", "main")
          .single();
        blobLoadedRef.current = true;
        if (row?.data) {
          const d = typeof row.data === "string" ? JSON.parse(row.data) : row.data;
          if (row.updated_at) blobTsRef.current = row.updated_at; // prevent auto-save from re-saving unchanged data
          adoptBlob(d);
        }
      } catch (e) {
        console.error("Supabase load error (call_schedule_data):", e);
        showToast("Couldn't load the shared setup (roster/rules) - check your connection and reload. Setup changes won't save until it loads.", "error");
      }
      try {
        // Leg B - the schedule itself: schedule_days (throws on failure -> the
        // catch arms loadFailedRef, which suppresses autosave until a read
        // succeeds).
        const loadedDays = await loadScheduleDays();
        adoptLoadedDays(loadedDays);

        // Independent secondary loads: each in its own try so one failure
        // cannot abort the others (and cannot arm loadFailedRef).
        try {
          const trades = await db.query("shift_trade_requests", { order: "submitted_at.desc", limit: 100 });
          if (Array.isArray(trades)) setTradeRequests(trades);
        } catch(e) { console.warn("Trade requests load failed:", e); }
        try {
          const notifs = await db.query("notifications", { order: "created_at.desc", limit: 50 });
          if (Array.isArray(notifs)) setNotifications(notifs);
        } catch(e) { console.warn("Notifications load failed:", e); }
        try {
          const mainRows = await db.query("client_versions", { eq: { id: "main" }, select: "id,min_version,message" });
          const main = Array.isArray(mainRows) ? mainRows[0] : null;
          if (main && main.min_version && versionCmp(APP_VERSION, main.min_version) < 0) setForceUpdate({ min_version: main.min_version, message: main.message || "" });
          else setForceUpdate(null);
        } catch(e) { console.warn("client_versions min-version check failed:", e); }
      } catch (e) {
        console.error("Supabase load error (schedule_days):", e);
        loadFailedRef.current = true; // read threw - suppress autosave until a read succeeds
        showToast("Couldn't load the latest data - check your connection and reload.", "error");
      }
      await loadTimeOff();
      await loadAvailability();
      await loadEastTables();
      setLoaded(true);
      loadedAtRef.current = Date.now();
    })();

    // --- Realtime subscriptions (preferred) with safety-net poll ---
    const refreshBlobRow = async () => {
      try {
        const { data: row } = await supabase.from("call_schedule_data").select("data,updated_at").eq("id", "main").single();
        blobLoadedRef.current = true; // the read succeeded (a missing row is still a successful read)
        if (!row?.data) return;
        if (row.updated_at === blobTsRef.current) return; // nothing new (or our own echo)
        blobTsRef.current = row.updated_at;
        const d = typeof row.data === "string" ? JSON.parse(row.data) : row.data;
        adoptBlob(d);
      } catch(e) { console.warn("Background config refresh failed:", e); }
    };
    const refreshDays = async () => {
      try {
        const fresh = await loadScheduleDays();
        loadFailedRef.current = false; // the days read succeeded - the days leg is safe again (the blob leg is gated by blobLoadedRef separately)
        // Adopt only days that differ from what we last persisted AND that we
        // have not edited locally since (an unsaved local edit is the truth).
        const base = lastSyncRef.current || {};
        const local = scheduleRef.current || {};
        let changedAny = false;
        const merged = { ...local };
        const allDays = Object.keys(Object.assign({}, base, fresh.sched));
        for (const day of allDays) {
          const serverChanged = !sameAssignment(day, fresh.sched[day], base[day]);
          const localChanged = !sameAssignment(day, local[day], base[day]);
          if (serverChanged && !localChanged) {
            if (fresh.sched[day]) merged[day] = fresh.sched[day]; else delete merged[day];
            base[day] = fresh.sched[day] ? JSON.parse(JSON.stringify(fresh.sched[day])) : undefined;
            if (!fresh.sched[day]) delete base[day];
            changedAny = true;
          }
        }
        dayVersionsRef.current = { ...dayVersionsRef.current, ...fresh.vers };
        if (changedAny) { lastSyncRef.current = base; scheduleRef.current = merged; setSchedule(merged); }
      } catch(e) { console.warn("Background schedule refresh failed:", e); }
    };
    const refreshTradeReqs = async () => {
      try {
        const trades = await db.query("shift_trade_requests", { order: "submitted_at.desc", limit: 100 });
        if (Array.isArray(trades)) setTradeRequests(trades);
      } catch(e) { console.warn("Background trade-requests refresh failed:", e); }
    };
    const refreshNotifs = async () => {
      try {
        const notifs = await db.query("notifications", { order: "created_at.desc", limit: 50 });
        if (Array.isArray(notifs)) setNotifications(notifs);
      } catch(e) { console.warn("Background notifications refresh failed:", e); }
    };
    const refreshMinVersion = async () => {
      try {
        const mainRows = await db.query("client_versions", { eq: { id: "main" }, select: "id,min_version,message" });
        const main = Array.isArray(mainRows) ? mainRows[0] : null;
        if (main && main.min_version && versionCmp(APP_VERSION, main.min_version) < 0) setForceUpdate({ min_version: main.min_version, message: main.message || "" });
        else setForceUpdate(null);
      } catch(e) { console.warn("Background min-version refresh failed:", e); }
    };
    const refreshAll = async () => {
      await Promise.allSettled([
        refreshBlobRow(), refreshDays(), refreshTradeReqs(), refreshNotifs(), refreshMinVersion(),
        loadTimeOff(true), loadAvailability(true), loadEastTables(true),
      ]);
    };

    // Per-row live updates for schedule_days: apply the changed row and keep
    // the version map fresh (this also harmlessly self-confirms our writes).
    const onDayChange = (payload) => {
      try {
        const nw = payload.new, od = payload.old;
        const day = (nw && nw.day) || (od && od.day);
        if (!day) return;
        if (payload.eventType === "DELETE") {
          setSchedule(p => { const n = { ...p }; delete n[day]; scheduleRef.current = n; return n; });
          delete dayVersionsRef.current[day];
          if (lastSyncRef.current) delete lastSyncRef.current[day];
        } else if (nw) {
          const a = dayRowToAssignment(nw);
          // An unsaved local edit on this day (inside the 800ms debounce or
          // with its write in flight) is the truth, exactly as in refreshDays
          // and the CAS conflict path: adopt the row only when local still
          // equals what we last persisted. The version map and lastSyncRef
          // always advance, so the pending edit re-syncs as a PATCH against
          // the fresh version (helpers.js mergeRealtimeDay, pinned in
          // test/data-layer.test.js).
          const base = lastSyncRef.current || {};
          const m = mergeRealtimeDay(day, (scheduleRef.current || {})[day], base[day], a);
          dayVersionsRef.current[day] = nw.version;
          if (lastSyncRef.current) lastSyncRef.current[day] = JSON.parse(JSON.stringify(m.lastSync));
          if (m.localChanged) {
            console.warn(`Realtime: ${day} changed in the table (v${nw.version}) while a local edit is unsaved - keeping the local edit; it re-syncs on the next pass.`);
          } else {
            setSchedule(p => { const n = { ...p, [day]: m.next }; scheduleRef.current = n; return n; });
          }
          if (a.primary || a.backup || a.externalCover) everHadRealDataRef.current = true;
        }
      } catch (e) { console.warn("Realtime day apply failed:", e); }
    };

    let rtChannel = null;
    let rtClient = null;
    const setupRealtime = () => {
      try {
        rtClient = (typeof getSupabaseRT === "function") ? getSupabaseRT() : null;
        if (!rtClient) return false;
        rtChannel = rtClient.channel("silvis-schedule-sync")
          .on("postgres_changes", { event: "*", schema: "public", table: "call_schedule_data" }, refreshBlobRow)
          .on("postgres_changes", { event: "*", schema: "public", table: "schedule_days" }, onDayChange)
          .on("postgres_changes", { event: "*", schema: "public", table: "time_off" }, () => { loadTimeOff(true); })
          .on("postgres_changes", { event: "*", schema: "public", table: "availability" }, () => { loadAvailability(true); })
          .on("postgres_changes", { event: "*", schema: "public", table: "shift_trade_requests" }, refreshTradeReqs)
          .on("postgres_changes", { event: "*", schema: "public", table: "notifications" }, refreshNotifs)
          .on("postgres_changes", { event: "*", schema: "public", table: "client_versions" }, refreshMinVersion)
          .subscribe((status) => {
            if (status === "SUBSCRIBED") refreshAll();
          });
        return true;
      } catch(e) { console.warn("Realtime subscribe failed, falling back to poll:", e); return false; }
    };
    if (!setupRealtime()) {
      const onReady = () => { window.removeEventListener("supabase-sdk-ready", onReady); setupRealtime(); };
      window.addEventListener("supabase-sdk-ready", onReady);
      setTimeout(() => { window.removeEventListener("supabase-sdk-ready", onReady); if (!rtChannel) setupRealtime(); }, 5000);
    }
    // Safety-net poll: every 60 seconds. If Realtime works nothing changes.
    const pollInterval = setInterval(refreshAll, 60000);
    return () => {
      clearInterval(pollInterval);
      if (rtChannel && rtClient) { try { rtClient.removeChannel(rtChannel); } catch(e) { console.warn("Realtime channel cleanup failed:", e); } }
    };
  }, [reloadTrigger]);

  // --- Current-state bundle (NOT "the thing we persist") ---
  // A snapshot of live component state in one object. schedule / vacations /
  // availability are IN the bundle but NOT in the blob - every blob write
  // strips them. They are ARGUMENTS to four consumers: payloadLooksWiped (the
  // empty-save guard), syncScheduleDays (leg 1), the keepalive flush, and the
  // JSON export. Do not remove them.
  const buildStateBundle = (overrides = {}) => ({
    roster: surgeons, surgeonRules, groupRules, holidays, settings, lastPublished,
    schedule, vacations, availability: availabilityRows,
    ...overrides,
  });
  const blobFromBundle = (bundle) => {
    const blobData = { ...bundle };
    delete blobData.schedule; delete blobData.vacations; delete blobData.availability;
    return blobData;
  };
  // Mirrors the RLS predicate on call_schedule_data (silvis_is_sched()).
  const canWriteBlob = isScheduler;

  // --- Supabase: Auto-save on changes ---
  useEffect(() => {
    if (!loaded) return;
    if (isPublicMode) return;  // Public viewers never write to the DB
    if (loadedAtRef.current && Date.now() - loadedAtRef.current < 3000) return; // hydration window
    if (loadFailedRef.current) {
      setSaveError(true);
      setSaveStatus("Not saving - data failed to load");
      return;
    }
    const payload = buildStateBundle();
    pendingSaveRef.current = payload;
    // Arm the guard as soon as we hold real data locally.
    if (!payloadLooksWiped(payload)) everHadRealDataRef.current = true;
    const timer = setTimeout(async () => {
      // -- Empty-save guard --
      if (payloadLooksWiped(payload) && everHadRealDataRef.current && !allowWipeSaveRef.current) {
        console.warn("Autosave blocked: refusing to write empty payload over real data.");
        setSaveError(true);
        setSaveStatus("Save blocked - empty data not written");
        return;
      }
      allowWipeSaveRef.current = false; // consume one-shot bypass
      // -- The two legs are INDEPENDENT (conventions 3a) --
      // Leg 1 - schedule_days (CAS). Every session, every role, FIRST and
      // unconditionally. Its own error handling is loud.
      syncScheduleDays(payload.schedule);
      // Leg 2 - the config blob. Scheduler/admin only (RLS): a member has
      // nothing to write here and would only produce a 403 every 60s.
      if (!canWriteBlob) return;
      // Never write the blob from a session that has not READ it: with
      // surgeonRules / groupRules / holidays undefined locally, this upsert
      // would replace the real jsonb with defaults (finding safety-2).
      if (!blobLoadedRef.current) {
        console.warn("Autosave: the shared setup (call_schedule_data) has not loaded this session - blob write skipped so defaults cannot overwrite it.");
        setSaveError(true);
        setSaveStatus("Setup not saved - shared setup failed to load");
        return;
      }
      try {
        const ts = new Date().toISOString();
        const { error: saveErr } = await supabase
          .from("call_schedule_data")
          .upsert({ id: "main", data: blobFromBundle(payload), updated_by: userProfile?.person_id || null, updated_at: ts });
        if (saveErr) throw new Error(`blob save failed: ${String(saveErr).slice(0, 200)}`);
        blobTsRef.current = ts;
        pendingSaveRef.current = null; // Save committed - clear pending
        setSaveError(false);
        setSaveStatus("Saved");
        setTimeout(() => setSaveStatus(""), 2000);
      } catch (e) {
        console.error("Save failed:", e);
        setSaveError(true);
        const failMsg = String(e?.message || e);
        const denied = /42501|row-level security|\b403\b/i.test(failMsg);
        setSaveStatus(denied ? "Not saved - no permission" : "Save failed - retrying");
        showToast(denied
          ? "Couldn't save the shared setup - your account doesn't have permission. Ask the scheduler."
          : /401|JWT|expired/i.test(failMsg)
            ? "Changes aren't saving - your session expired. Reload or sign in again."
            : "Changes aren't saving - check your connection.", "error");
      }
    }, 800);
    return () => clearTimeout(timer);
  }, [loaded, surgeons, surgeonRules, groupRules, holidays, settings, lastPublished, schedule, vacations, availabilityRows]);

  // --- Flush pending save when app is backgrounded or closing ---
  // The auto-save above has an 800ms debounce; an edit made right before
  // locking the phone would be lost. Fire any pending save immediately with
  // fetch keepalive. The days leg KEEPS THE CAS CONTRACT (finding wire-1): a
  // day whose version we know goes out as PATCH ?day=eq.X&version=eq.N with
  // version N+1 (a moved version matches zero rows instead of overwriting a
  // newer device's row and regressing its version); a day we have never seen
  // in the table goes out as a plain POST at version 1 (an existing row 409s,
  // it is never merged over). Responses are not awaited - whatever did not
  // land re-syncs through syncScheduleDays on the next foreground (the
  // pending payload stays armed on a rejected fetch). Never an upsert here.
  // Uses a ref bridge so the []-deps effect sees the current render's
  // closure (conventions item 1).
  const flushRef = useRef(() => {});
  flushRef.current = (source) => {
    if (isPublicMode) return;
    const payload = pendingSaveRef.current;
    if (!payload) return;
    if (loadFailedRef.current) return;
    if (payloadLooksWiped(payload) && everHadRealDataRef.current && !allowWipeSaveRef.current) {
      console.warn(`Keepalive flush blocked (${source}): empty payload over real data.`);
      return;
    }
    pendingSaveRef.current = null; // Clear optimistically; failures re-arm below
    try {
      const session = auth.getSession();
      const token = session?.access_token || SUPABASE_ANON_KEY;
      const ts = new Date().toISOString();
      const by = userProfile?.person_id || null;
      const hdrs = { "Content-Type": "application/json", "apikey": SUPABASE_ANON_KEY, "Authorization": `Bearer ${token}`, "Prefer": "resolution=merge-duplicates,return=minimal" };
      // schedule_days leg: per-day CAS writes, no upsert (see the comment above).
      const dayHdrs = { "Content-Type": "application/json", "apikey": SUPABASE_ANON_KEY, "Authorization": `Bearer ${token}`, "Prefer": "return=minimal" };
      try {
        const cur = payload.schedule || {};
        const base = lastSyncRef.current || {};
        const chk = scheduleWipeCheck(base, cur);
        if (chk.wipe && !intentionalScheduleWipeRef.current) {
          console.warn(`Keepalive flush (${source}): wipe-shaped diff skipped.`);
        } else {
          let sent = 0;
          for (const day of Object.keys(Object.assign({}, base, cur))) {
            if (sameAssignment(day, base[day], cur[day])) continue;
            const ver = dayVersionsRef.current[day];
            const row = assignmentToDayRow(day, cur[day] || emptyDayAssignment());
            const rearm = (e) => { console.warn(`Keepalive flush (${source}): schedule_days ${day} not sent -`, e); pendingSaveRef.current = payload; };
            if (typeof ver === "number") {
              fetch(`${SUPABASE_URL}/rest/v1/schedule_days?day=eq.${day}&version=eq.${ver}`, { method: "PATCH", keepalive: true, headers: dayHdrs, body: JSON.stringify({ ...row, version: ver + 1, updated_by: by, updated_at: ts }) }).catch(rearm);
            } else {
              fetch(`${SUPABASE_URL}/rest/v1/schedule_days`, { method: "POST", keepalive: true, headers: dayHdrs, body: JSON.stringify({ ...row, version: 1, updated_by: by, updated_at: ts }) }).catch(rearm);
            }
            sent++;
          }
          if (sent) console.warn(`Keepalive flush (${source}): ${sent} schedule_days CAS write(s) sent; they re-sync on the next foreground if any did not land.`);
        }
      } catch (e) { console.warn("Unload flush (schedule_days) failed:", e); pendingSaveRef.current = payload; }
      if (!canWriteBlob) return;
      if (!blobLoadedRef.current) { console.warn(`Keepalive flush (${source}): shared setup never loaded - blob leg skipped.`); return; }
      fetch(`${SUPABASE_URL}/rest/v1/call_schedule_data?on_conflict=id`, {
        method: "POST", keepalive: true, headers: hdrs,
        body: JSON.stringify({ id: "main", data: blobFromBundle(payload), updated_by: by, updated_at: ts }),
      }).then(() => { blobTsRef.current = ts; }).catch(e => {
        console.warn(`Keepalive save failed (${source}):`, e);
        pendingSaveRef.current = payload;
      });
    } catch (e) {
      console.warn(`Flush pending save (${source}) error:`, e);
      pendingSaveRef.current = payload;
    }
  };
  useEffect(() => {
    const onVisibilityChange = () => { if (document.hidden) flushRef.current("visibilitychange"); };
    const onPageHide = () => flushRef.current("pagehide");
    const onBeforeUnload = () => flushRef.current("beforeunload");
    document.addEventListener("visibilitychange", onVisibilityChange);
    window.addEventListener("pagehide", onPageHide);
    window.addEventListener("beforeunload", onBeforeUnload);
    return () => {
      document.removeEventListener("visibilitychange", onVisibilityChange);
      window.removeEventListener("pagehide", onPageHide);
      window.removeEventListener("beforeunload", onBeforeUnload);
    };
  }, []);

  // --- Periodic snapshot safety net ---
  // Once per session (and at most once every 6h across sessions), capture a
  // snapshot after load so there is always a recent restore point.
  const sessionSnapRef = useRef(false);
  useEffect(() => {
    if (!loaded || sessionSnapRef.current) return;
    if (!isScheduler) return;
    sessionSnapRef.current = true;
    snapshots.captureIfStale("periodic_session", 6);
  }, [loaded, isScheduler]);

  // ====================================================================
  // ONE RULES CONTEXT for the whole UI (Prompt 6 Slice B/D).
  // Built from the blob (roster / surgeonRules / groupRules / holidays), the
  // time_off and availability rows, the three East caches and the current
  // schedule; memoised on exactly those inputs and rebuilt when any changes.
  // eligibility(rulesCtx, ...) is the single chokepoint (rules.js) - the day
  // editor, badges and (Slice E) the generator all read this one ctx or a
  // draft built from the same ctxInputs. No surgeon-specific branch: which
  // East feature applies to whom is read from surgeonRules[id].eastFeed.
  // ====================================================================
  // Resolve Davenport ids by CODE once the East caches are in (never a literal id).
  useEffect(() => {
    if (eastIdByCode && eastIdByCode._source !== "failed") return;
    const needCodes = surgeons.filter(s => {
      const ef = surgeonRules && surgeonRules[s.id] && surgeonRules[s.id].eastFeed;
      return ef && ef.enabled && (ef.eastBlocksPrimary || ef.eastBlocksBackup) && s.code;
    }).map(s => String(s.code).toUpperCase());
    if (!needCodes.length) return;
    // 1) the forecast rows carry the Davenport id they were built for (code FAK by construction)
    const fc = eastForecastRows.find(r => r && r.data && r.data.fakId);
    if (fc && needCodes.length === 1 && needCodes[0] === "FAK") { setEastIdByCode({ FAK: fc.data.fakId, _source: "forecast" }); return; }
    if (!eastFeedRows.length || (eastIdByCode && eastIdByCode._source === "failed")) return;
    // 2) the Davenport roster, read-only, through east-feed.js (GET only)
    let cancelled = false;
    (async () => {
      try {
        const rows = await eastGetJson("call_schedule_data?id=eq.main&select=data");
        let blob = rows[0] && rows[0].data;
        if (typeof blob === "string") blob = JSON.parse(blob);
        const m = { _source: "davenport" };
        (blob && Array.isArray(blob.surgeons) ? blob.surgeons : []).forEach(s => { if (s && s.name && s.id) m[String(s.name).toUpperCase()] = s.id; });
        if (!cancelled) setEastIdByCode(m);
      } catch (e) {
        console.warn("Davenport roster read failed - East ids unresolved, East days show as unknown:", e);
        if (!cancelled) setEastIdByCode({ _source: "failed" });
      }
    })();
    return () => { cancelled = true; };
  }, [surgeons, surgeonRules, eastFeedRows, eastForecastRows, eastIdByCode]);

  const ctxInputs = useMemo(() => {
    const weeks = eastFeedRows.map(r => ({ weekMonday: r.week_monday, data: r.data || {} }));
    const forecast = forecastFromFeedRows(eastForecastRows);
    const eastBusyDays = {}, eastForecast = {}, eastDerived = [], eastMeta = {};
    let unresolved = false;
    surgeons.forEach(s => {
      const ef = (surgeonRules && surgeonRules[s.id] && surgeonRules[s.id].eastFeed) || null;
      if (!ef || !ef.enabled) return;
      const meta = { code: s.code, busyDays: false, derivedWeeks: false, forecast: false, eastId: null };
      if (ef.eastBlocksPrimary || ef.eastBlocksBackup) {
        meta.busyDays = true;
        meta.eastId = (eastIdByCode && eastIdByCode[String(s.code || "").toUpperCase()]) || null;
        let busy = new Set();
        if (meta.eastId) busy = deriveKhanBusyDays(weeks, meta.eastId, { eastBackupCountsAsBusy: ef.eastBackupCountsAsBusy !== false }).busy;
        else if (weeks.length) unresolved = true;
        eastBusyDays[s.id] = applyOverrides(busy, eastOverrideRows, s.id);
        if (ef.forecast && Object.keys(forecast).length) { eastForecast[s.id] = forecast; meta.forecast = true; }
      }
      if (ef.deriveFrom || ef.statedWeeks) {
        meta.derivedWeeks = true;
        deriveFierceWeeks(weeks, { statedWeeks: ef.statedWeeks || null }).forEach(w => {
          eastDerived.push({ surgeonId: s.id, weekMonday: w.weekMonday, silvisRole: w.silvisRole, source: w.source });
        });
      }
      eastMeta[s.id] = meta;
    });
    // Coverage is claimed only when every busy-days surgeon resolved: an
    // unresolved id must read as "unknown" (soft penalty), never as "clear".
    const coverage = unresolved ? null : coverageOf(weeks);
    return {
      roster: surgeons, surgeonRules: surgeonRules || {}, groupRules: groupRules || {}, holidays: holidays || {},
      timeOffRows, availabilityRows, schedule,
      eastBusyDays, eastForecast, eastDerived, eastFeedCoverage: coverage, eastMeta,
    };
  }, [surgeons, surgeonRules, groupRules, holidays, timeOffRows, availabilityRows, schedule, eastFeedRows, eastForecastRows, eastOverrideRows, eastIdByCode]);
  const rulesCtxState = useMemo(() => safeBuildContext(ctxInputs), [ctxInputs]);
  const rulesCtx = rulesCtxState.ctx;
  useEffect(() => {
    if (rulesCtxState.error) showToast("Couldn't build the rules context - eligibility checks are unavailable (" + rulesCtxState.error.slice(0, 90) + ").", "error");
    else if (rulesCtx && rulesCtx.warnings && rulesCtx.warnings.length) console.warn("rules context warnings:", rulesCtx.warnings);
  }, [rulesCtxState]);

  // --- Day editor save: the ONLY manual schedule mutation path ---
  // DayEditor (module scope) validates every pick through eligibility() and
  // collects explicit overrides; this applies the result: undo point, note
  // prefixed '[override: ...]', source "manual", audit 'schedule.day_edit'
  // with before/after rows, a schedule_changed notification for everyone
  // affected. Persistence is unchanged: the autosave's days leg pushes the
  // new map through syncScheduleDays (per-day CAS; a conflict toasts
  // "Changed by someone else - reloaded").
  const saveDayEdit = (day, next, meta) => {
    if (!isScheduler || isPublicMode) { showToast("Only the scheduler can change the schedule.", "error"); return false; }
    const before = schedule[day] || emptyDayAssignment();
    const after = { ...emptyDayAssignment(), ...next };
    if (after.primary && after.primary === after.backup) { showToast("Primary and backup must be different people.", "error"); return false; }
    if (after.primary) after.externalCover = null; // a roster primary replaces an external cover
    after.externalCover = (after.externalCover || "").trim() || null;
    const overrides = (meta && meta.overrides) || [];
    let note = (after.note || "").replace(/^\[override:[^\]]*\]\s*/, "").trim();
    if (overrides.length) {
      const tag = "[override: " + overrides.map(o => nameOf(o.id) + " " + o.role + ": " + o.reasons.join(", ")).join("; ") + "]";
      note = note ? tag + " " + note : tag;
    }
    after.note = note || null;
    after.source = "manual";
    if (sameAssignment(day, before, after)) return true; // nothing changed - nothing to write
    pushUndo(schedule);
    setSchedule(p => ({ ...p, [day]: after }));
    const lines = diffScheduleDays({ [day]: before }, { [day]: after }).map(c => formatDayChange(c, nameOf));
    logAudit("schedule.day_edit", fmtMD(day) + ": " + (lines.join("; ") || "edited"), {
      day, before: assignmentToDayRow(day, before), after: assignmentToDayRow(day, after), overrides,
    });
    if (overrides.length) logAudit("schedule.override", "Override on " + fmtMD(day) + ": " + overrides.map(o => nameOf(o.id) + " " + o.role + " despite " + o.reasons.join(", ")).join("; "), { day, overrides });
    const roleChanged = before.primary !== after.primary || before.backup !== after.backup || (before.externalCover || null) !== (after.externalCover || null);
    const affected = [...new Set([before.primary, before.backup, after.primary, after.backup].filter(Boolean))];
    if (roleChanged && affected.length) {
      addNotification("schedule_changed", "Schedule changed", fmtMD(day) + ": " + lines.filter(l => / [PB] /.test(l)).join("; "), { surgeon_id: after.primary || after.backup || before.primary || before.backup, day, affected });
    }
    return true;
  };
  // "Propose a trade for this day": switch to Time off & Trades with the day
  // (and the role the viewer holds, else primary) preselected. Slice G wires
  // the rest of the form.
  const proposeTradeForDay = (day, role) => {
    setTradeDay(day);
    setTradeRole(role === "backup" ? "backup" : "primary");
    if (mySurgeon && !isScheduler) setTradeFrom(mySurgeon);
    setEditorDay(null);
    setView("timeoff");
  };

  // --- Clear schedule (a range; locked slots stay) ---
  // The intentional-wipe path: snapshot first (capture failure BLOCKS), then
  // null out primary/backup on non-locked days in the range and push through
  // the CAS sync with the one-shot armed. Rows are never deleted.
  const clearSchedule = async () => {
    if (!isScheduler) return;
    const start = clearStart, end = clearEnd || Object.keys(schedule).sort().slice(-1)[0] || clearStart;
    if (!start || !end || end < start) { showToast("Pick a valid date range to clear.", "error"); return; }
    const days = Object.keys(schedule).filter(d => d >= start && d <= end);
    if (days.length === 0) { showToast("No scheduled days in that range.", "info"); return; }
    if (!confirm(`Clear primary and backup on ${days.length} day(s) from ${fmtMD(start)} to ${fmtMD(end)}? Locked slots are kept. Vacations and setup are untouched.\n\nA snapshot is saved first.`)) return;
    setSaveStatus("Saving backup snapshot");
    const clearSnap = await snapshots.capture("clear_schedule");
    if (!clearSnap.ok) {
      showToast("Couldn't save a backup snapshot - clear cancelled. Schedule unchanged. (" + (clearSnap.error || "unknown") + ")", "error");
      setSaveStatus("");
      return;
    }
    pushUndo(schedule);
    const next = { ...schedule };
    let cleared = 0;
    days.forEach(d => {
      const a = { ...next[d] };
      if (!a.primaryLocked && (a.primary || a.externalCover)) { a.primary = null; a.externalCover = null; cleared++; }
      if (!a.backupLocked && a.backup) { a.backup = null; cleared++; }
      next[d] = a;
    });
    setSchedule(next);
    scheduleRef.current = next;
    logAudit("schedule.clear", `Cleared ${cleared} slot(s) ${fmtMD(start)} - ${fmtMD(end)}`, { start, end, cleared });
    intentionalScheduleWipeRef.current = true; // authorize this one legitimate wipe-shaped write
    const r = await syncScheduleDays(next);
    if (r && r.ok) { setSaveStatus("Schedule cleared"); setTimeout(() => setSaveStatus(""), 2000); }
  };

  // --- Factory reset ---
  // Typed RESET + snapshot (capture failure BLOCKS) -> delete every
  // schedule_days row + reset the config blob. Vacations and availability are
  // NOT touched (they are the surgeons' own entries; clear them in Setup).
  const resetAllData = async () => {
    if (!isScheduler) { alert("Only a scheduler or the admin account can reset all data."); return; }
    const typed = prompt(
      "This permanently clears the ENTIRE saved schedule (every schedule_days row) and resets the roster/rules/settings blob for everyone.\n\n" +
      "Vacations and availability statements are KEPT.\n\n" +
      "A snapshot is saved first so it can be restored, but export a JSON backup before doing this.\n\n" +
      "Type  RESET  (all caps) to confirm:"
    );
    if (typed !== "RESET") { setSaveStatus("Reset cancelled"); setTimeout(() => setSaveStatus(""), 2000); return; }
    const resetSnap = await snapshots.capture("reset_all_data");
    if (!resetSnap.ok) {
      showToast("Couldn't save a backup snapshot - reset cancelled. Nothing was deleted. (" + (resetSnap.error || "unknown") + ")", "error");
      setSaveStatus("Reset cancelled"); setTimeout(() => setSaveStatus(""), 2000);
      return;
    }
    logAudit("system.factory_reset", "FACTORY RESET - wiped the schedule and reset the config blob");
    allowWipeSaveRef.current = true;   // authorize the intended empty blob write
    everHadRealDataRef.current = false; // wipe is intentional; re-arm only when real data returns
    // Step 1 - schedule_days DELETE. Runs FIRST: if it fails, nothing in the
    // DB has changed and the "nothing was changed" message is true. (The old
    // order cleared the blob first, so a failed DELETE left every other
    // device loading a default roster with no rules - finding safety-3.)
    try {
      const del = await fetch(`${SUPABASE_URL}/rest/v1/schedule_days?day=not.is.null`, { method: "DELETE", headers: { ...dbAuthHeaders(), Prefer: "return=minimal" } });
      if (!del.ok) throw new Error(`schedule_days delete failed: HTTP ${del.status} ${(await del.text().catch(() => "")).slice(0, 200)}`);
    } catch(e) {
      console.error("Factory reset: schedule_days delete failed:", e);
      // ABORT: restore the two guard refs armed above (a leftover grant would
      // pre-authorize the next accidental empty write).
      allowWipeSaveRef.current = false;
      everHadRealDataRef.current = true;
      showToast("Couldn't delete the stored schedule - reset cancelled. Nothing was changed: the schedule, roster and rules are as they were. (" + String(e?.message || e).slice(0, 120) + ")", "error");
      setSaveStatus("Reset cancelled"); setTimeout(() => setSaveStatus(""), 2000);
      return;
    }
    // The rows are gone: reflect that locally NOW, whatever step 2 does, so a
    // stale local copy is never re-POSTed as a fresh v1 schedule.
    setSchedule({});
    scheduleRef.current = {};
    dayVersionsRef.current = {};
    lastSyncRef.current = {};
    setScheduleHistory([]);
    // Step 2 - reset the config blob. If THIS fails the DB is half reset:
    // schedule deleted (recoverable from the snapshot), roster/rules intact
    // and still matching local state. Say exactly that; the guard refs stay
    // as armed above because the schedule is now legitimately empty.
    try {
      const { error: blobClearErr } = await supabase.from("call_schedule_data").upsert({ id: "main", data: { _intentionalClear: true }, updated_at: new Date().toISOString() });
      if (blobClearErr) throw new Error(`blob clear failed: ${String(blobClearErr).slice(0, 200)}`);
    } catch(e) {
      console.error("Factory reset: config blob reset failed after the schedule was deleted:", e);
      showToast("Partial reset: the schedule rows WERE deleted (restore the 'Before factory reset' snapshot in Settings to get them back), but the roster/rules blob could not be reset and is unchanged. (" + String(e?.message || e).slice(0, 120) + ")", "error");
      setSaveStatus("Reset incomplete - schedule deleted, setup kept"); setTimeout(() => setSaveStatus(""), 6000);
      return;
    }
    blobLoadedRef.current = true; // we wrote the blob ourselves; local defaults below ARE its content
    setSurgeons(INIT_SURGEONS);
    setSurgeonRules(undefined); setGroupRules(undefined); setHolidays(undefined); setSettings({}); setLastPublished(null);
    setSaveStatus("Reset complete");
    setTimeout(() => setSaveStatus(""), 2000);
  };

  // --- In-app notifications ---
  // Insert a row in the shared feed. No device push in this app (dropped with
  // the Davenport push stack); email goes through sendEmailNotif separately.
  const addNotification = useCallback(async (type, title, message, data = {}) => {
    try {
      const notif = { type, title, message, data, created_at: new Date().toISOString() };
      const { data: inserted, error: insertErr } = await db.insert("notifications", notif);
      if (insertErr) { console.warn("Notification insert failed:", insertErr); showToast("Couldn't save that notification.", "error"); }
      if (inserted) setNotifications(prev => [inserted, ...prev].slice(0, 50));
    } catch(e) { console.warn("Notification error:", e); showToast("Couldn't send the notification - check your connection.", "error"); }
  }, []);

  // --- Email via the send-notification edge function ---
  // Recipient resolution + per-category gating happen SERVER-SIDE (service
  // role reads user_profiles.email / notification_preferences). The client
  // sends only the type, template data and optional targetIds.
  const sendEmailNotif = useCallback(async (type, data, targetIds = null) => {
    // A targeted send with an EMPTY list means "no recipients", not broadcast.
    if (Array.isArray(targetIds) && targetIds.length === 0) return;
    try {
      const body = { type, data };
      if (Array.isArray(targetIds)) body.targetIds = targetIds;
      const res = await fetch(`${EDGE_FN_BASE}/send-notification`, {
        method: "POST",
        headers: dbAuthHeaders(), // a dead token must 401 loudly, never degrade to anon
        body: JSON.stringify(body),
      });
      const result = await res.json().catch(() => null);
      if (!res.ok || (result && result.failed > 0)) {
        console.warn("Email notification issue:", type, res.status, JSON.stringify(result));
        showToast(res.status === 404 ? "Email function is not deployed yet (Prompt 10) - no email sent." : "Some notification emails didn't send.", "error");
      }
    } catch(e) { console.warn("Email notification error:", e); showToast("Couldn't send email notifications - check your connection.", "error"); }
  }, []);

  // --- Shift Trade Request: Submit (day + role) ---
  // TODO(Slice G): accept/decline/cancel with eligibility check for the
  // recipient, schedule application, audit + notifications, scheduler revert.
  const submitTradeRequest = useCallback(async () => {
    if (!tradeFrom || !tradeTo || !tradeDay || !tradeRole) { showToast("Pick both surgeons, the day and the role.", "error"); return; }
    if (tradeFrom === tradeTo) { showToast("Pick a different surgeon to trade with.", "error"); return; }
    const sched = scheduleRef.current || {};
    const holder = sched[tradeDay] ? sched[tradeDay][tradeRole] : null;
    if (holder !== tradeFrom) { showToast(`${nameOf(tradeFrom)} is not ${tradeRole} on ${fmtMD(tradeDay)} (that slot is ${holderLabel(holder, nameOf)}).`, "error"); return; }
    if (tradeReturnDay) {
      const rHolder = sched[tradeReturnDay] ? sched[tradeReturnDay][tradeReturnRole] : null;
      if (rHolder !== tradeTo) { showToast(`${nameOf(tradeTo)} is not ${tradeReturnRole} on ${fmtMD(tradeReturnDay)} (that slot is ${holderLabel(rHolder, nameOf)}).`, "error"); return; }
    } else if (!isScheduler) {
      alert("A return shift is required. All trades are two-way - pick the day and role you'll take in return.");
      return;
    } else if (!confirm("No return shift specified. One-way trades are for emergencies only. Submit anyway?")) return;
    const fromName = nameOf(tradeFrom), toName = nameOf(tradeTo);
    try {
      const req = {
        from_surgeon_id: tradeFrom, from_surgeon_name: fromName,
        to_surgeon_id: tradeTo, to_surgeon_name: toName,
        day: tradeDay, role: tradeRole,
        return_day: tradeReturnDay || null, return_role: tradeReturnDay ? tradeReturnRole : null,
        status: "pending", submitted_at: new Date().toISOString(),
      };
      req.detail = tradeProposeMsg(req);
      const { data: inserted, error } = await db.insert("shift_trade_requests", req);
      if (error || !inserted) { console.warn("trade insert failed", error); showToast("Couldn't submit the trade: " + describeDbError(error), "error"); return; }
      setTradeRequests(prev => [inserted, ...prev]);
      logAudit("trade.propose", req.detail, { from: tradeFrom, to: tradeTo, day: tradeDay, role: tradeRole, return_day: req.return_day, return_role: req.return_role });
      await addNotification("trade_submitted", "Shift trade proposed", req.detail, { from_surgeon_id: tradeFrom, to_surgeon_id: tradeTo });
      sendEmailNotif("trade_submitted", { from_name: fromName, to_name: toName, day: tradeDay, role: tradeRole, detail: req.detail }, [tradeFrom, tradeTo]);
      setTradeDay(""); setTradeReturnDay("");
      showToast("Trade proposed.", "success");
    } catch(e) { console.warn("Submit trade error:", e); showToast("Couldn't submit the trade - check your connection and try again.", "error"); }
  }, [tradeFrom, tradeTo, tradeDay, tradeRole, tradeReturnDay, tradeReturnRole, surgeons, addNotification, sendEmailNotif, isScheduler]);

  // --- Mark Notifications as Seen ---
  const markNotifsSeen = () => {
    const now = new Date().toISOString();
    setNotifLastSeen(now);
    try { localStorage.setItem("silvis-notif-seen", now); } catch(e) { console.warn("Couldn't persist notifications-seen marker:", e); }
  };
  // --- Clear Notifications (local view, this device only) ---
  const clearAllNotifications = useCallback(() => {
    if (!confirm("Clear notifications from this view? Only this device is affected - the shared feed and other devices are untouched.")) return;
    const now = new Date().toISOString();
    setNotifClearedBefore(now);
    setNotifLastSeen(now);
    try {
      localStorage.setItem("silvis-notif-cleared", now);
      localStorage.setItem("silvis-notif-seen", now);
    } catch(e) { console.warn("Couldn't persist notifications-cleared marker:", e); }
  }, []);

  // Browser Notification API (in-app pop-up while the app is open; no push).
  const sendBrowserNotif = useCallback((title, body, tag, forceShow) => {
    try {
      if (browserNotifPermission !== "granted") return;
      if (!forceShow && document.hasFocus()) return;
      new Notification(title, { body, tag: tag || "silvis-call-" + Date.now() });
    } catch(e) { console.warn("Browser notification error:", e); }
  }, [browserNotifPermission]);
  const requestBrowserNotifPermission = async () => {
    try {
      if (typeof Notification === "undefined") { showToast("This browser doesn't support notifications.", "error"); return; }
      const p = await Notification.requestPermission();
      setBrowserNotifPermission(p);
    } catch (e) { console.warn("Notification permission request failed:", e); showToast("Couldn't request notification permission.", "error"); }
  };

  // --- Load Notification Preferences (own row; scheduler sees all) ---
  useEffect(() => {
    if (!loaded || !authUser) return;
    (async () => {
      try {
        const res = await fetch(`${SUPABASE_URL}/rest/v1/notification_preferences?select=*`, { headers: dbAuthHeaders() });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const rows = await res.json();
        if (Array.isArray(rows)) {
          const prefs = {};
          rows.forEach(r => { prefs[r.person_id] = r; });
          setNotifPrefs(prefs);
        }
      } catch(e) { console.warn("Load notif prefs error:", e); }
    })();
  }, [loaded, reloadTrigger, authUser]);

  // --- Load Office Contacts (scheduler/admin) ---
  useEffect(() => {
    if (!loaded || !isScheduler) return;
    (async () => {
      try {
        const res = await fetch(`${SUPABASE_URL}/rest/v1/office_contacts?select=*&order=name.asc`, { headers: dbAuthHeaders() });
        if (!res.ok) throw new Error(`HTTP ${res.status} ${(await res.text().catch(() => "")).slice(0, 120)}`);
        const rows = await res.json();
        if (Array.isArray(rows)) setOfficeContacts(rows);
      } catch(e) { console.warn("Load office contacts error:", e); showToast("Couldn't load office contacts - the list shown may be incomplete.", "error"); }
    })();
  }, [loaded, isScheduler, reloadTrigger]);

  // --- Save Notification Preference (email prefs only; own row) ---
  // PER-ID debounce timers so edits to two people's rows can't cancel each other.
  const notifSaveTimerRef = useRef({});
  const saveNotifPref = useCallback(async (personId, updates) => {
    setNotifPrefs(prev => {
      const cur = prev[personId] || { person_id: personId, schedule_updates_email: true, trade_updates_email: true, shift_reminders_email: true, reminder_hour_central: null };
      const merged = { ...cur, ...updates };
      notifPrefsRef.current = { ...prev, [personId]: merged };
      return { ...prev, [personId]: merged };
    });
    if (notifSaveTimerRef.current[personId]) clearTimeout(notifSaveTimerRef.current[personId]);
    notifSaveTimerRef.current[personId] = setTimeout(async () => {
      setNotifPrefsSaving(true);
      try {

  const [paintSheet, setPaintSheet] = useState(false);

  // --- Snapshot restore (Settings -> Restore from Snapshot) + JSON import ---
  const [snapshotList, setSnapshotList] = useState(null);   // null = not loaded yet
  const [snapshotsLoading, setSnapshotsLoading] = useState(false);
  const [snapshotLoadFailed, setSnapshotLoadFailed] = useState(false); // couldn't load != none exist
  const [restoreBusyId, setRestoreBusyId] = useState(null);
  const [openSettingsCards, setOpenSettingsCards] = useState({});

  const loadSnapshots = async () => {

  const snapshotReasonLabel = (r) => ({
    reset_all_data: "Before factory reset",
    clear_schedule: "Before schedule clear",
    before_restore: "Before restore",
    before_import: "Before JSON import",
    periodic_session: "Periodic (session start)",
    regenerate: "Before regenerate",
  }[r] || r || "manual");
  // The schedule leg of restore/import - the SAME CAS path every schedule
  // write uses. A confirmed restore may legitimately empty many days, so the
  // one-shot is armed and ALWAYS disarmed after.
  const applyScheduleViaCAS = async (sched) => {
    if (Object.keys(scheduleRef.current || {}).length > 0) pushUndo(scheduleRef.current);
    setSchedule(sched);
    scheduleRef.current = sched;
    intentionalScheduleWipeRef.current = true;
    try {
      const r = await syncScheduleDays(sched);
      if (r && r.ok === false) return { ok: false, error: r.error || "schedule sync failed" };
    } finally { intentionalScheduleWipeRef.current = false; }
    return { ok: true };
  };
  // The table leg: upsert time_off / availability rows BY ID (merge-duplicates).
  // Never deletes - rows that exist today and are absent from the backup stay.
  const applyTablesUpsert = async ({ time_off, availability }) => {
    const counts = {};
    for (const [table, rows] of [["time_off", time_off], ["availability", availability]]) {
      if (!Array.isArray(rows) || rows.length === 0) { counts[table + "_upserted"] = 0; continue; }
      const res = await fetch(`${SUPABASE_URL}/rest/v1/${table}?on_conflict=id`, {
        method: "POST", headers: { ...dbAuthHeaders(), Prefer: "resolution=merge-duplicates,return=minimal" },
        body: JSON.stringify(rows),
      });
      if (!res.ok) {
        const t = await res.text().catch(() => "");
        console.warn(`${table} restore upsert failed`, res.status, t);
        return { ok: false, error: `${table} restore failed: ${describeDbError(t)}`, counts };
      }
      counts[table + "_upserted"] = rows.length;
    }
    await loadTimeOff();
    await loadAvailability();
    return { ok: true, counts };
  };
  const afterPayloadApplied = (r, what) => {
    adoptBlob(r.blob || {});
    blobTsRef.current = r.ts;          // our own write - don't let the poll treat it as foreign

    loadSnapshots();
    const c = r.counts || {};
    alert(`${what} complete.\n\nRESTORED: ${c.schedule_days ?? 0} schedule day(s), ${c.time_off ?? 0} vacation row(s), ${c.availability ?? 0} availability row(s), plus roster/rules/settings.\n\nExisting vacation/availability rows not in the backup were left in place (restore never deletes).`);

  };
  const restoreSnapshot = async (snap) => {
    if (!isScheduler) return;
    const when = new Date(snap.created_at).toLocaleString(undefined, { month:"short", day:"numeric", year:"numeric", hour:"numeric", minute:"2-digit" });
    if (!confirm(`Restore the "${snapshotReasonLabel(snap.reason)}" snapshot from ${when}?\n\nThis replaces the CURRENT schedule and setup for everyone with that saved copy and re-adds its vacation/availability rows. A fresh snapshot of the current state is saved first, so this restore can itself be undone.`)) return;
    setRestoreBusyId(snap.id);
    setSaveStatus("Restoring snapshot");
    const r = await snapshots.restore(snap.id, applyScheduleViaCAS, applyTablesUpsert);
    setRestoreBusyId(null);
    if (!r.ok) { showToast("Restore failed: " + (r.error || "unknown error"), "error"); setSaveStatus(""); return; }
    logAudit("system.restore_snapshot", `Restored snapshot "${snapshotReasonLabel(snap.reason)}" from ${when}`, { snapshot_id: snap.id, reason: snap.reason, created_at: snap.created_at, counts: r.counts });
    setSaveStatus("Snapshot restored");

    afterPayloadApplied(r, "Restore");
  };
  const importBackupFile = async (file) => {

    if (!confirm(`Import this backup?\n\n${normalized.schedule_days.length} schedule day(s), ${normalized.time_off.length} vacation row(s), ${normalized.availability.length} availability row(s), config keys: ${Object.keys(normalized.config).join(", ") || "(none)"}.\n\nIt replaces the current schedule and setup for everyone (a snapshot is saved first).`)) return;
    setSaveStatus("Importing backup");

  // --- Dark Mode Styles ---

  // --- Today ---
  const todayStr = fmt(new Date());

  // --- Calendar month grid (Slice B) ---
  // Mon..Sun columns so Fri/Sat/Sun sit together as the weekend unit and the
  // rows line up with the ER-panel author's Mon-Sun week rows. gridDays runs from the Monday
  // on/before the 1st to the Sunday on/after the last day of the month.
  const monthStartStr = fmt(new Date(calYear, calMonth, 1));
  const monthEndStr = fmt(new Date(calYear, calMonth + 1, 0));
  const gridDays = useMemo(() => {
    const first = new Date(calYear, calMonth, 1);

    const out = [];
    for (let d = monOf(first); d <= last || out.length % 7 !== 0; d = addD(d, 1)) out.push(fmt(d));

  }, [calYear, calMonth]);
  const prevMonth = () => { if (calMonth === 0) { setCalMonth(11); setCalYear(y => y - 1); } else setCalMonth(m => m - 1); };
  const nextMonth = () => { if (calMonth === 11) { setCalMonth(0); setCalYear(y => y + 1); } else setCalMonth(m => m + 1); };
  const goToday = () => { const n = new Date(); setCalMonth(n.getMonth()); setCalYear(n.getFullYear()); };
  const toggleCalFilter = (id) => setCalSurgeonFilters(p => p.includes(id) ? p.filter(x => x !== id) : [...p, id]);
  const colorOf = (id) => surgeonColors(codeOf(id), sMap[id] ? sMap[id].idx : 0);
  // Text colour for a surgeon's name written straight on the page (week rows,

  const textColorOf = (id) => surgeonTextColor(colorOf(id), codeOf(id), dk);
  // Vacation dots: who is off on each visible day (time_off via the vacations map).
  const vacByDay = useMemo(() => {
    const map = {};

    Object.keys(vacations).forEach(pid => (vacations[pid] || []).forEach(([vs, ve]) => {
      if (!vs || !ve || ve < lo || vs > hi) return;
      const stop = ve > hi ? hi : ve;
      for (let d = parse(vs < lo ? lo : vs); fmt(d) <= stop; d = addD(d, 1)) { const ds = fmt(d); (map[ds] = map[ds] || []).push(pid); }

              <button key={k} data-tab={k} style={{...css.tab(view===k),position:"relative"}} onClick={()=>setView(k)}>

                {k==="timeoff" && pendingTrades > 0 && (
                  <span style={{position:"absolute",top:-4,right:-4,background:"#e04040",color:"#fff",borderRadius:10,fontSize:9,fontWeight:700,minWidth:16,height:16,display:"flex",alignItems:"center",justifyContent:"center",padding:"0 4px"}}>{pendingTrades}</span>
                )}

          <button onClick={()=>{setShowNotifs(p=>!p); if(!showNotifs) markNotifsSeen();}} aria-label="Notifications"
            style={{...css.tab(showNotifs),position:"relative",fontSize:12,padding:"5px 10px"}}>
            Alerts
            {myUnreadCount > 0 && (
              <span style={{position:"absolute",top:-4,right:-4,background:"#e04040",color:"#fff",borderRadius:10,fontSize:9,fontWeight:700,minWidth:16,height:16,display:"flex",alignItems:"center",justifyContent:"center",padding:"0 4px"}}>{myUnreadCount}</span>
            )}
          </button>
          {scheduleHistory.length > 0 && isScheduler && (
            <button onClick={undoLastChange} style={{...css.tab(false),fontSize:12,padding:"4px 10px",color:"#c09030"}} title={`Undo (${scheduleHistory.length} steps)`}>Undo</button>
          )}
        </div>}
      </div>

      <div style={{maxWidth:1020,margin:"0 auto",padding:"18px 14px 60px",position:"relative"}}>

        {/* --- Notification Panel --- */}
        {!isPublicMode && showNotifs && (
          <div style={{position:"absolute",top:0,right:14,width:340,maxHeight:400,overflowY:"auto",background:"#fff",border:"1px solid #dce2e8",borderRadius:10,boxShadow:"0 4px 20px rgba(0,0,0,0.12)",zIndex:100,padding:12}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10}}>
              <span style={{fontSize:14,fontWeight:700,color:"#1a2a3a"}}>Notifications</span>
              <div style={{display:"flex",gap:6,alignItems:"center"}}>
                {myNotifications.length > 0 && (
                  <button onClick={clearAllNotifications} style={{background:"none",border:"1px solid #e8c0c0",color:"#904040",borderRadius:5,padding:"2px 8px",fontSize:10,cursor:"pointer",fontFamily:font}}>Clear all</button>
                )}
                <button aria-label="Close notifications" onClick={()=>setShowNotifs(false)} style={{background:"none",border:"none",fontSize:16,cursor:"pointer",color:"#8a94a0"}}>x</button>
              </div>

            {myNotifications.length === 0 ? (
              <p style={{color:"#8a94a0",fontSize:13,textAlign:"center",padding:20}}>No notifications yet</p>

              const tabMap = {schedule_published:"calendar",schedule_changed:"calendar",trade_submitted:"timeoff",trade_accepted:"timeoff",trade_declined:"timeoff",trade_applied:"timeoff",vacation_logged:"timeoff",shift_reminder:"myschedule"};

                <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
                  <span style={{fontSize:12,fontWeight:600,color:"#1a2a3a"}}>{n.title}</span>
                  <span style={{fontSize:10,color:"#a0a8b0"}}>{new Date(n.created_at).toLocaleDateString()}</span>
                </div>
                <p style={{fontSize:12,color:"#5a6a78",margin:"3px 0 0",lineHeight:1.4}}>{n.message}</p>
                {targetTab && <span style={{fontSize:10,color:"#1a6fa8",marginTop:3,display:"inline-block"}}>Tap to view</span>}
              </div>

          </div>

        {/* Unlinked-account banner (neutral; the scheduler links accounts in Setup -> Users, Slice E) */}
        {!isPublicMode && isUnlinked && (
          <div data-testid="unlinked-banner" style={{...css.card,padding:"10px 14px",background:profileLoadFailed?"#fce8e8":"#eef3f8",border:`1px solid ${profileLoadFailed?"#e8c0c0":"#c0d4e8"}`,fontSize:12.5,color:profileLoadFailed?"#8a3030":"#2c4a68",lineHeight:1.5}}>
            {profileLoadFailed
              ? "Couldn't load your account profile - some features are hidden until it loads. Reload the app; if this persists, tell the scheduler."

          </div>
