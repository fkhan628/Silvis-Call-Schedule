          <SuField label="Person"><select data-testid="paste-person" value={paste.person_id} onChange={e => setPaste(p => ({ ...p, person_id: e.target.value }))} style={{ ...inp, width: 120 }}><option value="">Select</option>{(roster || []).map(s => <option key={s.id} value={s.id}>{s.name}</option>)}</select></SuField>
          <SuField label="Kind"><select value={paste.kind} onChange={e => setPaste(p => ({ ...p, kind: e.target.value }))} style={{ ...inp, width: 120 }}>{SU_AVAIL_KINDS.map(k => <option key={k} value={k}>{k}</option>)}</select></SuField>
          <SuField label="Role"><select value={paste.role} onChange={e => setPaste(p => ({ ...p, role: e.target.value }))} style={{ ...inp, width: 90 }}><option value="any">any</option><option value="primary">primary</option><option value="backup">backup</option></select></SuField>
          <SuField label="Year for M/D dates"><select data-testid="paste-year" value={paste.year} onChange={e => setPaste(p => ({ ...p, year: e.target.value }))} style={{ ...inp, width: 80 }}>{years.map(y => <option key={y} value={y}>{y}</option>)}</select></SuField>
          <SuField label="Note (public)" width={180}><input type="text" value={paste.note} onChange={e => setPaste(p => ({ ...p, note: e.target.value }))} style={{ ...inp, width: "100%" }} /></SuField>
        </div>
        <textarea data-testid="paste-text" value={paste.text} onChange={e => setPaste(p => ({ ...p, text: e.target.value }))} placeholder="10/6, 10/10, 10/11, 10/19-10/24 or 2026-12-01, 2026-12-03" style={{ ...inp, width: "100%", minHeight: 54, fontFamily: mono }} />
        <div data-testid="paste-preview" style={{ fontSize: 11.5, color: "#3a4a58", marginTop: 6, lineHeight: 1.5 }}>
          {parsed.dates.length === 0 ? <span style={{ color: "#7a8a98" }}>Nothing parsed yet.</span> : <>
            <strong>{parsed.dates.length} date(s)</strong> in <strong>{ranges.length} range(s)</strong>: <span style={{ fontFamily: mono }}>{ranges.map(r => r.start === r.end ? fmtMD(r.start) : fmtMD(r.start) + "-" + fmtMD(r.end)).join(", ")}</span>
            {paste.person_id ? <span> - {pasteNew} new row(s), {pasteRows.length - pasteNew} already exist (skipped)</span> : <span> - pick a person</span>}
          </>}
          {parsed.bad.length > 0 && <div style={{ color: "#a83232" }}>Not understood: {parsed.bad.join(", ")}</div>}
        </div>
        <button data-testid="paste-insert" onClick={submitPaste} disabled={busy || !paste.person_id || !pasteNew || contactNote(paste.note)} style={{ ...css.btn(true), padding: "5px 12px", marginTop: 6, opacity: (busy || !paste.person_id || !pasteNew) ? 0.5 : 1 }}>Insert {pasteNew} row(s)</button>
      </div>
      <div style={{ display: "flex", gap: 6, alignItems: "center", marginBottom: 6, flexWrap: "wrap" }}>
        <span style={{ fontSize: 11, color: "#7a8a98" }}>Show:</span>
        <button onClick={() => setFilter("")} style={css.mini(!filter)}>everyone ({(rows || []).length})</button>
        {(roster || []).map(s => <button key={s.id} data-testid={"avail-filter-" + s.id} onClick={() => setFilter(s.id)} style={css.mini(filter === s.id)}>{s.name} ({(rows || []).filter(r => r.person_id === s.id).length})</button>)}
      </div>
      <div className="table-wrap" style={{ ...css.tableWrap, maxHeight: 320, overflowY: "auto" }}>
        <table className="setup-table" data-testid="avail-table">
          <thead><tr><th>Person</th><th>Kind</th><th>Role</th><th>Dates</th><th>Note</th><th>Source</th><th></th></tr></thead>
          <tbody>
            {shown.length === 0 && <tr><td colSpan={7} style={{ color: "#7a8a98", fontStyle: "italic" }}>No rows.</td></tr>}
            {shown.map(r => (
              <tr key={r.id} data-avail={r.id}>
                <td>{nameOf(r.person_id)}</td><td style={{ fontFamily: mono }}>{r.kind}</td><td style={{ fontFamily: mono }}>{r.role || "any"}</td>
                <td style={{ fontFamily: mono, whiteSpace: "nowrap" }}>{String(r.start_date).slice(0, 10)}{r.end_date !== r.start_date ? " to " + String(r.end_date).slice(0, 10) : ""}</td>
                <td style={{ color: "#5a6a78" }}>{r.note || ""}</td><td style={{ fontFamily: mono, fontSize: 11 }}>{r.source || ""}</td>
                <td><button onClick={() => onDelete(r)} disabled={busy} style={css.danger}>Delete</button></td>
              </tr>
            ))}
          </tbody>
        </table>
      </div>
    </div>
  );
}

// --- Holiday units per year (blob) + who covers them now (schedule_days) ---
// Prompt 12 U (Faraz 9/22 evening): "Add year" pre-fills the new year from
// helpers.defaultHolidayUnits(year, groupRules.holidays + holidays.rules.tiers)
// - a minor holiday on a Monday absorbs the weekend before it (Sat-Mon) when
// groupRules.holidays.mondayMinorAbsorbsWeekend is true. Every unit and day
// stays editable; the stored days are what the engine reads.
function HolidaysCard({ css, holidays, groupRules, schedule, roster, nameOf, onSave, onEditDay, showToast, rulesImported }) {
  const inp = { ...css.inp, padding: "3px 6px", fontSize: 12 };
  const [draft, setDraft] = React.useState(() => suClone(holidays && holidays.units ? holidays : { units: {} }));
  const [dirty, setDirty] = React.useState(false);
  const [newYear, setNewYear] = React.useState("");
  const [dayTexts, setDayTexts] = React.useState({});
  React.useEffect(() => { if (!dirty) setDraft(suClone(holidays && holidays.units ? holidays : { units: {} })); }, [holidays]); // eslint-disable-line
  const units = draft.units || {};
  const years = Object.keys(units).sort();
  const edit = (y, i, patch) => { setDirty(true); setDraft(d => { const n = suClone(d); n.units[y] = n.units[y].map((u, j) => j === i ? { ...u, ...patch } : u); return n; }); };
  const setDays = (y, i, text) => {
    const list = suIsoList(text).filter(suIsIso).sort();
    edit(y, i, { days: list });
  };
  const addUnit = (y) => { setDirty(true); setDraft(d => { const n = suClone(d); (n.units[y] = n.units[y] || []).push({ name: SU_HOLIDAY_NAMES[0], tier: "major", days: [y + "-01-01"] }); return n; }); };
  const removeUnit = (y, i) => { setDirty(true); setDraft(d => { const n = suClone(d); n.units[y] = n.units[y].filter((_, j) => j !== i); return n; }); };
  const addYear = () => {
    const y = newYear.trim(); if (!/^\d{4}$/.test(y)) { showToast("Enter a 4-digit year.", "error"); return; } if (units[y]) { showToast(y + " already exists.", "info"); return; }
    const tiers = (draft.rules && draft.rules.tiers) || (holidays && holidays.rules && holidays.rules.tiers) || undefined;
    // name / tier / days only: the builder's per-unit note never reaches the blob (the importer drops holiday notes by design)
    const prefill = defaultHolidayUnits(y, { ...((groupRules && groupRules.holidays) || {}), tiers }).map(u => ({ name: u.name, tier: u.tier, days: u.days }));
    setDirty(true); setDraft(d => { const n = suClone(d); n.units[y] = prefill; return n; }); setNewYear("");
  };
  const save = () => {
    for (const y of years) for (const u of units[y]) {
      if (!u.name || !Array.isArray(u.days) || !u.days.length || !u.days.every(suIsIso)) { showToast(`Unit "${u.name || "?"}" in ${y} needs a name and at least one valid date.`, "error"); return; }
    }
    onSave(draft); setDirty(false);
  };
  const counts = suHolidayCounts(schedule, (holidays && holidays.units) || {}, "2026-09-14");
  return (
    <div data-testid="holidays-card">
      <p style={{ fontSize: 12, color: "#5a6a78", margin: "0 0 8px", lineHeight: 1.5 }}>Each unit gets one primary and one backup who stick through every day of it; a unit pre-empts the weekend it overlaps. Days are editable per year (Faraz: "the days will have to be figured out"). Coverage is read from the saved schedule; edit a day through the day editor.</p>
      {!rulesImported && <div style={css.warnBox}>Rules are not imported yet - holiday units arrive with the seed import, or add a year and units here.</div>}
      <div style={{ display: "flex", gap: 8, alignItems: "center", flexWrap: "wrap", marginBottom: 8 }}>
        <span style={{ fontSize: 11, color: "#7a8a98" }}>Held since 9/14/2026 (units, major/minor):</span>
        {(roster || []).map(s => { const c = counts[s.id] || { major: 0, minor: 0 }; return <span key={s.id} data-testid={"hol-count-" + s.id} style={{ fontSize: 11, fontFamily: mono, background: "#f4f6f8", border: "1px solid #e0e4ea", borderRadius: 5, padding: "2px 7px" }}>{s.name} {c.major}/{c.minor}</span>; })}
      </div>
      {years.map(y => (
        <div key={y} style={{ border: "1px solid #e8ecf0", borderRadius: 8, padding: "8px 10px", marginBottom: 8 }}>
          <div style={{ ...css.subT, margin: "0 0 6px" }}>{y} <button onClick={() => addUnit(y)} style={{ ...css.mini(false), marginLeft: 8 }}>Add unit</button></div>
          <div className="table-wrap" style={css.tableWrap}>
            <table className="setup-table" data-testid={"hol-year-" + y}>
              <thead><tr><th>Unit</th><th>Tier</th><th>Days (ISO, comma separated)</th><th>Covered now</th><th></th></tr></thead>
              <tbody>
                {(units[y] || []).map((u, i) => {
                  const cov = suHolidayCoverage(schedule, u);
                  const who = (v) => v === "mixed" ? <span style={{ color: "#a83232", fontWeight: 700 }}>mixed</span> : !v ? <span style={{ color: "#c04040", fontWeight: 800 }}>OPEN</span> : (String(v).indexOf("ext:") === 0 ? <span style={{ fontStyle: "italic" }}>{String(v).slice(4)} (ext)</span> : nameOf(v));
                  const key = y + ":" + i;
                  return (
                    <tr key={key}>
                      <td>
                        <select value={SU_HOLIDAY_NAMES.indexOf(u.name) >= 0 ? u.name : "__other"} onChange={e => { if (e.target.value !== "__other") edit(y, i, { name: e.target.value }); else edit(y, i, { name: "" }); }} style={{ ...inp, width: 140 }}>{SU_HOLIDAY_NAMES.map(n => <option key={n} value={n}>{n}</option>)}<option value="__other">other</option></select>
                        {SU_HOLIDAY_NAMES.indexOf(u.name) < 0 && <input type="text" value={u.name || ""} placeholder="name" onChange={e => edit(y, i, { name: e.target.value })} style={{ ...inp, width: 120, marginLeft: 4 }} />}
                      </td>
                      <td><select value={u.tier || "major"} onChange={e => edit(y, i, { tier: e.target.value })} style={{ ...inp, width: 80 }}><option value="major">major</option><option value="minor">minor</option></select></td>
                      <td><input type="text" value={dayTexts[key] !== undefined ? dayTexts[key] : (u.days || []).join(", ")} onChange={e => { setDayTexts(t => ({ ...t, [key]: e.target.value })); setDays(y, i, e.target.value); }} onBlur={() => setDayTexts(t => { const n = { ...t }; delete n[key]; return n; })} style={{ ...inp, width: 300, fontFamily: mono }} /></td>
                      <td style={{ fontSize: 12, whiteSpace: "nowrap" }} data-testid="hol-coverage">P {who(cov.primary)} / B {who(cov.backup)}{cov.openSlots ? <span style={{ color: "#c04040", marginLeft: 4 }}>({cov.openSlots} open slot(s))</span> : null}</td>
                      <td style={{ whiteSpace: "nowrap" }}>
                        {(u.days || []).slice(0, 4).map(d => <button key={d} onClick={() => onEditDay(d)} title={"Open the day editor for " + d} style={{ ...css.mini(false), marginRight: 3 }}>Edit {fmtMD(d)}</button>)}
                        <button onClick={() => removeUnit(y, i)} style={css.danger}>Remove</button>
                      </td>
                    </tr>
                  );
                })}
                {(units[y] || []).length === 0 && <tr><td colSpan={5} style={{ color: "#7a8a98", fontStyle: "italic" }}>No units for {y}.</td></tr>}
              </tbody>
            </table>
          </div>
        </div>
      ))}
      <div style={{ display: "flex", gap: 8, alignItems: "center", flexWrap: "wrap" }}>
        <input type="text" value={newYear} placeholder="2028" onChange={e => setNewYear(e.target.value)} style={{ ...inp, width: 70, fontFamily: mono }} />
        <button onClick={addYear} style={css.mini(false)}>Add year</button>
        <button data-testid="holidays-save" onClick={save} disabled={!dirty} style={{ ...css.btn(true), padding: "5px 14px", opacity: dirty ? 1 : 0.5 }}>Save holidays</button>
        {dirty && <button onClick={() => { setDraft(suClone(holidays && holidays.units ? holidays : { units: {} })); setDirty(false); }} style={css.mini(false)}>Revert</button>}
        <span style={{ fontSize: 11, color: "#7a8a98" }}>{dirty ? "Unsaved changes" : "Saved in the shared setup (autosave)."}</span>
      </div>
      <p data-testid="holidays-prefill-hint" style={{ fontSize: 11, color: "#7a8a98", margin: "6px 0 0" }}>{(groupRules && groupRules.holidays && groupRules.holidays.mondayMinorAbsorbsWeekend === true) ? "New years are pre-filled from the group rule (minor Monday holidays absorb the weekend before); edit any unit's days." : "New years are pre-filled with single-day holidays (the Monday-minor group rule is off in the shared setup); edit any unit's days."}</p>
    </div>
  );
}

// --- East feed status, forecast, overrides, derived weeks and busy days ---
function EastFeedCard({ css, feedRows, forecastRows, overrideRows, loadState, ctx, ctxInputs, roster, nameOf, calMonth, calYear, onRefresh, refreshing, onSaveOverride, onDeleteOverride, threshold, today, conflicts, onEditDay }) {
  const inp = { ...css.inp, padding: "3px 6px", fontSize: 12 };
  const weeks = (feedRows || []).map(r => ({ weekMonday: r.week_monday, data: r.data || {} }));
  const cov = typeof coverageOf === "function" ? coverageOf(weeks) : null;
  const fetchedAt = (feedRows || []).map(r => r.fetched_at).filter(Boolean).sort().slice(-1)[0] || null;
  const derived = (ctxInputs && ctxInputs.eastDerived) || [];
  const nextPrimary = derived.filter(w => w.silvisRole === "primary" && w.weekMonday >= today).sort((a, b) => a.weekMonday < b.weekMonday ? -1 : 1)[0] || null;
  const meta = (ctxInputs && ctxInputs.eastMeta) || {};
  const busyIds = Object.keys(meta).filter(id => meta[id].busyDays);
  // Fix round (9/22, findings 2 + 12): the strip reads the PRUNED map - published rows
  // win - so it can never name a day eligibility ignores; rows inside the coverage
  // (stale after a failed prune) are counted and named as ignored.
  const forecast = (typeof forecastFromFeedRows === "function" && typeof forecastOutsideCoverage === "function") ? forecastOutsideCoverage(forecastFromFeedRows(forecastRows || []), cov) : {};
  const fcInsideCov = cov ? (forecastRows || []).filter(r => r && r.week_monday >= cov.from && r.week_monday <= cov.to).length : 0;
  const fcGenerated = (forecastRows || []).map(r => r.generated_at || (r.data && r.data.generatedAt)).filter(Boolean).sort().slice(-1)[0] || null;
  const fcRuns = (forecastRows || []).map(r => r.data && r.data.runs).filter(x => typeof x === "number")[0];
  const horizon = suAddDays(today, 90);
  const fcDays = Object.keys(forecast).filter(d => d >= today && d <= horizon && forecast[d] >= (threshold || 0.5)).sort();
  const monthKey = String(calYear) + "-" + String(calMonth + 1).padStart(2, "0");
  const [ov, setOv] = React.useState({ day: today, person_id: busyIds[0] || "", busy: "true", note: "" });
  const state = (k) => (loadState || {})[k] || "pending";
  const tone = (k) => state(k) === "ok" ? "#1a8040" : state(k) === "failed" ? "#a83232" : "#8a5a10";
  return (
    <div data-testid="east-card">
      <div data-testid="east-status" style={{ fontSize: 12.5, color: "#2c3e50", lineHeight: 1.6, marginBottom: 8 }}>
        <strong>East feed:</strong> fetched {suFmtTs(fetchedAt)}, {weeks.length} week(s), coverage {cov ? cov.from + ".." + cov.to : "none"}, next derived primary week {nextPrimary ? nextPrimary.weekMonday + " (" + nameOf(nextPrimary.surgeonId) + ", " + nextPrimary.source + ")" : "none on file"}.
        <span style={{ marginLeft: 8, fontSize: 11 }}>cache: <span style={{ color: tone("feed") }}>{state("feed")}</span>, forecast: <span style={{ color: tone("forecast") }}>{state("forecast")}</span>, overrides: <span style={{ color: tone("overrides") }}>{state("overrides")}</span></span>
      </div>
      <div style={{ display: "flex", gap: 8, alignItems: "center", flexWrap: "wrap", marginBottom: 10 }}>
        <button data-testid="east-refresh" onClick={onRefresh} disabled={refreshing} style={{ ...css.btn(true), padding: "5px 12px", opacity: refreshing ? 0.6 : 1 }}>{refreshing ? "Fetching" : "Refresh from Davenport (read-only)"}</button>
        <span style={{ fontSize: 11, color: "#7a8a98" }}>Reads the Davenport project's published weeks with its public key, caches them here, then rebuilds eligibility. A failed fetch keeps the cache and says so - it never reads as "no East call".</span>
      </div>
      <div style={{ border: "1px solid #e8ecf0", borderRadius: 8, padding: "8px 10px", marginBottom: 10 }}>
        <div style={{ ...css.subT, margin: "0 0 4px" }}>Forecast (while Davenport is unpublished)</div>
        {(forecastRows || []).length === 0 ? <p style={{ fontSize: 12, color: "#7a8a98", margin: 0 }}>No forecast rows.</p> : (
          <div style={{ fontSize: 12, color: "#3a4a58", lineHeight: 1.6 }}>
            generated {suFmtTs(fcGenerated)}, {fcRuns !== undefined ? fcRuns + " runs" : "runs unknown"}, {(forecastRows || []).length} week(s){fcInsideCov > 0 ? <span style={{ color: "#a83232" }}> ({fcInsideCov} inside the published coverage (ignored) - refresh the feed to delete them)</span> : null}; days at or above {Math.round((threshold || 0.5) * 100)}% in the next 90 days: {fcDays.length === 0 ? "none" : null}
            {fcDays.length > 0 && <div data-testid="east-forecast-days" style={{ fontFamily: mono, fontSize: 11 }}>{fcDays.map(d => d + " " + Math.round(forecast[d] * 100) + "%").join(", ")}</div>}
          </div>
        )}
        <p style={{ fontSize: 11, color: "#7a8a98", margin: "4px 0 0" }}>How to refresh: run <span style={{ fontFamily: mono }}>node scripts/east-forecast.js --sql</span> on the dev machine and paste the printed upserts into the Supabase SQL editor (the script itself never writes). Refreshing the feed caches Davenport's published weeks and deletes forecast rows for weeks that are now published; the forecast only ever fills weeks Davenport has not published.</p>
      </div>
      <div style={{ border: "1px solid " + ((conflicts || []).length ? "#e0b4b4" : "#e8ecf0"), borderRadius: 8, padding: "8px 10px", marginBottom: 10 }}>
        <div style={{ ...css.subT, margin: "0 0 4px", color: (conflicts || []).length ? "#a83232" : undefined }}>Conflicts with the published schedule ({(conflicts || []).length})</div>
        <p style={{ fontSize: 11, color: "#7a8a98", margin: "0 0 4px" }}>Days where the East data makes the assigned surgeon ineligible - on East call while Silvis primary, or a derived East week the schedule no longer matches. Locked days are listed too; open the day to trade or reassign.</p>
        <div data-testid="east-conflicts" style={{ fontSize: 12, fontFamily: mono, lineHeight: 1.7 }}>
          {(conflicts || []).length === 0 ? "none" : (conflicts || []).map(c => (
            <div key={c.day + c.role}>
              <button type="button" onClick={() => onEditDay && onEditDay(c.day)} style={{ ...css.mini(false), fontFamily: mono, padding: "1px 6px", marginRight: 6 }}>{c.day}</button>
              {" "}{c.role} {nameOf(c.id)}: {(c.reasons || []).map(r => reasonLabel(r, nameOf)).join(", ")}
            </div>
          ))}
        </div>
      </div>
      <div style={{ border: "1px solid #e8ecf0", borderRadius: 8, padding: "8px 10px", marginBottom: 10 }}>
        <div style={{ ...css.subT, margin: "0 0 4px" }}>Overrides (days Faraz knows differ from the feed)</div>
        <div className="table-wrap" style={css.tableWrap}>
          <table className="setup-table" data-testid="east-overrides">
            <thead><tr><th>Day</th><th>Surgeon</th><th>Busy</th><th>Note</th><th></th></tr></thead>
            <tbody>
              {(overrideRows || []).length === 0 && <tr><td colSpan={5} style={{ color: "#7a8a98", fontStyle: "italic" }}>No overrides.</td></tr>}
              {(overrideRows || []).map(r => (
                <tr key={r.day + ":" + r.person_id}><td style={{ fontFamily: mono }}>{String(r.day).slice(0, 10)}</td><td>{nameOf(r.person_id)}</td><td>{r.busy ? "busy (on East call)" : "free (force clear)"}</td><td>{r.note || ""}</td><td><button onClick={() => onDeleteOverride(r.day, r.person_id)} style={css.danger}>Delete</button></td></tr>
              ))}
              <tr>
                <td><input type="date" value={ov.day} onChange={e => setOv(o => ({ ...o, day: e.target.value }))} style={inp} /></td>
                <td><select value={ov.person_id} onChange={e => setOv(o => ({ ...o, person_id: e.target.value }))} style={{ ...inp, width: 120 }}><option value="">Select</option>{(roster || []).filter(s => busyIds.indexOf(s.id) >= 0).map(s => <option key={s.id} value={s.id}>{s.name}</option>)}</select></td>
                <td><select value={ov.busy} onChange={e => setOv(o => ({ ...o, busy: e.target.value }))} style={{ ...inp, width: 150 }}><option value="true">busy (on East call)</option><option value="false">free (force clear)</option></select></td>
                <td><input type="text" value={ov.note} placeholder="operational note" onChange={e => setOv(o => ({ ...o, note: e.target.value }))} style={{ ...inp, width: 180 }} /></td>
                <td><button data-testid="east-override-save" onClick={() => { if (!suIsIso(ov.day) || !ov.person_id) return; onSaveOverride({ day: ov.day, person_id: ov.person_id, busy: ov.busy === "true", note: ov.note.trim() || null }); }} style={css.mini(true)}>Save</button></td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
      <div style={{ display: "flex", gap: 12, flexWrap: "wrap" }}>
        <div style={{ flex: "1 1 260px", border: "1px solid #e8ecf0", borderRadius: 8, padding: "8px 10px" }}>
          <div style={{ ...css.subT, margin: "0 0 4px" }}>Derived weeks (East week to Silvis role)</div>
          {derived.length === 0 ? <p style={{ fontSize: 12, color: "#7a8a98", margin: 0 }}>None derived.</p> : (
            <div data-testid="east-derived" style={{ fontSize: 12, fontFamily: mono, lineHeight: 1.6 }}>
              {derived.slice().sort((a, b) => a.weekMonday < b.weekMonday ? -1 : 1).map(w => <div key={w.weekMonday + w.surgeonId}>{w.weekMonday} {nameOf(w.surgeonId)} Silvis {w.silvisRole} <span style={{ color: "#7a8a98" }}>({w.source})</span></div>)}
            </div>
          )}
        </div>
        <div style={{ flex: "1 1 260px", border: "1px solid #e8ecf0", borderRadius: 8, padding: "8px 10px" }}>
          <div style={{ ...css.subT, margin: "0 0 4px" }}>East busy days in {monthKey} (published + overrides)</div>
          {busyIds.length === 0 ? <p style={{ fontSize: 12, color: "#7a8a98", margin: 0 }}>No surgeon has an East busy-days rule.</p> : busyIds.map(id => {
            const P = ctx && ctx.per ? ctx.per[id] : null;
            const days = P ? Array.from(P.eastBusy).filter(d => d.slice(0, 7) === monthKey).sort() : [];
            return <div key={id} data-testid={"east-busy-" + id} style={{ fontSize: 12, marginBottom: 4 }}><strong>{nameOf(id)}</strong>{meta[id].eastId ? "" : " (East id unresolved)"}: {days.length ? <span style={{ fontFamily: mono }}>{days.map(d => fmtMD(d)).join(", ")}</span> : <span style={{ color: "#7a8a98" }}>none</span>}</div>;
          })}
          {busyIds.map(id => {
            // Prompt 12 V: standing East days (surgeonRules.<id>.eastStanding) - read-only; seed/blob data, no Setup field yet
            const P = ctx && ctx.per ? ctx.per[id] : null;
            const st = P && P.eastStandingList ? P.eastStandingList : [];
            return st.length ? <div key={"standing-" + id} data-testid={"east-standing-" + id} style={{ fontSize: 12, marginTop: 6, color: "#2c3e50" }}><strong>{nameOf(id)}</strong> - Standing: <span style={{ fontFamily: mono }}>{st.map(e => e.name + " " + e.days.join(", ")).join("; ")}</span> (every year; Silvis primary blocked, backup per the East-day rule; seed/blob data, no Setup field yet)</div> : null;
          })}
        </div>
      </div>
    </div>
  );
}

// --- Generate: presets, options, run, preview + diagnostics ---
function GenDiagnostics({ css, dg, nameOf, roster }) {
  if (!dg) return null;
  const ids = (roster || []).map(s => s.id).filter(id => dg.tallies && dg.tallies[id]);
  const months = (dg.range && dg.range.months) || [];
  const soft = dg.softPenalties || [];
  const bySurgeon = {};
  soft.forEach(p => { (bySurgeon[p.id] = bySurgeon[p.id] || []).push(p); });
  const num = (v) => v === null || v === undefined ? "-" : (Math.round(v * 10) / 10);
  // Prompt 12 J (9/22): tallies target = { primary, backup } per month and for the range (a pre-J preview
  // persisted a single number: read it as the primary target); impliedTargets carries the shares table.
  const tgtOf = (t, role) => t && typeof t === "object" ? (typeof t[role] === "number" ? t[role] : null) : (role === "primary" && typeof t === "number" ? t : null);
  const IT = dg.impliedTargets;
  const hasShares = !!(IT && IT.months && Object.keys(IT.months).some(m => IT.months[m] && IT.months[m].members));
  const scoreKeys = dg.score ? Object.keys(dg.score) : [];
  const box = { border: "1px solid #e8ecf0", borderRadius: 8, padding: "8px 10px", marginBottom: 8 };
  return (
    <div data-testid="gen-diagnostics" data-uncovered-count={(dg.uncovered || []).length}>
      <div style={box}>
        <div style={{ ...css.subT, margin: "0 0 4px" }}>Score (lower is better)</div>
        <div data-testid="gen-score" style={{ display: "flex", gap: 10, flexWrap: "wrap", fontSize: 12, fontFamily: mono }}>
          {scoreKeys.map(k => {
            const v = dg.score[k];
            // An object-valued key (weights) is summarised, never String()-ed
            // into "[object Object]"; the full JSON sits in the title.
            if (v && typeof v === "object") { const ks = Object.keys(v); return <span key={k} data-testid={"gen-score-" + k} title={JSON.stringify(v)}><span style={{ color: "#7a8a98" }}>{k}</span> {ks.length} key{ks.length === 1 ? "" : "s"}: {ks.slice(0, 4).map(x => x + "=" + v[x]).join(", ")}{ks.length > 4 ? ", ..." : ""}</span>; }
            return <span key={k}><span style={{ color: "#7a8a98" }}>{k}</span> {typeof v === "number" ? (Number.isInteger(v) ? v : v.toFixed(2)) : String(v)}</span>;
          })}
          <span><span style={{ color: "#7a8a98" }}>candidates</span> {dg.candidatesTried}/{dg.bestOf}{dg.truncated ? " (time budget hit)" : ""}</span>
        </div>
      </div>
      <div style={box}>
        <div style={{ ...css.subT, margin: "0 0 4px" }}>Per-surgeon tallies vs cap / target</div>
        <div className="table-wrap" style={css.tableWrap}>
          <table className="setup-table" data-testid="gen-tallies">
            <thead><tr><th>Surgeon</th><th>Month</th><th>P</th><th>B</th><th>Total</th><th>Wknd days</th><th>Major</th><th>Minor</th><th title="Longest run of consecutive primary days touching the month / range (real days; the hard limit's measure)">Max consec. P</th><th title="Longest run of consecutive days in either role (real days; the soft limit's measure)">Max consec. any</th><th title="Monthly cap on PRIMARY days (backup days never count); a row is flagged when P - plus, for a cap that counts East days, his East primary-week days - is over it">Cap (P)</th><th title="Primary-day target for the month: an explicit monthlyTarget, else the implied equal share of the month's open primary slots (the window surgeon: her window target)">Target P</th><th title="Backup-day target for the month: the implied equal share of the month's open backup slots (a windows surgeon has none)">Target B</th></tr></thead>
            <tbody>
              {ids.map(id => {
                const t = dg.tallies[id];
                const rows = months.map(m => { const x = t.months[m] || {}; return (
                  <tr key={id + m} data-tally={id} style={{ color: (x.cap !== null && x.cap !== undefined && (x.primary + (x.eastP || 0)) > x.cap) ? "#a83232" : undefined }}>
                    <td>{nameOf(id)}</td><td style={{ fontFamily: mono }}>{m}</td><td>{x.primary}</td><td>{x.backup}</td><td><strong>{x.total}</strong></td><td>{x.weekendDays}</td><td>{x.majorHolidays}</td><td>{x.minorHolidays}</td><td>{x.maxConsecutive}</td><td>{x.maxConsecutiveAnyRole}</td><td title={x.eastP ? x.primary + " P + " + x.eastP + " East primary-week day(s) = " + (x.primary + x.eastP) + " counted against the cap" : undefined}>{num(x.cap)}{x.eastP ? " (" + (x.primary + x.eastP) + " counted)" : ""}</td><td>{num(tgtOf(x.target, "primary"))}</td><td>{num(tgtOf(x.target, "backup"))}</td>
                  </tr>); });
                const r = t.range || {};
                rows.push(<tr key={id + "range"} data-tally-range={id} style={{ background: "#f4f6f8", fontWeight: 700 }}><td>{nameOf(id)}</td><td>range</td><td>{r.primary}</td><td>{r.backup}</td><td>{r.total}</td><td>{r.weekendDays}</td><td>{r.majorHolidays}</td><td>{r.minorHolidays}</td><td>{r.maxConsecutive}</td><td>{r.maxConsecutiveAnyRole}</td><td title={r.eastP ? r.primary + " P + " + r.eastP + " East primary-week day(s) in the range" : undefined}>{num(r.cap)}{r.eastP ? " (+" + r.eastP + " East P)" : ""}</td><td>{num(tgtOf(r.target, "primary"))}</td><td>{num(tgtOf(r.target, "backup"))}</td></tr>);
                return rows;
              })}
            </tbody>
          </table>
        </div>
      </div>
      {hasShares && (
        <div style={box} data-testid="gen-shares">
          <div style={{ ...css.subT, margin: "0 0 4px" }}>Implied shares (equal-share fairness: target vs what the rules allow)</div>
          <p style={{ fontSize: 11, color: "#7a8a98", margin: "0 0 6px", lineHeight: 1.5 }}>Pool: {(IT.pool || []).map(nameOf).join(", ")}. Every pool member is targeted at an equal share of the month's open primary slots (after the window surgeon's reserved primaries) and, separately, of its open backup slots, held to locked days, caps and availability. Allowed = the open slots the rules let the surgeon take (a weekend day of a full weekend unit as a block member); a target above it is an availability shortfall the generator cannot close, not a defect. Targets and locked days are whole-month figures even where the range only touches a month. Placeable = the open slots the targets ask for (target minus locked days, summed); where a locked floor or a cap pins a member it reads below the open count and the surplus days are placed by the soft terms alone.</p>
          {months.map(m => { const I = IT.months[m]; if (!I || !I.members) return null; return (
            <div key={m} style={{ marginBottom: 6 }}>
              <div style={{ fontSize: 12, fontFamily: mono }} data-testid={"gen-shares-head-" + m}>{m}: primary {I.primaryOpen} open - {I.reservedForWindows} reserved = share {I.primaryShare} each of {I.poolSize}; backup {I.backupOpen} open = share {I.backupShare}{I.placeableAtTarget ? " | placeable at target " + num(I.placeableAtTarget.primary) + " P / " + num(I.placeableAtTarget.backup) + " B of " + I.primaryOpen + " / " + I.backupOpen + " open" : ""}{typeof I.rangeDays === "number" && I.rangeDays < new Date(Number(m.slice(0, 4)), Number(m.slice(5, 7)), 0).getDate() ? " | partial month: " + I.rangeDays + " day(s) in range, whole-month targets" : ""}</div>
              <div className="table-wrap" style={css.tableWrap}><table className="setup-table" data-testid={"gen-shares-" + m}><thead><tr><th>Surgeon</th><th>Target P</th><th>Allowed P</th><th>Locked P</th><th title="min(preferred cap, cap - 1) minus East primary-week days (a cap that counts them); '-' when uncapped">Clip P</th><th>Target B</th><th>Allowed B</th><th>Locked B</th></tr></thead><tbody>
                {ids.filter(id => I.members[id]).map(id => { const M = I.members[id]; const shortP = typeof M.primaryTarget === "number" && M.allowedPrimary + M.lockedHeld.primary < M.primaryTarget; const shortB = typeof M.backupTarget === "number" && M.allowedBackup + M.lockedHeld.backup < M.backupTarget; return (
                  <tr key={id} data-share={id + ":" + m}><td>{nameOf(id)}</td><td>{num(M.primaryTarget)}</td><td style={{ color: shortP ? "#a83232" : undefined }} title={shortP ? "the rules allow fewer open primary slots than the target" : undefined}>{M.allowedPrimary}{shortP ? " (short)" : ""}</td><td>{M.lockedHeld.primary}</td><td>{num(M.clipPrimary)}</td><td>{num(M.backupTarget)}</td><td style={{ color: shortB ? "#a83232" : undefined }} title={shortB ? "the rules allow fewer open backup slots than the target" : undefined}>{M.allowedBackup}{shortB ? " (short)" : ""}</td><td>{M.lockedHeld.backup}</td></tr>); })}
              </tbody></table></div>
            </div>); })}
        </div>
      )}
      <div style={box}>
        <div style={{ ...css.subT, margin: "0 0 4px", color: (dg.uncovered || []).length ? "#a83232" : undefined }}>Open slots ({(dg.uncovered || []).length})</div>
        {(dg.uncovered || []).length === 0 ? <p style={{ fontSize: 12, color: "#1a8040", margin: 0 }}>Every slot in the range is covered.</p> : (
          <div className="table-wrap" style={css.tableWrap}><table className="setup-table" data-testid="gen-uncovered"><thead><tr><th>Day</th><th>Role</th><th>Why nobody is eligible</th></tr></thead><tbody>
            {dg.uncovered.map(u => <tr key={u.day + u.role} data-uncovered={u.day + ":" + u.role}><td style={{ fontFamily: mono, whiteSpace: "nowrap" }}>{u.weekday} {u.day}{u.holidayUnit ? " (" + u.holidayUnit + ")" : ""}</td><td>{u.role}</td><td style={{ fontSize: 11 }}>{Object.keys(u.reasons || {}).map(id => <div key={id}><strong>{nameOf(id)}</strong>: {(Array.isArray(u.reasons[id]) ? u.reasons[id] : [u.reasons[id]]).map(r => reasonLabel(r, nameOf)).join(", ")}</div>)}</td></tr>)}
          </tbody></table></div>
        )}
      </div>
      <div style={box}>
        <div style={{ ...css.subT, margin: "0 0 4px" }}>Soft penalties ({soft.length}, weight {Math.round(soft.reduce((n, p) => n + (Number(p.weight) || 0), 0))})</div>
        {Object.keys(bySurgeon).sort().map(id => {
          const list = bySurgeon[id]; const byReason = {};
          list.forEach(p => { const k = byReason[p.reason] || (byReason[p.reason] = { n: 0, w: 0, days: [] }); k.n++; k.w += Number(p.weight) || 0; if (k.days.length < 8) k.days.push(fmtMD(p.day) + (p.role ? " " + p.role[0].toUpperCase() : "")); });
          return (
            <details key={id} data-testid={"gen-soft-" + id} style={{ marginBottom: 4 }}>
              <summary style={{ fontSize: 12, cursor: "pointer" }}><strong>{nameOf(id)}</strong> - {list.length} entries, weight {Math.round(list.reduce((n, p) => n + (Number(p.weight) || 0), 0))}</summary>
              <table className="setup-table" style={{ marginTop: 4 }}><thead><tr><th>Reason</th><th>Count</th><th>Weight</th><th>Days (first 8)</th></tr></thead><tbody>
                {Object.keys(byReason).sort((a, b) => byReason[b].w - byReason[a].w).map(k => <tr key={k}><td>{softTag({ reason: k })} <span style={{ color: "#9aa4ae", fontFamily: mono, fontSize: 10 }}>{k}</span></td><td>{byReason[k].n}</td><td>{byReason[k].w}</td><td style={{ fontFamily: mono, fontSize: 11 }}>{byReason[k].days.join(", ")}</td></tr>)}
              </tbody></table>
            </details>
          );
        })}
        {soft.length === 0 && <p style={{ fontSize: 12, color: "#1a8040", margin: 0 }}>None.</p>}
      </div>
      <div style={box}>
        <div style={{ ...css.subT, margin: "0 0 4px" }}>Holiday units in range ({(dg.holidayUnits || []).length})</div>
        {(dg.holidayUnits || []).length === 0 ? <p style={{ fontSize: 12, color: "#7a8a98", margin: 0 }}>None.</p> : (dg.holidayUnits || []).map((u, i) => <div key={i} data-testid="gen-holiday" style={{ fontSize: 12 }}>{u.name || "unit"} {(u.days || u.inRange || []).map ? (u.days || u.inRange || []).map(fmtMD).join(", ") : ""}: P {u.primary ? (String(u.primary).indexOf("external:") === 0 ? u.primary.slice(9) + " (ext)" : nameOf(u.primary)) : "OPEN"} / B {u.backup ? nameOf(u.backup) : "OPEN"}{u.uncovered ? <span style={{ color: "#a83232" }}> (open slot)</span> : null}</div>)}
        <div style={{ ...css.subT, margin: "8px 0 4px" }}>Weekend units: {(dg.weekendUnits || []).length}, fallback (daily) {(dg.weekendUnits || []).filter(w => w.fallback).length}</div>
        <div style={{ ...css.subT, margin: "8px 0 4px", color: (dg.lockViolations || []).length ? "#a83232" : undefined }}>Lock violations ({(dg.lockViolations || []).length})</div>
        {(dg.lockViolations || []).map((v, i) => <div key={i} style={{ fontSize: 12 }}>{fmtMD(v.day)} {v.role} {nameOf(v.id)} ({v.lock}): {(v.reasons || []).map(r => reasonLabel(r, nameOf)).join(", ")}</div>)}
        <div style={{ ...css.subT, margin: "8px 0 4px", color: (dg.eastConflicts || []).length ? "#a83232" : undefined }}>East conflicts on the final schedule ({(dg.eastConflicts || []).length})</div>
        {(dg.eastConflicts || []).map((c, i) => <div key={i} data-testid="gen-east-conflict" style={{ fontSize: 12 }}>{fmtMD(c.day)} {c.role} {nameOf(c.id)}: {(c.reasons || []).map(r => reasonLabel(r, nameOf)).join(", ")}</div>)}
        <div style={{ ...css.subT, margin: "8px 0 4px" }}>East forecast days in range ({(dg.eastForecast || []).length}); unknown East days: {(dg.eastUnknownDays || []).length}</div>
        {(dg.eastForecast || []).length > 0 && <div style={{ fontSize: 11, fontFamily: mono, lineHeight: 1.5 }}>{dg.eastForecast.map(f => f.day + " " + Math.round(f.probability * 100) + "%" + (f.busyByThreshold ? " busy" : "") + (f.assigned ? " (" + nameOf(f.id) + " " + f.assigned + ")" : "")).join(", ")}</div>}
        {(dg.warnings || []).length > 0 && <><div style={{ ...css.subT, margin: "8px 0 4px", color: "#8a5a10" }}>Warnings ({dg.warnings.length})</div><ul style={{ margin: 0, paddingLeft: 18, fontSize: 11.5, color: "#7a5a20" }}>{dg.warnings.map((w, i) => <li key={i}>{w}</li>)}</ul></>}
      </div>
    </div>
  );
}

function GeneratePanel({ css, presets, opts, setOpts, busy, preview, onRun, onReroll, onAccept, onDiscard, nameOf, roster, rulesImported, lastPublishedDay, genStart, genFirstOpenDay, laterRanges, holidayNames }) {
  const inp = { ...css.inp, padding: "3px 6px", fontSize: 12 };
  const p0 = presets && presets[0];
  const start = opts.start || (p0 ? p0.start : "");
  const end = opts.end || (p0 ? p0.end : "");
  const isPreset = (p) => start === p.start && end === p.end;
  const laterText = (laterRanges || []).map(r => (r.start === r.end ? fmtMD(r.start) : fmtMD(r.start) + "-" + fmtMD(r.end)) + (holidayNames && holidayNames[r.start] ? " (" + holidayNames[r.start] + ")" : "")).join(", ");
  return (
    <div data-testid="generate-panel">
      <p style={{ fontSize: 12, color: "#5a6a78", margin: "0 0 8px", lineHeight: 1.5 }}>Best-of-N over the rules (locks, vacations, availability, East feed, holiday units). The result is a PREVIEW drawn on the calendar with a dashed outline; nothing is written until Accept &amp; Publish, which snapshots first, writes the days through the compare-and-swap sync and then opens the publish dialog. <span data-testid="gen-last-published" data-gen-start={genStart || ""}>{!lastPublishedDay ? "No schedule days on file yet." : genFirstOpenDay ? "Range starts at the first open slot on or after today: " + genStart + " (locks are never touched; the run fills every open slot from there and generates the rest). Last saved day (end of the contiguous block): " + lastPublishedDay + "." : "No open slot on or after today - the range starts the day after the last saved day (end of the contiguous block: " + lastPublishedDay + "), or today when that day has passed: " + genStart + "."}{laterText ? " Days with a held slot from the start on: " + laterText + " - locked slots stay as they are while 'respect locks' is on; the open slots on those days are filled." : ""}</span></p>
      {!rulesImported && <div style={{ ...css.warnBox, marginBottom: 8 }}>Rules are not imported yet - Generate needs surgeonRules / groupRules / holidays (Import seed below).</div>}
      <div style={{ display: "flex", gap: 6, flexWrap: "wrap", alignItems: "center", marginBottom: 8 }}>
        {(presets || []).map(p => <button key={p.label} data-testid={"gen-preset-" + p.label.replace(/\s+/g, "-").toLowerCase()} onClick={() => setOpts(o => ({ ...o, start: p.start, end: p.end }))} title={p.start + " to " + p.end} style={css.mini(isPreset(p))}>{p.label}</button>)}
      </div>
      <div style={{ display: "flex", gap: 8, flexWrap: "wrap", alignItems: "flex-end", marginBottom: 8 }}>
        <SuField label="Start"><input data-testid="gen-start" type="date" value={start} onChange={e => setOpts(o => ({ ...o, start: e.target.value }))} style={inp} /></SuField>
        <SuField label="End"><input data-testid="gen-end" type="date" value={end} onChange={e => setOpts(o => ({ ...o, end: e.target.value }))} style={inp} /></SuField>
        <SuField label="Candidates (N)"><input data-testid="gen-n" type="number" min="1" max="2000" value={opts.bestOf} onChange={e => setOpts(o => ({ ...o, bestOf: e.target.value }))} style={{ ...inp, width: 70 }} /></SuField>
        <SuField label="Seed" hint="blank = random, shown after the run"><input data-testid="gen-seed" type="text" value={opts.seed} onChange={e => setOpts(o => ({ ...o, seed: e.target.value }))} placeholder="random" style={{ ...inp, width: 110, fontFamily: mono }} /></SuField>
        <SuCheck testid="gen-respect-locks" label="respect locks" title="Off: locked, already-published slots in the range are regenerated too - Accept asks for confirmation before anything is written" checked={opts.respectLocks !== false} onChange={v => setOpts(o => ({ ...o, respectLocks: v }))} />
        <button data-testid="gen-run" onClick={() => onRun({ ...opts, start, end })} disabled={busy || !rulesImported} style={{ ...css.btn(true), padding: "6px 16px", marginBottom: 8, opacity: (busy || !rulesImported) ? 0.6 : 1 }}>{busy ? "Generating" : "Run"}</button>
        {busy && <span data-testid="gen-busy" role="status" style={{ fontSize: 12, color: "#1a6fa8", fontWeight: 700, marginBottom: 8 }}>Running best-of-{opts.bestOf} - the page stays responsive between candidates</span>}
      </div>
      {preview && (
        <div data-testid="gen-preview" style={{ border: "2px dashed #7a4fbf", borderRadius: 8, padding: "10px 12px", background: "#faf7ff" }}>
          <div style={{ display: "flex", gap: 8, alignItems: "center", flexWrap: "wrap", marginBottom: 8 }}>
            <strong style={{ color: "#5a3a9f" }}>Preview</strong>
            <span data-testid="gen-preview-meta" style={{ fontSize: 12, color: "#3a4a58" }}>{fmtMD(preview.start)} - {fmtMD(preview.end)} ({Object.keys(preview.schedule || {}).length} days), seed <span style={{ fontFamily: mono }}>{String(preview.seed)}</span>, best of {preview.bestOf}, {preview.ms} ms, open slots {(preview.diagnostics.uncovered || []).length}. Shown on the calendar with a dashed outline - not saved.</span>
            <span style={{ flex: 1 }} />
            <button data-testid="gen-reroll" onClick={onReroll} disabled={busy} style={css.mini(false)}>Re-roll (new seed)</button>
            <button data-testid="gen-accept" onClick={onAccept} disabled={busy} style={{ ...css.btn(true), padding: "5px 14px" }}>Accept &amp; Publish</button>
            <button data-testid="gen-discard" onClick={onDiscard} disabled={busy} style={css.danger}>Discard</button>
          </div>
          <GenDiagnostics css={css} dg={preview.diagnostics} nameOf={nameOf} roster={roster} />
        </div>
      )}
    </div>
  );
}

// --- Seed import: file -> importPlan -> planDiff (dry run) -> Apply ---
function SeedImportCard({ css, state, onPick, onApply, nameOf }) {
  const fileRef = React.useRef(null);
  const d = state.diff;
  const t = d && d.tables;
  const canApply = !!(d && !state.applying && (d.totalChanges > 0));
  return (
    <div data-testid="seed-card">
      <p style={{ fontSize: 12, color: "#5a6a78", margin: "0 0 8px", lineHeight: 1.5 }}>Reads docs/silvis-seed.json (repo or OneDrive copy) through importer.importPlan - a file that carries contact data is refused before anything is read into the app. The dry run diffs the plan against freshly read live rows. Apply snapshots first, merges the blob, inserts only missing availability / vacation rows and writes schedule days only where a day is missing or still source "import" (an app-edited day is never overwritten) through the compare-and-swap sync.</p>
      <div style={{ display: "flex", gap: 8, alignItems: "center", flexWrap: "wrap", marginBottom: 8 }}>
        <input ref={fileRef} data-testid="seed-file" type="file" accept="application/json,.json" style={{ display: "none" }} onChange={e => { const f = e.target.files && e.target.files[0]; e.target.value = ""; if (f) onPick(f); }} />
        <button data-testid="seed-pick" onClick={() => fileRef.current && fileRef.current.click()} disabled={state.applying} style={{ ...css.btn(true), padding: "6px 14px" }}>Choose seed file (dry run)</button>
        {state.fileName && <span style={{ fontSize: 12, fontFamily: mono }}>{state.fileName}</span>}
        {state.loading && <span style={{ fontSize: 12, color: "#1a6fa8" }}>Reading live rows for the dry run</span>}
      </div>
      {state.error && <div data-testid="seed-error" style={{ ...css.errBox, marginBottom: 8 }}><strong>Refused / failed:</strong> {state.error}</div>}
      {d && (
        <div data-testid="seed-dryrun" style={{ border: "1px solid #c8d8e8", borderRadius: 8, padding: "10px 12px", marginBottom: 8, background: "#f8fbff" }}>
          <div style={{ ...css.subT, margin: "0 0 6px" }}>Dry run against the live rows</div>
          <div style={{ display: "flex", gap: 12, flexWrap: "wrap", fontSize: 12, marginBottom: 6 }}>
            <span data-testid="seed-total">Total changes: <strong>{d.totalChanges}</strong>{d.blocked.length ? <span style={{ color: "#a83232" }}> (+{d.blocked.length} blocked: app-edited days kept)</span> : null}</span>
            {t && <span>blob: {Object.keys(t.call_schedule_data.keys).map(k => k + "=" + t.call_schedule_data.keys[k]).join(", ")}</span>}
            {t && <span>schedule_days: insert {t.schedule_days.insert}, update {t.schedule_days.update}, unchanged {t.schedule_days.unchanged}{t.schedule_days.blocked ? ", blocked " + t.schedule_days.blocked : ""}{t.schedule_days.delete ? ", stale " + t.schedule_days.delete : ""}</span>}
            {t && <span>availability: insert {t.availability.insert}, update {t.availability.update}, unchanged {t.availability.unchanged}{t.availability.delete ? ", stale " + t.availability.delete : ""}</span>}
            {t && <span>time_off: insert {t.time_off.insert}, unchanged {t.time_off.unchanged}{t.time_off.delete ? ", stale " + t.time_off.delete : ""}</span>}
          </div>
          <pre data-testid="seed-diff-text" style={{ fontSize: 11, fontFamily: mono, background: "#fff", border: "1px solid #e0e4ea", borderRadius: 6, padding: 8, maxHeight: 220, overflow: "auto", whiteSpace: "pre-wrap", margin: "0 0 8px" }}>{d.text}</pre>
          {d.totalDeletes > 0 && <div style={{ ...css.warnBox, marginBottom: 8 }}>{d.totalDeletes} stale seed-owned row(s) are listed above; the in-app import never deletes rows (the CLI import does). Remove them by hand if they should go.</div>}
          {state.live && state.live.blobUpdatedBy && state.live.blobUpdatedBy !== "seed" && t && Object.keys(t.call_schedule_data.keys).filter(k => t.call_schedule_data.keys[k] !== "unchanged").length > 0 && (
            <div data-testid="seed-blob-warning" style={{ ...css.warnBox, marginBottom: 8 }}>
              The shared setup was last saved in the app by <strong>{nameOf(state.live.blobUpdatedBy)}</strong> ({suFmtTs(state.live.blobUpdatedAt)}), not by the seed. Apply replaces these top-level keys wholesale with the seed's copy: <strong>{Object.keys(t.call_schedule_data.keys).filter(k => t.call_schedule_data.keys[k] !== "unchanged").join(", ")}</strong> - any in-app Setup edit under them since the seed is lost (a snapshot is captured first; Apply is refused if the setup changes again after this dry run).
            </div>
          )}
          {state.plan && state.plan.infoDeltas && state.plan.infoDeltas.length > 0 && <details style={{ fontSize: 11, marginBottom: 8 }}><summary>{state.plan.infoDeltas.length} email update(s) already applied inside the seed (informational)</summary><ul style={{ margin: "4px 0 0", paddingLeft: 18 }}>{state.plan.infoDeltas.map((l, i) => <li key={i}>{l}</li>)}</ul></details>}
          <div style={{ display: "flex", gap: 8, alignItems: "center", flexWrap: "wrap" }}>
            <button data-testid="seed-apply" onClick={onApply} disabled={!canApply} style={{ ...css.btn(true), padding: "6px 14px", opacity: canApply ? 1 : 0.5 }}>{state.applying ? "Applying" : d.totalChanges === 0 ? "Nothing to apply" : "Apply (snapshot first)"}</button>
            <span style={{ fontSize: 11, color: "#7a8a98" }}>{d.totalChanges === 0 ? "The live tables already match the plan." : "A snapshot is captured first; if that fails nothing is written."}</span>
          </div>
        </div>
      )}
      {state.result && (
        <div data-testid="seed-result" style={state.result.errors.length ? css.errBox : css.okBox}>
          <strong>{state.result.errors.length ? "Import finished with errors" : "Import applied"}</strong> - blob {state.result.counts.blob}; availability inserted {state.result.counts.availability_inserted}, skipped {state.result.counts.availability_skipped}; time_off inserted {state.result.counts.time_off_inserted}, skipped {state.result.counts.time_off_skipped}{state.result.counts.time_off_failed.length ? ", refused " + state.result.counts.time_off_failed.length : ""}; schedule_days inserted {state.result.counts.schedule_days_inserted}, updated {state.result.counts.schedule_days_updated}, kept (app-edited) {state.result.counts.schedule_days_skipped}.
          {state.result.errors.map((e, i) => <div key={i}>- {e}</div>)}
          {state.result.counts.time_off_failed.map((e, i) => <div key={"t" + i}>- time_off refused: {e}</div>)}
        </div>
      )}
    </div>
  );
}

// --- Error boundary ---

// A render exception anywhere in the tree would otherwise white-screen the
// whole app - the worst possible failure for someone checking who's on call.
class ErrorBoundary extends React.Component {
  constructor(props) { super(props); this.state = { error: null }; }
  static getDerivedStateFromError(error) { return { error: error }; }
  componentDidCatch(error, info) { try { console.error("App crashed:", error, info); } catch (e) { /* console unavailable */ } }
  render() {
    if (this.state.error) {
      var msg = (this.state.error && this.state.error.message) ? this.state.error.message : String(this.state.error);
      return React.createElement(
        "div",
        { style: { minHeight: "100vh", display: "flex", alignItems: "center", justifyContent: "center", padding: 20, fontFamily: (typeof font !== "undefined" ? font : "system-ui, sans-serif"), background: "#f0f2f5", boxSizing: "border-box" } },
        React.createElement(
          "div",
          { style: { maxWidth: 460, width: "100%", background: "#fff", border: "1px solid #e0e4ea", borderRadius: 12, padding: 24, boxShadow: "0 2px 12px rgba(0,0,0,0.06)", textAlign: "center" } },
          React.createElement("div", { style: { fontSize: 18, fontWeight: 700, color: "#1a2a3a", marginBottom: 6 } }, "Something went wrong"),
          React.createElement("div", { style: { fontSize: 13, color: "#5a6a78", lineHeight: 1.5, marginBottom: 16 } }, "The app hit an unexpected error and stopped rendering. Your saved schedule is safe - reloading should recover it. If it keeps happening, export a JSON backup from the Settings tab and note what you were doing."),
          React.createElement("div", { style: { fontFamily: (typeof mono !== "undefined" ? mono : "monospace"), fontSize: 11, color: "#a04040", background: "#fcecec", border: "1px solid #f0d0d0", borderRadius: 6, padding: "8px 10px", marginBottom: 16, wordBreak: "break-word", textAlign: "left" } }, msg),
          React.createElement(
            "button",
            { onClick: function () { try { window.location.reload(); } catch (e) { /* reload blocked */ } }, style: { background: "linear-gradient(135deg,#1a6fa8,#2488c8)", border: "1px solid #1a6fa8", color: "#fff", borderRadius: 8, padding: "10px 22px", fontSize: 14, fontWeight: 600, cursor: "pointer", fontFamily: (typeof font !== "undefined" ? font : "system-ui, sans-serif") } },
            "Reload app"
          )
        )
      );
    }
    return this.props.children;
  }
}

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(React.createElement(ErrorBoundary, null, React.createElement(CallSchedule)));
  </script>
</body>
</html>
