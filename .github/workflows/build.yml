name: Build & deploy

# When you push a change to the JSX source (or the build tooling), this:
#   1. bumps APP_VERSION in index-source.html (Central-time date + letter),
#   2. compiles index.html from it with the same verified Babel settings,
#   3. commits both back to main.
# GitHub Pages (serving main) then redeploys automatically. You only ever edit
# and commit index-source.html — never touch index.html or bump by hand again.
#
# A failed build (bad transpile, injected imports, syntax error) exits non-zero
# and commits nothing, so a broken build can never reach the live site.

on:
  push:
    branches: [main]
    paths:
      - "index-source.html"
      - "build.js"
      - "bump-version.js"
      - "package.json"
      # Runtime modules: changing these must (a) run the generator regression
      # test and (b) bump APP_VERSION so cache-busted clients refetch them —
      # previously a module-only push skipped CI and stale clients kept the
      # old file indefinitely.
      - "generator.js"
      - "rules.js"
      - "east-feed.js"
      - "config.js"
      - "helpers.js"
      - "app-styles.js"
      - "test/rules.test.js"
      - "test/east-feed.test.js"
      - "test/data-layer.test.js"
      - "test/importer.test.js"
      - "test/week-rows.test.js"
      - "test/exports.test.js"
      - "test/totals.test.js"
      - "test/holidays.test.js"
      - "test/publish.test.js"
      - "test/day-edit.test.js"
      - "test/open-shifts.test.js"
      - "test/edge-functions.test.js"
      - "test/fixtures/open-slots.json"
      - "test/fixtures/last-generate-diagnostics.json"
      - "test/schema.test.js"
      - "test/offers.test.js"
      - "test/offers-timeline.test.js"
      - "test/fixtures/offer-timeline.json"
      - "edge-functions/daily-reminder/index.ts"
      - "edge-functions/send-notification/index.ts"
      - "importer.js"
      - "test/generator-regression.js"
      - "test/nov-backups.test.js"
      - "test/water-fill.test.js"
      - "test/ci.test.js"
      - "test/privacy.test.js"
      # Inputs the suites consume (a seed-, fixture- or adapter-only push must
      # re-run the tests that read them) and the PWA shell (a manifest/icon-only
      # push must bump APP_VERSION so cache-busted clients refetch them).
      # test/ci.test.js pins this list against package.json's test chain.
      # Deliberately NOT watched (review 2026-09-23): scripts/**, sql/**,
      # edge-functions/** and the docs/*.json / docs/*.md inputs some suites
      # read. A push touching only one of them skips its guard suite, but
      # adding them would make every SQL-, script- or doc-only push a Pages
      # redeploy with an APP_VERSION bump (an update banner on every client
      # for a no-op). Run `npm test` locally before such a push instead.
      - "docs/silvis-seed.json"
      - "test/fixtures/**"
      - "test/seed-adapter.js"
      - "manifest.json"
      - "icon-512.png"
      - "icon-192.png"
      - "apple-touch-icon.png"
  workflow_dispatch: {}   # allow manual runs from the Actions tab

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # Skip the bot's own build commits (belt-and-suspenders; GITHUB_TOKEN pushes
    # don't trigger workflows anyway).
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Node 24 (current LTS): the Babel 8 packages declare engines
      # ^22.18.0 || >=24.11.0, and on Node 20 npm printed EBADENGINE for every
      # one of them while the build only succeeded because engines are a warning
      # (audit T2, 9/23). package.json "engines" carries the same floor for a
      # developer machine. The Node 24 transpile is byte-identical to the Node 20
      # output of the same source.
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install build deps
        run: npm install --no-audit --no-fund

      # Guard the rules engine and the generator's hard rules BEFORE anything
      # is bumped or committed - a regression here fails the build and nothing
      # reaches the live site. (Same slot as the Davenport workflow's generator
      # regression + sync-guard steps.)
      - name: Rules engine unit tests
        run: node test/rules.test.js

      - name: East feed unit tests
        run: node test/east-feed.test.js

      # Data-layer contract: helpers round trips, snapshot fail-closed paths,
      # and the SOURCE PINS on index-source.html (guard-ref site counts, CAS
      # literals, blob-strip, blobLoadedRef gate, realtime merge). Without this
      # step every pin is unenforced on a push to main - a live deploy. The
      # Playwright smoke harness (test/ui/smoke.mjs) is NOT run here: it needs
      # Chromium and live network; run it locally with `npm run smoke`.
      - name: Data-layer unit tests + source pins
        run: node test/data-layer.test.js

      # Static schema pins (no database): sql/schema.sql and the 2026-09-22
      # trade-guards migration define the same trigger + apply_trade() checks,
      # and nothing under sql/ carries contact data.
      - name: Schema static tests
        run: node test/schema.test.js

      - name: Seed importer tests
        run: node test/importer.test.js

      - name: Week-rows builder tests
        run: node test/week-rows.test.js

      # Offline: the suite's live ER-panel section reads the Supabase project;
      # a runner has no business doing that, and a transient fetch failure must
      # never turn a live deploy red. The switch prints a note and skips only
      # that section (run the suite locally without the variable to refresh
      # test/ui/out/er-panel-*.html).
      - name: Export builders tests (ICS, share page, printable, ER panel)
        run: node test/exports.test.js
        env:
          EXPORTS_OFFLINE: "1"

      - name: Totals helpers tests
        run: node test/totals.test.js

      - name: Holiday unit builder tests
        run: node test/holidays.test.js

      # Command-line publish plan (scripts/publish-preview.js, Prompt 12 PUB):
      # locked roles untouched, app-edited slots refused, CAS + RAISE guards in
      # the SQL, no notifications table anywhere in it. Pure - no network.
      - name: Publish-preview plan tests
        run: node test/publish.test.js

      # Command-line day edits (scripts/day-edit.js, Prompt 12 BK): the day
      # editor's row shape (only the role's id + lock, source 'manual', note
      # kept), snapshot before every UPDATE, CAS on day + version + expected
      # holder, the app's audit action names, override gating, no
      # notifications statement anywhere. Pure - no network.
      - name: Day-edit CLI tests
        run: node test/day-edit.test.js

      # ONE definition of "open" (Prompt 13): helpers.js openSlots against
      # test/fixtures/open-slots.json (the edge function mirrors the same
      # fixture), the glance equivalence and the source pins that keep a
      # second definition out of index-source.html.
      - name: Open-shifts tests + source pins
        run: node test/open-shifts.test.js

      # Offer periods (Prompt 14 P2): helpers period maths mirror SQL offer_status() / the timeline,
      # parity with rules.buildContext, seed pins, the claim-as-offer migration pins.
      - name: Offer period tests
        run: node test/offers.test.js

      # Offer timeline (Prompt 14 P4): the daily cron's date maths in helpers.js and its plain-JS mirror in
      # edge-functions/daily-reminder/index.ts against ONE fixture; send-notification / README / guide pins.
      - name: Offer timeline tests + edge-function mirror
        run: node test/offers-timeline.test.js

      # send-notification's role/party gate (audit RLS-1): the plain-JS gate
      # block is extracted from the function source and run against a table
      # of callers; source pins keep it in the handler's auth path and keep
      # the README's verification steps. Pure - no network, no Deno.
      - name: Edge-function gate tests + source pins
        run: node test/edge-functions.test.js
      # CI + gate hygiene: package.json's test chain, the steps above and the
      # paths filter stay aligned, the exports step stays offline, the three
      # wall-clock gates (rules 5000 ms via SILVIS_RULES_BUDGET_MS; regression
      # 10000 ms, water-fill 6000 ms and holidays 4000 ms via SILVIS_GEN_BUDGET_MS)
      # stay overridable failing assertions, and neither variable is set here.
      # Pure - no network.
      - name: CI + gate hygiene tests
        run: node test/ci.test.js

      # Repo privacy pins (Prompt 16 A6): no tracked text file carries a developer
      # machine path, a session id, a staff full name, a roster middle initial, an
      # email subject, the Davenport time_off disclosure or a personal vacation
      # range. Reads the tracked file list with git; pure - no network.
      - name: Repo privacy pins
        run: node test/privacy.test.js

      # The water-filled share's November 2026 case (Faraz 9/23): the pre-publish
      # inputs in test/fixtures/water-fill-2026-10-07-to-2027-01-03.json, the two
      # bestOf-200 runs the publish made, pinned tallies. Its own step so the
      # regression below stays inside its 10 s budget (~2 s of runs); default
      # 6000 ms budget, SILVIS_GEN_BUDGET_MS is never set here.
      - name: Water-filled share fixture test
        run: node test/water-fill.test.js

      # Last, as in `npm test`: the fast unit suites fail first. Its default
      # 10 s wall-clock budget IS the CI gate (runners read ~5.6-6.5 s on
      # 2026-09-23 and the figure grows with every added block - re-check
      # headroom before extending the regression; raise the default only
      # deliberately);
      # SILVIS_GEN_BUDGET_MS is for a loaded developer machine and is never
      # set here.
      - name: Generator regression test
        run: node test/generator-regression.js

      - name: Bump APP_VERSION
        run: node bump-version.js

      - name: Build index.html
        run: node build.js

      # Commit back. main may have moved while this run was queued or running
      # (audit T3, 9/23): the concurrency group serialises runs but does not
      # rebase them, so a push from the checked-out sha would be non-fast-forward.
      #   - the move touched only UNWATCHED paths (docs / sql / scripts): no run
      #     was queued for it, so this run carries it - reset onto origin/main and
      #     rebuild (the build inputs are unchanged, so the suites above still
      #     cover the result);
      #   - the move touched a WATCHED path: its own queued run owns the deploy,
      #     so this run steps aside (exit 0, nothing pushed) instead of forcing a
      #     push that the queued run would then reject.
      # Never `git pull --rebase` here: rebasing a compiled index.html over a
      # changed index-source.html would deploy a stale build under a new version.
      - name: Commit built files
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch --quiet origin main
          if [ "$(git rev-parse origin/main)" != "${{ github.sha }}" ]; then
            changed="$(git diff --name-only "${{ github.sha }}" origin/main)"
            echo "main moved since ${{ github.sha }} ($(git rev-parse --short origin/main)):"
            echo "$changed" | sed 's/^/  /'
            # Matcher exit: 0 = none watched, 1 = some watched, anything else = the matcher
            # itself failed. Captured explicitly (review 9/23): `set -e` ignores a command
            # inside an `if` condition, and a matcher crash must never read as "watched" -
            # that arm is a green run with nothing pushed and no queued run to follow.
            rc=0
            if [ -n "$changed" ]; then node scripts/ci-watched-paths.js $changed || rc=$?; fi
            case "$rc" in
              0)
                echo "only unwatched paths changed - rebuilding on top of origin/main"
                git reset --hard --quiet origin/main
                node bump-version.js
                node build.js
                ;;
              1)
                echo "::notice::main moved with a watched change; the queued run for $(git rev-parse --short origin/main) owns this deploy - nothing pushed from this run (re-run 'Build & deploy' from the Actions tab if no run follows)."
                exit 0
                ;;
              *)
                echo "::error::scripts/ci-watched-paths.js failed (exit $rc) - cannot tell whether main's move is watched, so nothing is pushed from this run. Recovery: fix the matcher, then re-run 'Build & deploy' from the Actions tab (workflow_dispatch) or push any watched file; the live site stays on the previous build until then."
                exit 1
                ;;
            esac
          fi
          git add index-source.html index.html version.json
          if git diff --cached --quiet; then
            echo "Nothing to commit (source unchanged)."
          else
            git commit -m "Build: compile index.html + bump version [skip ci]"
            git push || { echo "::error::push to main rejected (main moved again during the build). Recovery: re-run 'Build & deploy' from the Actions tab (workflow_dispatch) or push any watched file; the live site stays on the previous build until then."; exit 1; }
          fi
