name: Build & deploy

# When you push a change to the JSX source (or the build tooling), this:
#   1. bumps APP_VERSION in index-source.html (Central-time date + letter),
#   2. compiles index.html from it with the same verified Babel settings,
#   3. commits both back to main.
# GitHub Pages (serving main) then redeploys automatically. You only ever edit
# and commit index-source.html — never touch index.html or bump by hand again.
#
# A failed build (bad transpile, injected imports, syntax error) exits non-zero
# and commits nothing, so a broken build can never reach the live site.

on:
  push:
    branches: [main]
    paths:
      - "index-source.html"
      - "build.js"
      - "bump-version.js"
      - "package.json"
      # Runtime modules: changing these must (a) run the generator regression
      # test and (b) bump APP_VERSION so cache-busted clients refetch them —
      # previously a module-only push skipped CI and stale clients kept the
      # old file indefinitely.
      - "generator.js"
      - "rules.js"
      - "east-feed.js"
      - "config.js"
      - "helpers.js"
      - "app-styles.js"
      - "test/rules.test.js"
      - "test/east-feed.test.js"
      - "test/data-layer.test.js"
      - "test/importer.test.js"
      - "test/week-rows.test.js"
      - "test/exports.test.js"
      - "test/totals.test.js"
      - "test/holidays.test.js"
      - "test/publish.test.js"
      - "test/open-shifts.test.js"
      - "test/fixtures/open-slots.json"
      - "test/fixtures/last-generate-diagnostics.json"
      - "test/schema.test.js"
      - "importer.js"
      - "test/generator-regression.js"
      - "test/nov-backups.test.js"
      - "test/ci.test.js"
      # Inputs the suites consume (a seed-, fixture- or adapter-only push must
      # re-run the tests that read them) and the PWA shell (a manifest/icon-only
      # push must bump APP_VERSION so cache-busted clients refetch them).
      # test/ci.test.js pins this list against package.json's test chain.
      # Deliberately NOT watched (review 2026-09-23): scripts/**, sql/**,
      # edge-functions/** and the docs/*.json / docs/*.md inputs some suites
      # read. A push touching only one of them skips its guard suite, but
      # adding them would make every SQL-, script- or doc-only push a Pages
      # redeploy with an APP_VERSION bump (an update banner on every client
      # for a no-op). Run `npm test` locally before such a push instead.
      - "docs/silvis-seed.json"
      - "test/fixtures/**"
      - "test/seed-adapter.js"
      - "manifest.json"
      - "icon-512.png"
      - "icon-192.png"
      - "apple-touch-icon.png"
  workflow_dispatch: {}   # allow manual runs from the Actions tab

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # Skip the bot's own build commits (belt-and-suspenders; GITHUB_TOKEN pushes
    # don't trigger workflows anyway).
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install build deps
        run: npm install --no-audit --no-fund

      # Guard the rules engine and the generator's hard rules BEFORE anything
      # is bumped or committed - a regression here fails the build and nothing
      # reaches the live site. (Same slot as the Davenport workflow's generator
      # regression + sync-guard steps.)
      - name: Rules engine unit tests
        run: node test/rules.test.js

      - name: East feed unit tests
        run: node test/east-feed.test.js

      # Data-layer contract: helpers round trips, snapshot fail-closed paths,
      # and the SOURCE PINS on index-source.html (guard-ref site counts, CAS
      # literals, blob-strip, blobLoadedRef gate, realtime merge). Without this
      # step every pin is unenforced on a push to main - a live deploy. The
      # Playwright smoke harness (test/ui/smoke.mjs) is NOT run here: it needs
      # Chromium and live network; run it locally with `npm run smoke`.
      - name: Data-layer unit tests + source pins
        run: node test/data-layer.test.js

      # Static schema pins (no database): sql/schema.sql and the 2026-09-22
      # trade-guards migration define the same trigger + apply_trade() checks,
      # and nothing under sql/ carries contact data.
      - name: Schema static tests
        run: node test/schema.test.js

      - name: Seed importer tests
        run: node test/importer.test.js

      - name: Week-rows builder tests
        run: node test/week-rows.test.js

      # Offline: the suite's live ER-panel section reads the Supabase project;
      # a runner has no business doing that, and a transient fetch failure must
      # never turn a live deploy red. The switch prints a note and skips only
      # that section (run the suite locally without the variable to refresh
      # test/ui/out/er-panel-*.html).
      - name: Export builders tests (ICS, share page, printable, ER panel)
        run: node test/exports.test.js
        env:
          EXPORTS_OFFLINE: "1"

      - name: Totals helpers tests
        run: node test/totals.test.js

      - name: Holiday unit builder tests
        run: node test/holidays.test.js

      # Command-line publish plan (scripts/publish-preview.js, Prompt 12 PUB):
      # locked roles untouched, app-edited slots refused, CAS + RAISE guards in
      # the SQL, no notifications table anywhere in it. Pure - no network.
      - name: Publish-preview plan tests
        run: node test/publish.test.js

      # ONE definition of "open" (Prompt 13): helpers.js openSlots against
      # test/fixtures/open-slots.json (the edge function mirrors the same
      # fixture), the glance equivalence and the source pins that keep a
      # second definition out of index-source.html.
      - name: Open-shifts tests + source pins
        run: node test/open-shifts.test.js
      # CI + gate hygiene: package.json's test chain, the steps above and the
      # paths filter stay aligned, the exports step stays offline, the three
      # wall-clock gates (rules 5000 ms via SILVIS_RULES_BUDGET_MS; regression
      # 10000 ms and holidays 4000 ms via SILVIS_GEN_BUDGET_MS) stay overridable
      # failing assertions, and neither variable is set here. Pure - no network.
      - name: CI + gate hygiene tests
        run: node test/ci.test.js

      # Last, as in `npm test`: the fast unit suites fail first. Its default
      # 10 s wall-clock budget IS the CI gate (runners read ~3.6 s);
      # SILVIS_GEN_BUDGET_MS is for a loaded developer machine and is never
      # set here.
      - name: Generator regression test
        run: node test/generator-regression.js

      - name: Bump APP_VERSION
        run: node bump-version.js

      - name: Build index.html
        run: node build.js

      - name: Commit built files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index-source.html index.html version.json
          if git diff --cached --quiet; then
            echo "Nothing to commit (source unchanged)."
          else
            git commit -m "Build: compile index.html + bump version [skip ci]"
            git push
          fi
