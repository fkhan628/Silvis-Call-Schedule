name: Tests

# Every push to any branch and every pull request runs the whole test chain
# (`npm test` = package.json's chain, the generator regression last) - review
# 2026-09-27 Do first 10. build.yml's paths filter watches only the deploy's
# runtime inputs, so a push that changes only tests, docs, sql, scripts, the seed
# or the edge-function sources is no deploy and no APP_VERSION bump; this
# workflow is what runs the suites on those pushes and on every PR branch.
#
# Read-only: no deploy, no version bump, no commit-back, no secrets. The deploy
# gate itself stays in build.yml, which still runs every suite step by step
# before it bumps and builds. test/ci.test.js pins this file (triggers, no paths
# filter, permissions, the action SHAs, Node version, npm ci, EXPORTS_OFFLINE,
# no budget overrides, concurrency).

on:
  push:
  pull_request:

permissions:
  contents: read

# One run per ref: a newer push to the same branch (or PR) cancels the run it
# supersedes. Nothing here writes, so a cancelled run leaves nothing half done.
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    # The same two actions and SHAs as build.yml (test/ci.test.js pins both files
    # to one table); bump them together.
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 (v4.4.0, 2026-09-23)

      # Same Node as build.yml (the Babel 8 engines floor; ci.test.js pins the two equal).
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4 (v4.4.0, 2026-09-23)
        with:
          node-version: "24"

      # npm ci against the committed lockfile, as build.yml installs.
      - name: Install deps
        run: npm ci --no-audit --no-fund

      # The whole chain. EXPORTS_OFFLINE=1 skips only the exports suite's live
      # ER-panel read (a runner never reads the live project; build.yml's exports
      # step sets the same switch). The wall-clock budgets keep their defaults:
      # SILVIS_RULES_BUDGET_MS / SILVIS_GEN_BUDGET_MS are never set here.
      - name: npm test (every suite in the chain)
        run: npm test
        env:
          EXPORTS_OFFLINE: "1"
